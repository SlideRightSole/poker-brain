,serif;\n  --body:\"IBM Plex Sans\",ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"IBM Plex Mono\",ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;\n    --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;\n    --accent:#d4a537; --accent-soft:#2b2415;\n    --good:#41b97c; --bad:#e4586c; --warn:#d69f34;\n    --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;\n    --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;\n    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;\n  --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;\n  --accent:#d4a537; --accent-soft:#2b2415;\n  --good:#41b97c; --bad:#e4586c; --warn:#d69f34;\n  --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;\n  --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);\n}\n*{box-sizing:border-box}\nbody{\n  margin:0; background:var(--bg); color:var(--ink);\n  font-family:var(--body); font-size:15px; line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n}\n.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:0 72px}\n.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}\n\n/* ---------------------------------------------------------- masthead --- */\n.masthead{padding-block:26px 14px}\n.masthead h1{\n  font-family:var(--display); font-weight:600; font-size:clamp(26px,4.5vw,36px);\n  margin:0; letter-spacing:-.015em; text-wrap:balance;\n}\n.masthead .rule{height:2px; background:var(--accent); width:44px; margin:12px 0 10px; border-radius:2px}\n.masthead .meta{\n  color:var(--muted); font-size:12.5px; font-family:var(--mono);\n  letter-spacing:.01em; display:flex; flex-wrap:wrap justify-content:center;\n  width:29px; height:40px; border-radius:4px; background:var(--card-face);\n  color:var(--card-black); border:1px solid rgba(0,0,0,.24); font-family:var(--body);\n  font-weight:600; font-size:14px; line-height:1;\n  box-shadow:0 1px 2px rgba(0,0,0,.3); flex:0 0 auto;\n}\n.pc.red{color:var(--card-red)}\n.pc s{font-size:11px; margin-top:1px; text-decoration:none}\n.pc.sm{width:21px; height:29px; font-size:10.5px; border-radius:3px}\n.pc.sm s{font-size:8.5px}\n.pc.down{background:repeating-linear-gradient(45deg,#2c4a5e,#2c4a5e 3px,#25404f 3px,#25404f 6px); border-color:#35576b}\n.hand{display:inline-flex; gap:2px; align-items:center}\n\n/* --------------------------------------------------------- felt table --- */\n.felt{\n  position:relative; background:radial-gradient(ellipse at 50% 42%,var(--felt-a),var(--felt-b));\n  border:10px solid var(--felt-rim); border-radius:46% / 38%;\n  aspect-ratio:16/10; max-width:100%; min-height:270px;\n  box-shadow:inset 0 0 60px rgba(0,0,0,.45);\n}\n.centre{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:86%}\n.centre .board{display:flex; gap:3px; justify-content:center; flex-wrap:wrap}\n.centre .pot{color:var(--felt-dim); font-family:var(--mono); font-size:11.5px; margin-top:9px; letter-spacing:.04em}\n.centre .pre{color:var(--felt-dim); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase}\n.seat{position:absolute; transform:translate(-50%,-50%); width:118px}\n.seat .box{\n  background:rgba(7,18,13,.86); border:1px solid rgba(255,255,255,.13);\n  border-radius:8px; padding:5px 6px; color:var(--felt-ink); text-align:center;\n}\n.seat.me .box{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}\n.seat.gone{opacity:.36}\n.seat .who{font-size:10.5px; font-weight:600; display:flex; gap:4px; justify-content:center; align-items:center}\n.seat .who em{font-style:normal; color:var(--felt-dim); font-weight:500}\n.seat .chips{font-family:var(--mono) --line);\n  border-radius:999px; padding:4px 11px 4px 5px; font-size:12.5px; cursor:pointer;\n}\n.chip:hover{border-color:var(--dim)}\n.chip i{width:14px; height:14px; border-radius:50%; display:block; flex:0 0 auto}\n.busy{color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center}\n.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);\n  border-radius:50%; animation:sp .7s linear infinite; flex:0 0 auto}\n@keyframes sp{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion: reduce){.spin{animation:none}}\n\n.status{\n  border-radius:9px; padding:11px 13px; font-size:13px; margin-top:12px;\n  border:1px solid var(--line); background:var(--panel2); line-height:1.5;\n}\n.status b{font-weight:600}\n.status.ok{background:var(--good-soft); border-color:var(--good)}\n.status.warn{background:var(--warn-soft); border-color:var(--warn)}\n.status.err{background:var(--bad-soft); border-color:var(--bad)}\n.status .how{display:block; margin-top:5px; color:var(--muted); font-size:12.5px}\n.legend{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}\n@media(max-width:820px){.legend{grid-template-columns:1fr}}\n.legend .item{display:flex; gap:12px; padding:12px; border:1px solid var(--line);\n  border-radius:9px; background:var(--panel)}\n.legend .item b{display:block; font-size:14px; margin-bottom:2px}\n.legend .item .when{color:var(--dim); font-size:12px; margin:2px 0 5px}\n.legend .item .plan{color:var(--ink); font-size:13px}\n.legend .swatch{width:26px; height:26px; border-radius:6px}\n.legend-note{color:var(--muted); font-size:12.5px; margin:10px 0 0; max-width:70ch}\n.colourbox{display:flex; gap:12px; margin-top:14px; padding:12px 14px;\n  border:1px solid var(--line); border-radius:9px; background:var(--panel2)}\n.colourbox b{display:block; font-size:14px}\n.colourbox .when{color:var(--dim); font-size:12px; margin:2px 0 4px}\n.colourbox .gplan{font-size:13px}\n.profile{font-size:14.5px; margin:0 0 8px; font-weight:500}\n.plansec{margin:8px 0 0}\n.plansec h5{margin:0 0 3px; font-size:11px; text-transform:uppercase;\n  letter-spacing:.09em; color:var(--dim)}\n.plansec ul{margin:0; padding-left:18px}\n.plansec li{font-size:13.5px; margin:2px 0}\n.loadbox{border:2px dashed var(--line); border-radius:var(--r); padding:30px 18px;\n  text-align:center; background:var(--panel); cursor:pointer}\n.loadbox:hover,.loadbox.over{border-color:var(--accent); background:var(--panel2)}\n.loadbox b{display:block; font-size:16px; margin-bottom:4px}\n.steps{margin:0; padding-left:20px; color:var(--muted); font-size:13.5px}\n.steps li{margin:3px 0}\n.bar2{height:8px; border-radius:4px; background:var(--panel2); overflow:hidden; margin-top:8px}\n.bar2 i{display:block; height:100%; background:var(--accent); width:0; transition:width .2s}\n.quick{\n  background:var(--panel2); border:1px solid var(--line); border-radius:9px;\n  padding:13px 14px; margin-bottom:16px;\n}\n.quick input{font-size:15px; letter-spacing:.04em}\n.quick .hint{display:block; margin-top:6px; color:var(--dim); font-size:11.5px;\n  font-family:var(--mono); line-height:1.5}\n.quick .said{display:block; margin-top:6px; font-size:12.5px; color:var(--muted)}\n.quick .said.good{color:var(--good)}\n.quick .said.bad{color:var(--bad)}\n.imgbar{display:flex;  gap:12px; align-items:flex-start; flex-wrap:wrap; margin-top:12px}\n\n/* -------------------------------------------------------- findings ----- */\n.find{padding:14px 0; border-bottom:1px solid var(--line)}\n.find:last-child{border-bottom:none}\n.find h4{margin:0 0 5px; font-size:14.5px; font-weight:600; display:flex; gap:9px; align-items:center; flex-wrap:wrap}\n.find p{margin:4px 0; color:var(--muted); font-size:13px; white-space:pre-wrap}\n.find .fix{color:var(--good); font-size:13px; margin-top:7px}\n.sev{width:3px; align-self:stretch; border-radius:2px; background:var(--dim)}\n.find.high .sev{background:var(--bad)} .find.medium .sev{background:var(--warn)}\n.find .body{display:flex; gap:12px}\n\n.callout{\n  background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--r);\n  padding:13px 15px; font-size:13px; margin-bottom:18px; color:var(--ink);\n}\n.callout b{font-weight:600}\n.lead{color:var(--muted); font-size:13px; margin:0 0 12px; max-width:68ch}\n.foot{color:var(--dim); font-size:12px; margin-top:26px; padding-top:14px; border-top:1px solid var(--line)}\n.ghost{\n  background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;\n  padding:5px 11px; cursor:pointer; font-size:12px; font-family:var(--body);\n}\n.ghost:hover{color:var(--ink); border-color:var(--dim)}\n.themer{position:absolute; right:16px; top:26px}\n.masthead{position:relative}\n@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}\n<\/style>\n\n<div class=\"wrap\">\n  <header class=\"masthead\">\n    <button class=\"ghost themer\" id=\"themer\" type=\"button\">Theme<\/button>\n    <h1>Poker Brain<\/h1>\n    <div class=\"rule\"><\/div>\n    <div class=\"meta\" id=\"meta\"><\/div>\n  <\/header>\n\n  <div class=\"tabbar\" role=\"tablist\">\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"load\">Load hands<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"true\" data-v=\"overview\">Overview<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"hands\">Hands<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"leaks\">Leaks<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"opponents\">Opponents<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"players\">Player tags<\/button>\n  <\/div>\n\n  <section class=\"view\" id=\"v-load\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-overview\" role=\"tabpanel\"><\/section>\n  <section class=\"view\" id=\"v-hands\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-leaks\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-opponents\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-players\" role=\"tabpanel\" hidden><\/section>\n\n  <p class=\"foot\" id=\"foot\"><\/p>\n<\/div>\n\n<script>\nconst DATA = /*__DATA__*/null;\nconst SUIT = {s:\"\u2660\", h:\"\u2665\", d:\"\u2666\", c:\"\u2663\"};\nconst REDS = {h:1, d:1};\nconst ORDER = [\"preflop\",\"flop\",\"turn\",\"river\"];\nconst BOARDN = {preflop:0, flop:3, turn:4, river:5};\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s == null ? \"\" : s).replace(/[&<>\"]/g,\n  c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst sgn = (v, d) => (Number(v) >= 0 ? \"+\" : \"\") + Number(v).toFixed(d == null ? 1 : d);\nconst dir = v => Number(v) >= 0 ? \"pos\" : \"neg\";\n\nfunction card(c, small){\n  if(!c) return \"\";\n  const r = c[0], s = c[1];\n  return `<span class=\"pc${REDS[s] ? \" red\" : \"\"}${small ? \" sm\" : \"\"}\">${\n    esc(r === \"T\" ? \"10\" : r)}<s>${SUIT[s] || \"\"}<\/s><\/span>`;\n}\nconst cards = (l, sm) => `<span class=\"hand\">${(l||[]).map(c => card(c, sm)).join(\"\")}<\/span>`;\n\n/* ------------------------------------------------------------- chart --- */\nfunction chart(vals){\n  if(!vals || !vals.length) return \"\";\n  const W = 960, H = 220, L = 46, R = 14, T = 16, B = 26;\n  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);\n  const span = (hi - lo) || 1;\n  const x = i => L + i * (W - L - R) / Math.max(1, vals.length - 1);\n  const y = v => T + (hi - v) * (H - T - B) / span;\n  const pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(\" \");\n  const last = vals[vals.length - 1];\n  const col = last >= 0 ? \"var(--good)\" : \"var(--bad)\";\n  const area = `${L},${y(0).toFixed(1)} ${pts} ${x(vals.length-1).toFixed(1)},${y(0).toFixed(1)}`;\n  const ticks = [hi, 0, lo].filter((v,i,a) => a.indexOf(v) === i);\n  let marks = \"\";\n  for(const t of ticks){\n    marks += `<line x1=\"${L}\" x2=\"${W-R}\" y1=\"${y(t).toFixed(1)}\" y2=\"${y(t).toFixed(1)}\"\n      stroke=\"var(--line)\" stroke-width=\"1\"${t === 0 ? \"\" : ' stroke-dasharray=\"2 4\"'}/>\n      <text x=\"${L-8}\" y=\"${(y(t)+4).toFixed(1)}\" text-anchor=\"end\" fill=\"var(--dim)\"\n        font-size=\"11\" font-family=\"var(--mono)\">${t.toFixed(0)}<\/text>`;\n  }\n  return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" height=\"220\" role=\"img\"\n    aria-label=\"Cumulative result: ${last.toFixed(1)} big blinds after ${vals.length} hands, low point ${lo.toFixed(0)}\">\n    ${marks}\n    <polygon points=\"${area}\" fill=\"${col}\" opacity=\"0.10\"/>\n    <polyline points=\"${pts}\" fill=\"none\" stroke=\"${col}\" stroke-width=\"2.25\"\n      stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n    <circle cx=\"${x(vals.length-1).toFixed(1)}\" cy=\"${y(last).toFixed(1)}\" r=\"4\" fill=\"${col}\"/>\n    <text x=\"${L}\" y=\"${H-7}\" fill=\"var(--dim)\" font-size=\"11\" font-family=\"var(--mono)\">hand 1<\/text>\n    <text x=\"${W-R}\" y=\"${H-7}\" text-anchor=\"end\" fill=\"var(--dim)\" font-size=\"11\"\n      font-family=\"var(--mono)\">hand ${vals.length}<\/text>\n  <\/svg>`;\n}\n\n/* ------------------------------------------------------------- stats --- */\nfunction statTable(rows, title, note){\n  if(!rows.length) return \"\";\n  let h = `<div class=\"panel flush\"><table><caption>${esc(title)}<\/caption><thead><tr>\n    <th>Stat<\/th><th class=\"n\">Rate<\/th><th class=\"n\">Sample<\/th>\n    <th class=\"n\">Typical<\/th><th>Read<\/th><\/tr><\/thead><tbody>`;\n  for(const r of rows){\n    const low = r.value < r.lo, high = r.value > r.hi;\n    const pill = r.thin ? '<span class=\"pill thin\">thin<\/span>'\n      : low ? '<span class=\"pill off\">low<\/span>'\n      : high ? '<span class=\"pill off\">high<\/span>'\n      : '<span class=\"pill ok\">in band<\/span>';\n    const scale = Math.max(r.hi * 1.6, r.value * 1.15, 10);\n    const w = Math.min(100, 100 * r.value / scale);\n    const bandL = 100 * r.lo / scale, bandR = 100 * r.hi / scale;\n    h += `<tr><td>${esc(r.label)}<\/td>\n      <td class=\"n\">${r.value.toFixed(1)}%<\/td>\n      <td class=\"n\" style=\"color:var(--dim)\">${r.act}/${r.opp}<\/td>\n      <td class=\"n\" style=\"color:var(--muted)\">${r.lo}\u2013${r.hi}%<\/td>\n      <td><div style=\"display:flex;align-items:center;gap:9px\">\n        <div class=\"meter\" style=\"flex:1\" title=\"${r.value.toFixed(1)}% vs typical ${r.lo}\u2013${r.hi}%\">\n          <i style=\"width:${w}%;background:${low||high?\"var(--bad)\":\"var(--good)\"}\"><\/i>\n          <u style=\"left:${bandL}%\"><\/u><u style=\"left:${bandR}%\"><\/u>\n        <\/div>${pill}<\/div><\/td><\/tr>`;\n  }\n  h += \"<\/tbody><\/table>\";\n  if(note) h += `<p class=\"lead\" style=\"padding:10px 16px 14px;margin:0\">${esc(note)}<\/p>`;\n  return h + \"<\/div>\";\n}\n\nfunction overview(){\n  const m = DATA.meta, s = DATA.split;\n  let h = \"\";\n  if(m.hands < 500){\n    h += `<div class=\"callout\"><b>${m.hands} hands is a small sample.<\/b> Preflop rates settle\n      around 1,000 hands, postflop rates need several thousand, and a win rate needs 20,000+.\n      Read everything here as a hypothesis to test against more data \u2014 not a verdict.<\/div>`;\n  }\n  h += `<div class=\"row r3\">\n    <div class=\"tile ${m.netBB>=0?\"up\":\"down\"}\"><div class=\"k\">Result<\/div>\n      <div class=\"v\">${sgn(m.netBB)} bb<\/div>\n      <div class=\"n\">${sgn(m.bb100)} bb/100 across ${m.hands} hands<\/div><\/div>\n    <div class=\"tile ${s.showdown_bb>=0?\"up\":\"down\"}\"><div class=\"k\">At showdown<\/div>\n      <div class=\"v\">${sgn(s.showdown_bb)} bb<\/div>\n      <div class=\"n\">pots that got called<\/div><\/div>\n    <div class=\"tile ${s.non_showdown_bb>=0?\"up\":\"down\"}\"><div class=\"k\">Without showdown<\/div>\n      <div class=\"v\">${sgn(s.non_showdown_bb)} bb<\/div>\n      <div class=\"n\">pots won uncontested<\/div><\/div>\n  <\/div>`;\n  h += `<h2>Where the money went<\/h2>\n    <div class=\"panel\">${chart(DATA.cumulative)}\n    <p class=\"lead\" style=\"margin:10px 0 0\">Cumulative result in big blinds, hand by hand.\n    Steep single-hand drops matter more than the slope \u2014 they point at individual\n    decisions rather than a losing style.<\/p><\/div>`;\n  h += `<h2>Rates<\/h2><div class=\"row r2\">\n    ${statTable(DATA.heroStats, \"You\", \"Markers on each bar show the band a winning 6-max regular occupies.\")}\n    ${statTable(DATA.poolStats, \"The pool \u2014 every opponent merged\",\n      \"This site rotates opponent IDs every hand, so the merged pool is the right prior for an unknown player.\")}\n  <\/div>`;\n  if(DATA.byPosition.length){\n    h += `<h2>By seat<\/h2><div class=\"panel flush\"><div class=\"scroll\"><table>\n      <thead><tr><th>Position<\/th><th class=\"n\">Hands<\/th><th class=\"n\">VPIP<\/th>\n      <th class=\"n\">PFR<\/th><th class=\"n\">bb/100<\/th><\/tr><\/thead><tbody>`;\n    for(const r of DATA.byPosition){\n      h += `<tr><td>${esc(r.pos)}<\/td><td class=\"n\">${r.hands}<\/td>\n        <td class=\"n\">${r.vpip==null?\"\u2013\":r.vpip+\"%\"}<\/td>\n        <td class=\"n\">${r.pfr==null?\"\u2013\":r.pfr+\"%\"}<\/td>\n        <td class=\"n ${dir(r.bb100)}\">${sgn(r.bb100,0)}<\/td><\/tr>`;\n    }\n    h += \"<\/tbody><\/table><\/div><\/div>\";\n  }\n  $(\"#v-overview\").innerHTML = h;\n}\n\n/* -------------------------------------------------------------- felt --- */\nfunction felt(hd){\n  const upto = ORDER.indexOf(hd.finalStreet);\n  const shown = hd.board.slice(0, BOARDN[hd.finalStreet] || 0);\n  const last = {};\n  for(let i = 0; i <= upto; i++)\n    for(const a of (hd.streets[ORDER[i]] || [])) last[a.player] = a;\n\n  const n = hd.players.length;\n  let seats = \"\";\n  hd.players.forEach((p, i) => {\n    const ang = (-90 + i * 360 / n) * Math.PI / 180;\n    const cx = 50 + 40 * Math.cos(ang), cy = 50 + 35 * Math.sin(ang);\n    const a = last[p.name];\n    const out = p.folded && ORDER.indexOf(p.folded) <= upto;\n    const face = p.cards.length ? cards(p.cards, true)\n      : (out ? \"\" : `<span class=\"hand\">${card(\"Xx\",true).replace(\"pc\",\"pc down\")}${\n          card(\"Xx\",true).replace(\"pc\",\"pc down\")}<\/span>`);\n    seats += `<div class=\"seat${p.isHero?\" me\":\"\"}${out?\" gone\":\"\"}\" style=\"left:${cx}%;top:${cy}%\">\n      <div class=\"box\">\n        <div class=\"who\">${esc(p.isHero?\"You\":p.name.slice(0,8))}<em>${esc(p.pos)}<\/em>${\n          p.seat === hd.buttonSeat ? '<span class=\"dealer\">D<\/span>' : \"\"}<\/div>\n        <div class=\"chips\">${p.stackBB} bb<\/div>\n        ${face}\n        <div class=\"did\">${a ? esc(a.verb + (a.amount ? \" \" + a.amount : \"\")) : \"\"}<\/div>\n      <\/div><\/div>`;\n  });\n  const centre = shown.length\n    ? `<div class=\"board\">${shown.map(c => card(c)).join(\"\")}<\/div>`\n    : '<div class=\"pre\">pre-flop<\/div>';\n  return `<div class=\"felt\">${seats}<div class=\"centre\">${centre}\n    <div class=\"pot\">pot ${potAt(hd, hd.finalStreet)} bb<\/div><\/div><\/div>`;\n}\nfunction potAt(hd, street){\n  for(let i = ORDER.indexOf(street); i >= 0; i--){\n    const e = hd.decisions.filter(d => d.street === ORDER[i]).pop();\n    if(e) return e.potBB;\n  }\n  return 0;\n}\n\n/* ------------------------------------------------------------- hands --- */\nfunction hands(){\n  let h = `<p class=\"lead\">Every hand, worst result first. Pick one to replay it with the\n    maths behind each decision.<\/p><div class=\"panel flush\"><div class=\"scroll\"><table>\n    <thead><tr><th>Hand<\/th><th>Seat<\/th><th>Your cards<\/th><th>Board<\/th>\n    <th>Reached<\/th><th class=\"n\">Result<\/th><\/tr><\/thead><tbody>`;\n  for(const hd of DATA.hands.slice().sort((a,b) => a.heroNetBB - b.heroNetBB)){\n    h += `<tr class=\"pick\" tabindex=\"0\" data-id=\"${esc(hd.id)}\">\n      <td class=\"n\" style=\"color:var(--dim);font-size:11.5px\">${esc(hd.id)}<\/td>\n      <td>${esc(hd.heroPos)}<\/td>\n      <td>${cards(hd.heroCards, true)}<\/td>\n      <td>${cards(hd.board, true)}<\/td>\n      <td style=\"color:var(--muted);font-size:12px\">${esc(hd.finalStreet)}<\/td>\n      <td class=\"n ${dir(hd.heroNetBB)}\">${sgn(hd.heroNetBB)} bb<\/td><\/tr>`;\n  }\n  h += `<\/tbody><\/table><\/div><\/div><div id=\"detail\"><\/div>`;\n  $(\"#v-hands\").innerHTML = h;\n  for(const tr of document.querySelectorAll(\"tr.pick\")){\n    tr.onclick = () => openHand(tr.dataset.id);\n    tr.onkeydown = e => { if(e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); openHand(tr.dataset.id); } };\n  }\n}\n\nfunction maths(d){\n  const r = [];\n  const add = (k,v) => r.push(`<dt>${k}<\/dt><dd>${v}<\/dd>`);\n  add(\"Pot before you acted\", `${d.potBefore} <span style=\"color:var(--dim)\">(${d.potBB} bb)<\/span>`);\n  if(d.spr != null) add(\"Stack-to-pot ratio\", d.spr);\n  if(d.toCall > 0){\n    add(\"To call\", d.toCall);\n    add(\"Equity your call needs\", `${d.potOdds}%`);\n    add(\"Minimum defence frequency\", `${d.mdf}%`);\n  }\n  if(d.betPct != null){\n    add(\"Your sizing\", `${d.betPct}% of pot`);\n    add(\"Folds needed to break even\", `${d.reqFE}%`);\n  }\n  if(d.madeHand) add(\"Your hand\", d.madeHand);\n  if(d.texture) add(\"Board\", d.texture);\n\n  let eq = \"\";\n  if(d.equity != null){\n    eq = `<div class=\"eq\"><div class=\"lab\"><span style=\"color:var(--muted)\">Your equity vs their estimated range<\/span>\n      <b>${d.equity}%<\/b><\/div><div class=\"eqbar\">\n      <i style=\"width:${d.equity}%;background:var(--good)\"><\/i>\n      <i style=\"width:${100-d.equity}%;background:var(--bad)\"><\/i><\/div><\/div>`;\n  }\n  let note = \"\";\n  if(d.evCall != null){\n    if(d.evCall < -0.5) note = `<div class=\"note bad\">Calling cost <b>${d.evCall.toFixed(2)}<\/b>\n      in expectation. You needed <b>${d.potOdds}%<\/b> equity and held <b>${d.equity}%<\/b>.<\/div>`;\n    else if(d.evCall > 0.5) note = `<div class=\"note good\">Calling was worth\n      <b>+${d.evCall.toFixed(2)}<\/b> against the estimated range.<\/div>`;\n    else note = `<div class=\"note flat\">Close to break-even (${sgn(d.evCall,2)}).<\/div>`;\n  }\n  return `<div class=\"maths\"><dl>${r.join(\"\")}<\/dl>${eq}<\/div>${note}`;\n}\n\nfunction openHand(id){\n  const hd = DATA.hands.find(x => x.id === id);\n  if(!hd) return;\n  let h = `<div class=\"detail\"><button class=\"ghost\" id=\"shut\" type=\"button\">\u2190 Back<\/button>\n    <div class=\"top\" style=\"margin-top:12px\">\n      <h3>${cards(hd.heroCards, true)} &nbsp;from the ${esc(hd.heroPos)}<\/h3>\n      <div class=\"res ${dir(hd.heroNetBB)}\">${sgn(hd.heroNetBB)} bb<\/div><\/div>\n    <div class=\"meta\" style=\"color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-top:4px\">\n      ${esc(hd.id)} \u00b7 ${esc(hd.time)} \u00b7 ${esc(hd.sb)}/${esc(hd.bb)}${\n      hd.ante ? \" ante \" + hd.ante : \"\"} \u00b7 ${hd.players.length}-handed<\/div>\n    <div class=\"row r2\" style=\"margin-top:14px\"><div>${felt(hd)}<\/div><div>`;\n\n  if(hd.villain && Object.keys(hd.ranges).length){\n    h += `<p class=\"eyebrow\">What they could hold<\/p>\n      <p class=\"lead\" style=\"margin-bottom:8px\">Main opponent <b style=\"color:var(--ink)\">${\n        esc(hd.villain)}<\/b> (${esc(hd.villainPos)})${\n        hd.villainCards.length ? \" \u2014 showed \" + cards(hd.villainCards, true) : \"\"}<\/p>`;\n    for(const st of ORDER){\n      const r = hd.ranges[st];\n      if(!r) continue;\n      h += `<div class=\"rng\"><b>${st}<\/b> \u2014 ${r.pct}% of hands, ${r.combos} combos\n        <code>${esc(r.summary)}<\/code><\/div>`;\n    }\n    h += `<p class=\"lead\" style=\"margin-top:10px\">Estimated from their position and betting\n      line, narrowed street by street. A model, not a read.<\/p>`;\n  }\n  h += \"<\/div><\/div>\";\n\n  for(const st of ORDER){\n    const acts = hd.streets[st];\n    if(!acts) continue;\n    const b = hd.board.slice(0, BOARDN[st]);\n    h += `<div class=\"street\"><h4>${st}${b.length ? cards(b, true) : \"\"}<\/h4>`;\n    for(const a of acts){\n      h += `<div class=\"act${a.isHero?\" me\":\"\"}\"><b>${esc(a.isHero?\"You\":a.player.slice(0,8))}<\/b>\n        <em>${esc(a.pos)}<\/em><span>${esc(a.verb)}${a.amount ? \" \" + a.amount : \"\"}<\/span><\/div>`;\n    }\n    for(const d of hd.decisions.filter(d => d.street === st)) h += maths(d);\n    h += \"<\/div>\";\n  }\n  h += `<p class=\"foot\" style=\"margin-top:18px\">Pot ${hd.pot} \u00b7 rake ${hd.rake}<\/p><\/div>`;\n  $(\"#detail\").innerHTML = h;\n  $(\"#shut\").onclick = () => { $(\"#detail\").innerHTML = \"\"; };\n  $(\"#detail\").scrollIntoView({behavior:\"smooth\", block:\"start\"});\n}\n\n/* ------------------------------------------------------------- leaks --- */\nfunction leaksView(){\n  let h = `<p class=\"lead\">Ranked by how much the sample supports them, not by how bad they\n    sound. A finding marked <span class=\"pill thin\">too thin to trust<\/span> is a note to\n    revisit, not an instruction.<\/p>`;\n  if(!DATA.findings.length){\n    h += '<div class=\"panel\">Nothing stood out in this sample.<\/div>';\n  } else {\n    h += '<div class=\"panel\">';\n    for(const f of DATA.findings){\n      const cf = f.confidence === \"solid\" ? \"ok\" : (f.confidence === \"tentative\" ? \"warn\" : \"thin\");\n      h += `<div class=\"find ${esc(f.severity)}\"><div class=\"body\"><div class=\"sev\"><\/div><div>\n        <h4>${esc(f.title)}<span class=\"pill ${cf}\">${esc(f.confidence)}<\/span><\/h4>\n        <p>${esc(f.detail)}<\/p>\n        ${f.fix ? `<div class=\"fix\">\u2192 ${esc(f.fix)}<\/div>` : \"\"}<\/div><\/div><\/div>`;\n    }\n    h += \"<\/div>\";\n  }\n  $(\"#v-leaks\").innerHTML = h;\n}\n\n/* --------------------------------------------------------- opponents --- */\nfunction oppView(){\n  let h = `<p class=\"lead\">This site issues every opponent a new ID each hand, so they cannot\n    be tracked directly. These profiles are rebuilt by following seat and stack continuity\n    within a table \u2014 the same seat, holding exactly the stack the previous hand left\n    behind, is almost certainly the same person. Treat them as probable, not certain.<\/p>`;\n  if(!DATA.opponents.length){\n    h += '<div class=\"panel\">No chain reached the minimum hand count.<\/div>';\n  } else {\n    h += `<div class=\"panel flush\"><div class=\"scroll\"><table><thead><tr>\n      <th>Player<\/th><th class=\"n\">Seat<\/th><th class=\"n\">Hands<\/th><th>Linkage<\/th>\n      <th class=\"n\">VPIP<\/th><th class=\"n\">PFR<\/th><th class=\"n\">AF<\/th>\n      <th class=\"n\">Net<\/th><th>How to play them<\/th><\/tr><\/thead><tbody>`;\n    for(const o of DATA.opponents){\n      let read = \"not enough to say\", pill = \"thin\";\n      if(o.vpip != null){\n        if(o.vpip >= 45){ read = \"Very loose \u2014 value bet thin, never bluff\"; pill = \"off\"; }\n        else if(o.vpip >= 33){ read = \"Loose \u2014 widen your value betting\"; pill = \"warn\"; }\n        else if(o.vpip <= 15){ read = \"Nit \u2014 respect raises, steal relentlessly\"; pill = \"warn\"; }\n        else { read = \"Reasonable \u2014 no obvious hole\"; pill = \"ok\"; }\n      }\n      const cf = o.confidence === \"strong\" ? \"ok\" : (o.confidence === \"moderate\" ? \"warn\" : \"thin\");\n      h += `<tr><td class=\"mono\">${esc(o.id)}<\/td><td class=\"n\">${o.seat}<\/td>\n        <td class=\"n\">${o.hands}<\/td>\n        <td><span class=\"pill ${cf}\">${esc(o.confidence)}<\/span><\/td>\n        <td class=\"n\">${o.vpip==null?\"\u2013\":o.vpip+\"%\"}<\/td>\n        <td class=\"n\">${o.pfr==null?\"\u2013\":o.pfr+\"%\"}<\/td>\n        <td class=\"n\">${o.af==null?\"\u2013\":o.af}<\/td>\n        <td class=\"n ${dir(o.netBB)}\">${sgn(o.netBB)}<\/td>\n        <td><span class=\"pill ${pill}\">${esc(read)}<\/span><\/td><\/tr>`;\n    }\n    h += \"<\/tbody><\/table><\/div><\/div>\";\n  }\n  $(\"#v-opponents\").innerHTML = h;\n}\n\n/* ------------------------------------------------------------ players --- */\nconst R = DATA.rules;\nconst SPEED = {}, SLABEL = {};\nR.stats.forEach(x => { SPEED[x.key] = x.speed; SLABEL[x.key] = x.label; });\n(R.derived || []).forEach(x => { SPEED[x.key] = x.speed; SLABEL[x.key] = x.label; });\n\n// Values the rules read but nobody types in.\nfunction withDerived(s){\n  const full = Object.assign({}, s);\n  full.gap = s.vpip - s.pfr;\n  return full;\n}\nconst SEV = {high:0, medium:1, low:2, info:3};\nconst SPD = {fast:0, medium:1, slow:2};\n\nfunction classify(s){\n  const g = s.vpip - s.pfr;\n  if ((s.vpip >= 33 && g >= 10) || g >= 15 ||\n      (s.fold_to_cbet <= 28 && s.wtsd >= 33 && s.pfr < 18))\n    return [\"green\", \"Fish / station\",\n      \"VPIP \" + s.vpip + \" with a \" + g + \"-point gap to PFR - they call into far too \" +\n      \"many pots and raise almost none of them before the flop, so most of their range \" +\n      \"is hands they were not willing to raise.\"];\n  if (s.vpip >= 30 && s.pfr >= 24)\n    return [\"orange\", \"LAG / maniac\",\n      \"VPIP \" + s.vpip + \" / PFR \" + s.pfr + \" - genuinely loose and genuinely aggressive. \" +\n      \"Their range is far wider than their aggression implies.\"];\n  if (s.vpip <= 17)\n    return [\"yellow\", \"Nit / rock\",\n      \"VPIP \" + s.vpip + \" - they are folding their way through the session. Their blinds \" +\n      \"are free and their aggression is real.\"];\n  let inBand = 0;\n  for (const k in R.benchmarks){\n    const b = R.benchmarks[k];\n    if (s[k] >= b[0] && s[k] <= b[1]) inBand++;\n  }\n  if (inBand >= 7 && s.three_bet >= 7 && s.check_raise >= 6)\n    return [\"red\", \"Threat - avoid\",\n      inBand + \" of 10 stats sit inside the winning-regular band, with a real 3-bet and \" +\n      \"check-raise frequency. No obvious way in.\"];\n  return [\"blue\", \"Solid reg\",\n    \"VPIP \" + s.vpip + \" / PFR \" + s.pfr + \" with a \" + g +\n    \"-point gap - a reasonable, ordinary regular.\"];\n}\n\nfunction findLeaks(s){\n  const full = withDerived(s);\n  const out = [];\n  for (const r of R.leaks){\n    const v = full[r.stat];\n    if (v == null) continue;\n    const hit = r.op === \">\" ? v > r.threshold : v < r.threshold;\n    if (!hit) continue;\n    out.push({\n      id:r.id, stat:r.stat, severity:r.severity, title:r.title, exploit:r.exploit,\n      value:v, label:SLABEL[r.stat], reliability:SPEED[r.stat],\n      benchmark:R.benchmarks[r.stat],\n      shorthand:r.shorthand.split(\"{v}\").join(String(v))\n    });\n  }\n  out.sort((a,b) => (SEV[a.severity]-SEV[b.severity]) || (SPD[a.reliability]-SPD[b.reliability]));\n  return out;\n}\n\nfunction buildProfile(s, name){\n  let cl = classify(s);\n  let colour = cl[0], label = cl[1], why = cl[2];\n  const leaks = findLeaks(s);\n  const serious = leaks.filter(l => l.severity === \"high\");\n  if ((colour === \"blue\" || colour === \"red\") && serious.length){\n    colour = \"magenta\";\n    label = \"Reg with a hole\";\n    const f = serious[0].title;\n    why = \"Looks like an ordinary regular, but \" + f[0].toLowerCase() + f.slice(1) +\n          \". The exploit is in the note, not the headline stats.\";\n  }\n  const plan = gamePlan(s);\n  const note = planNote(plan);\n  const slow = leaks.filter(l => l.reliability === \"slow\").map(l => l.label);\n  const unreliable = Array.from(new Set(slow)).sort();\n  return {name:name, stats:s, colour:colour, archetype:label, reasoning:why, leaks:leaks,\n          note:note, gamePlan:plan, unreliable:unreliable, plan:R.tags[colour].plan};\n}\n\nfunction holds(full, conds){\n  for (const c of conds){\n    const v = full[c[0]], th = c[2];\n    if (v == null) return false;\n    if (c[1] === \">\" && !(v > th)) return false;\n    if (c[1] === \"<\" && !(v < th)) return false;\n    if (c[1] === \">=\" && !(v >= th)) return false;\n    if (c[1] === \"<=\" && !(v <= th)) return false;\n  }\n  return true;\n}\n\nfunction gamePlan(s){\n  const full = withDerived(s);\n  const pre = R.profileRules.pre.find(r => holds(full, r.when));\n  const post = R.profileRules.post.find(r => holds(full, r.when));\n  const sections = R.planSections.map(sec => {\n    const picked = [], used = new Set();\n    for (const e of R.plan[sec.key]){\n      if (picked.length >= sec.limit) break;\n      if (!e.when.length || e.groups.some(g => used.has(g))) continue;\n      if (holds(full, e.when)){\n        picked.push({long: e.long, short: e.short});\n        e.groups.forEach(g => used.add(g));\n      }\n    }\n    if (!picked.length){\n      const d = R.plan[sec.key].find(e => !e.when.length);\n      picked.push({long: d.long, short: d.short});\n    }\n    return {key: sec.key, title: sec.title, label: sec.label, items: picked};\n  });\n  return {profile: pre.long + \"; \" + post.long + \".\",\n          profileShort: \"THEM: \" + pre.short + \", \" + post.short + \".\", sections: sections};\n}\n\nfunction planNote(plan){\n  const secs = plan.sections;\n  const render = counts => {\n    const parts = [plan.profileShort];\n    secs.forEach((sec, idx) => {\n      const n = counts[idx];\n      if (!n) return;\n      const lead = counts.slice(0, idx).some(c => c) ? \"\" : \"ME - \";\n      const shorts = sec.items.slice(0, n).map(i => i.short);\n      parts.push(lead + sec.label + \": \" + shorts.join(\"; \") + \".\");\n    });\n    return parts.join(\" \");\n  };\n  let counts = secs.map(() => 1);\n  while (render(counts).length > R.noteLimit && counts.some(c => c)){\n    let last = -1;\n    counts.forEach((c, i) => { if (c) last = i; });\n    counts[last] = 0;\n  }\n  secs.forEach((sec, i) => {\n    if (counts[i] && sec.items.length > counts[i]){\n      const trial = counts.slice();\n      trial[i] += 1;\n      if (render(trial).length <= R.noteLimit) counts = trial;\n    }\n  });\n  return render(counts);\n}\n\n(function selfCheck(){\n  const bad = R.selfTest.filter(t => buildProfile(t.stats, \"\").colour !== t.expect);\n  if (bad.length) console.warn(\"Poker Brain: rule engine disagrees with Python on \" +\n    bad.length + \" reference case(s) - the JS port has drifted.\");\n})();\n\nconst KEY = \"pb-players\";\nfunction loadRoster(){\n  try { return JSON.parse(localStorage.getItem(KEY) || \"{}\"); } catch(e){ return {}; }\n}\nfunction saveRoster(r){\n  try { localStorage.setItem(KEY, JSON.stringify(r)); } catch(e){}\n}\n\nfunction playersView(){\n  const flds = R.stats.map(x =>\n    '<div class=\"fld\"><label for=\"f-' + x.key + '\">' + esc(x.label) + '<\/label>' +\n    '<input id=\"f-' + x.key + '\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" inputmode=\"numeric\"><\/div>'\n  ).join(\"\");\n  $(\"#v-players\").innerHTML =\n    '<p class=\"lead\">Paste a screenshot of a player stat panel and I will read the numbers, ' +\n    'work out the tag, list what they do wrong, and write the note for you. You can also just ' +\n    'type the ten numbers in, which works offline and is never misread.<\/p>' +\n    '<div id=\"drop\" class=\"drop\" tabindex=\"0\" role=\"button\">' +\n      '<b>Paste a screenshot<\/b>Press <kbd>Ctrl<\/kbd>+<kbd>V<\/kbd> anywhere on this page, ' +\n      'or click here to pick a file. Drag and drop works too.' +\n      '<input id=\"pick\" type=\"file\" accept=\"image/*\" hidden><\/div>' +\n    '<div id=\"env\" class=\"status\" hidden><\/div>' +\n    '<div id=\"imgbar\" class=\"imgbar\" hidden>' +\n      '<div id=\"shotwrap\"><\/div>' +\n      '<div style=\"flex:1;min-width:230px\">' +\n        '<button class=\"btn\" id=\"readbtn\" type=\"button\">Read screenshot<\/button>' +\n        '<div id=\"imgstatus\" class=\"status\" hidden><\/div><\/div><\/div>' +\n    '<div class=\"panel\" style=\"margin-top:14px\">' +\n      '<p class=\"eyebrow\">The numbers<\/p>' +\n      '<div class=\"fld\" style=\"margin-bottom:12px;max-width:280px\">' +\n        '<label for=\"f-name\">Player name<\/label><input id=\"f-name\" type=\"text\"><\/div>' +\n      '<div class=\"quick fld\"><label for=\"f-quick\">Quick entry \\u2014 all ten at once<\/label>' +\n        '<input id=\"f-quick\" type=\"text\" autocomplete=\"off\" ' +\n        'placeholder=\"28 21 11 47 64 33 41 12 30 55\">' +\n        '<span class=\"hint\">VPIP  PFR  3-Bet  Fold-to-3-Bet  C-Bet  Fold-to-C-Bet  ' +\n        'Steal  Check/Raise  WTSD  WSD<\/span>' +\n        '<span class=\"said\" id=\"quicksaid\"><\/span><\/div>' +\n      '<div class=\"grid10\">' + flds + '<\/div>' +\n      '<div style=\"display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap\">' +\n        '<button class=\"btn\" id=\"go\" type=\"button\">Analyse<\/button>' +\n        '<button class=\"ghost\" id=\"clr\" type=\"button\">Clear<\/button>' +\n        '<span id=\"msg\" class=\"small muted\"><\/span><\/div><\/div>' +\n    '<div id=\"verdict\"><\/div>' +\n    '<h2>What the colours mean<\/h2>' +\n    '<div class=\"legend\" id=\"legend\"><\/div>' +\n    '<p class=\"legend-note\">These match the colour dots in the CoinPoker note panel. ' +\n    'Teal is deliberately unused - fewer colours you actually apply beats a complete set ' +\n    'you do not. Tag by what you should <b>do<\/b> against a player, not by a single stat.<\/p>' +\n    '<h2>Saved players<\/h2>' +\n    '<div class=\"panel\"><div class=\"roster\" id=\"roster\"><\/div>' +\n      '<p class=\"lead\" style=\"margin:10px 0 0\">Kept in this browser only, as a convenience. ' +\n      'The note itself belongs in the poker client note field, which is what you see at the ' +\n      'table.<\/p><\/div>';\n\n  $(\"#go\").onclick = analyse;\n  $(\"#f-quick\").oninput = quickFill;\n  $(\"#f-quick\").onkeydown = e => { if (e.key === \"Enter\"){ e.preventDefault(); analyse(); } };\n  $(\"#clr\").onclick = () => {\n    R.stats.forEach(x => { $(\"#f-\" + x.key).value = \"\"; });\n    $(\"#f-name\").value = \"\"; $(\"#verdict\").innerHTML = \"\";\n    $(\"#shotwrap\").innerHTML = \"\"; $(\"#msg\").textContent = \"\";\n    $(\"#imgbar\").hidden = true; $(\"#imgstatus\").hidden = true; shotBlob = null;\n    $(\"#f-quick\").value = \"\"; $(\"#quicksaid\").textContent = \"\";\n    $(\"#quicksaid\").className = \"said\";\n  };\n  const drop = $(\"#drop\"), pick = $(\"#pick\");\n  drop.onclick = () => pick.click();\n  drop.onkeydown = e => {\n    if (e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); pick.click(); }\n  };\n  pick.onchange = () => { if (pick.files && pick.files[0]) takeImage(pick.files[0]); };\n  drop.addEventListener(\"dragover\", e => { e.preventDefault(); drop.classList.add(\"over\"); });\n  drop.addEventListener(\"dragleave\", () => drop.classList.remove(\"over\"));\n  drop.addEventListener(\"drop\", e => {\n    e.preventDefault(); drop.classList.remove(\"over\");\n    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];\n    if (f && f.type.indexOf(\"image/\") === 0) takeImage(f);\n  });\n  $(\"#readbtn\").onclick = () => { if (shotBlob) readScreenshot(shotBlob); };\n  renderLegend();\n  renderRoster();\n  probeVision();\n}\n\nfunction renderLegend(){\n  const box = $(\"#legend\");\n  if (!box || !R.tagGuide) return;\n  box.innerHTML = R.tagGuide.map(g =>\n    '<div class=\"item\"><span class=\"swatch sw-' + esc(g.colour) + '\"><\/span><div>' +\n    \"<b>\" + esc(g.colour.charAt(0).toUpperCase() + g.colour.slice(1)) + \" \\u2014 \" +\n    esc(g.label) + \"<\/b>\" +\n    '<div class=\"when\">' + esc(g.when) + \"<\/div>\" +\n    '<div class=\"plan\">' + esc(g.plan) + \"<\/div><\/div><\/div>\"\n  ).join(\"\");\n}\n\nfunction renderRoster(){\n  const r = loadRoster();\n  const names = Object.keys(r).sort();\n  const box = $(\"#roster\");\n  if (!names.length){\n    box.innerHTML = '<span class=\"muted small\">Nothing saved yet.<\/span>';\n    return;\n  }\n  box.innerHTML = names.map(n =>\n    '<span class=\"chip\" data-n=\"' + esc(n) + '\"><i class=\"sw-' + esc(r[n].colour) + '\"><\/i>' +\n    esc(n) + '<\/span>').join(\"\");\n  for (const el of box.querySelectorAll(\".chip\")){\n    el.onclick = () => {\n      const p = loadRoster()[el.dataset.n];\n      if (!p) return;\n      $(\"#f-name\").value = p.name;\n      R.stats.forEach(x => { $(\"#f-\" + x.key).value = p.stats[x.key]; });\n      analyse();\n    };\n  }\n}\n\nfunction quickFill(){\n  const said = $(\"#quicksaid\");\n  const raw = $(\"#f-quick\").value;\n  const nums = (raw.match(/\\d+(?:\\.\\d+)?/g) || []).map(Number);\n  if (!nums.length){ said.className = \"said\"; said.textContent = \"\"; return; }\n  if (nums.length !== R.stats.length){\n    said.className = \"said bad\";\n    said.textContent = \"Found \" + nums.length + \" numbers, need \" + R.stats.length + \".\";\n    return;\n  }\n  const bad = nums.filter(n => n < 0 || n > 100);\n  if (bad.length){\n    said.className = \"said bad\";\n    said.textContent = \"Every value should be a percentage between 0 and 100.\";\n    return;\n  }\n  R.stats.forEach((x, i) => { $(\"#f-\" + x.key).value = nums[i]; });\n  said.className = \"said good\";\n  said.textContent = \"Filled all ten.\";\n  analyse();\n}\n\nfunction readForm(){\n  const s = {};\n  for (const x of R.stats){\n    const raw = $(\"#f-\" + x.key).value.trim();\n    if (raw === \"\") return {missing:x.label};\n    const v = Number(raw);\n    if (!isFinite(v) || v < 0 || v > 100) return {bad:x.label};\n    s[x.key] = v;\n  }\n  return {stats:s};\n}\n\nfunction analyse(){\n  const got = readForm();\n  const msg = $(\"#msg\");\n  if (got.missing){ msg.textContent = \"Still need \" + got.missing + \".\"; return; }\n  if (got.bad){ msg.textContent = got.bad + \" must be a percentage between 0 and 100.\"; return; }\n  msg.textContent = \"\";\n  const name = $(\"#f-name\").value.trim();\n  const p = buildProfile(got.stats, name);\n  renderVerdict(p);\n  if (name){\n    const r = loadRoster();\n    r[name] = {name:name, colour:p.colour, stats:p.stats, note:p.note, at:Date.now()};\n    saveRoster(r);\n    renderRoster();\n  }\n}\n\nfunction renderVerdict(p){\n  const tag = R.tags[p.colour];\n  let h = '<div class=\"panel\" style=\"margin-top:14px\">' +\n    '<div class=\"verdict\"><span class=\"swatch sw-' + esc(p.colour) + '\"><\/span><div>' +\n    '<h3>Tag ' + esc(p.colour.toUpperCase()) +\n    (p.name ? \" \u2014 \" + esc(p.name) : \"\") + '<\/h3>' +\n    '<div class=\"plan\">' + esc(p.archetype) + \" \u00b7 \" + esc(tag.plan) + '<\/div><\/div><\/div>' +\n    '<p class=\"lead\" style=\"margin-top:12px\">' + esc(p.reasoning) + '<\/p>';\n\n  const g = (R.tagGuide || []).find(x => x.colour === p.colour);\n  if (g){\n    h += '<div class=\"colourbox\"><span class=\"swatch sw-' + esc(p.colour) + '\"><\/span><div>' +\n      '<p class=\"eyebrow\" style=\"margin:0 0 4px\">Colour to set in CoinPoker<\/p>' +\n      \"<b>\" + esc(p.colour.charAt(0).toUpperCase() + p.colour.slice(1)) + \" \\u2014 \" +\n      esc(g.label) + \"<\/b>\" +\n      '<div class=\"when\">' + esc(g.when) + \"<\/div>\" +\n      '<div class=\"gplan\">' + esc(g.plan) + \"<\/div><\/div><\/div>\";\n  }\n\n  const gp = p.gamePlan;\n  h += '<p class=\"eyebrow\" style=\"margin-top:18px\">Them<\/p>' +\n    '<p class=\"profile\">' + esc(gp.profile) + \"<\/p>\" +\n    '<p class=\"eyebrow\" style=\"margin-top:14px\">Me<\/p>';\n  for (const sec of gp.sections){\n    h += '<div class=\"plansec\"><h5>Me \\u2014 ' + esc(sec.title) + \"<\/h5><ul>\" +\n      sec.items.map(i => \"<li>\" + esc(i.long) + \"<\/li>\").join(\"\") + \"<\/ul><\/div>\";\n  }\n\n  if (p.leaks.length){\n    h += '<p class=\"eyebrow\" style=\"margin-top:18px\">Leaks and how to attack them<\/p>';\n    for (const l of p.leaks){\n      const pill = l.severity === \"high\" ? \"off\" : (l.severity === \"medium\" ? \"warn\" : \"thin\");\n      h += '<div class=\"leakrow ' + esc(l.severity) + '\"><div class=\"bar\"><\/div><div>' +\n        \"<h5>\" + esc(l.title) +\n        '<span class=\"pill ' + pill + '\">' + esc(l.severity) + \"<\/span>\" +\n        (l.reliability === \"slow\" ? '<span class=\"pill thin\">slow stat<\/span>' : \"\") +\n        \"<\/h5><p>\" + esc(l.exploit) + \"<\/p>\" +\n        '<div class=\"stat\">' + esc(l.label) + \" \" + l.value + \"%, typical \" +\n        l.benchmark[0] + \"\u2013\" + l.benchmark[1] + \"%<\/div><\/div><\/div>\";\n    }\n  } else {\n    h += '<p class=\"lead\">No rule tripped. Play them straightforwardly until something ' +\n         'shows up.<\/p>';\n  }\n\n  if (p.unreliable.length){\n    h += '<div class=\"callout\" style=\"margin-top:16px\"><b>Hold these loosely.<\/b> ' +\n      esc(p.unreliable.join(\", \")) + \" accumulate slowly \u2014 a player only faces a 3-bet \" +\n      \"after opening and getting re-raised. Act hard on VPIP, PFR, C-Bet and Steal; wait for \" +\n      \"more hands before trusting the rest.<\/div>\";\n  }\n\n  h += '<p class=\"eyebrow\" style=\"margin-top:18px\">Note to paste into CoinPoker<\/p>' +\n    '<textarea class=\"noteout\" id=\"note\">' + esc(p.note) + \"<\/textarea>\" +\n    '<div style=\"display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap\">' +\n    '<button class=\"btn\" id=\"cp\" type=\"button\">Copy note<\/button>' +\n    '<span class=\"small muted\" id=\"cc\">' + p.note.length + \"/\" + R.noteLimit +\n    \" characters<\/span><\/div><\/div>\";\n  $(\"#verdict\").innerHTML = h;\n\n  const ta = $(\"#note\");\n  ta.oninput = () => {\n    $(\"#cc\").textContent = ta.value.length + \"/\" + R.noteLimit + \" characters\";\n  };\n  $(\"#cp\").onclick = async () => {\n    ta.select();\n    let ok = false;\n    try { await navigator.clipboard.writeText(ta.value); ok = true; }\n    catch(e){ try { ok = document.execCommand(\"copy\"); } catch(e2){ ok = false; } }\n    $(\"#cp\").textContent = ok ? \"Copied\" : \"Press Ctrl+C\";\n    setTimeout(() => { $(\"#cp\").textContent = \"Copy note\"; }, 1800);\n  };\n  $(\"#verdict\").scrollIntoView({behavior:\"smooth\", block:\"nearest\"});\n}\n\n\nlet shotBlob = null;\nlet sampleFn = null;\nlet imagesConfirmed = false;\n\nfunction setStatus(kind, html){\n  const el = $(\"#imgstatus\");\n  el.className = \"status \" + kind;\n  el.innerHTML = html;\n  el.hidden = false;\n}\n\nfunction setEnv(kind, html){\n  const el = $(\"#env\");\n  el.className = \"status \" + kind;\n  el.innerHTML = html;\n  el.hidden = false;\n}\n\nconst TYPE_THEM_IN =\n  '<span class=\"how\">Type the ten numbers into the boxes below instead - that always ' +\n  'works, and is never misread.<\/span>';\n\nasync function probeVision(){\n  if (!(window.claude && window.claude.use)){\n    setEnv(\"\", \"<b>Screenshots are read here by built-in OCR.<\/b> Paste a stat panel and \" +\n      \"press <b>Read screenshot<\/b>. The first read downloads the reader, so give it a few \" +\n      \"seconds; after that it is quick and works offline. Always check the numbers it fills \" +\n      \"in \u2014 OCR can misread a digit.\");\n    return;\n  }\n  let s = null;\n  try { s = await window.claude.use(\"sample\"); } catch(e){ s = null; }\n  if (!s){\n    setEnv(\"warn\", \"<b>Screenshot reading is not available in this view.<\/b>\" + TYPE_THEM_IN);\n    return;\n  }\n  sampleFn = s;\n  let caps = null;\n  try { caps = await s.limits(); } catch(e){ caps = null; }\n  imagesConfirmed = !!(caps && caps.images);\n  if (imagesConfirmed){\n    setEnv(\"ok\", \"<b>Screenshot reading is ready.<\/b> Paste a stat panel and I will read the \" +\n      \"numbers off it. The first read asks your permission and takes a few seconds.\");\n  } else {\n    setEnv(\"\", \"<b>Screenshot reading: not confirmed in this viewer.<\/b> It did not advertise \" +\n      \"image support, but that is not the same as refusing - paste a panel and press \" +\n      \"<b>Read screenshot<\/b> anyway. If it genuinely cannot, it will say so.\" + TYPE_THEM_IN);\n  }\n}\n\nfunction takeImage(blob){\n  shotBlob = blob;\n  const url = URL.createObjectURL(blob);\n  $(\"#shotwrap\").innerHTML =\n    '<img class=\"shot\" alt=\"Pasted stat panel\" src=\"' + url + '\">';\n  $(\"#imgbar\").hidden = false;\n  setStatus(\"\", \"Got the image. Reading it now...\");\n  readScreenshot(blob);\n}\n\nconst VISION = [\n  \"This image is a screenshot of an online poker HUD player-statistics panel.\",\n  \"Read the player screen name and the ten percentage statistics, then reply with only JSON.\",\n  \"Keys: name, vpip, pfr, three_bet, fold_to_three_bet, cbet, fold_to_cbet, steal,\",\n  \"check_raise, wtsd, wsd.\",\n  \"The panel labels them VPIP, PFR, 3-BET, Fold to 3-Bet, C-BET, Fold to C-Bet, Steal,\",\n  \"Check/Raise, WTSD and WSD. WTSD and WSD may sit at either end of a coloured bar.\",\n  \"Every statistic is a number without a percent sign. Use null for anything not visible.\",\n  \"name is the player screen name as a string, or an empty string if you cannot see it.\",\n  'Example: {\"name\":\"Player1\",\"vpip\":24,\"pfr\":22,\"three_bet\":12,\"fold_to_three_bet\":64,',\n  '\"cbet\":70,\"fold_to_cbet\":21,\"steal\":45,\"check_raise\":11,\"wtsd\":31,\"wsd\":52}'\n].join(\"\\n\");\n\nconst VISION_ERRORS = {\n  not_granted: \"You have not allowed this page to use Claude, so it cannot read the image. \" +\n    \"Reload the page to be asked again, or type the numbers in below.\",\n  sampling_disabled: \"Claude is not available on this account, so screenshots cannot be read.\",\n  images_unavailable: \"This viewer really cannot send images. Opening the same link in a web browser (Chrome, Edge, Safari) usually can.\",\n  image_rejected: \"That image was rejected. Try a PNG or JPEG under 20 MB.\",\n  rate_limited: \"Too many requests just now. Wait a moment and press Read screenshot again.\",\n  invalid_json: \"I could not read the panel cleanly. Press Read screenshot to try again, \" +\n    \"or type the numbers in below.\",\n  refused: \"I could not process that image.\",\n  session_expired: \"Your Claude session expired. Sign in again, then press Read screenshot.\",\n  cancelled: \"That read was cancelled.\",\n  upstream_error: \"Something went wrong reaching Claude. Press Read screenshot to try again.\"\n};\n\nasync function readScreenshot(blob){\n  if (!blob) return;\n  if (sampleFn) return readWithClaude(blob);\n  return readWithOCR(blob);\n}\n\nasync function readWithClaude(blob){\n  const btn = $(\"#readbtn\");\n  btn.disabled = true;\n  setStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Reading the panel. The first ' +\n    'time, Claude asks your permission first.<\/span>');\n  try {\n    const d = await sampleFn.json(VISION, {images: blob, modelTier: \"default\"});\n    const missing = [];\n    let filled = 0;\n    for (const x of R.stats){\n      const v = d ? d[x.key] : null;\n      if (typeof v === \"number\" && isFinite(v)){ $(\"#f-\" + x.key).value = v; filled++; }\n      else missing.push(x.label);\n    }\n    if (d && typeof d.name === \"string\" && d.name.trim()) $(\"#f-name\").value = d.name.trim();\n    if (filled === R.stats.length){\n      setStatus(\"ok\", \"<b>Read all ten.<\/b> Check them against the screenshot, then press \" +\n        \"Analyse.\");\n      analyse();\n    } else if (filled){\n      setStatus(\"warn\", \"<b>Read \" + filled + \" of \" + R.stats.length + \".<\/b> Still need: \" +\n        esc(missing.join(\", \")) + \". Fill those in and press Analyse.\");\n    } else {\n      setStatus(\"err\", \"<b>I could not read any numbers off that image.<\/b>\" + TYPE_THEM_IN);\n    }\n  } catch(e){\n    const code = e && e.code;\n    setStatus(\"err\", \"<b>\" + esc((code && VISION_ERRORS[code]) ||\n      \"Could not read that screenshot.\") + \"<\/b>\" + TYPE_THEM_IN +\n      (code ? '<span class=\"how\">Error code: ' + esc(code) + \"<\/span>\" : \"\"));\n  } finally {\n    btn.disabled = false;\n  }\n}\n\n/* ---- in-browser OCR, for hosts where Claude is not available ----------- */\nconst TESS_URL = \"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js\";\nlet tessLoading = null;\n\nfunction loadScript(src){\n  return new Promise((resolve, reject) => {\n    const el = document.createElement(\"script\");\n    el.src = src;\n    el.async = true;\n    el.onload = () => resolve();\n    el.onerror = () => reject(new Error(\"could not load \" + src));\n    document.head.appendChild(el);\n  });\n}\n\nasync function ensureTesseract(){\n  if (window.Tesseract) return window.Tesseract;\n  if (!tessLoading) tessLoading = loadScript(TESS_URL);\n  await tessLoading;\n  if (!window.Tesseract) throw new Error(\"Tesseract failed to initialise\");\n  return window.Tesseract;\n}\n\nfunction blobToImage(blob){\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    const url = URL.createObjectURL(blob);\n    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };\n    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(\"bad image\")); };\n    img.src = url;\n  });\n}\n\n// The panel is light text on a dark ground; Tesseract wants the opposite.\n// Upscale first - the digits are small - then grey, invert, and push the\n// midtones apart so the glyph edges are clean.\nfunction preprocess(img){\n  const scale = Math.min(3, Math.max(1.6, 1500 / Math.max(1, img.naturalWidth)));\n  const c = document.createElement(\"canvas\");\n  c.width = Math.round(img.naturalWidth * scale);\n  c.height = Math.round(img.naturalHeight * scale);\n  const ctx = c.getContext(\"2d\", {willReadFrequently: true});\n  ctx.imageSmoothingEnabled = true;\n  ctx.imageSmoothingQuality = \"high\";\n  ctx.drawImage(img, 0, 0, c.width, c.height);\n  const frame = ctx.getImageData(0, 0, c.width, c.height);\n  const px = frame.data;\n  for (let i = 0; i < px.length; i += 4){\n    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];\n    v = 255 - v;\n    v = v < 115 ? 0 : (v > 185 ? 255 : v);\n    px[i] = px[i + 1] = px[i + 2] = v;\n    px[i + 3] = 255;\n  }\n  ctx.putImageData(frame, 0, 0);\n  return c;\n}\n\n// Tesseract versions differ in where they hang word boxes; gather them\n// from whichever shape came back.\nfunction wordsFrom(data){\n  if (!data) return [];\n  if (Array.isArray(data.words) && data.words.length) return data.words;\n  const out = [];\n  const walk = node => {\n    if (!node || typeof node !== \"object\") return;\n    if (Array.isArray(node.words)) out.push.apply(out, node.words);\n    [\"blocks\", \"paragraphs\", \"lines\"].forEach(k => {\n      if (Array.isArray(node[k])) node[k].forEach(walk);\n    });\n  };\n  walk(data);\n  return out;\n}\n\n// Every stat in the panel carries a percent sign and nothing else does, so\n// the percentage tokens are exactly the ten values. Group them into rows,\n// read each row left to right, and panel order falls out.\nfunction panelNumbers(words){\n  const found = [];\n  for (const w of words){\n    const text = String((w && w.text) || \"\").replace(/\\s+/g, \"\");\n    const m = text.match(/^(\\d{1,3})%$/);\n    if (!m) continue;\n    const value = Number(m[1]);\n    if (!isFinite(value) || value < 0 || value > 100) continue;\n    const b = (w && w.bbox) || {};\n    if (typeof b.x0 !== \"number\") continue;\n    found.push({value: value, x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2,\n                h: Math.max(1, b.y1 - b.y0)});\n  }\n  if (!found.length) return [];\n  const meanH = found.reduce((t, n) => t + n.h, 0) / found.length;\n  const tol = Math.max(10, meanH * 0.8);\n  found.sort((a, b) => a.y - b.y);\n  const rows = [];\n  for (const n of found){\n    const row = rows[rows.length - 1];\n    if (row && Math.abs(n.y - row.y) <= tol){\n      row.items.push(n);\n      row.y = row.items.reduce((t, i) => t + i.y, 0) / row.items.length;\n    } else {\n      rows.push({y: n.y, items: [n]});\n    }\n  }\n  const out = [];\n  for (const row of rows){\n    row.items.sort((a, b) => a.x - b.x);\n    for (const item of row.items) out.push(item.value);\n  }\n  return out;\n}\n\nasync function readWithOCR(blob){\n  const btn = $(\"#readbtn\");\n  btn.disabled = true;\n  setStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Loading the reader\u2026 ' +\n    'the first time downloads it, which takes a few seconds.<\/span>');\n  try {\n    const T = await ensureTesseract();\n    setStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Reading the panel\u2026<\/span>');\n    const img = await blobToImage(blob);\n    const canvas = preprocess(img);\n    const worker = await T.createWorker(\"eng\");\n    let data;\n    try {\n      await worker.setParameters({\n        tessedit_char_whitelist: \"0123456789%\",\n        tessedit_pageseg_mode: \"11\"\n      });\n      const result = await worker.recognize(canvas, {}, {blocks: true, text: true});\n      data = result && result.data;\n    } finally {\n      try { await worker.terminate(); } catch(e){}\n    }\n    const nums = panelNumbers(wordsFrom(data));\n    if (nums.length === R.stats.length){\n      R.stats.forEach((x, i) => { $(\"#f-\" + x.key).value = nums[i]; });\n      setStatus(\"ok\", \"<b>Read all ten.<\/b> Check them against the screenshot before you \" +\n        \"trust them \u2014 OCR does misread the odd digit \u2014 then press Analyse.\");\n      analyse();\n    } else if (nums.length){\n      setStatus(\"warn\", \"<b>Found \" + nums.length + \" numbers, expected \" + R.stats.length +\n        \".<\/b> Reading was unreliable on this image: \" + esc(nums.join(\", \")) +\n        '<span class=\"how\">Paste a tighter crop of just the stats, or use quick entry ' +\n        \"below.<\/span>\");\n    } else {\n      setStatus(\"err\", \"<b>Could not read any values off that image.<\/b>\" + TYPE_THEM_IN);\n    }\n  } catch(err){\n    setStatus(\"err\", \"<b>The reader could not run.<\/b> \" +\n      esc((err && err.message) || \"Unknown error\") +\n      '<span class=\"how\">This needs an internet connection the first time, to fetch the ' +\n      \"OCR engine.<\/span>\" + TYPE_THEM_IN);\n  } finally {\n    btn.disabled = false;\n  }\n}\n\n/* ------------------------------------------------------------ load hands - */\nconst PYODIDE_URL = \"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/\";\nlet pyReady = null;\n\nfunction renderMeta(){\n  $(\"#meta\").innerHTML = [\n    DATA.meta.site, DATA.meta.stakes, DATA.meta.hands + \" hands\",\n    DATA.meta.first + \" \u2014 \" + DATA.meta.last\n  ].map(x => \"<span>\" + esc(x) + \"<\/span>\").join(\"\");\n}\n\nfunction loadView(){\n  const hosted = !!DATA.pysrc;\n  let h = '<p class=\"lead\">Load your CoinPoker hand history files and the whole report \u2014 ' +\n    \"overview, every hand replayed with the maths, leaks and opponents \u2014 is rebuilt from \" +\n    \"them. The files are analysed in this browser and never uploaded anywhere.<\/p>\";\n  if (!hosted){\n    h += '<div class=\"callout\"><b>Loading hands works on your own site.<\/b> Open ' +\n      '<a href=\"https://sliderightsole.github.io/poker-brain/\" target=\"_blank\" rel=\"noopener\">' +\n      \"sliderightsole.github.io/poker-brain<\/a> and use this tab there \u2014 this view can\u2019t \" +\n      \"run the analyser.<\/div>\";\n    $(\"#v-load\").innerHTML = h;\n    return;\n  }\n  h += '<div id=\"loaddrop\" class=\"loadbox\" tabindex=\"0\" role=\"button\">' +\n      \"<b>Choose hand history files<\/b>Click to pick one or more <code>.txt<\/code> exports, \" +\n      \"or drop them here.\" +\n      '<input id=\"loadpick\" type=\"file\" accept=\".txt,text/plain\" multiple hidden><\/div>' +\n    '<div id=\"loadstatus\" class=\"status\" hidden><\/div>' +\n    '<h2>Getting your hands<\/h2><ol class=\"steps\">' +\n      \"<li>In CoinPoker, open your hand history / game history and export the sessions you \" +\n      \"want as a text file.<\/li>\" +\n      \"<li>Load one file or many at once \u2014 they are combined into one report.<\/li>\" +\n      \"<li>The first load downloads the analyser (about 10 MB), so give it a moment. After \" +\n      \"that it is cached.<\/li>\" +\n      \"<li>A few thousand hands can take a few minutes. The more hands you load, the more \" +\n      \"the stats mean \u2014 under 1,000 hands they are still mostly noise.<\/li><\/ol>\" +\n    '<p class=\"lead\" style=\"margin-top:12px\">Loaded hands last until you reload the page. ' +\n    \"To keep a report permanently, run <code>python -m pokerbrain report<\/code> on your PC.<\/p>\";\n  $(\"#v-load\").innerHTML = h;\n  const drop = $(\"#loaddrop\"), pick = $(\"#loadpick\");\n  drop.onclick = () => pick.click();\n  drop.onkeydown = e => { if (e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); pick.click(); } };\n  pick.onchange = () => { if (pick.files && pick.files.length) analyseFiles(Array.from(pick.files)); };\n  drop.addEventListener(\"dragover\", e => { e.preventDefault(); drop.classList.add(\"over\"); });\n  drop.addEventListener(\"dragleave\", () => drop.classList.remove(\"over\"));\n  drop.addEventListener(\"drop\", e => {\n    e.preventDefault(); drop.classList.remove(\"over\");\n    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || [])\n      .filter(f => /\\.txt$/i.test(f.name) || f.type === \"text/plain\");\n    if (files.length) analyseFiles(files);\n  });\n}\n\nfunction loadStatus(kind, html, pct){\n  const el = $(\"#loadstatus\");\n  el.className = \"status \" + kind;\n  el.hidden = false;\n  el.innerHTML = html + (pct == null ? \"\" :\n    '<div class=\"bar2\"><i style=\"width:' + Math.round(pct) + '%\"><\/i><\/div>');\n}\n\nasync function ensurePython(){\n  if (pyReady) return pyReady;\n  pyReady = (async () => {\n    await loadScript(PYODIDE_URL + \"pyodide.js\");\n    const py = await window.loadPyodide({indexURL: PYODIDE_URL});\n    for (const rel in DATA.pysrc){\n      const path = \"/pb/\" + rel;\n      const dir = path.slice(0, path.lastIndexOf(\"/\"));\n      py.FS.mkdirTree(dir);\n      py.FS.writeFile(path, DATA.pysrc[rel]);\n    }\n    await py.runPythonAsync(PY_GLUE);\n    return py;\n  })();\n  try { return await pyReady; }\n  catch(e){ pyReady = null; throw e; }\n}\n\nconst PY_GLUE = [\n  \"import sys, json, asyncio\",\n  \"sys.path.insert(0, '/pb')\",\n  \"from pokerbrain.parsers import coinpoker\",\n  \"from pokerbrain import report\",\n  \"async def pb_run(texts, progress):\",\n  \"    hands, skipped = [], 0\",\n  \"    for text in texts:\",\n  \"        for block in coinpoker.split_hands(text):\",\n  \"            try:\",\n  \"                hands.append(coinpoker.parse_hand(block))\",\n  \"            except Exception:\",\n  \"                skipped += 1\",\n  \"    unique = {}\",\n  \"    for h in hands:\",\n  \"        unique.setdefault(h.hand_id, h)\",\n  \"    dupes = len(hands) - len(unique)\",\n  \"    hands = list(unique.values())\",\n  \"    hands.sort(key=lambda h: (h.timestamp, h.hand_id))\",\n  \"    hands = [h for h in hands if h.hero is not None]\",\n  \"    if not hands:\",\n  \"        return json.dumps({'error': 'No CoinPoker hands with you in them were found.', 'skipped': skipped})\",\n  \"    payloads = []\",\n  \"    for i, h in enumerate(hands):\",\n  \"        payloads.append(report._hand_payload(h, 'Hero', 600, 600))\",\n  \"        if i % 4 == 0:\",\n  \"            progress(i + 1, len(hands))\",\n  \"            await asyncio.sleep(0)\",\n  \"    progress(len(hands), len(hands))\",\n  \"    await asyncio.sleep(0)\",\n  \"    data = report.build_payload(hands, 'Hero', payloads)\",\n  \"    data.pop('rules', None)\",\n  \"    data['skipped'] = skipped\",\n  \"    data['dupes'] = dupes\",\n  \"    return json.dumps(data)\",\n].join(\"\\n\");\n\nasync function analyseFiles(files){\n  loadStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Reading ' + files.length +\n    \" file\" + (files.length > 1 ? \"s\" : \"\") + \"\u2026<\/span>\");\n  try {\n    const texts = await Promise.all(files.map(f => f.text()));\n    loadStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Loading the analyser\u2026 ' +\n      \"the first time downloads it, which takes a little while.<\/span>\");\n    const py = await ensurePython();\n    const run = py.globals.get(\"pb_run\");\n    const progress = (done, total) => loadStatus(\"\",\n      '<span class=\"busy\"><span class=\"spin\"><\/span>Analysing hand ' + done + \" of \" + total +\n      \"\u2026<\/span>\", 100 * done / total);\n    const pyTexts = py.toPy(texts);\n    let raw;\n    try { raw = await run(pyTexts, progress); }\n    finally { pyTexts.destroy(); run.destroy(); }\n    const result = JSON.parse(raw);\n    if (result.error){\n      loadStatus(\"err\", \"<b>\" + esc(result.error) + \"<\/b>\" +\n        '<span class=\"how\">Check these are CoinPoker hand history exports (.txt).<\/span>');\n      return;\n    }\n    const skipped = result.skipped || 0;\n    const dupes = result.dupes || 0;\n    delete result.skipped;\n    delete result.dupes;\n    Object.assign(DATA, result);\n    renderMeta(); overview(); hands(); leaksView(); oppView();\n    loadStatus(\"ok\", \"<b>Analysed \" + DATA.meta.hands + \" hands.<\/b> The Overview, Hands, \" +\n      \"Leaks and Opponents tabs now show your files.\" +\n      (skipped ? '<span class=\"how\">' + skipped + \" hand\" + (skipped > 1 ? \"s\" : \"\") +\n        \" could not be read and were skipped.<\/span>\" : \"\") +\n      (dupes ? '<span class=\"how\">' + dupes + \" duplicate hand\" + (dupes > 1 ? \"s\" : \"\") +\n        \" (the same hand in more than one file) counted once.<\/span>\" : \"\") +\n      '<span class=\"how\">Equity figures use a faster, rougher simulation here than the ' +\n      \"report built on your PC.<\/span>\");\n  } catch(err){\n    loadStatus(\"err\", \"<b>Could not analyse those files.<\/b> \" +\n      esc((err && err.message) || String(err)).slice(0, 300) +\n      '<span class=\"how\">The first run needs an internet connection to download the ' +\n      \"analyser.<\/span>\");\n  }\n}\n\ndocument.addEventListener(\"paste\", e => {\n  const items = (e.clipboardData && e.clipboardData.items) || [];\n  for (const it of i
