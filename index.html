00;\n  padding:2px 8px; border-radius:999px; letter-spacing:.03em; white-space:nowrap}\n.pill.ok{background:var(--good-soft); color:var(--good)}\n.pill.off{background:var(--bad-soft); color:var(--bad)}\n.pill.thin{background:var(--panel2); color:var(--muted)}\n.pill.warn{background:var(--warn-soft); color:var(--warn)}\n\n/* -------------------------------------------------------------- cards --- */\n.pc{\n  display:inline-flex; flex-direction:column; align-items:center; justify-content:center;\n  width:29px; height:40px; border-radius:4px; background:var(--card-face);\n  color:var(--card-black); border:1px solid rgba(0,0,0,.24); font-family:var(--body);\n  font-weight:600; font-size:14px; line-height:1;\n  box-shadow:0 1px 2px rgba(0,0,0,.3); flex:0 0 auto;\n}\n.pc.red{color:var(--card-red)}\n.pc s{font-size:11px; margin-top:1px; text-decoration:none}\n.pc.sm{width:21px; height:29px; font-size:10.5px; border-radius:3px}\n.pc.sm s{font-size:8.5px}\n.pc.down{background:repeating-linear-gradient(45deg,#2c4a5e,#2c4a5e 3px,#25404f 3px,#25404f 6px); border-color:#35576b}\n.hand{display:inline-flex; gap:2px; align-items:center}\n\n/* --------------------------------------------------------- felt table --- */\n.felt{\n  position:relative; background:radial-gradient(ellipse at 50% 42%,var(--felt-a),var(--felt-b));\n  border:10px solid var(--felt-rim); border-radius:46% / 38%;\n  aspect-ratio:16/10; max-width:100%; min-height:270px;\n  box-shadow:inset 0 0 60px rgba(0,0,0,.45);\n}\n.centre{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:86%}\n.centre .board{display:flex; gap:3px; justify-content:center; flex-wrap:wrap}\n.centre .pot{color:var(--felt-dim); font-family:var(--mono); font-size:11.5px; margin-top:9px; letter-spacing:.04em}\n.centre .pre{color:var(--felt-dim); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase}\n.seat{position:absolute; transform:translate(-50%,-50%); width:118px}\n.seat .box{\n  background:rgba(7,18,13,.86); border:1px solid rgba(255,255,255,.13);\n  border-radius:8px; padding:5px 6px; color:var(--felt-ink); text-align:center;\n}\n.seat.me .box{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}\n.seat.gone{opacity:.36}\n.seat .who{font-size:10.5px; font-weight:600; display:flex; gap:4px; justify-content:center; align-items:center}\n.seat .who em{font-style:normal; color:var(--felt-dim); font-weight:500}\n.seat .chips{font-family:var(--mono); font-size:9.5px; color:var(--felt-dim)}\n.seat .hand{justify-content:center; margin-top:3px}\n.seat .did{font-family:var(--mono); font-size:9.5px; color:var(--warn); margin-top:2px; min-height:12px}\n.dealer{display:inline-flex; width:14px; height:14px; border-radius:50%; background:var(--card-face);\n  color:#111; font-size:8.5px; line-height:14px; font-weight:700; justify-content:center}\n@media(max-width:560px){\n  .felt{aspect-ratio:auto; min-height:0; border-radius:var(--r); padding:14px; display:grid; gap:8px}\n  .centre{position:static; transform:none; width:auto; order:-1; padding-bottom:6px}\n  .seat{position:static!important; transform:none; width:auto}\n}\n\n/* ------------------------------------------------------ hand detail ----- */\n.detail{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:16px}\n.detail .top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline}\n.detail .top h3{font-family:var(--display); font-weight:600; font-size:18px; margin:0}\n.detail .top .res{font-family:var(--mono); font-size:22px; font-weight:600}\n.street{margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line)}\n.street:first-of-type{border-top:none}\n.street h4{\n  margin:0 0 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;\n  color:var(--dim); font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap;\n}\n.act{font-size:13px; color:var(--muted); padding:2px 0; di color:var(--ink);\n  border:1px solid var(--line); border-radius:4px; padding:1px 6px;\n}\n.shot{max-width:200px; border-radius:8px; border:1px solid var(--line); margin-top:12px}\n.grid10{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}\n@media(max-width:820px){.grid10{grid-template-columns:repeat(2,1fr)}}\n.fld label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;\n  color:var(--dim); font-weight:600; margin-bottom:3px}\n.fld input{\n  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;\n  background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:14px;\n}\n.fld input:focus{outline:2px solid var(--accent); outline-offset:1px}\n.btn{\n  background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 18px;\n  font-family:var(--body); font-size:13.5px; font-weight:600; cursor:pointer;\n}\n.btn:hover{filter:brightness(1.08)}\n.btn:disabled{opacity:.5; cursor:default}\n.swatch{width:34px; height:34px; border-radius:8px; flex:0 0 auto; border:1px solid rgba(0,0,0,.25)}\n.sw-green{background:#2f9e5e}.sw-orange{background:#e08a1e}.sw-yellow{background:#e0c221}\n.sw-blue{background:#2f7fd0}.sw-red{background:#d03a44}.sw-magenta{background:#c2439c}\n.sw-none{background:var(--panel2)}\n.verdict{display:flex; gap:13px; align-items:center}\n.verdict h3{margin:0; font-family:var(--display); font-size:19px; font-weight:600}\n.verdict .plan{color:var(--muted); font-size:13px}\n.leakrow{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}\n.leakrow:last-child{border-bottom:none}\n.leakrow .bar{width:3px; border-radius:2px; background:var(--dim); flex:0 0 auto}\n.leakrow.high .bar{background:var(--bad)} .leakrow.medium .bar{background:var(--warn)}\n.leakrow.info .bar{background:var(--accent)}\n.leakrow h5{margin:0 0 3px; font-size:14px; font-weight:600; display:flex; gap:8px;\n  align-items:center; flex-wrap:wrap}\n.leakrow p{margin:0; color:var(--muted); f r{color:var(--ink); border-color:var(--dim)}\n.themer{position:absolute; right:16px; top:26px}\n.masthead{position:relative}\n@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}\n<\/style>\n\n<div class=\"wrap\">\n  <header class=\"masthead\">\n    <button class=\"ghost themer\" id=\"themer\" type=\"button\">Theme<\/button>\n    <h1>Poker Brain<\/h1>\n    <div class=\"rule\"><\/div>\n    <div class=\"meta\" id=\"meta\"><\/div>\n  <\/header>\n\n  <div class=\"tabbar\" role=\"tablist\">\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"load\">Load hands<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"true\" data-v=\"overview\">Overview<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"sessions\">Sessions<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"lessons\">Lessons<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"hands\">Hands<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"solver\">Solver<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"leaks\">Leaks<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"opponents\">Opponents<\/button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-v=\"players\">Player tags<\/button>\n  <\/div>\n\n  <section class=\"view\" id=\"v-load\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-overview\" role=\"tabpanel\"><\/section>\n  <section class=\"view\" id=\"v-sessions\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-lessons\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-hands\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-solver\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-leaks\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-opponents\" role=\"tabpanel\" hidden><\/section>\n  <section class=\"view\" id=\"v-players\" role=\"tabpanel\" hidden><\/section>\n\n  <p class=\"foot\" id=\"foot\"><\/p>\n<\/div>\n\n<script>\nconst DATA = /*__DATA__*/null;\nconst SUIT = {s:\"\u2660\", h:\"\u2665\", d:\"\u2666\", c:\"\u2663\"};\nconst REDS = {h:1, d:1};\nconst ORDER = [\"preflop\",\"flop\",\"turn\",\"river\"];\nconst BOARDN = {preflop:0, flop:3, turn:4, river:5};\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s == null ? \"\" : s).replace(/[&<>\"]/g,\n  c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst sgn = (v, d) => (Number(v) >= 0 ? \"+\" : \"\") + Number(v).toFixed(d == null ? 1 : d);\nconst dir = v => Number(v) >= 0 ? \"pos\" : \"neg\";\n\nfunction card(c, small){\n  if(!c) return \"\";\n  const r = c[0], s = c[1];\n  return `<span class=\"pc${REDS[s] ? \" red\" : \"\"}${small ? \" sm\" : \"\"}\">${\n    esc(r === \"T\" ? \"10\" : r)}<s>${SUIT[s] || \"\"}<\/s><\/span>`;\n}\nconst cards = (l, sm) => `<span class=\"hand\">${(l||[]).map(c => card(c, sm)).join(\"\")}<\/span>`;\n\n/* ------------------------------------------------------------- chart --- */\nfunction chart(vals){\n  if(!vals || !vals.length) return \"\";\n  const W = 960, H = 220, L = 46, R = 14, T = 16, B = 26;\n  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);\n  const span = (hi - lo) || 1;\n  const x = i => L + i * (W - L - R) / Math.max(1, vals.length - 1);\n  const y = v => T + (hi - v) * (H - T - B) / span;\n  const pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(\" \");\n  const last = vals[vals.length - 1];\n  const col = last >= 0 ? \"var(--good)\" : \"var(--bad)\";\n  const area = `${L},${y(0).toFixed(1)} ${pts} ${x(vals.length-1).toFixed(1)},${y(0).toFixed(1)}`;\n  const ticks = [hi, 0, lo].filter((v,i,a) => a.indexOf(v) === i);\n  let marks = \"\";\n  for(const t of ticks){\n    marks += `<line x1=\"${L}\" x2=\"${W-R}\" y1=\"${y(t).toFixed(1)}\" y2=\"${y(t).toFixed(1)}\"\n      stroke=\"var(--line)\" stroke-width=\"1\"${t === 0 ? \"\" : ' stroke-dasharray=\"2 4\"'}/>\n      <text x=\"${L-8}\" y=\"${(y(t)+4).toFixed(1)}\" text-anchor=\"end\" fill=\"var(--dim)\"\n        font-size=\"11\" font-family=\"var(--mono)\">${t.toFixed(0)}<\/text>`;\n  }\n  return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" height=\"220\" role=\"img\"\n    aria-label=\"Cumulative result: ${last.toFixed(1)} big blinds after ${vals.length} hands, low point ${lo.toFixed(0)}\">\n    ${marks}\n    <polygon points=\"${area}\" fill=\"${col}\" opacity=\"0.10\"/>\n    <polyline points=\"${pts}\" fill=\"none\" stroke=\"${col}\" stroke-width=\"2.25\"\n      stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n    <circle cx=\"${x(vals.length-1).toFixed(1)}\" cy=\"${y(last).toFixed(1)}\" r=\"4\" fill=\"${col}\"/>\n    <text x=\"${L}\" y=\"${H-7}\" fill=\"var(--dim)\" font-size=\"11\" font-family=\"var(--mono)\">hand 1<\/text>\n    <text x=\"${W-R}\" y=\"${H-7}\" text-anchor=\"end\" fill=\"var(--dim)\" font-size=\"11\"\n      font-family=\"var(--mono)\">hand ${vals.length}<\/text>\n  <\/svg>`;\n}\n\n/* ------------------------------------------------------------- stats --- */\nfunction statTable(rows, title, note){\n  if(!rows.length) return \"\";\n  let h = `<div class=\"panel flush\"><table><caption>${esc(title)}<\/caption><thead><tr>\n    <th>Stat<\/th><th class=\"n\">Rate<\/th><th class=\"n\">Sample<\/th>\n    <th class=\"n\">Typical<\/th><th>Read<\/th><\/tr><\/thead><tbody>`;\n  for(const r of rows){\n    const low = r.value < r.lo, high = r.value > r.hi;\n    const pill = r.thin ? '<span class=\"pill thin\">thin<\/span>'\n      : low ? '<span class=\"pill off\">low<\/span>'\n      : high ? '<span class=\"pill off\">high<\/span>'\n      : '<span class=\"pill ok\">in band<\/span>';\n    const scale = Math.max(r.hi * 1.6, r.value * 1.15, 10);\n    const w = Math.min(100, 100 * r.value / scale);\n    const bandL = 100 * r.lo / scale, bandR = 100 * r.hi / scale;\n    h += `<tr><td>${esc(r.label)}<\/td>\n      <td class=\"n\">${r.value.toFixed(1)}%<\/td>\n      <td class=\"n\" style=\"color:var(--dim)\">${r.act}/${r.opp}<\/td>\n      <td class=\"n\" style=\"color:var(--muted)\">${r.lo}\u2013${r.hi}%<\/td>\n      <td><div style=\"display:flex;align-items:center;gap:9px\">\n        <div class=\"meter\" style=\"flex:1\" title=\"${r.value.toFixed(1)}% vs typical ${r.lo}\u2013${r.hi}%\">\n          <i style=\"width:${w}%;background:${low||high?\"var(--bad)\":\"var(--good)\"}\"><\/i>\n          <u style=\"left:${bandL}%\"><\/u><u style=\"left:${bandR}%\"><\/u>\n        <\/div>${pill}<\/div><\/td><\/tr>`;\n  }\n  h += \"<\/tbody><\/table>\";\n  if(note) h += `<p class=\"lead\" style=\"padding:10px 16px 14px;margin:0\">${esc(note)}<\/p>`;\n  return h + \"<\/div>\";\n}\n\nfunction overview(){\n  const m = DATA.meta, s = DATA.split;\n  let h = \"\";\n  if(m.hands < 500){\n    h += `<div class=\"callout\"><b>${m.hands} hands is a small sample.<\/b> Preflop rates settle\n      around 1,000 hands, postflop rates need several thousand, and a win rate needs 20,000+.\n      Read everything here as a hypothesis to test against more data \u2014 not a verdict.<\/div>`;\n  }\n  h += `<div class=\"row r3\">\n    <div class=\"tile ${m.netBB>=0?\"up\":\"down\"}\"><div class=\"k\">Result<\/div>\n      <div class=\"v\">${sgn(m.netBB)} bb<\/div>\n      <div class=\"n\">${sgn(m.bb100)} bb/100 across ${m.hands} hands<\/div><\/div>\n    <div class=\"tile ${s.showdown_bb>=0?\"up\":\"down\"}\"><div class=\"k\">At showdown<\/div>\n      <div class=\"v\">${sgn(s.showdown_bb)} bb<\/div>\n      <div class=\"n\">pots that got called<\/div><\/div>\n    <div class=\"tile ${s.non_showdown_bb>=0?\"up\":\"down\"}\"><div class=\"k\">Without showdown<\/div>\n      <div class=\"v\">${sgn(s.non_showdown_bb)} bb<\/div>\n      <div class=\"n\">pots won uncontested<\/div><\/div>\n  <\/div>`;\n  h += `<h2>Where the money went<\/h2>\n    <div class=\"panel\">${chart(DATA.cumulative)}\n    <p class=\"lead\" style=\"margin:10px 0 0\">Cumulative result in big blinds, hand by hand.\n    Steep single-hand drops matter more than the slope \u2014 they point at individual\n    decisions rather than a losing style.<\/p><\/div>`;\n  h += `<h2>Rates<\/h2><div class=\"row r2\">\n    ${statTable(DATA.heroStats, \"You\", \"Markers on each bar show the band a winning 6-max regular occupies.\")}\n    ${statTable(DATA.poolStats, \"The pool \u2014 every opponent merged\",\n      \"This site rotates opponent IDs every hand, so the merged pool is the right prior for an unknown player.\")}\n  <\/div>`;\n  if(DATA.byPosition.length){\n    h += `<h2>By seat<\/h2><div class=\"panel flush\"><div class=\"scroll\"><table>\n      <thead><tr><th>Position<\/th><th class=\"n\">Hands<\/th><th class=\"n\">VPIP<\/th>\n      <th class=\"n\">PFR<\/th><th class=\"n\">bb/100<\/th><\/tr><\/thead><tbody>`;\n    for(const r of DATA.byPosition){\n      h += `<tr><td>${esc(r.pos)}<\/td><td class=\"n\">${r.hands}<\/td>\n        <td class=\"n\">${r.vpip==null?\"\u2013\":r.vpip+\"%\"}<\/td>\n        <td class=\"n\">${r.pfr==null?\"\u2013\":r.pfr+\"%\"}<\/td>\n        <td class=\"n ${dir(r.bb100)}\">${sgn(r.bb100,0)}<\/td><\/tr>`;\n    }\n    h += \"<\/tbody><\/table><\/div><\/div>\";\n  }\n  $(\"#v-overview\").innerHTML = h;\n}\n\n/* -------------------------------------------------------------- felt --- */\nfunction felt(hd){\n  const upto = ORDER.indexOf(hd.finalStreet);\n  const shown = hd.board.slice(0, BOARDN[hd.finalStreet] || 0);\n  const last = {};\n  for(let i = 0; i <= upto; i++)\n    for(const a of (hd.streets[ORDER[i]] || [])) last[a.player] = a;\n\n  const n = hd.players.length;\n  let seats = \"\";\n  hd.players.forEach((p, i) => {\n    const ang = (-90 + i * 360 / n) * Math.PI / 180;\n    const cx = 50 + 40 * Math.cos(ang), cy = 50 + 35 * Math.sin(ang);\n    const a = last[p.name];\n    const out = p.folded && ORDER.indexOf(p.folded) <= upto;\n    const face = p.cards.length ? cards(p.cards, true)\n      : (out ? \"\" : `<span class=\"hand\">${card(\"Xx\",true).replace(\"pc\",\"pc down\")}${\n          card(\"Xx\",true).replace(\"pc\",\"pc down\")}<\/span>`);\n    seats += `<div class=\"seat${p.isHero?\" me\":\"\"}${out?\" gone\":\"\"}\" style=\"left:${cx}%;top:${cy}%\">\n      <div class=\"box\">\n        <div class=\"who\">${esc(p.isHero?\"You\":p.name.slice(0,8))}<em>${esc(p.pos)}<\/em>${\n          p.seat === hd.buttonSeat ? '<span class=\"dealer\">D<\/span>' : \"\"}<\/div>\n        <div class=\"chips\">${p.stackBB} bb<\/div>\n        ${face}\n        <div class=\"did\">${a ? esc(a.verb + (a.amount ? \" \" + a.amount : \"\")) : \"\"}<\/div>\n      <\/div><\/div>`;\n  });\n  const centre = shown.length\n    ? `<div class=\"board\">${shown.map(c => card(c)).join(\"\")}<\/div>`\n    : '<div class=\"pre\">pre-flop<\/div>';\n  return `<div class=\"felt\">${seats}<div class=\"centre\">${centre}\n    <div class=\"pot\">pot ${potAt(hd, hd.finalStreet)} bb<\/div><\/div><\/div>`;\n}\nfunction potAt(hd, street){\n  for(let i = ORDER.indexOf(street); i >= 0; i--){\n    const e = hd.decisions.filter(d => d.street === ORDER[i]).pop();\n    if(e) return e.potBB;\n  }\n  return 0;\n}\n\n/* ------------------------------------------------------------- hands --- */\nlet handFilter = \"all\";\n\nfunction reviewBadges(hd){\n  let out = \"\";\n  if (hd.badBB > 0) out += '<span class=\"pill off\">fix ' + hd.badBB + ' bb<\/span> ';\n  if (hd.goodBB > 0) out += '<span class=\"pill ok\">good ' + hd.goodBB + ' bb<\/span>';\n  return out || '<span style=\"color:var(--dim)\">\u2013<\/span>';\n}\n\nfunction hands(){\n  const list0 = DATA.sessions || [];\n  if (handFilter !== \"all\" && !list0.some(s => s.id === handFilter)) handFilter = \"all\";\n  const opts = ['<option value=\"all\">All sessions<\/option>'].concat(\n    list0.slice().reverse().map(s => '<option value=\"' + esc(s.id) + '\"' +\n      (s.id === handFilter ? \" selected\" : \"\") + \">\" + esc(s.label) + \" (\" + s.hands +\n      \" hands)<\/option>\")).join(\"\");\n  const rows = DATA.hands.filter(hd => handFilter === \"all\" || hd.sessionId === handFilter)\n    .sort((a, b) => a.heroNetBB - b.heroNetBB);\n  let h = '<div class=\"toolbar\"><label for=\"hfilter\" class=\"eyebrow\" style=\"margin:0\">Session<\/label>' +\n    '<select id=\"hfilter\">' + opts + \"<\/select>\" +\n    '<span class=\"small muted\">' + rows.length + \" hands, worst result first. Pick one to \" +\n    \"replay it and review your decisions.<\/span><\/div>\" +\n    '<div class=\"panel flush\"><div class=\"scroll\"><table><thead><tr><th>Hand<\/th><th>Seat<\/th>' +\n    '<th>Your cards<\/th><th>Board<\/th><th>Reached<\/th><th>Review<\/th><th class=\"n\">Result<\/th>' +\n    \"<\/tr><\/thead><tbody>\";\n  for (const hd of rows){\n    h += '<tr class=\"pick\" tabindex=\"0\" data-id=\"' + esc(hd.id) + '\">' +\n      '<td class=\"n\" style=\"color:var(--dim);font-size:11.5px\">' + esc(hd.id) + \"<\/td>\" +\n      \"<td>\" + esc(hd.heroPos) + \"<\/td>\" +\n      \"<td>\" + cards(hd.heroCards, true) + \"<\/td>\" +\n      \"<td>\" + cards(hd.board, true) + \"<\/td>\" +\n      '<td style=\"color:var(--muted);font-size:12px\">' + esc(hd.finalStreet) + \"<\/td>\" +\n      '<td style=\"white-space:nowrap\">' + reviewBadges(hd) + \"<\/td>\" +\n      '<td class=\"n ' + dir(hd.heroNetBB) + '\">' + sgn(hd.heroNetBB) + \" bb<\/td><\/tr>\";\n  }\n  h += '<\/tbody><\/table><\/div><\/div><div id=\"detail\"><\/div>';\n  $(\"#v-hands\").innerHTML = h;\n  $(\"#hfilter\").onchange = e => { handFilter = e.target.value; hands(); };\n  for (const tr of document.querySelectorAll(\"tr.pick\")){\n    tr.onclick = () => openHand(tr.dataset.id);\n    tr.onkeydown = e => {\n      if (e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); openHand(tr.dataset.id); }\n    };\n  }\n}\n\nfunction jumpToHand(id, sessionId){\n  handFilter = sessionId || \"all\";\n  showTab(\"hands\");\n  hands();\n  openHand(id);\n}\n\nfunction maths(d){\n  const r = [];\n  const add = (k,v) => r.push(`<dt>${k}<\/dt><dd>${v}<\/dd>`);\n  add(\"Pot before you acted\", `${d.potBefore} <span style=\"color:var(--dim)\">(${d.potBB} bb)<\/span>`);\n  if(d.spr != null) add(\"Stack-to-pot ratio\", d.spr);\n  if(d.toCall > 0){\n    add(\"To call\", d.toCall);\n    add(\"Equity your call needs\", `${d.potOdds}%`);\n    add(\"Minimum defence frequency\", `${d.mdf}%`);\n  }\n  if(d.betPct != null){\n    add(\"Your sizing\", `${d.betPct}% of pot`);\n    add(\"Folds needed to break even\", `${d.reqFE}%`);\n  }\n  if(d.madeHand) add(\"Your hand\", d.madeHand);\n  if(d.texture) add(\"Board\", d.texture);\n\n  let eq = \"\";\n  if(d.equity != null){\n    eq = `<div class=\"eq\"><div class=\"lab\"><span style=\"color:var(--muted)\">Your equity vs their estimated range<\/span>\n      <b>${d.equity}%<\/b><\/div><div class=\"eqbar\">\n      <i style=\"width:${d.equity}%;background:var(--good)\"><\/i>\n      <i style=\"width:${100-d.equity}%;background:var(--bad)\"><\/i><\/div><\/div>`;\n  }\n  let note = \"\";\n  if(d.evCall != null){\n    if(d.evCall < -0.5) note = `<div class=\"note bad\">Calling cost <b>${d.evCall.toFixed(2)}<\/b>\n      in expectation. You needed <b>${d.potOdds}%<\/b> equity and held <b>${d.equity}%<\/b>.<\/div>`;\n    else if(d.evCall > 0.5) note = `<div class=\"note good\">Calling was worth\n      <b>+${d.evCall.toFixed(2)}<\/b> against the estimated range.<\/div>`;\n    else note = `<div class=\"note flat\">Close to break-even (${sgn(d.evCall,2)}).<\/div>`;\n  }\n  return `<div class=\"maths\"><dl>${r.join(\"\")}<\/dl>${eq}<\/div>${note}`;\n}\n\nfunction openHand(id){\n  const hd = DATA.hands.find(x => x.id === id);\n  if(!hd) return;\n  let h = `<div class=\"detail\"><button class=\"ghost\" id=\"shut\" type=\"button\">\u2190 Back<\/button>\n    <div class=\"top\" style=\"margin-top:12px\">\n      <h3>${cards(hd.heroCards, true)} &nbsp;from the ${esc(hd.heroPos)}<\/h3>\n      <div class=\"res ${dir(hd.heroNetBB)}\">${sgn(hd.heroNetBB)} bb<\/div><\/div>\n    <div class=\"meta\" style=\"color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-top:4px\">\n      ${esc(hd.id)} \u00b7 ${esc(hd.time)} \u00b7 ${esc(hd.sb)}/${esc(hd.bb)}${\n      hd.ante ? \" ante \" + hd.ante : \"\"} \u00b7 ${hd.players.length}-handed<\/div>\n    <div class=\"row r2\" style=\"margin-top:14px\"><div>${felt(hd)}<\/div><div>`;\n\n  if(hd.villain && Object.keys(hd.ranges).length){\n    h += `<p class=\"eyebrow\">What they could hold<\/p>\n      <p class=\"lead\" style=\"margin-bottom:8px\">Main opponent <b style=\"color:var(--ink)\">${\n        esc(hd.villain)}<\/b> (${esc(hd.villainPos)})${\n        hd.villainCards.length ? \" \u2014 showed \" + cards(hd.villainCards, true) : \"\"}<\/p>`;\n    for(const st of ORDER){\n      const r = hd.ranges[st];\n      if(!r) continue;\n      h += `<div class=\"rng\"><b>${st}<\/b> \u2014 ${r.pct}% of hands, ${r.combos} combos\n        <code>${esc(r.summary)}<\/code><\/div>`;\n    }\n    h += `<p class=\"lead\" style=\"margin-top:10px\">Estimated from their position and betting\n      line, narrowed street by street. A model, not a read.<\/p>`;\n  }\n  h += \"<\/div><\/div>\";\n\n  for(const st of ORDER){\n    const acts = hd.streets[st];\n    if(!acts) continue;\n    const b = hd.board.slice(0, BOARDN[st]);\n    h += `<div class=\"street\"><h4>${st}${b.length ? cards(b, true) : \"\"}<\/h4>`;\n    for(const a of acts){\n      h += `<div class=\"act${a.isHero?\" me\":\"\"}\"><b>${esc(a.isHero?\"You\":a.player.slice(0,8))}<\/b>\n        <em>${esc(a.pos)}<\/em><span>${esc(a.verb)}${a.amount ? \" \" + a.amount : \"\"}<\/span><\/div>`;\n    }\n    for(const d of hd.decisions.filter(d => d.street === st)) h += maths(d);\n    h += \"<\/div>\";\n  }\n  h += reviewHTML(hd.grades, \"Review of your decisions\");\n  h += solveHTML(hd) + diveHTML(hd) + askHTML(hd);\n  h += `<p class=\"foot\" style=\"margin-top:18px\">Pot ${hd.pot} \u00b7 rake ${hd.rake}<\/p><\/div>`;\n  $(\"#detail\").innerHTML = h;\n  $(\"#shut\").onclick = () => { $(\"#detail\").innerHTML = \"\"; };\n  wireSolve(hd);\n  wireDive(hd);\n  wireAsk(hd);\n  $(\"#detail\").scrollIntoView({behavior:\"smooth\", block:\"start\"});\n}\n\nfunction reviewHTML(grades, title){\n  let h = '<div class=\"review\"><p class=\"eyebrow\">' + esc(title) + \"<\/p>\";\n  if (!grades || !grades.length){\n    return h + '<p class=\"lead\">Nothing in this hand stood out as clearly right or wrong ' +\n      \"against their estimated range.<\/p><\/div>\";\n  }\n  for (const g of grades){\n    const mark = g.kind === \"good\" ? \"\u2713\" : (g.kind === \"review\" ? \"?\" : \"\u2717\");\n    h += '<div class=\"grade ' + esc(g.kind) + '\"><i>' + mark + \"<\/i><span>\" + esc(g.text) +\n      \"<\/span><\/div>\";\n  }\n  return h + '<p class=\"lead\" style=\"margin-top:6px\">Graded against an estimated opponent ' +\n    \"range \u2014 a guide to what deserves a second look, not a final verdict.<\/p><\/div>\";\n}\n\n/* ---- deep dive: re-run the maths with your own read of their range ---- */\nfunction diveHTML(hd){\n  if (!hd.villain) return \"\";\n  let h = '<div class=\"dive\"><p class=\"eyebrow\" style=\"margin:0\">Deep dive \u2014 change their range<\/p>';\n  if (!DATA.pysrc || !hd.raw){\n    return h + '<p class=\"lead\" style=\"margin:6px 0 0\">Re-running the maths with your own ' +\n      'read works on <a href=\"https://sliderightsole.github.io/poker-brain/\" target=\"_blank\" ' +\n      'rel=\"noopener\">your own site<\/a>.<\/p><\/div>';\n  }\n  h += '<p class=\"lead\" style=\"margin:6px 0 0\">Think they had something different? Type the ' +\n    \"hands you put them on for any street (e.g. <code>QQ+, AK, JTs<\/code>) and recalculate. \" +\n    \"Blank streets keep the estimate.<\/p><div class=\\\"fields\\\">\";\n  for (const st of ORDER){\n    if (!hd.streets[st]) continue;\n    const ph = st === \"preflop\" ? (hd.villainRangeSpec || \"estimate\") : \"estimate\";\n    h += '<div class=\"fld\"><label for=\"dv-' + st + '\">Their ' + st + \" range<\/label>\" +\n      '<input id=\"dv-' + st + '\" type=\"text\" autocomplete=\"off\" placeholder=\"' + esc(ph) + '\"><\/div>';\n  }\n  return h + '<\/div><button class=\"btn\" id=\"divebtn\" type=\"button\">Recalculate<\/button> ' +\n    '<span class=\"small muted\" id=\"divemsg\"><\/span><div id=\"diveout\"><\/div><\/div>';\n}\n\nfunction wireDive(hd){\n  const btn = $(\"#divebtn\");\n  if (!btn) return;\n  btn.onclick = async () => {\n    const overrides = {};\n    for (const st of ORDER){\n      const el = $(\"#dv-\" + st);\n      if (el && el.value.trim()) overrides[st] = el.value.trim();\n    }\n    btn.disabled = true;\n    $(\"#divemsg\").innerHTML = '<span class=\"busy\"><span class=\"spin\"><\/span>' +\n      (pyReady ? \"Recalculating\u2026\" : \"Loading the analyser\u2026 the first time takes a moment.\") +\n      \"<\/span>\";\n    try {\n      const py = await ensurePython();\n      const fn = py.globals.get(\"pb_dive\");\n      let raw;\n      try { raw = await fn(hd.raw, JSON.stringify(overrides)); } finally { fn.destroy(); }\n      const res = JSON.parse(raw);\n      if (res.error){ $(\"#divemsg\").textContent = res.error; return; }\n      hd._dive = res;\n      $(\"#divemsg\").textContent = \"\";\n      let h = '<div class=\"review\"><p class=\"eyebrow\">Recalculated with ' +\n        (Object.keys(res.overrides).length ? \"your ranges\" : \"the estimate\") + \"<\/p>\";\n      for (const st of ORDER){\n        const r = res.ranges[st];\n        const ds = res.decisions.filter(d => d.street === st);\n        if (!ds.length) continue;\n        h += '<div class=\"street\"><h4>' + st + \"<\/h4>\";\n        if (r) h += '<div class=\"rng\">' + (res.overrides[st] ? \"Your range\" : \"Estimated range\") +\n          \" \u2014 \" + r.pct + \"% of hands<code>\" + esc(r.summary) + \"<\/code><\/div>\";\n        for (const d of ds) h += maths(d);\n        h += \"<\/div>\";\n      }\n      h += \"<\/div>\" + reviewHTML(res.grades, \"Review with these ranges\");\n      $(\"#diveout\").innerHTML = h;\n    } catch(err){\n      $(\"#divemsg\").textContent = \"Could not recalculate: \" +\n        String((err && err.message) || err).slice(0, 200);\n    } finally {\n      btn.disabled = false;\n    }\n  };\n}\n\n/* ---- ask: Claude where the page can reach it, otherwise copy for Claude -- */\nfunction handContext(hd){\n  const L = [];\n  L.push(\"Hand \" + hd.id + \" (\" + hd.time + \"), CoinPoker NLH \" + hd.sb + \"/\" + hd.bb +\n    (hd.ante ? \" ante \" + hd.ante : \"\") + \", \" + hd.players.length + \"-handed.\");\n  L.push(\"I am in the \" + hd.heroPos + \" with \" + hd.heroCards.join(\" \") + \".\");\n  L.push(\"Players: \" + hd.players.map(p => (p.isHero ? \"Me\" : p.name) + \" \" + p.pos + \" \" +\n    p.stackBB + \"bb\").join(\", \") + \".\");\n  for (const st of ORDER){\n    const acts = hd.streets[st];\n    if (!acts) continue;\n    const b = hd.board.slice(0, BOARDN[st]);\n    L.push(st.toUpperCase() + (b.length ? \" [\" + b.join(\" \") + \"]\" : \"\") + \": \" +\n      acts.map(a => (a.isHero ? \"Me\" : a.player) + \" (\" + a.pos + \") \" + a.verb +\n        (a.amount ? \" \" + a.amount : \"\")).join(\", \"));\n  }\n  L.push(\"Result for me: \" + sgn(hd.heroNetBB) + \" bb. Pot \" + hd.pot + \".\");\n  if (hd.villainCards && hd.villainCards.length)\n    L.push(\"Main opponent showed \" + hd.villainCards.join(\" \") + \".\");\n  const dive = hd._dive;\n  const decisions = dive ? dive.decisions : hd.decisions;\n  const ranges = dive ? dive.ranges : hd.ranges;\n  L.push(\"\");\n  L.push(\"Engine maths for each of my decisions (opponent ranges are estimates\" +\n    (dive && Object.keys(dive.overrides).length ? \", some set by me\" : \"\") + \"):\");\n  for (const d of decisions){\n    const bits = [d.street + \": I \" + d.verb + (d.amount ? \" \" + d.amount : \"\"),\n      \"pot \" + d.potBB + \"bb\"];\n    if (d.toCall > 0) bits.push(\"to call \" + d.toCall + \", needed \" + d.potOdds + \"%\");\n    if (d.equity != null) bits.push(\"equity vs range \" + d.equity + \"%\");\n    if (d.evCall != null) bits.push(\"EV of calling \" + d.evCall);\n    if (d.spr != null) bits.push(\"SPR \" + d.spr);\n    if (d.madeHand) bits.push(d.madeHand);\n    L.push(\"- \" + bits.join(\"; \"));\n  }\n  for (const st of ORDER){\n    if (ranges && ranges[st]) L.push(\"Their \" + st + \" range: \" + ranges[st].summary +\n      \" (\" + ranges[st].pct + \"% of hands)\");\n  }\n  if (hd._solve && hd._solve.line){\n    L.push(\"\");\n    L.push(\"River solver (GTO, estimated ranges) with my hand \" + hd._solve.spot.heroHand + \":\");\n    for (const st of hd._solve.line){\n      if (!st.hero) continue;\n      L.push(\"- at [\" + (st.path.join(\" > \") || \"start of river\") + \"]: solver plays \" +\n        st.actions.map((a, i) => a + \" \" + Math.round(100 * st.hero[i]) + \"%\").join(\", \") +\n        \"; I chose \" + st.chosen);\n    }\n  }\n  const grades = dive ? dive.grades : hd.grades;\n  if (grades && grades.length){\n    L.push(\"\");\n    L.push(\"Automatic review:\");\n    for (const g of grades) L.push(\"- [\" + g.kind + \"] \" + g.text);\n  }\n  return L.join(\"\\n\");\n}\n\nconst ASK_RULES = [\n  \"You are an experienced poker coach reviewing one hand of online 6-max cash with a\",\n  \"student. Answer the student's question directly first, then explain. Refer to the\",\n  \"student as 'you' and the opponent as 'they'. Judge the decisions, not the result.\",\n  \"The maths below comes from an equity engine; treat the opponent ranges as estimates\",\n  \"and say when a different read would change the answer. Keep it practical: what to do\",\n  \"next time in this spot and why. Plain text, no tables.\"\n].join(\" \");\n\nfunction askHTML(hd){\n  return '<div class=\"ask\"><p class=\"eyebrow\" style=\"margin:0\">Ask about this hand<\/p>' +\n    '<p class=\"lead\" style=\"margin:6px 0 8px\">Ask anything \u2014 \u201cshould I have raised the ' +\n    \"flop?\u201d, \u201cwhat was I beating on the river?\u201d. \" +\n    \"If you recalculated with your own ranges above, those are included.<\/p>\" +\n    '<label for=\"askq\" class=\"eyebrow\">Your question<\/label>' +\n    '<textarea id=\"askq\" placeholder=\"What should I have done differently?\"><\/textarea>' +\n    '<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center\">' +\n    '<button class=\"btn\" id=\"askbtn\" type=\"button\">Get answer<\/button>' +\n    '<button class=\"ghost\" id=\"copybtn\" type=\"button\">Copy hand + question<\/button>' +\n    '<span class=\"small muted\" id=\"askmsg\"><\/span><\/div>' +\n    '<div class=\"answer\" id=\"askout\"><\/div><\/div>';\n}\n\nasync function claudeSample(){\n  if (sampleFn) return sampleFn;\n  try {\n    if (window.claude && window.claude.use) sampleFn = await window.claude.use(\"sample\");\n  } catch(e){ sampleFn = null; }\n  return sampleFn;\n}\n\n/* ---- built-in coach: answers common questions from this hand's numbers,\n   used wherever Claude isn't available (the self-hosted page) ---- */\nconst ASK_TOPICS = [\n  [\"equity\", /equity|chance|percent|%|how often.*win|odds of winning|outs/i],\n  [\"price\", /pot odds|price|odds|need(ed)? to call|break ?even|worth (a )?call/i],\n  [\"range\", /beat|ahead|behind|range|what (did|could|would) (they|he|she|villain)|put (them|him|her) on/i],\n  [\"action\", /should i|raise|call|fold|bet|check|shove|all.?in|jam|differently|mistake|right play|best play/i]\n];\n\nfunction askTopics(q){\n  const hits = ASK_TOPICS.filter(t => t[1].test(q)).map(t => t[0]);\n  return hits.length ? hits : [\"review\"];\n}\n\nfunction askStreet(q){\n  for (const st of ORDER) if (new RegExp(\"\\\\b\" + st + \"\\\\b\", \"i\").test(q)) return st;\n  return null;\n}\n\nfunction bbOf(hd, x){ return Math.round(10 * x / (hd.bb || 1)) / 10; }\n\nfunction decisionLine(hd, d){\n  const act = d.verb + (d.amount ? \" \" + bbOf(hd, d.amount) + \" bb\" : \"\");\n  let s = cap(d.street) + \" - you \" + act + \" (pot \" + d.potBB + \" bb\" +\n    (d.madeHand ? \", you had \" + d.madeHand : \"\") + \").\";\n  if (d.equity != null) s += \" Your equity against their estimated range: \" + d.equity + \"%.\";\n  if (d.toCall > 0 && d.potOdds != null){\n    const called = d.verb === \"call\";\n    s += (called ? \" Calling cost \" : \" A call would have cost \") + bbOf(hd, d.toCall) +\n      \" bb, needing \" + d.potOdds + \"% equity.\";\n    if (d.equity != null){\n      const gap = Math.round(10 * (d.equity - d.potOdds)) / 10;\n      const verb = called ? \"calling \" : \"a call \";\n      s += gap >= 0 ? \" You had \" + gap + \" points more than that, so \" + verb +\n                      (called ? \"made\" : \"would have made\") + \" money\"\n                    : \" You were \" + (-gap) + \" points short, so \" + verb +\n                      (called ? \"lost\" : \"would have lost\") + \" money\";\n      if (d.evCall != null) s += \" (about \" + sgn(bbOf(hd, d.evCall)) + \" bb each time)\";\n      s += \".\";\n    }\n  }\n  return s;\n}\n\nfunction cap(s){ return s ? s[0].toUpperCase() + s.slice(1) : s; }\n\nfunction localAnswer(hd, q){\n  const dive = hd._dive;\n  const decisions = (dive ? dive.decisions : hd.decisions) || [];\n  const ranges = (dive ? dive.ranges : hd.ranges) || {};\n  const grades = (dive ? dive.grades : hd.grades) || [];\n  const street = askStreet(q);\n  const picked = street ? decisions.filter(d => d.street === street) : decisions;\n  const ds = picked.length ? picked : decisions;\n  const topics = askTopics(q);\n  const out = [];\n\n  if (topics.includes(\"equity\")){\n    out.push(\"HOW TO WORK OUT YOUR EQUITY\",\n      \"Equity is how often your hand wins by the river against every hand they could have - \" +\n      \"not against their one actual hand.\",\n      \"1. Put them on a range: the hands they would play this way. Their action narrows it \" +\n      \"(a big river raise is mostly strong hands).\",\n      \"2. If you're behind and drawing, count your outs - the cards that make you the best \" +\n      \"hand. Don't count outs that also improve them.\",\n      \"3. Rule of 2 and 4: outs x 4 = your rough equity on the flop with two cards to come; \" +\n      \"outs x 2 on the turn with one card to come. Example: a flush draw has 9 outs, so \" +\n      \"about 36% on the flop and 18% on the turn.\",\n      \"4. If you have a made hand, ask what share of their range you beat. Beating half of \" +\n      \"it means roughly 50%.\",\n      \"5. Compare with the price: call / (pot + their bet + your call). If your equity is \" +\n      \"higher, calling makes money.\",\n      \"At the table you estimate. Here the engine works it out exactly against the range \" +\n      \"shown in the deep dive above. Change that range and press Recalculate to see how \" +\n      \"much your read matters.\", \"\");\n  }\n  if (topics.includes(\"price\") && !topics.includes(\"equity\")){\n    out.push(\"THE PRICE\",\n      \"Needed equity = your call / (pot + their bet + your call). A half-pot bet needs 25%, \" +\n      \"a two-thirds bet 28.6%, a pot-sized bet 33%, and a shove twice the pot needs 40%.\", \"\");\n  }\n\n  const lines = ds.map(d => decisionLine(hd, d));\n  if (lines.length){\n    out.push(street ? \"YOUR \" + street.toUpperCase() + \" IN THIS HAND\" : \"IN THIS HAND\");\n    out.push(...lines, \"\");\n  } else if (street){\n    out.push(\"You didn't make a decision on the \" + street + \" in this hand.\", \"\");\n  }\n\n  if (topics.includes(\"range\") || topics.includes(\"equity\")){\n    const rs = ORDER.filter(st => ranges[st] && (!street || st === street));\n    if (rs.length){\n      out.push(\"WHAT THEY COULD HAVE (estimated)\");\n      for (const st of rs) out.push(cap(st) + \": \" + ranges[st].summary + \" (\" +\n        ranges[st].pct + \"% of all hands).\");\n      if (hd.villainCards && hd.villainCards.length)\n        out.push(\"They actually showed \" + hd.villainCards.join(\" \") + \" - but judge the \" +\n          \"decision against the whole range, not the one hand they had.\");\n      out.push(\"\");\n    }\n  }\n\n  if (topics.includes(\"action\") || topics.includes(\"review\")){\n    const gs = street ? grades.filter(g => !g.street || g.street === street) : grades;\n    out.push(\"VERDICT\");\n    if (gs.length){\n      for (const g of gs) out.push((g.kind === \"good\" ? \"Good: \" : g.kind === \"review\" ?\n        \"Check: \" : \"Fix: \") + g.text);\n    } else {\n      out.push(\"Nothing here stood out as clearly right or wrong against their estimated \" +\n        \"range. A close spot - either choice is fine unless you have a specific read.\");\n    }\n    const facing = ds.filter(d => d.toCall > 0 && d.equity != null && d.verb === \"fold\");\n    for (const d of facing){\n      out.push(d.equity >= d.potOdds\n        ? \"On the \" + d.street + \" you folded with \" + d.equity + \"% when you needed \" +\n          d.potOdds + \"% - calling was the better choice against this range.\"\n        : \"On the \" + d.street + \" your fold was right: \" + d.equity + \"% is less than the \" +\n          d.potOdds + \"% you needed.\");\n    }\n    out.push(\"\");\n  }\n\n  out.push(\"These answers come from the engine and estimated ranges. For anything more \" +\n    \"specific, use \u201cCopy hand + question\u201d and paste it into a chat with Claude.\");\n  return out.join(\"\\n\");\n}\n\nfunction wireAsk(hd){\n  const q = $(\"#askq\");\n  const askText = () => (q.value.trim() || \"Review this hand. What did I do well, and what \" +\n    \"should I change?\");\n  const copyText = () => \"Help me with this poker hand. \" + askText() + \"\\n\\n\" + handContext(hd);\n\n  $(\"#copybtn\").onclick = async () => {\n    const text = copyText();\n    let ok = false;\n    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}\n    if (!ok){\n      $(\"#askout\").textContent = text;\n      $(\"#askmsg\").textContent = \"Select the text below and copy it.\";\n      return;\n    }\n    $(\"#askmsg\").textContent = \"Copied \u2014 paste it into a chat with Claude.\";\n  };\n\n  $(\"#askbtn\").onclick = async () => {\n    const btn = $(\"#askbtn\");\n    const sample = await claudeSample();\n    if (!sample){\n      $(\"#askout\").textContent = localAnswer(hd, askText());\n      $(\"#askmsg\").textContent = \"Answered by the built-in coach.\";\n      return;\n    }\n    btn.disabled = true;\n    $(\"#askmsg\").textContent = \"\";\n    $(\"#askout\").textContent = \"Thinking\u2026\";\n    try {\n      await sample(ASK_RULES + \"\\n\\nQuestion: \" + askText() + \"\\n\\n\" + handContext(hd), {\n        cache: false,\n        onText: ({text}) => { $(\"#askout\").textContent = text; }\n      });\n    } catch(e){\n      const why = {\n        not_granted: \"You haven't allowed this page to use Claude. Reload to be asked again, or copy the hand instead.\",\n        rate_limited: \"Too many requests right now \u2014 try again in a moment.\",\n        session_expired: \"Your Claude session expired \u2014 sign in again.\"\n      }[e && e.code];\n      $(\"#askout\").textContent = (e && e.text) || \"\";\n      $(\"#askmsg\").textContent = why || \"Couldn't get an answer \u2014 try again, or copy the hand instead.\";\n    } finally {\n      btn.disabled = false;\n    }\n  };\n}\n\n\n/* ---------------------------------------------------------- sessions --- */\nlet sessionPick = null;\n\nfunction hcardHTML(x, kind, sid){\n  const first = x.reasons[0];\n  const more = x.reasons.length > 1 ? \" (+\" + (x.reasons.length - 1) + \" more)\" : \"\";\n  return '<button class=\"hcard ' + kind + '\" type=\"button\" data-id=\"' + esc(x.id) +\n    '\" data-sid=\"' + esc(sid) + '\"><span class=\"bar\"><\/span><span style=\"flex:1\">' +\n    '<span class=\"hc-top\">' + cards(x.cards, true) + \"<b>\" + esc(x.pos) + \"<\/b>\" +\n    '<span class=\"pill ' + (kind === \"good\" ? \"ok\" : \"off\") + '\">' +\n    (kind === \"good\" ? \"+\" : \"\") + x.bb + \" bb<\/span>\" +\n    '<span class=\"' + dir(x.netBB) + '\" style=\"font-family:var(--mono);font-size:12px\">result ' +\n    sgn(x.netBB) + \" bb<\/span><\/span>\" +\n    \"<p>\" + esc(first.text) + esc(more) + \"<\/p><\/span><\/button>\";\n}\n\nfunction sessionsView(){\n  const list = DATA.sessions || [];\n  const box = $(\"#v-sessions\");\n  if (!list.length){\n    box.innerHTML = '<div class=\"panel\">No sessions yet \u2014 load some hands.<\/div>';\n    return;\n  }\n  if (!list.some(s => s.id === sessionPick)) sessionPick = list[list.length - 1].id;\n  const s = list.find(x => x.id === sessionPick);\n  const opts = list.slice().reverse().map(x => '<option value=\"' + esc(x.id) + '\"' +\n    (x.id === s.id ? \" selected\" : \"\") + \">\" + esc(x.label) + \" \u2014 \" + x.hands +\n    \" hands, \" + sgn(x.netBB) + \" bb<\/option>\").join(\"\");\n\n  let h = '<div class=\"toolbar\"><label for=\"spick\" class=\"eyebrow\" style=\"margin:0\">Session<\/label>' +\n    '<select id=\"spick\">' + opts + \"<\/select><\/div>\";\n  h += '<div class=\"row r3\">' +\n    '<div class=\"tile ' + (s.netBB >= 0 ? \"up\" : \"down\") + '\"><div class=\"k\">Result<\/div>' +\n      '<div class=\"v\">' + sgn(s.netBB) + \" bb<\/div>\" +\n      '<div class=\"n\">' + s.hands + \" hands \u00b7 \" + sgn(s.bb100) + \" bb/100<\/div><\/div>\" +\n    '<div class=\"tile down\"><div class=\"k\">Mistakes cost<\/div>' +\n      '<div class=\"v\">' + s.mistakeBB + \" bb<\/div>\" +\n      '<div class=\"n\">' + s.toFix.length + \" hands worth fixing<\/div><\/div>\" +\n    '<div class=\"tile up\"><div class=\"k\">Well played<\/div>' +\n      '<div class=\"v\">+' + s.goodBB + \" bb<\/div>\" +\n      '<div class=\"n\">from good decisions<\/div><\/div><\/div>';\n  if (s.hands < 200){\n    h += '<p class=\"lead\" style=\"margin-top:10px\">One session is a small sample \u2014 use it ' +\n      \"to review decisions, not to judge your win rate. Results swing; decisions are what \" +\n      \"you control.<\/p>\";\n  }\n  h += '<div class=\"row r2\" style=\"margin-top:14px\">' +\n    '<div><h2 style=\"margin-top:6px\">Hands to fix<\/h2><div class=\"hcards\">' +\n    (s.toFix.length ? s.toFix.map(x => hcardHTML(x, \"bad\", s.id)).join(\"\")\n      : '<div class=\"panel\">No clear mistakes found in this session.<\/div>') + \"<\/div><\/div>\" +\n    '<div><h2 style=\"margin-top:6px\">Played well<\/h2><div class=\"hcards\">' +\n    (s.wellPlayed.length ? s.wellPlayed.map(x => hcardHTML(x, \"good\", s.id)).join(\"\")\n      : '<div class=\"panel\">Nothing stood out this session.<\/div>') + \"<\/div><\/div><\/div>\";\n  if (s.lesson){\n    h += '<div class=\"rulebox\" style=\"margin-top:12px\">Today\\u2019s lesson: ' + esc(s.lesson.title) +\n      ' <button class=\"ghost\" id=\"golesson\" type=\"button\" style=\"margin-left:8px\">Open lesson<\/button><\/div>';\n  }\n  h += '<p class=\"lead\" style=\"margin-top:8px\">Hands are ranked by how much the decision was ' +\n    \"worth against an estimated range \u2014 not by the result. Click one to replay it, \" +\n    \"change their range, or ask about it.<\/p>\";\n  h += '<h2>How the session went<\/h2><div class=\"panel\">' + chart(s.cumulative) + \"<\/div>\";\n  h += '<h2>Your stats this session<\/h2>' + statTable(s.heroStats, \"This session\",\n    \"Single-session stats are very noisy; compare them with the Overview across all hands.\");\n  if (s.findings && s.findings.length){\n    h += '<h2>Patterns this session<\/h2><div class=\"panel\">';\n    for (const f of s.findings){\n      h += '<div class=\"find ' + esc(f.severity) + '\"><div class=\"body\"><div class=\"sev\"><\/div><div>' +\n        \"<h4>\" + esc(f.title) + \"<\/h4><p>\" + esc(f.detail) + \"<\/p>\" +\n        (f.fix ? '<div class=\"fix\">\u2192 ' + esc(f.fix) + \"<\/div>\" : \"\") + \"<\/div><\/div><\/div>\";\n    }\n    h += \"<\/div>\";\n  }\n  h += '<h2>All sessions<\/h2><div class=\"panel flush\"><div class=\"scroll\"><table><thead><tr>' +\n    '<th>Session<\/th><th class=\"n\">Hands<\/th><th class=\"n\">Result<\/th><th class=\"n\">Mistakes<\/th>' +\n    '<th class=\"n\">Well played<\/th><\/tr><\/thead><tbody>';\n  for (const x of list.slice().reverse()){\n    h += '<tr class=\"pick spick\" tabindex=\"0\" data-sid=\"' + esc(x.id) + '\"><td>' + esc(x.label) +\n      '<\/td><td class=\"n\">' + x.hands + '<\/td><td class=\"n ' + dir(x.netBB) + '\">' + sgn(x.netBB) +\n      ' bb<\/td><td class=\"n\">' + x.mistakeBB + ' bb<\/td><td class=\"n\">+' + x.goodBB +\n      \" bb<\/td><\/tr>\";\n  }\n  h += \"<\/tbody><\/table><\/div><\/div>\";\n  box.innerHTML = h;\n\n  $(\"#spick\").onchange = e => { sessionPick = e.target.value; sessionsView(); };\n  const gl = $(\"#golesson\");\n  if (gl) gl.onclick = () => { lessonPick = s.id; lessonsView(); showTab(\"lessons\"); window.scrollTo(0, 0); };\n  for (const b of box.querySelectorAll(\".hcard\"))\n    b.onclick = () => jumpToHand(b.dataset.id, b.dataset.sid);\n  for (const tr of box.querySelectorAll(\"tr.spick\")){\n    const pick = () => { sessionPick = tr.dataset.sid; sessionsView(); window.scrollTo(0, 0); };\n    tr.onclick = pick;\n    tr.onkeydown = e => { if (e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); pick(); } };\n  }\n}\n\n/* ------------------------------------------------------------ solver --- */\nconst ACT_CHECK = \"#3f9a6b\", ACT_FOLD = \"#5f7c9c\", ACT_ALLIN = \"#8f2433\";\nconst ACT_AGG = [\"#e2b33c\", \"#e3843a\", \"#d45a3a\", \"#b53b3b\"];\nconst GRID_RANKS = \"AKQJT98765432\";\n\nfunction actColors(actions){\n  let k = 0;\n  return actions.map(a => a === \"Check\" || a === \"Call\" ? ACT_CHECK :\n    a === \"Fold\" ? ACT_FOLD : a === \"All-in\" ? ACT_ALLIN : ACT_AGG[Math.min(k++, ACT_AGG.length - 1)]);\n}\n\nfunction mixBar(actions, freqs){\n  const cols = actColors(actions);\n  return '<span class=\"mix\" role=\"img\" aria-label=\"' + esc(actions.map((a, i) =>\n    a + \" \" + Math.round(100 * freqs[i]) + \"%\").join(\", \")) + '\">' +\n    actions.map((a, i) => freqs[i] > 0.001 ? '<i style=\"width:' + (100 * freqs[i]).toFixed(1) +\n      \"%;background:\" + cols[i] + '\" title=\"' + esc(a + \" \" + Math.round(100 * freqs[i]) + \"%\") +\n      '\"><\/i>' : \"\").join(\"\") + \"<\/span>\";\n}\n\nfunction mixText(actions, freqs){\n  return actions.map((a, i) => [a, freqs[i]]).filter(x => x[1] >= 0.005)\n    .sort((x, y) => y[1] - x[1]).map(x => x[0] + \" \" + Math.round(100 * x[1]) + \"%\").join(\", \");\n}\n\nfunction legendHTML(actions){\n  const cols = actColors(actions);\n  return '<div class=\"legend2\">' + actions.map((a, i) => '<span><b style=\"background:' + cols[i] +\n    '\"><\/b>' + esc(a) + \"<\/span>\").join(\"\") + \"<\/div>\";\n}\n\nfunction gridHTML(node){\n  const cols = actColors(node.actions);\n  let h = '<div class=\"grid13\" role=\"img\" aria-label=\"Strategy by hand class\">';\n  for (let i = 0; i < 13; i++){\n    for (let j = 0; j < 13; j++){\n      const r1 = GRID_RANKS[i], r2 = GRID_RANKS[j];\n      const label = i === j ? r1 + r2 : (i < j ? r1 + r2 + \"s\" : r2 + r1 + \"o\");\n      const f = node.classes[label];\n      if (!f){ h += '<div class=\"empty\">' + label + \"<\/div>\"; continue; }\n      let acc = 0;\n      const stops = f.map((v, a) => {\n        const s = cols[a] + \" \" + acc.toFixed(1) + \"% \" + (acc + 100 * v).toFixed(1) + \"%\";\n        acc += 100 * v;\n        return s;\n      }).join(\",\");\n      h += '<div style=\"background:linear-gradient(to right,' + stops + ')\" title=\"' +\n        esc(label + \": \" + mixText(node.actions, f)) + '\">' + label + \"<\/div>\";\n    }\n  }\n  return h + \"<\/div>\";\n}\n\n// Actions alternate from OOP, so the i-th step of a path belongs to OOP on\n// even steps and IP on odd ones.\nfunction pathText(path, names){\n  if (!path.length) return \"Start of river\";\n  return path.map((a, i) => (names ? names[i % 2 ? \"IP\" : \"OOP\"] : (i % 2 ? \"IP\" : \"OOP\")) +\n    \" \" + a.toLowerCase()).join(\" \u2192 \");\n}\n\nfunction nodeName(n, names){\n  const who = names ? names[n.player] : n.player;\n  return who + \" to act \u00b7 after \" + pathText(n.path, names).replace(\"Start of river\", \"nothing yet\");\n}\n\nfunction handKey(text, node){\n  const t = text.replace(/\\s+/g, \"\");\n  if (t.length !== 4) return null;\n  const a = t[0].toUpperCase() + t[1].toLowerCase(), b = t[2].toUpperCase() + t[3].toLowerCase();\n  if (node.hands[a + b]) return a + b;\n  if (node.hands[b + a]) return b + a;\n  return null;\n}\n\nfunction renderSolveResult(box, res){\n  const names = res.spot ? {\n    OOP: res.spot.oop + \" (\" + res.spot.oopPos + \")\",\n    IP: res.spot.ip + \" (\" + res.spot.ipPos + \")\"} : null;\n  const quality = res.exploitabilityPct <= 1 ? \"solver-grade\" :\n    (res.exploitabilityPct <= 3 ? \"close\" : \"rough - run more iterations\");\n  let h = '<p class=\"lead\" style=\"margin:10px 0 4px\">Board ' + cards(res.board, true) +\n    \" \u00b7 \" + (res.spot ? \"pot \" + res.spot.potBB + \" bb, \" + res.spot.stackBB + \" bb behind\"\n      : \"pot \" + res.pot + \", \" + res.stack + \" behind\") +\n    \" \u00b7 \" + res.combos.OOP + \" vs \" + res.combos.IP + \" combos<\/p>\" +\n    '<p class=\"small muted\" style=\"margin:0\">' + res.iterations + \" iterations \u00b7 \" +\n    \"exploitability \" + res.exploitabilityPct + \"% of the pot (\" + quality + \") \u00b7 \" +\n    \"EV: \" + (names ? names.OOP : \"OOP\") + \" \" + res.evPct.OOP + \"% of pot, \" +\n    (names ? names.IP : \"IP\") + \" \" + res.evPct.IP + \"%<\/p>\";\n  if (res.spot){\n    h += '<p class=\"small muted\" style=\"margin:4px 0 0\">' + esc(names.OOP) + \" acts first. \" +\n      \"Both ranges are estimates from the betting before the river.\" +\n      (res.spot.villainCards.length ? \" They actually had \" + cards(res.spot.villainCards, true) + \".\" : \"\") +\n      \"<\/p>\";\n  }\n  if (res.line && res.line.some(s => s.hero)){\n    h += '<p class=\"eyebrow\" style=\"margin-top:14px\">Your hand (' + esc(res.spot.heroHand) +\n      \") against the solution<\/p>\";\n    for (const st of res.line){\n      if (!st.hero) continue;\n      const idx = st.actions.indexOf(st.chosen);\n      const f = idx >= 0 ? st.hero[idx] : 0;\n      const verdict = f >= 0.5 ? '<span class=\"pill ok\">matches the solver<\/span>' :\n        f >= 0.15 ? '<span class=\"pill warn\">a mix the solver sometimes plays<\/span>' :\n        '<span class=\"pill off\">the solver rarely does this<\/span>';\n      h += '<div class=\"linerow\"><span class=\"where\">' + esc(pathText(st.path, names)) +\n        \"<\/span>\" + mixBar(st.actions, st.hero) + \"<span>Solver: \" + esc(mixText(st.actions, st.hero)) +\n        \". You: <b>\" + esc(st.chosen) + \"<\/b> \" + verdict + \"<\/span><\/div>\";\n    }\n  }\n  h += '<div class=\"toolbar\" style=\"margin-top:14px\"><label class=\"eyebrow\" style=\"margin:0\">Decision<\/label>' +\n    '<select class=\"sv-node\">' + res.nodes.map((n, i) => '<option value=\"' + i + '\">' +\n      esc(nodeName(n, names)) + \" (range reaches \" + n.reachPct + \"%)<\/option>\").join(\"\") +\n    \"<\/select><\/div><div class=\\\"sv-panel\\\"><\/div>\";\n  box.innerHTML = h;\n\n  const sel = box.querySelector(\".sv-node\");\n  const panel = box.querySelector(\".sv-panel\");\n  const heroSide = res.spot ? res.spot.heroSide : null;\n  const draw = () => {\n    const n = res.nodes[+sel.value];\n    let p = '<p style=\"margin:6px 0 2px;font-size:14px\"><b>' + esc(names ? names[n.player] : n.player) +\n      \"<\/b>, whole range: \" + esc(mixText(n.actions, n.freqs)) + \"<\/p>\" +\n      mixBar(n.actions, n.freqs) + legendHTML(n.actions) + gridHTML(n) +\n      '<div class=\"toolbar\" style=\"margin-top:10px\"><label class=\"eyebrow\" style=\"margin:0\">Look up a hand<\/label>' +\n      '<input class=\"sv-look\" type=\"text\" autocomplete=\"off\" placeholder=\"e.g. AhKd\" ' +\n      'style=\"width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;' +\n      'background:var(--bg);color:var(--ink);font-family:var(--mono)\">' +\n      '<span class=\"sv-lookout small\"><\/span><\/div>';\n    panel.innerHTML = p;\n    const look = panel.querySelector(\".sv-look\"), out = panel.querySelector(\".sv-lookout\");\n    const show = () => {\n      const key = handKey(look.value, n);\n      out.textContent = !look.value.trim() ? \"\" :\n        (key ? key + \": \" + mixText(n.actions, n.hands[key]) :\n         \"Not in this player's range here.\");\n    };\n    look.oninput = show;\n    if (res.spot && n.player === heroSide){ look.value = res.spot.heroHand; show(); }\n  };\n  sel.onchange = draw;\n  const firstHero = res.line ? res.line.find(s => s.hero) : null;\n  if (firstHero){\n    const idx = res.nodes.findIndex(n => n.id === firstHero.nodeId);\n    if (idx >= 0) sel.value = String(idx);\n  }\n  draw();\n}\n\nfunction solveHTML(hd){\n  if (!hd.riverHeadsUp) return \"\";\n  let h = '<div class=\"solvebox\"><p class=\"eyebrow\" style=\"margin:0\">River solver<\/p>';\n  if (!DATA.pysrc || !hd.raw){\n    return h + '<p class=\"lead\" style=\"margin:6px 0 0\">Solving this river works on ' +\n      '<a href=\"https://sliderightsole.github.io/poker-brain/\" target=\"_blank\" rel=\"noopener\">' +\n      \"your own site<\/a>.<\/p><\/div>\";\n  }\n  return h + '<p class=\"lead\" style=\"margin:6px 0 8px\">Work out the game-theory-optimal way ' +\n    \"to play this river for both players, and see how your decision compares.<\/p>\" +\n    '<button class=\"btn\" id=\"solvebtn\" type=\"button\">Solve this river<\/button> ' +\n    '<span class=\"small muted\" id=\"solvemsg\"><\/span><div id=\"solveout\"><\/div><\/div>';\n}\n\nfunction solveProgress(el){\n  return (done, total, expl) => {\n    el.innerHTML = '<span class=\"busy\"><span class=\"spin\"><\/span>Solving\u2026 ' + done + \"/\" +\n      total + \" iterations\" + (expl >= 0 ? \" \u00b7 exploitability \" + expl.toFixed(2) + \"%\" : \"\") +\n      \"<\/span>\";\n  };\n}\n\nfunction wireSolve(hd){\n  const btn = $(\"#solvebtn\");\n  if (!btn) return;\n  btn.onclick = async () => {\n    btn.disabled = true;\n    const msg = $(\"#solvemsg\");\n    msg.innerHTML = '<span class=\"busy\"><span class=\"spin\"><\/span>' +\n      (pyReady ? \"Starting\u2026\" : \"Loading the analyser\u2026\") + \"<\/span>\";\n    try {\n      const py = await ensurePython();\n      const fn = py.globals.get(\"pb_solve_hand\");\n      let raw;\n      try { raw = await fn(hd.raw, solveProgress(msg)); } finally { fn.destroy(); }\n      const res = JSON.parse(raw);\n      if (res.error){ msg.textContent = res.error; return; }\n      hd._solve = res;\n      msg.textContent = \"\";\n      renderSolveResult($(\"#solveout\"), res);\n    } catch(err){\n      msg.textContent = \"Could not solve: \" + String((err && err.message) || err).slice(0, 200);\n    } finally {\n      btn.disabled = false;\n    }\n  };\n}\n\nconst SOLVER_PRESETS = [\n  {name: \"Textbook: nuts or air vs a bluff-catcher\", board: \"2c 7d 9h Js Kc\",\n   oop: \"QQ\", ip: \"KK, 54o\", pot: 10, stack: 100, bets: \"100\", raises: \"\"},\n  {name: \"Paired board, 3-bet pot\", board: \"Qh 9d 8s 8c 5c\",\n   oop: \"TT+, AQs+, AKo, A5s-A4s\", ip: \"JJ-66, AJs+, KQs, QJs, JTs, T9s, AQo\",\n   pot: 20, stack: 80, bets: \"33, 75\", raises: \"100\"},\n  {name: \"Single-raised pot, dry king-high\", board: \"Kc 8d 4h 2s 7c\",\n   oop: \"88-44, K9s-K5s, A8s-A2s, 97s, 86s, 65s, KTo-K9o\",\n   ip: \"AA-TT, AK, KQ, KJs, 99-66, A5s-A4s, QJs, JTs, T9s\",\n   pot: 6, stack: 90, bets: \"33, 75\", raises: \"100\"},\n];\n\nfunction solverView(){\n  const box = $(\"#v-solver\");\n  let h = '<p class=\"lead\">A solver works out the unexploitable (\u201cGTO\u201d) way to play a ' +\n    \"spot: how often every hand should check, bet, call, fold or raise so the opponent can\u2019t \" +\n    \"profit by adjusting. This one solves <b>heads-up river<\/b> spots exactly, using the same \" +\n    \"algorithm as commercial solvers (CFR+). Earlier streets need specialised software.<\/p>\";\n  if (!DATA.pysrc){\n    box.innerHTML = h + '<div class=\"callout\"><b>The solver runs on your own site.<\/b> Open ' +\n      '<a href=\"https://sliderightsole.github.io/poker-brain/\" target=\"_blank\" rel=\"noopener\">' +\n      \"sliderightsole.github.io/poker-brain<\/a> to use it.<\/div>\";\n    return;\n  }\n  h += '<div class=\"panel\"><div class=\"toolbar\"><label for=\"sv-preset\" class=\"eyebrow\" style=\"margin:0\">' +\n    'Start from<\/label><select id=\"sv-preset\"><option value=\"\">Choose an example\u2026<\/option>' +\n    SOLVER_PRESETS.map((p, i) => '<option value=\"' + i + '\">' + esc(p.name) + \"<\/option>\").join(\"\") +\n    \"<\/select><\/div>\" +\n    '<div class=\"sfields\">' +\n    '<div class=\"fld wide\"><label for=\"sv-board\">River board (5 cards)<\/label><input id=\"sv-board\" placeholder=\"Qh 9d 8s 8c 5c\"><\/div>' +\n    '<div class=\"fld\"><label for=\"sv-pot\">Pot<\/label><input id=\"sv-pot\" type=\"number\" min=\"0\" step=\"any\" placeholder=\"20\"><\/div>' +\n    '<div class=\"fld\"><label for=\"sv-stack\">Stack behind<\/label><input id=\"sv-stack\" type=\"number\" min=\"0\" step=\"any\" placeholder=\"80\"><\/div>' +\n    '<div class=\"fld wide\"><label for=\"sv-oop\">Out-of-position range (acts first)<\/label><input id=\"sv-oop\" placeholder=\"TT+, AQs+, AKo\"><\/div>' +\n    '<div class=\"fld wide\"><label for=\"sv-ip\">In-position range<\/label><input id=\"sv-ip\" placeholder=\"JJ-66, AJs+, KQs\"><\/div>' +\n    '<div class=\"fld\"><label for=\"sv-bets\">Bet sizes (% pot)<\/label><input id=\"sv-bets\" value=\"33, 75\"><\/div>' +\n    '<div class=\"fld\"><label for=\"sv-raises\">Raise sizes (% pot)<\/label><input id=\"sv-raises\" value=\"100\"><\/div>' +\n    '<div class=\"fld\"><label for=\"sv-iters\">Max iterations<\/label><input id=\"sv-iters\" type=\"number\" min=\"10\" max=\"3000\" value=\"300\"><\/div>' +\n    \"<\/div>\" +\n    '<button class=\"btn\" id=\"sv-go\" type=\"button\">Solve<\/button> <span class=\"small muted\" id=\"sv-status\"><\/span>' +\n    '<p class=\"small muted\" style=\"margin:8px 0 0\">Ranges use normal notation (<code>77+<\/code>, ' +\n    \"<code>ATs+<\/code>, <code>KQo<\/code>). Wider ranges and more sizes take longer. Leave raise \" +\n    \"sizes blank for no raises.<\/p><\/div>\" +\n    '<div class=\"panel\" style=\"margin-top:14px\" id=\"sv-out\"><p class=\"muted\" style=\"margin:0\">' +\n    \"Pick an example or enter a spot, then press Solve.<\/p><\/div>\";\n  box.innerHTML = h;\n\n  $(\"#sv-preset\").onchange = e => {\n    const p = SOLVER_PRESETS[+e.target.value];\n    if (!p) return;\n    $(\"#sv-board\").value = p.board; $(\"#sv-oop\").value = p.oop; $(\"#sv-ip\").value = p.ip;\n    $(\"#sv-pot\").value = p.pot; $(\"#sv-stack\").value = p.stack;\n    $(\"#sv-bets\").value = p.bets; $(\"#sv-raises\").value = p.raises;\n  };\n  const nums = s => s.split(/[,\\s]+/).filter(Boolean).map(Number);\n  $(\"#sv-go\").onclick = async () => {\n    const status = $(\"#sv-status\"), btn = $(\"#sv-go\");\n    const bets = nums($(\"#sv-bets\").value), raises = nums($(\"#sv-raises\").value);\n    if (bets.some(x => !(x > 0)) || raises.some(x => !(x > 0))){\n      status.textContent = \"Sizes must be positive percentages, e.g. 33, 75.\"; return;\n    }\n    const spec = {board: $(\"#sv-board\").value, oop: $(\"#sv-oop\").value, ip: $(\"#sv-ip\").value,\n      pot: Number($(\"#sv-pot\").value), stack: Number($(\"#sv-stack\").value),\n      bets: bets.map(x => x / 100), raises: raises.map(x => x / 100),\n      iterations: Math.max(10, Math.min(3000, Number($(\"#sv-iters\").value) || 300))};\n    if (!spec.board.trim() || !spec.oop.trim() || !spec.ip.trim() || !(spec.pot > 0) || !(spec.stack >= 0)){\n      status.textContent = \"Fill in the board, both ranges, the pot and the stack.\"; return;\n    }\n    btn.disabled = true;\n    status.innerHTML = '<span class=\"busy\"><span class=\"spin\"><\/span>' +\n      (pyReady ? \"Starting\u2026\" : \"Loading the analyser\u2026\") + \"<\/span>\";\n    try {\n      const py = await ensurePython();\n      const fn = py.globals.get(\"pb_solve\");\n      let raw;\n      try { raw = await fn(JSON.stringify(spec), solveProgress(status)); } finally { fn.destroy(); }\n      const res = JSON.parse(raw);\n      if (res.error){ status.textContent = res.error; return; }\n      status.textContent = \"\";\n      renderSolveResult($(\"#sv-out\"), res);\n    } catch(err){\n      status.textContent = \"Could not solve: \" + String((err && err.message) || err).slice(0, 200);\n    } finally {\n      btn.disabled = false;\n    }\n  };\n}\n\n/* ----------------------------------------------------------- lessons --- */\nlet lessonPick = null;\n\nfunction lessonsView(){\n  const list = DATA.sessions || [];\n  const box = $(\"#v-lessons\");\n  if (!list.length){\n    box.innerHTML = '<div class=\"panel\">Load some hands and a lesson is built for each session.<\/div>';\n    return;\n  }\n  if (!list.some(s => s.id === lessonPick)) lessonPick = list[list.length - 1].id;\n  const s = list.find(x => x.id === lessonPick);\n  const L = s.lesson;\n  const opts = list.slice().reverse().map(x => '<option value=\"' + esc(x.id) + '\"' +\n    (x.id === s.id ? \" selected\" : \"\") + \">\" + esc(x.label) + \" \u2014 \" +\n    esc(x.lesson ? x.lesson.title : \"\") + \"<\/option>\").join(\"\");\n  let h = '<div class=\"toolbar\"><label for=\"lpick\" class=\"eyebrow\" style=\"margin:0\">Session<\/label>' +\n    '<select id=\"lpick\">' + opts + \"<\/select><\/div>\";\n  if (!L){\n    box.innerHTML = h + '<div class=\"panel\">This lesson is being built \u2014 it appears as soon as ' +\n      \"the latest update finishes analysing your saved hands (see Load hands).<\/div>\";\n    return;\n  }\n\n  h += '<div class=\"panel lesson\"><p class=\"eyebrow\" style=\"margin:0\">Lesson \u00b7 ' + esc(s.label) +\n    '<\/p><h2 class=\"big\">' + esc(L.title) + '<\/h2><p class=\"body\">' + esc(L.summary) + \"<\/p>\" +\n    \"<h2>Why it matters<\/h2><p class=\\\"body\\\">\" + esc(L.why) + \"<\/p>\" +\n    '<h2>The rule<\/h2><div class=\"rulebox\">' + esc(L.rule) + \"<\/div>\" +\n    \"<h2>How to apply it<\/h2><ol>\" + L.steps.map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\") + \"<\/ol>\";\n  if (L.examples.length){\n    h += '<h2>From your session<\/h2><div class=\"hcards\">' + L.examples.map(e =>\n      '<button class=\"hcard bad\" type=\"button\" data-id=\"' + esc(e.handId) + '\"><span class=\"bar\"><\/span>' +\n      '<span style=\"flex:1\"><span class=\"hc-top\">' + cards(e.cards, true) + \"<b>\" + esc(e.pos) +\n      \"<\/b>\" + (e.board.length ? cards(e.board, true) : \"\") + '<span class=\"pill off\">' + e.bb +\n      \" bb<\/span><\/span><p>\" + esc(e.text) + \"<\/p><\/span><\/button>\").join(\"\") + \"<\/div>\";\n  }\n  h += '<h2>Practice<\/h2><div id=\"quiz\">' + L.quiz.map((q, i) =>\n    '<div class=\"qitem\" data-i=\"' + i + '\"><p>' + (i + 1) + \". \" + esc(q.q) + '<\/p><div class=\"qopts\">' +\n    q.options.map(o => '<button class=\"qopt\" type=\"button\">' + esc(o) + \"<\/button>\").join(\"\") +\n    '<\/div><div class=\"qexplain\" hidden><\/div><\/div>').join(\"\") + \"<\/div>\";\n  if (L.keepDoing){\n    const k = L.keepDoing;\n    h += \"<h2>Keep doing<\/h2><p class=\\\"body\\\"><b>\" + esc(k.title) + \"<\/b> (+\" + k.bb + \" bb) \u2014 \" +\n      esc(k.text) + \"<\/p>\";\n    if (k.examples.length){\n      h += '<div class=\"hcards\">' + k.examples.map(e =>\n        '<button class=\"hcard good\" type=\"button\" data-id=\"' + esc(e.handId) + '\"><span class=\"bar\"><\/span>' +\n        '<span style=\"flex:1\"><span class=\"hc-top\">' + cards(e.cards, true) + \"<b>\" + esc(e.pos) +\n        \"<\/b><\/span><p>\" + esc(e.text) + \"<\/p><\/span><\/button>\").join(\"\") + \"<\/div>\";\n    }\n  }\n  if (L.alsoWatch.length){\n    h += \"<h2>Also watch<\/h2><ul>\" + L.alsoWatch.map(a => \"<li>\" + esc(a.title) + \" \u2014 about \" +\n      a.bb + \" bb this session<\/li>\").join(\"\") + \"<\/ul>\";\n  }\n  if (s.solvable && s.solvable.length && DATA.pysrc){\n    h += \"<h2>Study with the solver<\/h2><p class=\\\"body\\\">These hands reached a heads-up river. \" +\n      \"Solve one and compare your decision with the game-theory answer.<\/p><div class=\\\"qopts\\\">\" +\n      s.solvable.slice(0, 6).map(id => {\n        const hd = DATA.hands.find(x => x.id === id);\n        return '<button class=\"qopt sv-jump\" type=\"button\" data-id=\"' + esc(id) + '\">' +\n          (hd ? cards(hd.heroCards, true) + \" \" + esc(hd.heroPos) + \" \" + sgn(hd.heroNetBB) + \" bb\" : esc(id)) +\n          \"<\/button>\";\n      }).join(\"\") + \"<\/div>\";\n  }\n  h += '<h2>Goal for next session<\/h2><div class=\"goalbox\">' + esc(L.goal) + \"<\/div>\" +\n    '<p class=\"lead\" style=\"margin-top:14px\">' + esc(L.caveat) + \"<\/p><\/div>\";\n  box.innerHTML = h;\n\n  $(\"#lpick\").onchange = e => { lessonPick = e.target.value; lessonsView(); };\n  for (const b of box.querySelectorAll(\".hcard\")) b.onclick = () => jumpToHand(b.dataset.id, s.id);\n  for (const b of box.querySelectorAll(\".sv-jump\")){\n    b.onclick = () => {\n      jumpToHand(b.dataset.id, s.id);\n      const sb = $(\"#solvebtn\");\n      if (sb){ sb.scrollIntoView({behavior: \"smooth\", block: \"center\"}); sb.click(); }\n    };\n  }\n  for (const item of box.querySelectorAll(\".qitem\")){\n    const q = L.quiz[+item.dataset.i];\n    const ex = item.querySelector(\".qexplain\");\n    for (const b of item.querySelectorAll(\".qopt\")){\n      b.onclick = () => {\n        for (const o of item.querySelectorAll(\".qopt\")){\n          o.classList.remove(\"right\", \"wrong\");\n          if (o.textContent === q.answer) o.classList.add(\"right\");\n        }\n        const ok = b.textContent === q.answer;\n        if (!ok) b.classList.add(\"wrong\");\n        ex.hidden = false;\n        ex.textContent = (ok ? \"Correct. \" : \"Not quite \u2014 the answer is \" + q.answer + \". \") + q.explain;\n      };\n    }\n  }\n}\n\n/* ------------------------------------------------------------- leaks --- */\nfunction leaksView(){\n  let h = `<p class=\"lead\">Ranked by how much the sample supports them, not by how bad they\n    sound. A finding marked <span class=\"pill thin\">too thin to trust<\/span> is a note to\n    revisit, not an instruction.<\/p>`;\n  if(!DATA.findings.length){\n    h += '<div class=\"panel\">Nothing stood out in this sample.<\/div>';\n  } else {\n    h += '<div class=\"panel\">';\n    for(const f of DATA.findings){\n      const cf = f.confidence === \"solid\" ? \"ok\" : (f.confidence === \"tentative\" ? \"warn\" : \"thin\");\n      h += `<div class=\"find ${esc(f.severity)}\"><div class=\"body\"><div class=\"sev\"><\/div><div>\n        <h4>${esc(f.title)}<span class=\"pill ${cf}\">${esc(f.confidence)}<\/span><\/h4>\n        <p>${esc(f.detail)}<\/p>\n        ${f.fix ? `<div class=\"fix\">\u2192 ${esc(f.fix)}<\/div>` : \"\"}<\/div><\/div><\/div>`;\n    }\n    h += \"<\/div>\";\n  }\n  $(\"#v-leaks\").innerHTML = h;\n}\n\n/* --------------------------------------------------------- opponents --- */\nfunction oppView(){\n  let h = `<p class=\"lead\">This site issues every opponent a new ID each hand, so they cannot\n    be tracked directly. These profiles are rebuilt by following seat and stack continuity\n    within a table \u2014 the same seat, holding exactly the stack the previous hand left\n    behind, is almost certainly the same person. Treat them as probable, not certain.<\/p>`;\n  if(!DATA.opponents.length){\n    h += '<div class=\"panel\">No chain reached the minimum hand count.<\/div>';\n  } else {\n    h += `<div class=\"panel flush\"><div class=\"scroll\"><table><thead><tr>\n      <th>Player<\/th><th class=\"n\">Seat<\/th><th class=\"n\">Hands<\/th><th>Linkage<\/th>\n      <th class=\"n\">VPIP<\/th><th class=\"n\">PFR<\/th><th class=\"n\">AF<\/th>\n      <th class=\"n\">Net<\/th><th>How to play them<\/th><\/tr><\/thead><tbody>`;\n    for(const o of DATA.opponents){\n      let read = \"not enough to say\", pill = \"thin\";\n      if(o.vpip != null){\n        if(o.vpip >= 45){ read = \"Very loose \u2014 value bet thin, never bluff\"; pill = \"off\"; }\n        else if(o.vpip >= 33){ read = \"Loose \u2014 widen your value betting\"; pill = \"warn\"; }\n        else if(o.vpip <= 15){ read = \"Nit \u2014 respect raises, steal relentlessly\"; pill = \"warn\"; }\n        else { read = \"Reasonable \u2014 no obvious hole\"; pill = \"ok\"; }\n      }\n      const cf = o.confidence === \"strong\" ? \"ok\" : (o.confidence === \"moderate\" ? \"warn\" : \"thin\");\n      h += `<tr><td class=\"mono\">${esc(o.id)}<\/td><td class=\"n\">${o.seat}<\/td>\n        <td class=\"n\">${o.hands}<\/td>\n        <td><span class=\"pill ${cf}\">${esc(o.confidence)}<\/span><\/td>\n        <td class=\"n\">${o.vpip==null?\"\u2013\":o.vpip+\"%\"}<\/td>\n        <td class=\"n\">${o.pfr==null?\"\u2013\":o.pfr+\"%\"}<\/td>\n        <td class=\"n\">${o.af==null?\"\u2013\":o.af}<\/td>\n        <td class=\"n ${dir(o.netBB)}\">${sgn(o.netBB)}<\/td>\n        <td><span class=\"pill ${pill}\">${esc(read)}<\/span><\/td><\/tr>`;\n    }\n    h += \"<\/tbody><\/table><\/div><\/div>\";\n  }\n  $(\"#v-opponents\").innerHTML = h;\n}\n\n/* ------------------------------------------------------------ players --- */\nconst R = DATA.rules;\nconst SPEED = {}, SLABEL = {};\nR.stats.forEach(x => { SPEED[x.key] = x.speed; SLABEL[x.key] = x.label; });\n(R.derived || []).forEach(x => { SPEED[x.key] = x.speed; SLABEL[x.key] = x.label; });\n\n// Values the rules read but nobody types in.\nfunction withDerived(s){\n  const full = Object.assign({}, s);\n  full.gap = s.vpip - s.pfr;\n  return full;\n}\nconst SEV = {high:0, medium:1, low:2, info:3};\nconst SPD = {fast:0, medium:1, slow:2};\n\nfunction classify(s){\n  const g = s.vpip - s.pfr;\n  if ((s.vpip >= 33 && g >= 10) || g >= 15 ||\n      (s.fold_to_cbet <= 28 && s.wtsd >= 33 && s.pfr < 18))\n    return [\"green\", \"Fish / station\",\n      \"VPIP \" + s.vpip + \" with a \" + g + \"-point gap to PFR - they call into far too \" +\n      \"many pots and raise almost none of them before the flop, so most of their range \" +\n      \"is hands they were not willing to raise.\"];\n  if (s.vpip >= 30 && s.pfr >= 24)\n    return [\"orange\", \"LAG / maniac\",\n      \"VPIP \" + s.vpip + \" / PFR \" + s.pfr + \" - genuinely loose and genuinely aggressive. \" +\n      \"Their range is far wider than their aggression implies.\"];\n  if (s.vpip <= 17)\n    return [\"yellow\", \"Nit / rock\",\n      \"VPIP \" + s.vpip + \" - they are folding their way through the session. Their blinds \" +\n      \"are free and their aggression is real.\"];\n  let inBand = 0;\n  for (const k in R.benchmarks){\n    const b = R.benchmarks[k];\n    if (s[k] >= b[0] && s[k] <= b[1]) inBand++;\n  }\n  if (inBand >= 7 && s.three_bet >= 7 && s.check_raise >= 6)\n    return [\"red\", \"Threat - avoid\",\n      inBand + \" of 10 stats sit inside the winning-regular band, with a real 3-bet and \" +\n      \"check-raise frequency. No obvious way in.\"];\n  return [\"blue\", \"Solid reg\",\n    \"VPIP \" + s.vpip + \" / PFR \" + s.pfr + \" with a \" + g +\n    \"-point gap - a reasonable, ordinary regular.\"];\n}\n\nfunction findLeaks(s){\n  const full = withDerived(s);\n  const out = [];\n  for (const r of R.leaks){\n    const v = full[r.stat];\n    if (v == null) continue;\n    const hit = r.op === \">\" ? v > r.threshold : v < r.threshold;\n    if (!hit) continue;\n    out.push({\n      id:r.id, stat:r.stat, severity:r.severity, title:r.title, exploit:r.exploit,\n      value:v, label:SLABEL[r.stat], reliability:SPEED[r.stat],\n      benchmark:R.benchmarks[r.stat],\n      shorthand:r.shorthand.split(\"{v}\").join(String(v))\n    });\n  }\n  out.sort((a,b) => (SEV[a.severity]-SEV[b.severity]) || (SPD[a.reliability]-SPD[b.reliability]));\n  return out;\n}\n\nfunction buildProfile(s, name){\n  let cl = classify(s);\n  let colour = cl[0], label = cl[1], why = cl[2];\n  const leaks = findLeaks(s);\n  const serious = leaks.filter(l => l.severity === \"high\");\n  if ((colour === \"blue\" || colour === \"red\") && serious.length){\n    colour = \"magenta\";\n    label = \"Reg with a hole\";\n    const f = serious[0].title;\n    why = \"Looks like an ordinary regular, but \" + f[0].toLowerCase() + f.slice(1) +\n          \". The exploit is in the note, not the headline stats.\";\n  }\n  const plan = gamePlan(s);\n  const note = planNote(plan, colour);\n  const slow = leaks.filter(l => l.reliability === \"slow\").map(l => l.label);\n  const unreliable = Array.from(new Set(slow)).sort();\n  return {name:name, stats:s, colour:colour, archetype:label, reasoning:why, leaks:leaks,\n          note:note, gamePlan:plan, unreliable:unreliable, plan:R.tags[colour].plan};\n}\n\nfunction holds(full, conds){\n  for (const c of conds){\n    const v = full[c[0]], th = c[2];\n    if (v == null) return false;\n    if (c[1] === \">\" && !(v > th)) return false;\n    if (c[1] === \"<\" && !(v < th)) return false;\n    if (c[1] === \">=\" && !(v >= th)) return false;\n    if (c[1] === \"<=\" && !(v <= th)) return false;\n  }\n  return true;\n}\n\nfunction gamePlan(s){\n  const full = withDerived(s);\n  const pre = R.profileRules.pre.find(r => holds(full, r.when));\n  const post = R.profileRules.post.find(r => holds(full, r.when));\n  const sections = R.planSections.map(sec => {\n    const picked = [], used = new Set();\n    for (const e of R.plan[sec.key]){\n      if (picked.length >= sec.limit) break;\n      if (!e.when.length || e.groups.some(g => used.has(g))) continue;\n      if (holds(full, e.when)){\n        picked.push({long: e.long, short: e.short});\n        e.groups.forEach(g => used.add(g));\n      }\n    }\n    if (!picked.length){\n      const d = R.plan[sec.key].find(e => !e.when.length);\n      picked.push({long: d.long, short: d.short});\n    }\n    return {key: sec.key, title: sec.title, label: sec.label, items: picked};\n  });\n  return {profile: pre.long + \"; \" + post.long + \".\",\n          profileShort: \"THEM: \" + pre.short + \", \" + post.short + \".\", sections: sections};\n}\n\nfunction tagLine(colour){\n  const g = (R.tagGuide || []).find(x => x.colour === colour);\n  return g ? colour.toUpperCase() + \" - \" + g.label + \".\" : \"\";\n}\n\nfunction planNote(plan, colour){\n  const secs = plan.sections;\n  const render = counts => {\n    const parts = [tagLine(colour), plan.profileShort].filter(p => p);\n    secs.forEach((sec, idx) => {\n      const n = counts[idx];\n      if (!n) return;\n      const lead = counts.slice(0, idx).some(c => c) ? \"\" : \"ME - \";\n      const shorts = sec.items.slice(0, n).map(i => i.short);\n      parts.push(lead + sec.label + \": \" + shorts.join(\"; \") + \".\");\n    });\n    return parts.join(\" \");\n  };\n  let counts = secs.map(() => 1);\n  while (render(counts).length > R.noteLimit && counts.some(c => c)){\n    let last = -1;\n    counts.forEach((c, i) => { if (c) last = i; });\n    counts[last] = 0;\n  }\n  secs.forEach((sec, i) => {\n    if (counts[i] && sec.items.length > counts[i]){\n      const trial = counts.slice();\n      trial[i] += 1;\n      if (render(trial).length <= R.noteLimit) counts = trial;\n    }\n  });\n  return render(counts);\n}\n\n(function selfCheck(){\n  const bad = R.selfTest.filter(t => buildProfile(t.stats, \"\").colour !== t.expect);\n  if (bad.length) console.warn(\"Poker Brain: rule engine disagrees with Python on \" +\n    bad.length + \" reference case(s) - the JS port has drifted.\");\n})();\n\nconst KEY = \"pb-players\";\nfunction loadRoster(){\n  try { return JSON.parse(localStorage.getItem(KEY) || \"{}\"); } catch(e){ return {}; }\n}\nfunction saveRoster(r){\n  try { localStorage.setItem(KEY, JSON.stringify(r)); } catch(e){}\n}\n\nfunction playersView(){\n  const flds = R.stats.map(x =>\n    '<div class=\"fld\"><label for=\"f-' + x.key + '\">' + esc(x.label) + '<\/label>' +\n    '<input id=\"f-' + x.key + '\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" inputmode=\"numeric\"><\/div>'\n  ).join(\"\");\n  $(\"#v-players\").innerHTML =\n    '<p class=\"lead\">Paste a screenshot of a player stat panel and I will read the numbers, ' +\n    'work out the tag, list what they do wrong, and write the note for you. You can also just ' +\n    'type the ten numbers in, which works offline and is never misread.<\/p>' +\n    '<div id=\"drop\" class=\"drop\" tabindex=\"0\" role=\"button\">' +\n      '<b>Paste a screenshot<\/b>Press <kbd>Ctrl<\/kbd>+<kbd>V<\/kbd> anywhere on this page, ' +\n      'or click here to pick a file. Drag and drop works too.' +\n      '<input id=\"pick\" type=\"file\" accept=\"image/*\" hidden><\/div>' +\n    '<div id=\"env\" class=\"status\" hidden><\/div>' +\n    '<div id=\"imgbar\" class=\"imgbar\" hidden>' +\n      '<div id=\"shotwrap\"><\/div>' +\n      '<div style=\"flex:1;min-width:230px\">' +\n        '<button class=\"btn\" id=\"readbtn\" type=\"button\">Read screenshot<\/button>' +\n        '<div id=\"imgstatus\" class=\"status\" hidden><\/div><\/div><\/div>' +\n    '<div class=\"panel\" style=\"margin-top:14px\">' +\n      '<p class=\"eyebrow\">The numbers<\/p>' +\n      '<div class=\"fld\" style=\"margin-bottom:12px;max-width:280px\">' +\n        '<label for=\"f-name\">Player name<\/label><input id=\"f-name\" type=\"text\"><\/div>' +\n      '<div class=\"quick fld\"><label for=\"f-quick\">Quick entry \\u2014 all ten at once<\/label>' +\n        '<input id=\"f-quick\" type=\"text\" autocomplete=\"off\" ' +\n        'placeholder=\"28 21 11 47 64 33 41 12 30 55\">' +\n        '<span class=\"hint\">VPIP  PFR  3-Bet  Fold-to-3-Bet  C-Bet  Fold-to-C-Bet  ' +\n
