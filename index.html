<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Poker Brain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Light is the base palette; dark redefines only the tokens, twice, so an
   explicit toggle wins over the OS in both directions. */
:root{
  --bg:#f5f4f0; --panel:#ffffff; --panel2:#efefe9; --line:#e0e2dd; --ink:#161a18; --muted:#5e6863; --dim:#8b938d;
  --accent:#8a6716; --accent-soft:#f0e7cf;
  --good:#1a6b43; --bad:#a8243a; --warn:#8a5d0c;
  --good-soft:#e2efe8; --bad-soft:#f7e3e6; --warn-soft:#f6ecd8;
  --felt-a:#1d5740; --felt-b:#123326; --felt-rim:#0b2118; --felt-ink:#e4efe9;
  --felt-dim:#8fb3a2;
  --card-face:#fcfcfa; --card-red:#b0263a; --card-black:#1b201d;
  --shadow:0 1px 2px rgba(20,30,25,.07), 0 6px 18px -10px rgba(20,30,25,.22);
  --r:12px;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;
    --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;
    --accent:#d4a537; --accent-soft:#2b2415;
    --good:#41b97c; --bad:#e4586c; --warn:#d69f34;
    --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;
    --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;
  --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;
  --accent:#d4a537; --accent-soft:#2b2415;
  --good:#41b97c; --bad:#e4586c; --warn:#d69f34;
  --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;
  --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:0 72px}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------- masthead --- */
.masthead{padding-block:26px 14px}
.masthead h1{
  font-family:var(--display); font-weight:600; font-size:clamp(26px,4.5vw,36px);
  margin:0; letter-spacing:-.015em; text-wrap:balance;
}
.masthead .rule{height:2px; background:var(--accent); width:44px; margin:12px 0 10px; border-radius:2px}
.masthead .meta{
  color:var(--muted); font-size:12.5px; font-family:var(--mono);
  letter-spacing:.01em; display:flex; flex-wrap:wrap; gap:6px 14px;
}
.tabbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  padding-block:8px; margin-bottom:22px;
}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; padding:7px 14px; border:none; background:none; cursor:pointer;
  color:var(--muted); font-family:var(--body); font-size:13px; font-weight:500;
  border-radius:7px; letter-spacing:.01em;
}
.tab:hover{color:var(--ink); background:var(--panel2)}
.tab[aria-selected="true"]{color:var(--ink); background:var(--panel2); box-shadow:inset 0 -2px 0 var(--accent)}
.tab:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.view[hidden]{display:none!important}

/* ------------------------------------------------------------- blocks --- */
.row{display:grid; gap:14px}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.r3,.r2{grid-template-columns:1fr}}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.panel.flush{padding:0; overflow:hidden}
h2{font-family:var(--display); font-weight:600; font-size:19px; margin:30px 0 12px; letter-spacing:-.01em}
.eyebrow{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;
  color:var(--dim); font-weight:600; margin:0 0 10px;
}

/* Money tiles: the three figures the page exists to deliver. */
.tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; position:relative; overflow:hidden}
.tile::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--dim)}
.tile.up::before{background:var(--good)} .tile.down::before{background:var(--bad)}
.tile .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--dim); font-weight:600}
.tile .v{font-family:var(--mono); font-weight:600; font-size:clamp(24px,4vw,31px); margin-top:6px; letter-spacing:-.02em}
.tile .n{font-size:12.5px; color:var(--muted); margin-top:2px}
.up .v{color:var(--good)} .down .v{color:var(--bad)}

/* --------------------------------------------------------- data table --- */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:440px}
caption{text-align:left; padding:14px 16px 0; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.11em; color:var(--dim); font-weight:600}
th{
  text-align:left; color:var(--dim); font-weight:600; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.09em; padding:10px 14px;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover{background:var(--panel2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.meter{height:4px; border-radius:2px; background:var(--panel2); min-width:64px; overflow:hidden; position:relative}
.meter i{position:absolute; inset:0 auto 0 0; border-radius:2px}
.meter u{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--dim); opacity:.55}
.pill{display:inline-block; font-family:var(--body); font-size:10.5px; font-weight:600;
  padding:2px 8px; border-radius:999px; letter-spacing:.03em; white-space:nowrap}
.pill.ok{background:var(--good-soft); color:var(--good)}
.pill.off{background:var(--bad-soft); color:var(--bad)}
.pill.thin{background:var(--panel2); color:var(--muted)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}

/* -------------------------------------------------------------- cards --- */
.pc{
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  width:29px; height:40px; border-radius:4px; background:var(--card-face);
  color:var(--card-black); border:1px solid rgba(0,0,0,.24); font-family:var(--body);
  font-weight:600; font-size:14px; line-height:1;
  box-shadow:0 1px 2px rgba(0,0,0,.3); flex:0 0 auto;
}
.pc.red{color:var(--card-red)}
.pc s{font-size:11px; margin-top:1px; text-decoration:none}
.pc.sm{width:21px; height:29px; font-size:10.5px; border-radius:3px}
.pc.sm s{font-size:8.5px}
.pc.down{background:repeating-linear-gradient(45deg,#2c4a5e,#2c4a5e 3px,#25404f 3px,#25404f 6px); border-color:#35576b}
.hand{display:inline-flex; gap:2px; align-items:center}

/* --------------------------------------------------------- felt table --- */
.felt{
  position:relative; background:radial-gradient(ellipse at 50% 42%,var(--felt-a),var(--felt-b));
  border:10px solid var(--felt-rim); border-radius:46% / 38%;
  aspect-ratio:16/10; max-width:100%; min-height:270px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.45);
}
.centre{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:86%}
.centre .board{display:flex; gap:3px; justify-content:center; flex-wrap:wrap}
.centre .pot{color:var(--felt-dim); font-family:var(--mono); font-size:11.5px; margin-top:9px; letter-spacing:.04em}
.centre .pre{color:var(--felt-dim); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase}
.seat{position:absolute; transform:translate(-50%,-50%); width:118px}
.seat .box{
  background:rgba(7,18,13,.86); border:1px solid rgba(255,255,255,.13);
  border-radius:8px; padding:5px 6px; color:var(--felt-ink); text-align:center;
}
.seat.me .box{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.seat.gone{opacity:.36}
.seat .who{font-size:10.5px; font-weight:600; display:flex; gap:4px; justify-content:center; align-items:center}
.seat .who em{font-style:normal; color:var(--felt-dim); font-weight:500}
.seat .chips{font-family:var(--mono); font-size:9.5px; color:var(--felt-dim)}
.seat .hand{justify-content:center; margin-top:3px}
.seat .did{font-family:var(--mono); font-size:9.5px; color:var(--warn); margin-top:2px; min-height:12px}
.dealer{display:inline-flex; width:14px; height:14px; border-radius:50%; background:var(--card-face);
  color:#111; font-size:8.5px; line-height:14px; font-weight:700; justify-content:center}
@media(max-width:560px){
  .felt{aspect-ratio:auto; min-height:0; border-radius:var(--r); padding:14px; display:grid; gap:8px}
  .centre{position:static; transform:none; width:auto; order:-1; padding-bottom:6px}
  .seat{position:static!important; transform:none; width:auto}
}

/* ------------------------------------------------------ hand detail ----- */
.detail{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:16px}
.detail .top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline}
.detail .top h3{font-family:var(--display); font-weight:600; font-size:18px; margin:0}
.detail .top .res{font-family:var(--mono); font-size:22px; font-weight:600}
.street{margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line)}
.street:first-of-type{border-top:none}
.street h4{
  margin:0 0 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;
  color:var(--dim); font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.act{font-size:13px; color:var(--muted); padding:2px 0; display:flex; gap:7px; flex-wrap:wrap}
.act b{color:var(--ink); font-weight:600}
.act em{font-style:normal; color:var(--dim); font-size:11.5px; font-family:var(--mono)}
.act.me b{color:var(--accent)}
.maths{background:var(--panel2); border-radius:9px; padding:12px 14px; margin-top:10px; font-size:13px}
.maths dl{display:grid; grid-template-columns:1fr auto; gap:3px 14px; margin:0}
.maths dt{color:var(--muted)}
.maths dd{margin:0; font-family:var(--mono); font-weight:500; text-align:right}
.eq{margin-top:11px}
.eq .lab{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px}
.eq .lab b{font-family:var(--mono)}
.eqbar{height:9px; border-radius:5px; overflow:hidden; display:flex; border:1px solid var(--line)}
.note{margin-top:10px; padding:9px 11px; border-radius:8px; font-size:12.5px; line-height:1.5}
.note.bad{background:var(--bad-soft); color:var(--ink); border-left:3px solid var(--bad)}
.note.good{background:var(--good-soft); color:var(--ink); border-left:3px solid var(--good)}
.note.flat{background:var(--panel2); color:var(--muted)}
.rng{font-size:12.5px; color:var(--muted); padding:7px 0; border-bottom:1px solid var(--line)}
.rng:last-of-type{border-bottom:none}
.rng b{color:var(--ink); font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.07em}
.rng code{font-family:var(--mono); font-size:11.5px; color:var(--ink); display:block; margin-top:2px}

/* --------------------------------------------------------- players ----- */
.drop{
  border:2px dashed var(--line); border-radius:var(--r); padding:26px 18px;
  text-align:center; color:var(--muted); cursor:pointer; background:var(--panel);
  transition:border-color .15s, background .15s;
}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--panel2)}
.drop b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px; font-weight:600}
.drop kbd{
  font-family:var(--mono); font-size:11.5px; background:var(--panel2); color:var(--ink);
  border:1px solid var(--line); border-radius:4px; padding:1px 6px;
}
.shot{max-width:200px; border-radius:8px; border:1px solid var(--line); margin-top:12px}
.grid10{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
@media(max-width:820px){.grid10{grid-template-columns:repeat(2,1fr)}}
.fld label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--dim); font-weight:600; margin-bottom:3px}
.fld input{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:14px;
}
.fld input:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{
  background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 18px;
  font-family:var(--body); font-size:13.5px; font-weight:600; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5; cursor:default}
.swatch{width:34px; height:34px; border-radius:8px; flex:0 0 auto; border:1px solid rgba(0,0,0,.25)}
.sw-green{background:#2f9e5e}.sw-orange{background:#e08a1e}.sw-yellow{background:#e0c221}
.sw-blue{background:#2f7fd0}.sw-red{background:#d03a44}.sw-magenta{background:#c2439c}
.sw-none{background:var(--panel2)}
.verdict{display:flex; gap:13px; align-items:center}
.verdict h3{margin:0; font-family:var(--display); font-size:19px; font-weight:600}
.verdict .plan{color:var(--muted); font-size:13px}
.leakrow{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.leakrow:last-child{border-bottom:none}
.leakrow .bar{width:3px; border-radius:2px; background:var(--dim); flex:0 0 auto}
.leakrow.high .bar{background:var(--bad)} .leakrow.medium .bar{background:var(--warn)}
.leakrow.info .bar{background:var(--accent)}
.leakrow h5{margin:0 0 3px; font-size:14px; font-weight:600; display:flex; gap:8px;
  align-items:center; flex-wrap:wrap}
.leakrow p{margin:0; color:var(--muted); font-size:13px}
.leakrow .stat{font-family:var(--mono); font-size:11.5px; color:var(--dim)}
.noteout{
  width:100%; min-height:76px; padding:11px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--ink); font-family:var(--mono); font-size:13px;
  resize:vertical; line-height:1.5;
}
.roster{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:flex; gap:7px; align-items:center; background:var(--panel2); border:1px solid var(--line);
  border-radius:999px; padding:4px 11px 4px 5px; font-size:12.5px; cursor:pointer;
}
.chip:hover{border-color:var(--dim)}
.chip i{width:14px; height:14px; border-radius:50%; display:block; flex:0 0 auto}
.busy{color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%; animation:sp .7s linear infinite; flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

.status{
  border-radius:9px; padding:11px 13px; font-size:13px; margin-top:12px;
  border:1px solid var(--line); background:var(--panel2); line-height:1.5;
}
.status b{font-weight:600}
.status.ok{background:var(--good-soft); border-color:var(--good)}
.status.warn{background:var(--warn-soft); border-color:var(--warn)}
.status.err{background:var(--bad-soft); border-color:var(--bad)}
.status .how{display:block; margin-top:5px; color:var(--muted); font-size:12.5px}
.legend{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media(max-width:820px){.legend{grid-template-columns:1fr}}
.legend .item{display:flex; gap:12px; padding:12px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel)}
.legend .item b{display:block; font-size:14px; margin-bottom:2px}
.legend .item .when{color:var(--dim); font-size:12px; margin:2px 0 5px}
.legend .item .plan{color:var(--ink); font-size:13px}
.legend .swatch{width:26px; height:26px; border-radius:6px}
.legend-note{color:var(--muted); font-size:12.5px; margin:10px 0 0; max-width:70ch}
.colourbox{display:flex; gap:12px; margin-top:14px; padding:12px 14px;
  border:1px solid var(--line); border-radius:9px; background:var(--panel2)}
.colourbox b{display:block; font-size:14px}
.colourbox .when{color:var(--dim); font-size:12px; margin:2px 0 4px}
.colourbox .gplan{font-size:13px}
.profile{font-size:14.5px; margin:0 0 8px; font-weight:500}
.plansec{margin:8px 0 0}
.plansec h5{margin:0 0 3px; font-size:11px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--dim)}
.plansec ul{margin:0; padding-left:18px}
.plansec li{font-size:13.5px; margin:2px 0}
.loadbox{border:2px dashed var(--line); border-radius:var(--r); padding:30px 18px;
  text-align:center; background:var(--panel); cursor:pointer}
.loadbox:hover,.loadbox.over{border-color:var(--accent); background:var(--panel2)}
.loadbox b{display:block; font-size:16px; margin-bottom:4px}
.steps{margin:0; padding-left:20px; color:var(--muted); font-size:13.5px}
.steps li{margin:3px 0}
.bar2{height:8px; border-radius:4px; background:var(--panel2); overflow:hidden; margin-top:8px}
.bar2 i{display:block; height:100%; background:var(--accent); width:0; transition:width .2s}
.quick{
  background:var(--panel2); border:1px solid var(--line); border-radius:9px;
  padding:13px 14px; margin-bottom:16px;
}
.quick input{font-size:15px; letter-spacing:.04em}
.quick .hint{display:block; margin-top:6px; color:var(--dim); font-size:11.5px;
  font-family:var(--mono); line-height:1.5}
.quick .said{display:block; margin-top:6px; font-size:12.5px; color:var(--muted)}
.quick .said.good{color:var(--good)}
.quick .said.bad{color:var(--bad)}
.imgbar{display:flex;  gap:12px; align-items:flex-start; flex-wrap:wrap; margin-top:12px}

/* -------------------------------------------------------- findings ----- */
.find{padding:14px 0; border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:none}
.find h4{margin:0 0 5px; font-size:14.5px; font-weight:600; display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.find p{margin:4px 0; color:var(--muted); font-size:13px; white-space:pre-wrap}
.find .fix{color:var(--good); font-size:13px; margin-top:7px}
.sev{width:3px; align-self:stretch; border-radius:2px; background:var(--dim)}
.find.high .sev{background:var(--bad)} .find.medium .sev{background:var(--warn)}
.find .body{display:flex; gap:12px}

.callout{
  background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--r);
  padding:13px 15px; font-size:13px; margin-bottom:18px; color:var(--ink);
}
.callout b{font-weight:600}
.lead{color:var(--muted); font-size:13px; margin:0 0 12px; max-width:68ch}
.foot{color:var(--dim); font-size:12px; margin-top:26px; padding-top:14px; border-top:1px solid var(--line)}
.ghost{
  background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
  padding:5px 11px; cursor:pointer; font-size:12px; font-family:var(--body);
}
.ghost:hover{color:var(--ink); border-color:var(--dim)}
.themer{position:absolute; right:16px; top:26px}
.masthead{position:relative}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="masthead">
    <button class="ghost themer" id="themer" type="button">Theme</button>
    <h1>Poker Brain</h1>
    <div class="rule"></div>

spr":15.6,"mdf":62.0,"betPct":null,"reqFE":null,"equity":41.6,"evCall":0.08,"madeHand":"","texture":"","effStack":25.24},{"street":"flop","verb":"check","amount":0.0,"potBefore":2.6,"potBB":10.4,"toCall":0.0,"potOdds":null,"spr":9.7,"mdf":null,"betPct":null,"reqFE":null,"equity":31.3,"evCall":null,"madeHand":"High Card, K","texture":"dry / static","effStack":25.24},{"street":"turn","verb":"check","amount":0.0,"potBefore":2.6,"potBB":10.4,"toCall":0.0,"potOdds":null,"spr":9.7,"mdf":null,"betPct":null,"reqFE":null,"equity":22.1,"evCall":null,"madeHand":"High Card, K","texture":"wet / dynamic","effStack":25.24},{"street":"turn","verb":"call","amount":0.75,"potBefore":3.35,"potBB":13.4,"toCall":0.75,"potOdds":18.3,"spr":7.5,"mdf":82.0,"betPct":null,"reqFE":null,"equity":22.1,"evCall":0.15,"madeHand":"High Card, K","texture":"wet / dynamic","effStack":25.24},{"street":"river","verb":"check","amount":0.0,"potBefore":4.1,"potBB":16.4,"toCall":0.0,"potOdds":null,"spr":6.2,"mdf":null,"betPct":null,"reqFE":null,"equity":55.7,"evCall":null,"madeHand":"One Pair, Qs","texture":"wet / dynamic","effStack":25.24},{"street":"river","verb":"call","amount":2.46,"potBefore":6.56,"potBB":26.2,"toCall":2.46,"potOdds":27.3,"spr":3.8,"mdf":73.0,"betPct":null,"reqFE":null,"equity":55.7,"evCall":2.57,"madeHand":"One Pair, Qs","texture":"wet / dynamic","effStack":25.24}],"villain":"fa61849e","villainPos":"UTG","villainCards":["2h","2c"],"villainRangeSpec":"66+, A9s+, KTs+, QTs+, J9s+, T9s, 98s, AJo+, KQo","ranges":{"preflop":{"pct":10.0,"combos":133,"summary":"AJo, AQo, AKo, KQo, 66, 77, 88, 99, TT, JJ, AA, A9s +15 more"},"flop":{"pct":8.7,"combos":129,"summary":"AJo, AKo, AQo, KQo, TT, 99, 77, 66, AJs, ATs, A9s, JTs +15 more"},"turn":{"pct":4.5,"combos":121,"summary":"TT, 99, 66, AJo, 77, AKo, AQo, JJ, 98s, AJs, ATs, A9s +14 more"},"river":{"pct":1.2,"combos":54,"summary":"JJ, AQo, AA, AQs, QJs, QTs, TT, KQs, 88, KK, JTs, J9s +5 more"}}}],"pysrc":{"pokerbrain/analysis.py":"\"\"\"Per-hand analysis: the maths behind every decision the hero faced.\n\nThis module produces the numbers. It deliberately does not produce verdicts:\njudgement belongs to the reader (or to the brain/ notes), because the right\nplay depends on reads and pool tendencies the raw numbers cannot see.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\n\nfrom .cards import cards_str, card_rank, card_suit\nfrom .equity import calculate\nfrom .evaluator import evaluate, describe\nfrom .model import (\n    ALLIN, BET, CALL, CHECK, FLOP, FOLD, POST, PREFLOP, RAISE, RETURN, RIVER,\n    STRADDLE, STREETS, TURN,\n)\nfrom .ranges import parse_range, remove_blockers, range_percent\n\n_CHART_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"charts\")\n_RANGES = None\n\n\ndef reference_ranges() -> dict:\n    global _RANGES\n    if _RANGES is None:\n        with open(os.path.join(_CHART_DIR, \"preflop_ranges.json\"), \"r\", encoding=\"utf-8\") as fh:\n            _RANGES = json.load(fh)\n    return _RANGES\n\n\n# ------------------------------------------------------------ pot maths ---\n\ndef pot_odds(call_amount: float, pot_before_call: float):\n    \"\"\"Break-even equity for a call, as a fraction.\"\"\"\n    total = pot_before_call + call_amount\n    return call_amount / total if total > 0 else 0.0\n\n\ndef bet_pct_pot(bet: float, pot: float):\n    return 100.0 * bet / pot if pot else 0.0\n\n\ndef mdf(bet: float, pot: float):\n    \"\"\"Minimum defence frequency against a bet of `bet` into `pot`.\"\"\"\n    if bet <= 0:\n        return 1.0\n    return pot / (pot + bet)\n\n\ndef required_fold_equity(bet: float, pot: float):\n    \"\"\"Fold frequency a pure bluff needs to break even.\"\"\"\n    if bet <= 0:\n        return 0.0\n    return bet / (pot + bet)\n\n\ndef spr(effective_stack: float, pot: float):\n    return effective_stack / pot if pot else float(\"inf\")\n\n\ndef ev_call(equity: float, pot_before_call: float, call_amount: float):\n    \"\"\"EV of calling, relative to folding (which is 0).\"\"\"\n    return equity * (pot_before_call + call_amount) - call_amount\n\n\n# -------------------------------------------------------- board texture ---\n\ndef board_texture(board) -> dict:\n    \"\"\"Describe a 3-5 card board: pairing, suits, connectedness, high cards.\"\"\"\n    if len(board) < 3:\n        return {}\n    ranks = sorted((card_rank(c) for c in board), reverse=True)\n    suits = [card_suit(c) for c in board]\n    counts = {}\n    for r in ranks:\n        counts[r] = counts.get(r, 0) + 1\n    suit_counts = {}\n    for s in suits:\n        suit_counts[s] = suit_counts.get(s, 0) + 1\n    max_suit = max(suit_counts.values())\n\n    unique = sorted(set(ranks), reverse=True)\n    gaps = [unique[i] - unique[i + 1] for i in range(len(unique) - 1)]\n    connected = sum(1 for g in gaps if g <= 2)\n\n    paired = any(v >= 2 for v in counts.values())\n    trips = any(v >= 3 for v in counts.values())\n    high_cards = sum(1 for r in ranks if r >= 8)   # T or better\n\n    if max_suit >= 3 and len(board) == 3:\n        suit_note = \"monotone\"\n    elif max_suit >= 4:\n        suit_note = \"four-flush\"\n    elif max_suit == 2:\n        suit_note = \"two-tone\"\n    else:\n        suit_note = \"rainbow\"\n\n    wetness = 0\n    wetness += 2 if max_suit >= 3 else (1 if max_suit == 2 else 0)\n    wetness += connected\n    wetness += 1 if high_cards >= 2 else 0\n    if paired:\n        wetness -= 1\n\n    return {\n        \"paired\": paired,\n        \"trips\": trips,\n        \"suit\": suit_note,\n        \"max_suit_count\": max_suit,\n        \"connected_steps\": connected,\n        \"high_card_count\": high_cards,\n        \"wetness\": max(0, wetness),\n        \"label\": \"wet / dynamic\" if wetness >= 3 else (\"semi-wet\" if wetness == 2 else \"dry / static\"),\n        \"text\": cards_str(board),\n    }\n\n\n# --------------------------------------------------- hero decision walk ---\n\nclass Decision:\n    \"\"\"One spot where the hero had to act.\"\"\"\n\n    def __init__(self, **kw):\n        self.__dict__.update(kw)\n\n    def __repr__(self):\n        return \"<%s %s pot=%.2f to_call=%.2f>\" % (\n            self.street, self.action.verb, self.pot_before, self.to_call)\n\n\ndef _effective_stack(hand, hero_name, live_names):\n    hero = hand.player(hero_name)\n    others = [hand.player(n) for n in live_names if n != hero_name]\n    others = [p for p in others if p]\n    if not hero or not others:\n        return hero.stack if hero else 0.0\n    return min(hero.stack, max(p.stack for p in others))\n\n\ndef walk(hand, hero_name=\"Hero\", villain_range=None, equity_iters=6000,\n         exact_limit=None):\n    \"\"\"Return a Decision for every hero action, with the maths attached.\"\"\"\n    hero = hand.player(hero_name)\n    if hero is None:\n        return []\n\n    pot = 0.0\n    street_invested = {}\n    street_level = {}\n    live = {p.name for p in hand.players}\n    decisions = []\n\n    for a in hand.actions:\n        street = a.street\n        street_invested.setdefault(street, {})\n        street_level.setdefault(street, 0.0)\n        inv = street_invested[street]\n\n        if a.player == hero_name and a.verb not in (POST, RETURN, STRADDLE, \"show\", \"muck\"):\n            to_call = max(0.0, street_level[street] - inv.get(hero_name, 0.0))\n            eff = _effective_stack(hand, hero_name, live)\n            board = hand.board_at(street)\n            d = Decision(\n                street=street,\n                action=a,\n                pot_before=pot,\n                to_call=to_call,\n                pot_odds=pot_odds(to_call, pot) if to_call > 0 else None,\n                spr=spr(eff - inv.get(hero_name, 0.0), pot) if pot else None,\n                effective_stack=eff,\n                players_live=len(live),\n                board=list(board),\n                texture=board_texture(board) if len(board) >= 3 else {},\n                hole=list(hero.hole_cards),\n                bb=hand.bb_size,\n                equity=None,\n                ev_of_call=None,\n                required_fold_equity=None,\n                bet_pct=None,\n                mdf=None,\n                made_hand=\"\",\n                assumed_range=villain_range if isinstance(villain_range, str) else None,\n            )\n            if hero.hole_cards and len(board) >= 3:\n                d.made_hand = describe(evaluate(list(hero.hole_cards) + list(board)))\n            if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n                d.bet_pct = bet_pct_pot(a.amount, pot)\n                d.required_fold_equity = required_fold_equity(a.amount, pot)\n            if to_call > 0:\n                d.mdf = mdf(to_call, pot)\n            street_range = villain_range\n            if isinstance(villain_range, dict) and villain_range:\n                # Per-street ranges: fall back to the most recent street given.\n                street_range = None\n                for s in STREETS[: STREETS.index(street) + 1]:\n                    if villain_range.get(s):\n                        street_range = villain_range[s]\n                d.assumed_range = street_range\n            if street_range and hero.hole_cards:\n                try:\n                    res = calculate(list(hero.hole_cards), [street_range], board,\n                                    iterations=equity_iters, seed=7,\n                                    exact_limit=exact_limit)\n                    d.equity = res.equity\n                    if to_call > 0:\n                        d.ev_of_call = ev_call(res.equity, pot, to_call)\n                except Exception:\n                    pass\n            decisions.append(d)\n\n        # advance the pot / levels\n        if a.verb == RETURN:\n            pot -= a.amount\n            inv[a.player] = inv.get(a.player, 0.0) - a.amount\n        elif a.verb in (POST, STRADDLE, CALL, BET, RAISE, ALLIN):\n            pot += a.amount\n            if not (a.verb == POST and \"ante\" in (a.note or \"\")):\n                inv[a.player] = inv.get(a.player, 0.0) + a.amount\n                street_level[street] = max(street_level[street], inv[a.player])\n        elif a.verb == FOLD:\n            live.discard(a.player)\n\n    return decisions\n\n\ndef summarise_decision(d) -> str:\n    \"\"\"One readable block of maths for a single decision.\"\"\"\n    out = []\n    head = \"%s: hero %s\" % (d.street.upper(), d.action.verb)\n    if d.action.amount:\n        head += \" %.2f\" % d.action.amount\n    out.append(head)\n    if d.board:\n        out.append(\"  board %s  (%s)\" % (cards_str(d.board), d.texture.get(\"label\", \"\")))\n    if d.made_hand:\n        out.append(\"  hero has %s  [%s]\" % (d.made_hand, cards_str(d.hole)))\n    out.append(\"  pot %.2f (%.1f bb)   effective stack %.2f (%.1f bb)\"\n               % (d.pot_before, d.pot_before / d.bb, d.effective_stack, d.effective_stack / d.bb))\n    if d.spr is not None:\n        out.append(\"  SPR %.1f\" % d.spr)\n    if d.to_call > 0:\n        out.append(\"  facing %.2f into %.2f  ->  pot odds %.1f%% needed, MDF %.0f%%\"\n                   % (d.to_call, d.pot_before, 100 * d.pot_odds, 100 * d.mdf))\n    if d.bet_pct is not None:\n        out.append(\"  sizing %.0f%% pot  ->  needs %.0f%% folds to break even as a bluff\"\n                   % (d.bet_pct, 100 * d.required_fold_equity))\n    if d.equity is not None:\n        assumed = getattr(d, \"assumed_range\", None)\n        if isinstance(assumed, str) and assumed:\n            pct = range_percent(remove_blockers(parse_range(assumed),\n                                                list(d.hole) + list(d.board)))\n            out.append(\"  assumed villain range (%.0f%% of hands): %s\" % (pct, assumed))\n        elif isinstance(assumed, dict) and assumed:\n            pct = range_percent(remove_blockers(assumed, list(d.hole) + list(d.board)))\n            out.append(\"  assumed villain range: %.0f%% of hands (%d combos)\"\n                       % (pct, len(assumed)))\n        out.append(\"  equity vs assumed range: %.1f%%\" % (100 * d.equity))\n        if d.ev_of_call is not None:\n            verdict = \"profitable\" if d.ev_of_call > 0 else \"losing\"\n            out.append(\"  EV(call) = %+.2f  (%s)\" % (d.ev_of_call, verdict))\n    return \"\\n\".join(out)\n\n\ndef hand_report(hand, hero_name=\"Hero\", villain_range=None) -> str:\n    \"\"\"Full text breakdown of one hand from the hero's seat.\"\"\"\n    hero = hand.player(hero_name)\n    lines = []\n    lines.append(\"Hand %s  %s  %g/%g%s  %d-handed\"\n                 % (hand.hand_id, hand.game, hand.small_blind, hand.big_blind,\n                    (\" ante %g\" % hand.ante) if hand.ante else \"\", len(hand.players)))\n    if hero:\n        lines.append(\"Hero in %s with [%s], stack %.2f (%.0f bb)\"\n                     % (hero.position, cards_str(hero.hole_cards), hero.stack,\n                        hero.stack / hand.bb_size))\n    lines.append(\"\")\n    for street in STREETS:\n        acts = hand.street_actions(street)\n        if not acts:\n            continue\n        board = hand.board_at(street)\n        header = street.upper()\n        if board:\n            header += \"  [%s]\" % cards_str(board)\n        lines.append(header)\n        for a in acts:\n            tag = \" *\" if a.player == hero_name else \"  \"\n            p = hand.player(a.player)\n            money = (\" %.2f\" % a.amount) if a.amount else \"\"\n            lines.append(\"   %s%-8s %-4s %s%s\"\n                         % (tag, a.player[:8], p.position if p else \"\", a.verb, money))\n        lines.append(\"\")\n    lines.append(\"Result: pot %.2f, rake %.2f, hero net %+.2f (%+.1f bb)\"\n                 % (hand.total_pot, hand.rake, hero.net if hero else 0.0,\n                    (hero.net / hand.bb_size) if hero else 0.0))\n    shown = [p for p in hand.players if p.hole_cards and p.name != hero_name]\n    if shown:\n        lines.append(\"Shown down: \" + \", \".join(\n            \"%s %s (%s)\" % (p.name[:8], cards_str(p.hole_cards), p.shown_rank or \"\")\n            for p in shown))\n    lines.append(\"\")\n    lines.append(\"DECISION MATHS\")\n    lines.append(\"-\" * 60)\n    for d in walk(hand, hero_name, villain_range):\n        lines.append(summarise_decision(d))\n        lines.append(\"\")\n    return \"\\n\".join(lines)\n","pokerbrain/cards.py":"\"\"\"Card representation.\n\nA card is an int 0..51 encoded as rank * 4 + suit.\nRanks are 0..12 mapping to 2..A; suits are 0..3 mapping to c,d,h,s.\nInteger encoding keeps the evaluator and Monte-Carlo loops fast.\n\"\"\"\n\nfrom __future__ import annotations\n\nRANK_CHARS = \"23456789TJQKA\"\nSUIT_CHARS = \"cdhs\"\n\nSUIT_SYMBOLS = {\"\\u2663\": \"c\", \"\\u2666\": \"d\", \"\\u2665\": \"h\", \"\\u2660\": \"s\"}\n\nRANK_TO_INT = {c: i for i, c in enumerate(RANK_CHARS)}\nSUIT_TO_INT = {c: i for i, c in enumerate(SUIT_CHARS)}\n\n# Human-facing rank value: 2..14\nRANK_VALUE = {i: i + 2 for i in range(13)}\n\n\nclass CardError(ValueError):\n    \"\"\"Raised when a card string cannot be parsed.\"\"\"\n\n\ndef make_card(rank: int, suit: int) -> int:\n    return rank * 4 + suit\n\n\ndef card_rank(card: int) -> int:\n    return card >> 2\n\n\ndef card_suit(card: int) -> int:\n    return card & 3\n\n\ndef parse_card(text: str) -> int:\n    \"\"\"Parse a single card such as 'As', 'th', '9D' or 'A\\u2660'.\"\"\"\n    s = text.strip()\n    if len(s) != 2:\n        raise CardError(f\"cannot parse card {text!r}\")\n    r, u = s[0], s[1]\n    u = SUIT_SYMBOLS.get(u, u)\n    r = r.upper()\n    u = u.lower()\n    if r not in RANK_TO_INT:\n        raise CardError(f\"bad rank in card {text!r}\")\n    if u not in SUIT_TO_INT:\n        raise CardError(f\"bad suit in card {text!r}\")\n    return make_card(RANK_TO_INT[r], SUIT_TO_INT[u])\n\n\ndef card_str(card: int) -> str:\n    return RANK_CHARS[card_rank(card)] + SUIT_CHARS[card_suit(card)]\n\n\ndef parse_cards(text: str) -> list[int]:\n    \"\"\"Parse a run of cards: 'AsKd', 'As Kd', '[As Kd]', 'As,Kd'.\"\"\"\n    cleaned = text.replace(\"[\", \" \").replace(\"]\", \" \").replace(\",\", \" \")\n    for sym, letter in SUIT_SYMBOLS.items():\n        cleaned = cleaned.replace(sym, letter)\n    tokens = cleaned.split()\n    cards: list[int] = []\n    for token in tokens:\n        if len(token) % 2 != 0:\n            raise CardError(f\"cannot split {token!r} into cards\")\n        for i in range(0, len(token), 2):\n            cards.append(parse_card(token[i : i + 2]))\n    if len(cards) != len(set(cards)):\n        raise CardError(f\"duplicate card in {text!r}\")\n    return cards\n\n\ndef cards_str(cards) -> str:\n    return \" \".join(card_str(c) for c in cards)\n\n\nFULL_DECK = tuple(range(52))\n","pokerbrain/equity.py":"\"\"\"Equity calculation: hand vs hand, hand vs range, range vs range.\n\nUses exact enumeration when the remaining sample space is small enough and\nMonte Carlo otherwise. Every entry point takes an optional seed so results\nare reproducible when you re-run an analysis.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport itertools\nimport random\n\nfrom .evaluator import evaluate\nfrom .ranges import parse_range, remove_blockers, make_combo\n\n# Enumerate rather than sample when the full space is at most this large.\nEXACT_LIMIT = 600_000\n\n\nclass EquityResult:\n    \"\"\"Equity for the hero plus each villain seat.\"\"\"\n\n    def __init__(self, win, tie, lose, equity, villain_equities, samples, exact):\n        self.win = win\n        self.tie = tie\n        self.lose = lose\n        self.equity = equity\n        self.villain_equities = villain_equities\n        self.samples = samples\n        self.exact = exact\n\n    @property\n    def win_pct(self):\n        return 100.0 * self.win / self.samples if self.samples else 0.0\n\n    @property\n    def tie_pct(self):\n        return 100.0 * self.tie / self.samples if self.samples else 0.0\n\n    @property\n    def equity_pct(self):\n        return 100.0 * self.equity\n\n    def __repr__(self):\n        kind = \"exact\" if self.exact else \"%d sims\" % self.samples\n        return \"<Equity %.2f%% (win %.2f%% tie %.2f%%, %s)>\" % (\n            self.equity_pct, self.win_pct, self.tie_pct, kind)\n\n\ndef _as_weighted(spec, dead):\n    \"\"\"Normalise a villain spec (string range, dict, or 2 cards) to {combo: w}.\"\"\"\n    if isinstance(spec, dict):\n        weighted = dict(spec)\n    elif isinstance(spec, str):\n        weighted = parse_range(spec)\n    elif isinstance(spec, (list, tuple)) and len(spec) == 2 and all(isinstance(c, int) for c in spec):\n        weighted = {make_combo(spec[0], spec[1]): 1.0}\n    else:\n        raise ValueError(\"cannot interpret villain spec %r\" % (spec,))\n    weighted = remove_blockers(weighted, dead)\n    if not weighted:\n        raise ValueError(\"villain range is empty after removing blocked cards\")\n    return weighted\n\n\ndef _score_showdown(hero_score, villain_scores):\n    \"\"\"Return (hero_share, villain_shares, outcome) splitting the pot by ties.\"\"\"\n    best = max([hero_score] + list(villain_scores))\n    winners = (1 if hero_score == best else 0) + sum(1 for s in villain_scores if s == best)\n    share = 1.0 / winners\n    hero_share = share if hero_score == best else 0.0\n    villain_shares = [share if s == best else 0.0 for s in villain_scores]\n    if hero_score == best:\n        outcome = \"win\" if winners == 1 else \"tie\"\n    else:\n        outcome = \"lose\"\n    return hero_share, villain_shares, outcome\n\n\ndef calculate(hero, villains, board=(), iterations=25_000, seed=None, exact_limit=None):\n    \"\"\"Equity for `hero` (2 cards) against one or more villain range specs.\n\n    board  -- 0, 3, 4 or 5 community cards already dealt\n    villains -- list of range strings / {combo: weight} dicts / explicit hands\n    \"\"\"\n    hero = list(hero)\n    board = list(board)\n    if len(hero) != 2:\n        raise ValueError(\"hero must hold exactly 2 cards\")\n    if len(board) not in (0, 3, 4, 5):\n        raise ValueError(\"board must have 0, 3, 4 or 5 cards\")\n\n    dead = set(hero) | set(board)\n    if len(dead) != len(hero) + len(board):\n        raise ValueError(\"duplicate card between hole cards and board\")\n\n    if not isinstance(villains, (list, tuple)):\n        villains = [villains]\n    ranges = [_as_weighted(v, dead) for v in villains]\n\n    deck = [c for c in range(52) if c not in dead]\n    to_come = 5 - len(board)\n\n    # Decide exact vs Monte Carlo.\n    combo_space = 1\n    for r in ranges:\n        combo_space *= len(r)\n    board_space = 1\n    for i in range(to_come):\n        board_space = board_space * (len(deck) - i) // (i + 1)\n    limit = EXACT_LIMIT if exact_limit is None else exact_limit\n    exact = combo_space * board_space <= limit\n\n    if exact:\n        return _exact(hero, ranges, board, deck, to_come)\n    return _monte_carlo(hero, ranges, board, deck, to_come, iterations, seed)\n\n\ndef _exact(hero, ranges, board, deck, to_come):\n    n = len(ranges)\n    win = tie = lose = 0.0\n    hero_eq = 0.0\n    villain_eq = [0.0] * n\n    total_weight = 0.0\n\n    for assignment in itertools.product(*[list(r.items()) for r in ranges]):\n        used = set(hero) | set(board)\n        weight = 1.0\n        clash = False\n        for combo, w in assignment:\n            if combo[0] in used or combo[1] in used:\n                clash = True\n                break\n            used.add(combo[0])\n            used.add(combo[1])\n            weight *= w\n        if clash or weight == 0.0:\n            continue\n\n        remaining = [c for c in deck if c not in used]\n        for extra in itertools.combinations(remaining, to_come):\n            full_board = board + list(extra)\n            hs = evaluate(hero + full_board)\n            vs = [evaluate(list(combo) + full_board) for combo, _ in assignment]\n            hero_share, villain_shares, outcome = _score_showdown(hs, vs)\n            hero_eq += hero_share * weight\n            for i, sh in enumerate(villain_shares):\n                villain_eq[i] += sh * weight\n            total_weight += weight\n            if outcome == \"win\":\n                win += weight\n            elif outcome == \"tie\":\n                tie += weight\n            else:\n                lose += weight\n\n    if total_weight == 0:\n        raise ValueError(\"no valid card assignments (ranges fully blocked)\")\n    equity = hero_eq / total_weight\n    villain_equities = [e / total_weight for e in villain_eq]\n    return EquityResult(win, tie, lose, equity, villain_equities, total_weight, True)\n\n\ndef _monte_carlo(hero, ranges, board, deck, to_come, iterations, seed):\n    rng = random.Random(seed)\n    pools = []\n    for r in ranges:\n        combos = list(r.keys())\n        weights = [r[c] for c in combos]\n        pools.append((combos, weights))\n\n    win = tie = lose = 0.0\n    hero_eq = 0.0\n    villain_eq = [0.0] * len(ranges)\n    samples = 0\n    attempts = 0\n    max_attempts = iterations * 40\n\n    while samples < iterations and attempts < max_attempts:\n        attempts += 1\n        used = set(hero) | set(board)\n        hands = []\n        ok = True\n        for combos, weights in pools:\n            combo = rng.choices(combos, weights=weights, k=1)[0]\n            if combo[0] in used or combo[1] in used:\n                ok = False\n                break\n            used.add(combo[0])\n            used.add(combo[1])\n            hands.append(combo)\n        if not ok:\n            continue\n\n        remaining = [c for c in deck if c not in used]\n        extra = rng.sample(remaining, to_come) if to_come else []\n        full_board = board + extra\n        hs = evaluate(hero + full_board)\n        vs = [evaluate(list(h) + full_board) for h in hands]\n        hero_share, villain_shares, outcome = _score_showdown(hs, vs)\n        hero_eq += hero_share\n        for i, sh in enumerate(villain_shares):\n            villain_eq[i] += sh\n        samples += 1\n        if outcome == \"win\":\n            win += 1\n        elif outcome == \"tie\":\n            tie += 1\n        else:\n            lose += 1\n\n    if samples == 0:\n        raise ValueError(\"could not sample any valid runout (ranges fully blocked)\")\n    equity = hero_eq / samples\n    villain_equities = [e / samples for e in villain_eq]\n    return EquityResult(win, tie, lose, equity, villain_equities, samples, False)\n\n\ndef range_vs_range(hero_spec, villain_spec, board=(), iterations=20_000, seed=None):\n    \"\"\"Average equity of one range against another.\"\"\"\n    board = list(board)\n    hero_range = remove_blockers(\n        parse_range(hero_spec) if isinstance(hero_spec, str) else dict(hero_spec), board)\n    rng = random.Random(seed)\n    combos = list(hero_range.keys())\n    weights = [hero_range[c] for c in combos]\n    total = 0.0\n    count = 0\n    per_combo = {}\n    picks = max(1, iterations // 200)\n    for _ in range(picks):\n        hero = rng.choices(combos, weights=weights, k=1)[0]\n        try:\n            res = calculate(list(hero), [villain_spec], board, iterations=200, seed=rng.random())\n        except ValueError:\n            continue\n        per_combo.setdefault(hero, []).append(res.equity)\n        total += res.equity\n        count += 1\n    avg = total / count if count else 0.0\n    detail = {c: sum(v) / len(v) for c, v in per_combo.items()}\n    return avg, detail\n\n\ndef equity_vs_random(hero, iterations=8000, seed=0):\n    \"\"\"Heads-up equity against a uniformly random hand (used for the 169 chart).\"\"\"\n    rng = random.Random(seed)\n    hero = list(hero)\n    deck = [c for c in range(52) if c not in hero]\n    total = 0.0\n    for _ in range(iterations):\n        sample = rng.sample(deck, 7)\n        villain = sample[:2]\n        board = sample[2:]\n        hs = evaluate(hero + board)\n        vs = evaluate(villain + board)\n        if hs > vs:\n            total += 1.0\n        elif hs == vs:\n            total += 0.5\n    return total / iterations\n","pokerbrain/evaluator.py":"\"\"\"Fast 5/6/7-card Texas Hold'em hand evaluator.\n\nevaluate(cards) returns a single int; higher is strictly better, and two\nhands compare equal if and only if they split the pot. The score packs the\ncategory in the high bits followed by up to five tiebreak ranks:\n\n    (category << 20) | (k1 << 16) | (k2 << 12) | (k3 << 8) | (k4 << 4) | k5\n\nRanks in the tiebreak slots use natural values 2..14 (14 = ace).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .cards import card_rank, card_suit\n\nHIGH_CARD = 0\nPAIR = 1\nTWO_PAIR = 2\nTRIPS = 3\nSTRAIGHT = 4\nFLUSH = 5\nFULL_HOUSE = 6\nQUADS = 7\nSTRAIGHT_FLUSH = 8\n\nCATEGORY_NAMES = {\n    HIGH_CARD: \"High Card\",\n    PAIR: \"One Pair\",\n    TWO_PAIR: \"Two Pair\",\n    TRIPS: \"Three of a Kind\",\n    STRAIGHT: \"Straight\",\n    FLUSH: \"Flush\",\n    FULL_HOUSE: \"Full House\",\n    QUADS: \"Four of a Kind\",\n    STRAIGHT_FLUSH: \"Straight Flush\",\n}\n\n\ndef _pack(category: int, kickers) -> int:\n    score = category << 20\n    shift = 16\n    for k in kickers[:5]:\n        score |= k << shift\n        shift -= 4\n    return score\n\n\ndef _straight_high(value_mask: int) -> int:\n    \"\"\"Highest straight top-card given a bitmask over values 2..14, else 0.\"\"\"\n    mask = value_mask\n    if mask & (1 << 14):\n        mask |= 1 << 1  # ace plays low for the wheel\n    for high in range(14, 4, -1):\n        window = (1 << high) | (1 << (high - 1)) | (1 << (high - 2)) | (1 << (high - 3)) | (1 << (high - 4))\n        if mask & window == window:\n            return high\n    return 0\n\n\ndef evaluate(cards) -> int:\n    \"\"\"Evaluate the best 5-card hand from 5, 6 or 7 cards.\"\"\"\n    value_mask = 0\n    suit_masks = [0, 0, 0, 0]\n    suit_counts = [0, 0, 0, 0]\n    rank_counts = [0] * 15\n\n    for card in cards:\n        value = card_rank(card) + 2\n        suit = card_suit(card)\n        value_mask |= 1 << value\n        suit_masks[suit] |= 1 << value\n        suit_counts[suit] += 1\n        rank_counts[value] += 1\n\n    # --- flush family -------------------------------------------------\n    for suit in range(4):\n        if suit_counts[suit] >= 5:\n            smask = suit_masks[suit]\n            sf_high = _straight_high(smask)\n            if sf_high:\n                return _pack(STRAIGHT_FLUSH, [sf_high])\n            top = []\n            for value in range(14, 1, -1):\n                if smask & (1 << value):\n                    top.append(value)\n                    if len(top) == 5:\n                        break\n            return _pack(FLUSH, top)\n\n    # --- paired families ----------------------------------------------\n    quads = []\n    trips = []\n    pairs = []\n    singles = []\n    for value in range(14, 1, -1):\n        count = rank_counts[value]\n        if count == 4:\n            quads.append(value)\n        elif count == 3:\n            trips.append(value)\n        elif count == 2:\n            pairs.append(value)\n        elif count == 1:\n            singles.append(value)\n\n    if quads:\n        quad = quads[0]\n        rest = [v for v in range(14, 1, -1) if v != quad and rank_counts[v]]\n        return _pack(QUADS, [quad, rest[0]])\n\n    if trips and (len(trips) > 1 or pairs):\n        trip = trips[0]\n        pair = trips[1] if len(trips) > 1 else pairs[0]\n        if pairs and len(trips) > 1:\n            pair = max(trips[1], pairs[0])\n        return _pack(FULL_HOUSE, [trip, pair])\n\n    straight = _straight_high(value_mask)\n    if straight:\n        return _pack(STRAIGHT, [straight])\n\n    if trips:\n        trip = trips[0]\n        kickers = [v for v in singles][:2]\n        return _pack(TRIPS, [trip] + kickers)\n\n    if len(pairs) >= 2:\n        hi, lo = pairs[0], pairs[1]\n        rest = [v for v in range(14, 1, -1) if v not in (hi, lo) and rank_counts[v]]\n        return _pack(TWO_PAIR, [hi, lo, rest[0]])\n\n    if pairs:\n        return _pack(PAIR, [pairs[0]] + singles[:3])\n\n    return _pack(HIGH_CARD, singles[:5])\n\n\ndef hand_category(score: int) -> int:\n    return score >> 20\n\n\ndef describe(score: int) -> str:\n    \"\"\"Human-readable description of an evaluated score.\"\"\"\n    from .cards import RANK_CHARS\n\n    cat = hand_category(score)\n    k = [(score >> s) & 0xF for s in (16, 12, 8, 4, 0)]\n    name = lambda v: RANK_CHARS[v - 2] if 2 <= v <= 14 else \"?\"\n    if cat == STRAIGHT_FLUSH:\n        return \"Royal Flush\" if k[0] == 14 else f\"Straight Flush, {name(k[0])} high\"\n    if cat == QUADS:\n        return f\"Four of a Kind, {name(k[0])}s\"\n    if cat == FULL_HOUSE:\n        return f\"Full House, {name(k[0])}s full of {name(k[1])}s\"\n    if cat == FLUSH:\n        return f\"Flush, {name(k[0])} high\"\n    if cat == STRAIGHT:\n        return f\"Straight, {name(k[0])} high\"\n    if cat == TRIPS:\n        return f\"Three of a Kind, {name(k[0])}s\"\n    if cat == TWO_PAIR:\n        return f\"Two Pair, {name(k[0])}s and {name(k[1])}s\"\n    if cat == PAIR:\n        return f\"One Pair, {name(k[0])}s\"\n    return f\"High Card, {name(k[0])}\"\n","pokerbrain/leaks.py":"\"\"\"Leak detection across a sample of hands.\n\nTwo kinds of finding:\n\n  * statistical  - a HUD stat sits outside the band a winning regular\n                   occupies, with enough sample to mean something.\n  * situational  - a concrete recurring spot that cost money, with the\n                   hands attached so they can be reviewed individually.\n\nEvery finding carries a confidence based on sample size. Poker variance is\nbrutal: 75 hands says almost nothing, 10,000 says a lot. The detector is\ndeliberately loud about which is which.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .cards import cards_str\nfrom .model import ALLIN, BET, CALL, CHECK, FLOP, FOLD, PREFLOP, RAISE, RIVER, TURN\nfrom .stats import BENCHMARKS, STAT_ORDER, compute\n\n# Sample sizes below which a stat is reported but not trusted.\nMIN_MEANINGFUL = {\n    \"vpip\": 100, \"pfr\": 100, \"rfi\": 80, \"3bet\": 60, \"fold_to_3bet\": 30,\n    \"4bet\": 30, \"steal\": 50, \"bb_fold_to_steal\": 40, \"limp\": 80,\n    \"cbet_flop\": 40, \"cbet_turn\": 30, \"cbet_river\": 25,\n    \"fold_to_cbet_flop\": 40, \"fold_to_cbet_turn\": 30,\n    \"wtsd\": 60, \"wsd\": 40, \"wwsf\": 60,\n}\n\n\nclass Finding:\n    def __init__(self, kind, title, detail, severity=\"medium\",\n                 confidence=\"low\", sample=0, hands=None, fix=\"\"):\n        self.kind = kind\n        self.title = title\n        self.detail = detail\n        self.severity = severity\n        self.confidence = confidence\n        self.sample = sample\n        self.hands = hands or []\n        self.fix = fix\n\n    def __repr__(self):\n        return \"<%s %s (%s)>\" % (self.severity, self.title, self.confidence)\n\n\ndef _confidence(sample, needed):\n    if sample >= needed:\n        return \"solid\"\n    if sample >= needed * 0.4:\n        return \"tentative\"\n    return \"too thin to trust\"\n\n\ndef showdown_split(hands, hero_name=\"Hero\"):\n    \"\"\"Split winnings into showdown (blue line) and non-showdown (red line).\n\n    Red line negative with blue line positive is the classic passive/\n    station profile: winning only by making hands, losing every pot that\n    does not reach showdown.\n    \"\"\"\n    blue = red = 0.0\n    bb = hands[0].bb_size if hands else 1.0\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero:\n            continue\n        if hero.showed or (hero.collected > 0 and hero.folded_street == \"\"\n                           and len(h.went_to_showdown) > 1):\n            blue += hero.net\n        else:\n            red += hero.net\n    return {\"showdown_bb\": blue / bb, \"non_showdown_bb\": red / bb,\n            \"total_bb\": (blue + red) / bb}\n\n\ndef statistical_leaks(hands, hero_name=\"Hero\"):\n    lines = compute(hands, hero_name=hero_name)\n    hero = lines.get(\"Hero\")\n    pool = lines.get(\"POOL\")\n    out = []\n    if not hero:\n        return out\n\n    for name in STAT_ORDER:\n        counter = hero.c.get(name)\n        if not counter or not counter.opp:\n            continue\n        lo, hi, label = BENCHMARKS[name]\n        val = counter.pct\n        needed = MIN_MEANINGFUL.get(name, 50)\n        conf = _confidence(counter.opp, needed)\n        pool_val = pool.c[name].pct if pool and pool.c.get(name) and pool.c[name].opp else None\n\n        if lo <= val <= hi:\n            continue\n        direction = \"too low\" if val < lo else \"too high\"\n        severity = \"high\" if (val < lo * 0.6 or val > hi * 1.6) else \"medium\"\n        detail = \"%s is %.1f%% over %d opportunities; a winning 6-max reg sits %d-%d%%.\" % (\n            label, val, counter.opp, lo, hi)\n        if pool_val is not None:\n            detail += \" Your pool runs %.1f%%.\" % pool_val\n        out.append(Finding(\"stat\", \"%s %s\" % (label, direction), detail,\n                           severity=severity, confidence=conf, sample=counter.opp,\n                           fix=_FIXES.get(name, \"\")))\n    return out\n\n\n_FIXES = {\n    \"vpip\": \"Tighten the bottom of your opening and cold-calling ranges, especially out of position.\",\n    \"pfr\": \"Convert limps and flat calls into raises. A healthy VPIP/PFR gap is about 4-6 points, not 20.\",\n    \"rfi\": \"When it folds to you, raise more. Folding a playable hand first-in gives up the blinds and the initiative.\",\n    \"3bet\": \"Add suited-ace and suited-broadway 3-bet bluffs against late-position opens.\",\n    \"fold_to_3bet\": \"Defend your opens more often in position; folding over half is exploitable.\",\n    \"steal\": \"Attack the blinds harder from CO/BTN/SB, particularly against players who fold too much.\",\n    \"bb_fold_to_steal\": \"Defend the big blind wider with suited and connected hands; you are getting a price.\",\n    \"limp\": \"Stop open-limping. Raise or fold; limping caps your range and invites multiway pots.\",\n    \"cbet_flop\": \"Bet more on boards that favour your range; check more on boards that favour theirs.\",\n    \"fold_to_cbet_flop\": \"Float and raise more on dry boards where the c-bettor's range is weak.\",\n    \"wtsd\": \"Reaching showdown too often usually means calling too many rivers with bluff-catchers.\",\n    \"wwsf\": \"Winning few pots that see a flop points to passivity after the flop; take more initiative.\",\n}\n\n\ndef situational_leaks(hands, hero_name=\"Hero\"):\n    out = []\n    bb = hands[0].bb_size if hands else 1.0\n\n    # --- biggest losses --------------------------------------------------\n    losses = sorted((h for h in hands if h.player(hero_name)),\n                    key=lambda h: h.player(hero_name).net)[:5]\n    big = [h for h in losses if h.player(hero_name).net / bb < -20]\n    if big:\n        rows = []\n        for h in big:\n            hero = h.player(hero_name)\n            rows.append(\"  %s  %+.0f bb  %s [%s] on %s\"\n                        % (h.hand_id, hero.net / bb, hero.position,\n                           cards_str(hero.hole_cards), cards_str(h.board) or \"preflop\"))\n        out.append(Finding(\n            \"situational\", \"Largest pots lost\",\n            \"These hands dominate the sample's loss. Review each one street by \"\n            \"street before drawing conclusions from the aggregate stats:\\n\" + \"\\n\".join(rows),\n            severity=\"high\", confidence=\"n/a\", sample=len(big),\n            hands=[h.hand_id for h in big]))\n\n    # --- calling the river with a weak holding ---------------------------\n    river_calls = []\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero or RIVER not in h.streets_reached:\n            continue\n        acts = h.street_actions(RIVER)\n        for a in acts:\n            if a.player == hero_name and a.verb == CALL and a.amount / bb >= 8:\n                if hero.net < 0:\n                    river_calls.append((h, a))\n    if len(river_calls) >= 2:\n        rows = [\"  %s  called %.0f bb on the river with [%s], lost %.0f bb\"\n                % (h.hand_id, a.amount / bb, cards_str(h.player(hero_name).hole_cards),\n                   -h.player(hero_name).net / bb)\n                for h, a in river_calls[:6]]\n        out.append(Finding(\n            \"situational\", \"Large losing river calls\",\n            \"Big river calls that did not get there:\\n\" + \"\\n\".join(rows) +\n            \"\\nOn the river there are no more cards: you are calling purely on whether \"\n            \"their value range is wider than the price you are getting.\",\n            severity=\"high\", confidence=_confidence(len(river_calls), 8),\n            sample=len(river_calls), hands=[h.hand_id for h, _ in river_calls],\n            fix=\"Before calling, name the worse hands they would bet this size with. \"\n                \"If you cannot name three, fold.\"))\n\n    # --- passivity: checking back / calling with the betting lead --------\n    passive = 0\n    total_flop = 0\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero or FLOP not in h.streets_reached or hero.folded_street == PREFLOP:\n            continue\n        total_flop += 1\n        aggressive = any(a.player == hero_name and\n                         (a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0))\n                         for a in h.actions if a.street in (FLOP, TURN, RIVER))\n        if not aggressive:\n            passive += 1\n    if total_flop >= 10 and passive / total_flop > 0.6:\n        out.append(Finding(\n            \"situational\", \"Postflop passivity\",\n            \"In %d of %d flops seen (%.0f%%) you never bet or raised on any street. \"\n            \"Pots are won by the player who bets; checking back gives every hand in \"\n            \"their range a free chance to improve or to bluff you.\"\n            % (passive, total_flop, 100 * passive / total_flop),\n            severity=\"high\", confidence=_confidence(total_flop, 60), sample=total_flop,\n            fix=\"Pick up the betting lead more: c-bet as the preflop aggressor, and \"\n                \"bet when checked to on boards that miss the caller's range.\"))\n\n    # --- open-limping ----------------------------------------------------\n    limps = []\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero:\n            continue\n        first_voluntary = None\n        raised = False\n        for a in h.actions:\n            if a.street != PREFLOP or a.verb in (\"post\", \"return\", \"straddle\"):\n                continue\n            if a.player == hero_name and first_voluntary is None:\n                first_voluntary = a\n                break\n            if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n                raised = True\n        if first_voluntary and first_voluntary.verb == CALL and not raised:\n            limps.append(h)\n    if limps:\n        out.append(Finding(\n            \"situational\", \"Open-limping\",\n            \"You open-limped %d times. Limping caps your range at hands you were not \"\n            \"willing to raise, surrenders the initiative, and lets the blinds see a \"\n            \"cheap flop. Hands: %s\"\n            % (len(limps), \", \".join(h.hand_id for h in limps[:6])),\n            severity=\"medium\", confidence=_confidence(len(limps), 15), sample=len(limps),\n            hands=[h.hand_id for h in limps],\n            fix=\"Raise or fold when the pot is unopened.\"))\n\n    return out\n\n\ndef analyse(hands, hero_name=\"Hero\"):\n    \"\"\"All findings, most severe first.\"\"\"\n    findings = statistical_leaks(hands, hero_name) + situational_leaks(hands, hero_name)\n    rank = {\"high\": 0, \"medium\": 1, \"low\": 2}\n    conf_rank = {\"solid\": 0, \"n/a\": 1, \"tentative\": 2, \"too thin to trust\": 3}\n    findings.sort(key=lambda f: (conf_rank.get(f.confidence, 3), rank.get(f.severity, 1)))\n    return findings\n\n\ndef format_findings(findings, hands=None, hero_name=\"Hero\") -> str:\n    out = []\n    if hands:\n        split = showdown_split(hands, hero_name)\n        out.append(\"WINNINGS SPLIT\")\n        out.append(\"  at showdown (blue line):     %+8.1f bb\" % split[\"showdown_bb\"])\n        out.append(\"  without showdown (red line): %+8.1f bb\" % split[\"non_showdown_bb\"])\n        out.append(\"  total:                       %+8.1f bb over %d hands\"\n                   % (split[\"total_bb\"], len(hands)))\n        out.append(\"\")\n    if not findings:\n        out.append(\"No leaks stood out. With a larger sample there will be more to see.\")\n        return \"\\n\".join(out)\n    out.append(\"FINDINGS (%d)\" % len(findings))\n    out.append(\"=\" * 72)\n    for i, f in enumerate(findings, 1):\n        out.append(\"%d. [%s | %s] %s\" % (i, f.severity.upper(), f.confidence, f.title))\n        for line in f.detail.split(\"\\n\"):\n            out.append(\"   \" + line)\n        if f.fix:\n            out.append(\"   FIX: \" + f.fix)\n        out.append(\"\")\n    return \"\\n\".join(out)\n","pokerbrain/model.py":"\"\"\"Normalised hand-history data model.\n\nSite-specific parsers all produce these objects, so every downstream\ncomponent (stats, leak detection, analysis, reports) is site-agnostic.\n\nMoney is stored as float in the table's currency unit. Amounts follow one\nconvention throughout: `amount` is the chips a player *added* on that\naction, and `to_amount` is the resulting total wager level for the street.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nPREFLOP = \"preflop\"\nFLOP = \"flop\"\nTURN = \"turn\"\nRIVER = \"river\"\nSTREETS = (PREFLOP, FLOP, TURN, RIVER)\n\n# Action verbs\nPOST = \"post\"\nCHECK = \"check\"\nFOLD = \"fold\"\nCALL = \"call\"\nBET = \"bet\"\nRAISE = \"raise\"\nALLIN = \"allin\"\nSTRADDLE = \"straddle\"\nSHOW = \"show\"\nMUCK = \"muck\"\nRETURN = \"return\"\n\nAGGRESSIVE = (BET, RAISE)\nVOLUNTARY = (CALL, BET, RAISE, ALLIN)\n\n# Position labels ordered by distance from the button, for 2..10 handed.\nPOSITION_TABLES = {\n    2: [\"BTN\", \"BB\"],\n    3: [\"BTN\", \"SB\", \"BB\"],\n    4: [\"BTN\", \"SB\", \"BB\", \"CO\"],\n    5: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"CO\"],\n    6: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"HJ\", \"CO\"],\n    7: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"HJ\", \"CO\"],\n    8: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"MP\", \"HJ\", \"CO\"],\n    9: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"HJ\", \"CO\"],\n    10: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"MP1\", \"HJ\", \"CO\"],\n}\n\n# Ordering used when reporting stats by position.\nPOSITION_ORDER = [\"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"MP1\", \"HJ\", \"CO\", \"BTN\", \"SB\", \"BB\"]\n\nIP_POSITIONS = (\"BTN\", \"CO\", \"HJ\")\nBLINDS = (\"SB\", \"BB\")\n\n\n@dataclass\nclass Action:\n    player: str\n    verb: str\n    street: str = PREFLOP\n    amount: float = 0.0          # chips added by this action\n    to_amount: float = 0.0       # resulting street wager level\n    all_in: bool = False\n    cards: tuple = ()            # for SHOW\n    note: str = \"\"               # e.g. \"ante\", \"small blind\", \"big blind\"\n    order: int = 0               # index within the hand\n\n    @property\n    def is_voluntary(self) -> bool:\n        return self.verb in VOLUNTARY\n\n    @property\n    def is_aggressive(self) -> bool:\n        return self.verb in AGGRESSIVE or (self.verb == ALLIN and self.amount > 0)\n\n    def __repr__(self):\n        money = f\" {self.amount:g}\" if self.amount else \"\"\n        to = f\"->{self.to_amount:g}\" if self.to_amount else \"\"\n        return f\"<{self.street}: {self.player} {self.verb}{money}{to}>\"\n\n\n@dataclass\nclass Player:\n    name: str\n    seat: int\n    stack: float                 # stack at the start of the hand\n    position: str = \"\"\n    hole_cards: tuple = ()       # ints; empty when unknown\n    is_hero: bool = False\n    posted: float = 0.0          # blinds + antes + straddle\n    invested: float = 0.0        # total chips put in across the hand\n    collected: float = 0.0       # total chips won back\n    showed: bool = False\n    shown_rank: str = \"\"         # site-reported hand name at showdown\n    folded_street: str = \"\"      # street on which they folded, if any\n\n    @property\n    def net(self) -> float:\n        return self.collected - self.invested\n\n    @property\n    def effective_position_group(self) -> str:\n        if self.position in BLINDS:\n            return \"blind\"\n        if self.position in IP_POSITIONS:\n            return \"late\"\n        return \"early\"\n\n    def __repr__(self):\n        tag = \"*\" if self.is_hero else \"\"\n        return f\"<{tag}{self.name} seat{self.seat} {self.position} {self.stack:g}>\"\n\n\n@dataclass\nclass Hand:\n    hand_id: str\n    site: str = \"CoinPoker\"\n    game: str = \"NLH\"\n    currency: str = \"USDT\"\n    small_blind: float = 0.0\n    big_blind: float = 0.0\n    ante: float = 0.0\n    timestamp: str = \"\"\n    timezone: str = \"\"\n    table: str = \"\"\n    max_seats: int = 6\n    button_seat: int = 0\n    players: list = field(default_factory=list)\n    actions: list = field(default_factory=list)\n    board: list = field(default_factory=list)     # card ints\n    total_pot: float = 0.0\n    rake: float = 0.0\n    extra_fee: float = 0.0\n    run_count: int = 1\n    is_tournament: bool = False\n    tournament_id: str = \"\"\n    level: str = \"\"\n    raw: str = \"\"\n    parse_warnings: list = field(default_factory=list)\n\n    # ---------------------------------------------------------- lookups ---\n    @property\n    def hero(self):\n        for p in self.players:\n            if p.is_hero:\n                return p\n        return None\n\n    def player(self, name: str):\n        for p in self.players:\n            if p.name == name:\n                return p\n        return None\n\n    def by_position(self, position: str):\n        for p in self.players:\n            if p.position == position:\n                return p\n        return None\n\n    def street_actions(self, street: str) -> list:\n        \"\"\"Real decisions on a street (blinds, antes and returns excluded).\"\"\"\n        return [a for a in self.actions\n                if a.street == street and a.verb not in (POST, RETURN, SHOW, MUCK)]\n\n    def all_street_entries(self, street: str) -> list:\n        return [a for a in self.actions if a.street == street]\n\n    @property\n    def streets_reached(self) -> list:\n        seen = [PREFLOP]\n        if len(self.board) >= 3:\n            seen.append(FLOP)\n        if len(self.board) >= 4:\n            seen.append(TURN)\n        if len(self.board) >= 5:\n            seen.append(RIVER)\n        return seen\n\n    @property\n    def final_street(self) -> str:\n        return self.streets_reached[-1]\n\n    def board_at(self, street: str) -> list:\n        counts = {PREFLOP: 0, FLOP: 3, TURN: 4, RIVER: 5}\n        return self.board[: counts[street]]\n\n    @property\n    def went_to_showdown(self) -> list:\n        \"\"\"Players who showed or mucked at showdown.\"\"\"\n        return [p for p in self.players if p.showed]\n\n    def pot_before_street(self, street: str) -> float:\n        \"\"\"Total chips in the middle when a street began.\"\"\"\n        idx = STREETS.index(street)\n        earlier = STREETS[:idx]\n        total = 0.0\n        for a in self.actions:\n            if a.street in earlier and a.verb != SHOW and a.verb != MUCK:\n                total += a.amount if a.verb != RETURN else -a.amount\n        return total\n\n    @property\n    def bb_size(self) -> float:\n        return self.big_blind or 1.0\n\n    def in_bb(self, amount: float) -> float:\n        return amount / self.bb_size\n\n    def __repr__(self):\n        return (f\"<Hand {self.hand_id} {self.game} {self.small_blind:g}/{self.big_blind:g} \"\n                f\"{len(self.players)}p board={len(self.board)}>\")\n\n\ndef assign_positions(hand: Hand) -> None:\n    \"\"\"Fill in each player's position from the button seat.\"\"\"\n    if not hand.players:\n        return\n    seats = sorted(p.seat for p in hand.players)\n    n = len(seats)\n    if hand.button_seat not in seats:\n        # Button sat out; fall back to the highest seat at or below it.\n        candidates = [s for s in seats if s <= hand.button_seat] or seats\n        button = candidates[-1]\n        hand.parse_warnings.append(\n            f\"button seat {hand.button_seat} not occupied; using seat {button}\")\n    else:\n        button = hand.button_seat\n\n    start = seats.index(button)\n    ordered = [seats[(start + i) % n] for i in range(n)]\n    labels = POSITION_TABLES.get(n)\n    if labels is None:\n        labels = [\"BTN\", \"SB\", \"BB\"] + [f\"P{i}\" for i in range(3, n)]\n\n    seat_to_player = {p.seat: p for p in hand.players}\n    for seat, label in zip(ordered, labels):\n        seat_to_player[seat].position = label\n","pokerbrain/profiles.py":"\"\"\"Opponent profiling from HUD statistics.\n\nCoinPoker's client shows a per-player stat panel (PokerIntel) with real,\npersistent usernames. This module turns those numbers into three things:\n\n    1. a colour tag, so the table read is instant\n    2. a ranked list of exploitable leaks, each with the adjustment\n    3. a note under 250 characters, for the client's own note field\n\nThe rules live in RULES as plain data so the same rule set drives the CLI,\nthe web report and the tests, and so they can be argued with and tuned in\none place rather than being buried in code.\n\nDesign note: the *classification* is deterministic. Screenshot reading may\nbe done by a vision model, but only to extract the numbers. Everything\ndownstream of the numbers is these rules, so the same input always gives\nthe same verdict.\n\"\"\"\n\nfrom __future__ import annotations\n\nNOTE_LIMIT = 250\n\n# Stats we read off the panel. `key` is used everywhere downstream.\nSTATS = [\n    (\"vpip\", \"VPIP\", \"fast\"),\n    (\"pfr\", \"PFR\", \"fast\"),\n    (\"three_bet\", \"3-Bet\", \"slow\"),\n    (\"fold_to_three_bet\", \"Fold to 3-Bet\", \"slow\"),\n    (\"cbet\", \"C-Bet\", \"fast\"),\n    (\"fold_to_cbet\", \"Fold to C-Bet\", \"medium\"),\n    (\"steal\", \"Steal\", \"fast\"),\n    (\"check_raise\", \"Check/Raise\", \"slow\"),\n    (\"wtsd\", \"WTSD\", \"medium\"),\n    (\"wsd\", \"WSD\", \"medium\"),\n]\n\n# Derived from the entered stats rather than read off the panel, but the\n# rules treat it like any other value.\nDERIVED = [\n    (\"gap\", \"VPIP\\u2013PFR gap\", \"fast\"),\n]\n\nSTAT_LABELS = {k: label for k, label, _ in STATS}\nSTAT_SPEED = {k: speed for k, _, speed in STATS}\nfor _k, _label, _speed in DERIVED:\n    STAT_LABELS[_k] = _label\n    STAT_SPEED[_k] = _speed\n\n# How quickly each statistic becomes trustworthy. Opportunities accumulate\n# at wildly different rates: you post a VPIP decision every hand, but you\n# only face a 3-bet after you have opened and someone has re-raised.\nSPEED_NOTE = {\n    \"fast\": \"settles quickly - trust it early\",\n    \"medium\": \"needs a few hundred hands\",\n    \"slow\": \"accumulates slowly - hold this one loosely\",\n}\n\nBENCHMARKS = {\n    \"vpip\": (22, 28),\n    \"pfr\": (17, 23),\n    \"three_bet\": (6, 11),\n    \"fold_to_three_bet\": (40, 55),\n    \"cbet\": (55, 70),\n    \"fold_to_cbet\": (40, 55),\n    \"steal\": (35, 50),\n    \"check_raise\": (6, 12),\n    \"wtsd\": (24, 30),\n    \"wsd\": (48, 56),\n    \"gap\": (3, 8),\n}\n\nTAGS = {\n    \"green\":   (\"Fish / station\", \"Your money. Value bet thin, never bluff.\"),\n    \"orange\":  (\"LAG / maniac\", \"Let them bluff into you. Trap, call lighter.\"),\n    \"yellow\":  (\"Nit / rock\", \"Steal relentlessly. Believe their raises.\"),\n    \"blue\":    (\"Solid reg\", \"Play straightforwardly. Skip marginal spots.\"),\n    \"red\":     (\"Threat - avoid\", \"Avoid pots out of position. Don't get creative.\"),\n    \"magenta\": (\"Reg with a hole\", \"Read the note - one stat is badly out of line.\"),\n    \"none\":    (\"Not enough to say\", \"Play the pool default until you see more.\"),\n}\n\n# The legend shown beside the tagging tool, in the order a reader scans it:\n# money first, danger last, and the \"read the note\" tag at the end.\nTAG_GUIDE = [\n    (\"green\", \"Fish / station\",\n     \"VPIP 33+ with a big gap to PFR, or a gap of 15+ on its own. Folds rarely, \"\n     \"goes to showdown a lot.\",\n     \"Your money. Isolate them, value bet thin across every street, never bluff. \"\n     \"Sit to their left.\"),\n    (\"orange\", \"LAG / maniac\",\n     \"VPIP 30+ and PFR 24+. Genuinely loose and genuinely aggressive.\",\n     \"Let them bluff into you. Tighten your opens, trap with strong hands, and \"\n     \"call down lighter than feels comfortable.\"),\n    (\"yellow\", \"Nit / rock\",\n     \"VPIP 17 or lower. Folds its way through the session.\",\n     \"Steal their blinds every time, c-bet them relentlessly, and believe them \"\n     \"when they raise - it is real.\"),\n    (\"blue\", \"Solid reg\",\n     \"Near the winning-regular band on most stats, no serious hole.\",\n     \"Play straightforwardly. Skip marginal spots; there is no special edge here.\"),\n    (\"red\", \"Threat - avoid\",\n     \"Seven or more stats in the winning band, with a real 3-bet and \"\n     \"check-raise, and no exploitable hole.\",\n     \"Avoid pots out of position, don't bluff-catch light, don't get creative. \"\n     \"Consider changing seats if they are on your left.\"),\n    (\"magenta\", \"Reg with a hole\",\n     \"Would be blue or red, but at least one high-severity leak fired.\",\n     \"Looks ordinary on the headline numbers. The exploit is in the note - read \"\n     \"it before you play a pot with them.\"),\n]\n\nTAG_GUIDE_BY_COLOUR = {c: {\"label\": l, \"when\": w, \"plan\": p}\n                       for c, l, w, p in TAG_GUIDE}\n\n# ---------------------------------------------------------------- leaks ---\n# Each rule: (id, stat, op, threshold, severity, title, exploit, shorthand)\n# `shorthand` is what goes in the 250-character note.\n\nLEAK_RULES = [\n    (\"wide_gap\", \"gap\", \">\", 12, \"high\",\n     \"Plays far more hands than they raise\",\n     \"Isolate them in position and value bet relentlessly. A gap this size \"\n     \"means most of the hands they show up with are ones they merely called \"\n     \"with, so their range is weak and uncapped by any raise.\",\n     \"gap{v} isolate+value\"),\n\n    (\"no_flatting\", \"gap\", \"<\", 2, \"info\",\n     \"Raise-or-fold - almost never flat-calls\",\n     \"Their calling range barely exists, so the hands they enter with are \"\n     \"polarised to raises. Expect a strong range whenever they just call.\",\n     \"gap{v} raise-or-fold\"),\n\n    (\"overfold_3bet\", \"fold_to_three_bet\", \">\", 60, \"high\",\n     \"Folds too much to 3-bets\",\n     \"3-bet them light, especially when they open from late position. \"\n     \"They open wide and then surrender the pot without a fight.\",\n     \"F3B{v} 3bet light\"),\n\n    (\"underfold_3bet\", \"fold_to_three_bet\", \"<\", 33, \"medium\",\n     \"Almost never folds to a 3-bet\",\n     \"3-bet for value only. Your bluff 3-bets have no fold equity, and you \"\n     \"will be playing a big pot out of position with a weak range.\",\n     \"F3B{v} no 3bet bluffs\"),\n\n    (\"sticky_postflop\", \"fold_to_cbet\", \"<\", 32, \"high\",\n     \"Will not fold to a c-bet\",\n     \"Do not barrel them. Your bluffs get called. C-bet for value, check \"\n     \"back marginal hands, and value bet thinner than usual.\",\n     \"FvCB{v} NO barrels\"),\n\n
