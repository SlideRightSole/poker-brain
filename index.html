bo[1])\n    return RANK_CHARS[hi] + RANK_CHARS[lo] + (\"s\" if suited else \"o\")\n\n\ndef class_combos(label: str) -> list:\n    \"\"\"All concrete combos belonging to a 169-class label.\"\"\"\n    label = label.strip()\n    if len(label) == 2 and label[0].upper() == label[1].upper():\n        r = RANK_TO_INT[label[0].upper()]\n        cards = [r * 4 + s for s in range(4)]\n        return [make_combo(cards[i], cards[j]) for i in range(4) for j in range(i + 1, 4)]\n    if len(label) == 3:\n        hi, lo, kind = label[0].upper(), label[1].upper(), label[2].lower()\n        h, l = RANK_TO_INT[hi], RANK_TO_INT[lo]\n        if h == l:\n            raise RangeError(\"%r is not a valid hand class\" % label)\n        if h < l:\n            h, l = l, h\n        if kind == \"s\":\n            return [make_combo(h * 4 + s, l * 4 + s) for s in range(4)]\n        if kind == \"o\":\n            return [make_combo(h * 4 + s1, l * 4 + s2)\n                    for s1 in range(4) for s2 in range(4) if s1 != s2]\n    raise RangeError(\"%r is not a valid hand class\" % label)\n\n\ndef all_hand_classes() -> list:\n    \"\"\"The 169 classes in chart order (pairs on the diagonal, suited above).\"\"\"\n    out = []\n    for i in range(12, -1, -1):\n        for j in range(12, -1, -1):\n            if i == j:\n                out.append(RANK_CHARS[i] * 2)\n            elif i > j:\n                out.append(RANK_CHARS[i] + RANK_CHARS[j] + \"s\")\n            else:\n                out.append(RANK_CHARS[j] + RANK_CHARS[i] + \"o\")\n    seen = []\n    for label in out:\n        if label not in seen:\n            seen.append(label)\n    return seen\n\n\n# ------------------------------------------------------------- expansion ---\n\n_PAIR_RE = re.compile(r\"^([2-9TJQKA])\\1$\", re.I)\n_PAIR_PLUS_RE = re.compile(r\"^([2-9TJQKA])\\1\\+$\", re.I)\n_PAIR_SPAN_RE = re.compile(r\"^([2-9TJQKA])\\1-([2-9TJQKA])\\2$\", re.I)\n_HAND_RE = re.compile(r\"^([2-9TJQKA])([2-9TJQKA])([so]?)$\", re.I)\n_HAND_PLUS_RE = re.compile(r\"^([2-9TJQKA])([2-9TJQKA])([so]?)\\+$\", re.I)\n_HAND_SPAN_RE = re.compile(\n    r\"^([2-9TJQKA])([2-9TJQKA])([so]?)-([2-9TJQKA])([2-9TJQKA])([so]?)$\", re.I)\n_PCT_RE = re.compile(r\"^(?:top[\\s_]*)?([0-9]+(?:\\.[0-9]+)?)\\s*%$\", re.I)\n\n\ndef _r(ch: str) -> int:\n    return RANK_TO_INT[ch.upper()]\n\n\ndef _expand_token(token: str) -> list:\n    t = token.strip()\n    if not t:\n        return []\n\n    m = _PCT_RE.match(t)\n    if m:\n        return top_percent(float(m.group(1)))\n\n    if _PAIR_RE.match(t):\n        return class_combos(t)\n\n    m = _PAIR_PLUS_RE.match(t)\n    if m:\n        lo = _r(m.group(1))\n        out = []\n        for r in range(lo, 13):\n            out += class_combos(RANK_CHARS[r] * 2)\n        return out\n\n    m = _PAIR_SPAN_RE.match(t)\n    if m:\n        a, b = _r(m.group(1)), _r(m.group(2))\n        lo, hi = min(a, b), max(a, b)\n        out = []\n        for r in range(lo, hi + 1):\n            out += class_combos(RANK_CHARS[r] * 2)\n        return out\n\n    m = _HAND_PLUS_RE.match(t)\n    if m:\n        hi, lo, kind = _r(m.group(1)), _r(m.group(2)), m.group(3).lower()\n        if hi < lo:\n            hi, lo = lo, hi\n        out = []\n        for k in range(lo, hi):\n            label = RANK_CHARS[hi] + RANK_CHARS[k]\n            out += _expand_token(label + kind) if kind else _expand_token(label)\n        return out\n\n    m = _HAND_SPAN_RE.match(t)\n    if m:\n        hi1, lo1, k1 = _r(m.group(1)), _r(m.group(2)), m.group(3).lower()\n        hi2, lo2, k2 = _r(m.group(4)), _r(m.group(5)), m.group(6).lower()\n        if hi1 != hi2:\n            raise RangeError(\"span %r must share a top card\" % t)\n        kind = k1 or k2\n        lo, hi = min(lo1, lo2), max(lo1, lo2)\n        out = []\n        for k in range(lo, hi + 1):\n            label = RANK_CHARS[hi1] + RANK_CHARS[k]\n            out += _expand_token(label + kind) if kind else _expand_token(label)\n        return out\n\n    m = _HAND_RE.match(t)\n    if m:\n        hi, lo, kind = m.group(1).upper(), m.group(2).upper(), m.group(3).lower()\n        if hi == lo:\n            return class_combos(hi + lo)\n        if kind:\n            return class_combos(hi + lo + kind)\n        return class_combos(hi + lo + \"s\") + class_combos(hi + lo + \"o\")\n\n    # exact combo, e.g. AsKd\n    try:\n        cards = parse_cards(t)\n        if len(cards) == 2:\n            return [make_combo(cards[0], cards[1])]\n    except Exception:\n        pass\n\n    raise RangeError(\"cannot parse range token %r\" % token)\n\n\ndef parse_range(text: str) -> dict:\n    \"\"\"Parse range notation into a {combo: weight} dict.\"\"\"\n    if not text or not text.strip():\n        return {}\n    out = {}\n    for part in re.split(r\"[,\\n]+\", text):\n        for token in part.split():\n            weight = 1.0\n            if \":\" in token:\n                token, _, w = token.partition(\":\")\n                try:\n                    weight = float(w)\n                except ValueError:\n                    raise RangeError(\"bad weight in %r\" % part)\n            for combo in _expand_token(token):\n                out[combo] = max(out.get(combo, 0.0), weight)\n    return out\n\n\ndef remove_blockers(weighted: dict, dead_cards) -> dict:\n    \"\"\"Drop combos that use any known or dead card.\"\"\"\n    dead = set(dead_cards)\n    return {c: w for c, w in weighted.items()\n            if c[0] not in dead and c[1] not in dead}\n\n\ndef combo_count(weighted: dict) -> float:\n    return sum(weighted.values())\n\n\ndef range_percent(weighted: dict) -> float:\n    return 100.0 * combo_count(weighted) / 1326.0\n\n\ndef to_class_summary(weighted: dict) -> str:\n    \"\"\"Collapse combos back into readable class notation.\"\"\"\n    by_class = {}\n    for combo in weighted:\n        by_class.setdefault(hand_class(combo), 0)\n        by_class[hand_class(combo)] += 1\n    labels = []\n    for label in all_hand_classes():\n        if label in by_class:\n            total = len(class_combos(label))\n            got = by_class[label]\n            labels.append(label if got == total else \"%s(%d/%d)\" % (label, got, total))\n    return \", \".join(labels)\n\n\n# -------------------------------------------------------------- strength ---\n\n_strength_cache = None\n\n\ndef hand_strength_table() -> dict:\n    \"\"\"{hand_class: equity vs a random hand}, from the cached chart.\"\"\"\n    global _strength_cache\n    if _strength_cache is None:\n        with open(_STRENGTH_PATH, \"r\", encoding=\"utf-8\") as fh:\n            _strength_cache = json.load(fh)\n    return _strength_cache\n\n\ndef ranked_hand_classes() -> list:\n    table = hand_strength_table()\n    return sorted(table, key=lambda h: -table[h])\n\n\ndef top_percent(pct: float) -> list:\n    \"\"\"Strongest pct% of the 1326 combos, by equity vs a random hand.\"\"\"\n    target = 1326.0 * pct / 100.0\n    out = []\n    for label in ranked_hand_classes():\n        combos = class_combos(label)\n        if out and len(out) + len(combos) > target:\n            break\n        out += combos\n        if len(out) >= target:\n            break\n    return out\n","pokerbrain/report.py":"\"\"\"Generate a self-contained HTML report from parsed hands.\n\nEverything (data, styles, script) is inlined into one file so the report\nworks offline, can be opened straight from disk, and can be emailed or kept\nalongside the session it describes.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime\nimport hashlib\nimport json\nimport os\n\nfrom . import analysis, grading, leaks, lessons, profiles, rangemodel, sessions, stats, template\nfrom .cards import card_str, cards_str\nfrom .model import FLOP, PREFLOP, RIVER, STREETS, TURN\nfrom .parsers import coinpoker\nfrom .ranges import parse_range, range_percent, remove_blockers\nfrom .stats import BENCHMARKS, STAT_ORDER\n\n# A new playing session starts after this long without a hand.\nSESSION_GAP_MINUTES = 90\n\n\ndef _decision_dict(d):\n    return {\n        \"street\": d.street,\n        \"verb\": d.action.verb,\n        \"amount\": round(d.action.amount, 2),\n        \"potBefore\": round(d.pot_before, 2),\n        \"potBB\": round(d.pot_before / d.bb, 1),\n        \"toCall\": round(d.to_call, 2),\n        \"potOdds\": round(100 * d.pot_odds, 1) if d.pot_odds is not None else None,\n        \"spr\": round(d.spr, 1) if d.spr is not None else None,\n        \"mdf\": round(100 * d.mdf, 0) if d.mdf is not None else None,\n        \"betPct\": round(d.bet_pct, 0) if d.bet_pct is not None else None,\n        \"reqFE\": round(100 * d.required_fold_equity, 0) if d.required_fold_equity is not None else None,\n        \"equity\": round(100 * d.equity, 1) if d.equity is not None else None,\n        \"evCall\": round(d.ev_of_call, 2) if d.ev_of_call is not None else None,\n        \"madeHand\": d.made_hand,\n        \"texture\": d.texture.get(\"label\", \"\") if d.texture else \"\",\n        \"effStack\": round(d.effective_stack, 2),\n    }\n\n\ndef _range_view(ranges):\n    return {street: {\n        \"pct\": round(range_percent(weighted), 1),\n        \"combos\": len(weighted),\n        \"summary\": rangemodel.describe_range(weighted, 12),\n    } for street, weighted in ranges.items()}\n\n\ndef _hand_payload(hand, hero_name=\"Hero\", equity_iters=4000, exact_limit=4000):\n    hero = hand.player(hero_name)\n    villain = rangemodel.main_villain(hand, hero_name)\n    ranges = {}\n    range_view = {}\n    spec = \"\"\n    if villain:\n        try:\n            ranges, spec = rangemodel.estimate_ranges(hand, villain, hero_name)\n            range_view = _range_view(ranges)\n        except Exception:\n            ranges = {}\n\n    try:\n        walked = analysis.walk(hand, hero_name, villain_range=ranges or None,\n                               equity_iters=equity_iters, exact_limit=exact_limit)\n    except Exception:\n        walked = []\n    decisions = [_decision_dict(d) for d in walked]\n    graded = grading.grade(hand, walked, hero_name)\n\n    street_actions = {}\n    for street in STREETS:\n        rows = []\n        for a in hand.street_actions(street):\n            p = hand.player(a.player)\n            rows.append({\n                \"player\": a.player,\n                \"pos\": p.position if p else \"\",\n                \"verb\": a.verb,\n                \"amount\": round(a.amount, 2),\n                \"isHero\": a.player == hero_name,\n            })\n        if rows:\n            street_actions[street] = rows\n\n    return {\n        \"id\": hand.hand_id,\n        \"time\": hand.timestamp,\n        \"sb\": hand.small_blind,\n        \"bb\": hand.big_blind,\n        \"ante\": hand.ante,\n        \"table\": hand.table,\n        \"buttonSeat\": hand.button_seat,\n        \"players\": [{\n            \"seat\": p.seat, \"name\": p.name, \"pos\": p.position,\n            \"stack\": round(p.stack, 2), \"stackBB\": round(p.stack / hand.bb_size, 1),\n            \"cards\": [card_str(c) for c in p.hole_cards],\n            \"net\": round(p.net, 2), \"netBB\": round(p.net / hand.bb_size, 1),\n            \"isHero\": p.is_hero, \"folded\": p.folded_street or \"\",\n            \"shownRank\": p.shown_rank,\n        } for p in sorted(hand.players, key=lambda x: x.seat)],\n        \"board\": [card_str(c) for c in hand.board],\n        \"streets\": street_actions,\n        \"pot\": round(hand.total_pot, 2),\n        \"rake\": round(hand.rake, 2),\n        \"heroNet\": round(hero.net, 2) if hero else 0,\n        \"heroNetBB\": round(hero.net / hand.bb_size, 1) if hero else 0,\n        \"currency\": hand.currency,\n        \"heroPos\": hero.position if hero else \"\",\n        \"heroCards\": [card_str(c) for c in hero.hole_cards] if hero else [],\n        \"finalStreet\": hand.final_street,\n        \"decisions\": decisions,\n        \"villain\": villain or \"\",\n        \"villainPos\": hand.player(villain).position if villain and hand.player(villain) else \"\",\n        \"villainCards\": [card_str(c) for c in hand.player(villain).hole_cards]\n                        if villain and hand.player(villain) and hand.player(villain).hole_cards else [],\n        \"villainRangeSpec\": spec,\n        \"ranges\": range_view,\n        \"grades\": graded[\"items\"],\n        \"goodBB\": graded[\"goodBB\"],\n        \"badBB\": graded[\"badBB\"],\n        \"raw\": hand.raw,\n        \"riverHeadsUp\": _river_heads_up(hand, hero_name),\n    }\n\n\ndef _river_heads_up(hand, hero_name):\n    if len(hand.board) < 5 or not hand.player(hero_name):\n        return False\n    alive = [p for p in hand.players\n             if not p.folded_street or STREETS.index(p.folded_street) >= STREETS.index(RIVER)]\n    return len(alive) == 2 and any(p.name == hero_name for p in alive)\n\n\ndef _stakes_label(hands):\n    \"\"\"'0.1/0.25 ante 0.04', or every stake played when there is more than one.\"\"\"\n    seen = []\n    for h in hands:\n        label = \"%g/%g%s\" % (h.small_blind, h.big_blind, (\" ante %g\" % h.ante) if h.ante else \"\")\n        if label not in seen:\n            seen.append(label)\n    return \" + \".join(seen)\n\n\ndef _when(hand):\n    try:\n        return datetime.datetime.strptime(hand.timestamp, \"%Y/%m/%d %H:%M:%S\")\n    except (TypeError, ValueError):\n        return None\n\n\ndef session_groups(hands, gap_minutes=SESSION_GAP_MINUTES):\n    \"\"\"Split time-ordered hands into playing sessions.\"\"\"\n    groups = []\n    last = None\n    for h in hands:\n        when = _when(h)\n        if (not groups or when is None or last is None\n                or (when - last).total_seconds() > gap_minutes * 60):\n            groups.append([])\n        groups[-1].append(h)\n        if when is not None:\n            last = when\n    return groups\n\n\ndef _stat_rows(line):\n    rows = []\n    if not line:\n        return rows\n    for name in STAT_ORDER:\n        counter = line.c.get(name)\n        if not counter or not counter.opp:\n            continue\n        lo, hi, label = BENCHMARKS[name]\n        rows.append({\n            \"key\": name, \"label\": label,\n            \"value\": round(counter.pct, 1),\n            \"act\": counter.act, \"opp\": counter.opp,\n            \"lo\": lo, \"hi\": hi,\n            \"thin\": counter.opp < 15,\n        })\n    return rows\n\n\ndef _highlight(payload, kind):\n    wanted = (\"good\",) if kind == \"good\" else (\"bad\", \"review\")\n    items = [g for g in payload.get(\"grades\", []) if g[\"kind\"] in wanted]\n    items.sort(key=lambda g: -g[\"bb\"])\n    return {\n        \"id\": payload[\"id\"],\n        \"pos\": payload[\"heroPos\"],\n        \"cards\": payload[\"heroCards\"],\n        \"board\": payload[\"board\"],\n        \"netBB\": payload[\"heroNetBB\"],\n        \"bb\": payload[\"goodBB\"] if kind == \"good\" else payload[\"badBB\"],\n        \"reasons\": [{\"kind\": g[\"kind\"], \"street\": g[\"street\"], \"text\": g[\"text\"]}\n                    for g in items],\n    }\n\n\ndef _session_payload(group, by_id, hero_name, top=5):\n    first, last = group[0], group[-1]\n    start, end = _when(first), _when(last)\n    net = sum(h.player(hero_name).net for h in group if h.player(hero_name))\n    net_bb = sum(h.player(hero_name).net / h.bb_size for h in group if h.player(hero_name))\n    sid = (start.strftime(\"%Y%m%d-%H%M\") if start else first.hand_id)\n    if start:\n        label = \"%s %d %s, %s\\u2013%s\" % (start.strftime(\"%a\"), start.day,\n                                          start.strftime(\"%b %Y\"),\n                                          start.strftime(\"%H:%M\"),\n                                          end.strftime(\"%H:%M\") if end else \"?\")\n    else:\n        label = first.timestamp or \"Session\"\n    payloads = [by_id[h.hand_id] for h in group if h.hand_id in by_id]\n    for p in payloads:\n        p[\"sessionId\"] = sid\n    bad = sorted((p for p in payloads if p.get(\"badBB\", 0) > 0),\n                 key=lambda p: -p[\"badBB\"])[:top]\n    good = sorted((p for p in payloads if p.get(\"goodBB\", 0) > 0),\n                  key=lambda p: -p[\"goodBB\"])[:top]\n    running, cumulative = 0.0, []\n    for h in group:\n        hero = h.player(hero_name)\n        if hero:\n            running += hero.net / h.bb_size\n        cumulative.append(round(running, 2))\n    findings = [{\n        \"title\": f.title, \"detail\": f.detail, \"severity\": f.severity,\n        \"confidence\": f.confidence, \"fix\": f.fix,\n    } for f in leaks.analyse(group, hero_name)[:6]]\n    out = {\n        \"id\": sid,\n        \"label\": label,\n        \"date\": start.strftime(\"%Y-%m-%d\") if start else \"\",\n        \"start\": first.timestamp,\n        \"end\": last.timestamp,\n        \"hands\": len(group),\n        \"handIds\": [h.hand_id for h in group],\n        \"netBB\": round(net_bb, 1),\n        \"netMoney\": round(net, 2),\n        \"bb100\": round(100 * net_bb / len(group), 1),\n        \"stakes\": _stakes_label(group),\n        \"split\": {k: round(v, 1) for k, v in leaks.showdown_split(group, hero_name).items()},\n        \"cumulative\": cumulative,\n        \"heroStats\": _stat_rows(stats.compute(group, hero_name=hero_name).get(\"Hero\")),\n        \"toFix\": [_highlight(p, \"bad\") for p in bad],\n        \"wellPlayed\": [_highlight(p, \"good\") for p in good],\n        \"mistakeBB\": round(sum(p.get(\"badBB\", 0) for p in payloads), 1),\n        \"goodBB\": round(sum(p.get(\"goodBB\", 0) for p in payloads), 1),\n        \"findings\": findings,\n        \"solvable\": [p[\"id\"] for p in payloads if p.get(\"riverHeadsUp\")],\n    }\n    out[\"lesson\"] = lessons.build(out, payloads)\n    return out\n\n\ndef deep_dive(raw, overrides=None, hero_name=\"Hero\", equity_iters=3000):\n    \"\"\"Re-run one hand's maths, optionally with the opponent's range replaced.\n\n    `overrides` maps a street to range notation (\"QQ+, AK\"). Streets left\n    blank keep the modelled estimate.\n    \"\"\"\n    hand = coinpoker.parse_hand(raw)\n    hero = hand.player(hero_name)\n    villain = rangemodel.main_villain(hand, hero_name)\n    ranges, spec = ({}, \"\")\n    if villain:\n        ranges, spec = rangemodel.estimate_ranges(hand, villain, hero_name)\n    dead = list(hero.hole_cards) if hero else []\n    used = {}\n    for street, text in (overrides or {}).items():\n        if not text or not text.strip():\n            continue\n        try:\n            weighted = parse_range(text)\n        except Exception as exc:\n            return {\"error\": \"%s range: %s\" % (street.capitalize(), exc)}\n        weighted = remove_blockers(weighted, dead + list(hand.board_at(street)))\n        if not weighted:\n            return {\"error\": \"%s range has no hands left once your cards and the \"\n                             \"board are removed.\" % street.capitalize()}\n        ranges[street] = weighted\n        used[street] = text.strip()\n    walked = analysis.walk(hand, hero_name, villain_range=ranges or None,\n                           equity_iters=equity_iters, exact_limit=20000)\n    graded = grading.grade(hand, walked, hero_name)\n    return {\n        \"decisions\": [_decision_dict(d) for d in walked],\n        \"grades\": graded[\"items\"],\n        \"goodBB\": graded[\"goodBB\"],\n        \"badBB\": graded[\"badBB\"],\n        \"ranges\": _range_view(ranges),\n        \"overrides\": used,\n        \"villainRangeSpec\": spec,\n    }\n\n\ndef build_payload(hands, hero_name=\"Hero\", hand_payloads=None):\n    lines = stats.compute(hands, hero_name=hero_name)\n    hero_line = lines.get(\"Hero\")\n    pool_line = lines.get(\"POOL\")\n\n    stat_rows = _stat_rows\n\n    if hand_payloads is None:\n        hand_payloads = [_hand_payload(h, hero_name) for h in hands]\n    by_id = {p[\"id\"]: p for p in hand_payloads}\n    session_list = [_session_payload(g, by_id, hero_name) for g in session_groups(hands)]\n\n    cumulative = []\n    running = 0.0\n    for h in hands:\n        hero = h.player(hero_name)\n        if hero:\n            running += hero.net / h.bb_size\n        cumulative.append(round(running, 2))\n\n    findings = []\n    for f in leaks.analyse(hands, hero_name):\n        findings.append({\n            \"title\": f.title, \"detail\": f.detail, \"severity\": f.severity,\n            \"confidence\": f.confidence, \"sample\": f.sample, \"fix\": f.fix,\n            \"hands\": f.hands,\n        })\n\n    chains = sessions.build_chains(hands, hero_name)\n    opponents = []\n    for chain, line in sessions.chain_stats(chains, min_hands=4):\n        opponents.append({\n            \"id\": chain.cid, \"table\": chain.table, \"seat\": chain.seat,\n            \"hands\": chain.hands, \"confidence\": chain.confidence,\n            \"vpip\": round(line.pct(\"vpip\"), 0) if line.pct(\"vpip\") is not None else None,\n            \"pfr\": round(line.pct(\"pfr\"), 0) if line.pct(\"pfr\") is not None else None,\n            \"af\": round(line.af, 2) if line.af is not None else None,\n            \"netBB\": round(line.bb_won, 1),\n        })\n\n    split = leaks.showdown_split(hands, hero_name)\n    net_money = sum(h.player(hero_name).net for h in hands if h.player(hero_name))\n    net_bb = sum(h.player(hero_name).net / h.bb_size for h in hands if h.player(hero_name))\n\n    return {\n        \"meta\": {\n            \"site\": hands[0].site if hands else \"\",\n            \"hands\": len(hands),\n            \"stakes\": _stakes_label(hands),\n            \"currency\": hands[0].currency if hands else \"\",\n            \"first\": hands[0].timestamp if hands else \"\",\n            \"last\": hands[-1].timestamp if hands else \"\",\n            \"netBB\": round(net_bb, 1),\n            \"netMoney\": round(net_money, 2),\n            \"bb100\": round(100 * net_bb / len(hands), 1) if hands else 0,\n            \"mixedStakes\": len({h.big_blind for h in hands}) > 1,\n        },\n        \"rules\": profiles.export_rules(),\n        \"split\": {k: round(v, 2) for k, v in split.items()},\n        \"cumulative\": cumulative,\n        \"heroStats\": stat_rows(hero_line),\n        \"poolStats\": stat_rows(pool_line),\n        \"byPosition\": [{\n            \"pos\": pos, \"hands\": line.hands,\n            \"vpip\": round(line.pct(\"vpip\"), 0) if line.pct(\"vpip\") is not None else None,\n            \"pfr\": round(line.pct(\"pfr\"), 0) if line.pct(\"pfr\") is not None else None,\n            \"bb100\": round(line.bb_per_100, 0),\n        } for pos, line in stats.compute_by_position(hands, hero_name=hero_name).items()],\n        \"findings\": findings,\n        \"opponents\": opponents,\n        \"sessions\": session_list,\n        \"hands\": hand_payloads,\n    }\n\n\n_PKG_DIR = os.path.dirname(os.path.abspath(__file__))\n\n\ndef package_source():\n    \"\"\"{relative path: text} for every file the in-browser analyser needs.\"\"\"\n    out = {}\n    for root, dirs, files in os.walk(_PKG_DIR):\n        dirs[:] = [d for d in dirs if d != \"__pycache__\"]\n        for name in files:\n            if not (name.endswith(\".py\") or name.endswith(\".json\")):\n                continue\n            if name in (\"__main__.py\", \"cli.py\"):\n                continue\n            full = os.path.join(root, name)\n            rel = os.path.relpath(full, os.path.dirname(_PKG_DIR)).replace(os.sep, \"/\")\n            with open(full, \"r\", encoding=\"utf-8\") as fh:\n                out[rel] = fh.read()\n    return out\n\n\ndef render(payload, standalone=True) -> str:\n    \"\"\"Render the report. standalone=False returns an Artifact-ready fragment.\"\"\"\n    payload = dict(payload)\n    if standalone:\n        payload[\"pysrc\"] = package_source()\n        digest = hashlib.sha1()\n        for rel in sorted(payload[\"pysrc\"]):\n            digest.update(rel.encode(\"utf-8\"))\n            digest.update(payload[\"pysrc\"][rel].encode(\"utf-8\"))\n        payload[\"buildId\"] = digest.hexdigest()[:12]\n    blob = json.dumps(payload, separators=(\",\", \":\"))\n    # Keep embedded source from closing the script tag it lives in.\n    blob = blob.replace(\"<\/\", \"<\\\\/\").replace(\"<\!--\", \"<\\\\!--\")\n    body = template.BODY.replace(\"/*__DATA__*/null\", blob)\n    if not standalone:\n        return body\n    return template.STANDALONE.replace(\"__BODY__\", body)\n\n\ndef write(hands, path, hero_name=\"Hero\", standalone=True):\n    payload = build_payload(hands, hero_name)\n    html = render(payload, standalone=standalone)\n    directory = os.path.dirname(os.path.abspath(path))\n    if directory and not os.path.isdir(directory):\n        os.makedirs(directory, exist_ok=True)\n    with open(path, \"w\", encoding=\"utf-8\") as fh:\n        fh.write(html)\n    return path, len(html)\n","pokerbrain/sessions.py":"\"\"\"Recover opponent continuity on sites that rotate anonymous IDs.\n\nCoinPoker issues every opponent a fresh ID each hand, so IDs are useless as\nhandles. But players do not teleport: the same seat, at the same table, in\nthe next hand, holding exactly the stack the previous hand left them with,\nis almost certainly the same person.\n\nChaining on (table, seat, expected stack) reconstructs opponents across a\nsession. The links are probabilistic \u2014 someone can leave and be replaced by\na player who happens to buy in for the same amount \u2014 so every chain carries\na confidence, and chains never span a gap in the hand sequence.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .model import POSITION_ORDER\n\n# A stack is considered to carry over if it matches within this many chips.\nSTACK_TOLERANCE = 0.02\n\n\nclass Chain:\n    \"\"\"A run of hands believed to be the same physical opponent.\"\"\"\n\n    __slots__ = (\"cid\", \"table\", \"seat\", \"entries\", \"links\", \"topups\")\n\n    def __init__(self, cid, table, seat):\n        self.cid = cid\n        self.table = table\n        self.seat = seat\n        self.entries = []   # (hand, player)\n        self.links = 0      # confident links made\n        self.topups = 0     # links where the stack changed unexplained\n\n    @property\n    def hands(self):\n        return len(self.entries)\n\n    @property\n    def net(self):\n        return sum(p.net for _, p in self.entries)\n\n    @property\n    def confidence(self):\n        if self.hands < 3:\n            return \"weak\"\n        ratio = self.links / max(1, self.hands - 1)\n        if ratio > 0.9 and self.topups == 0:\n            return \"strong\"\n        return \"moderate\" if ratio > 0.6 else \"weak\"\n\n    def __repr__(self):\n        return \"<Chain %s t%s seat%d %dh %s>\" % (\n            self.cid, self.table, self.seat, self.hands, self.confidence)\n\n\ndef _sort_key(hand):\n    try:\n        return (hand.timestamp, int(hand.hand_id))\n    except (TypeError, ValueError):\n        return (hand.timestamp, hand.hand_id)\n\n\ndef build_chains(hands, hero_name=\"Hero\"):\n    \"\"\"Link opponents across consecutive hands. Returns a list of Chains.\"\"\"\n    by_table = {}\n    for h in hands:\n        by_table.setdefault(h.table, []).append(h)\n\n    chains = []\n    counter = 0\n\n    for table, table_hands in by_table.items():\n        table_hands = sorted(table_hands, key=_sort_key)\n        # active[seat] = (chain, expected_stack_for_next_hand)\n        active = {}\n        for hand in table_hands:\n            seen_seats = set()\n            for p in hand.players:\n                if p.name == hero_name:\n                    continue\n                seen_seats.add(p.seat)\n                prior = active.get(p.seat)\n                linked = False\n                topup = False\n                if prior:\n                    chain, expected = prior\n                    if abs(p.stack - expected) <= STACK_TOLERANCE:\n                        linked = True\n                    elif p.stack > expected and (p.stack - expected) > STACK_TOLERANCE:\n                        # Could be a top-up by the same player, or a new player.\n                        # Only accept it as the same player if the seat was\n                        # never vacated, and mark it as uncertain.\n                        linked = True\n                        topup = True\n                if linked:\n                    chain = prior[0]\n                    chain.links += 1\n                    if topup:\n                        chain.topups += 1\n                else:\n                    counter += 1\n                    chain = Chain(\"P%03d\" % counter, table, p.seat)\n                    chains.append(chain)\n                chain.entries.append((hand, p))\n                active[p.seat] = (chain, p.stack + p.net)\n\n            # Seats that did not appear this hand have been vacated.\n            for seat in list(active):\n                if seat not in seen_seats:\n                    del active[seat]\n\n    return chains\n\n\ndef chain_stats(chains, min_hands=5):\n    \"\"\"HUD stats for each reconstructed opponent with enough hands.\"\"\"\n    from .stats import StatLine, accumulate\n\n    out = []\n    for chain in chains:\n        if chain.hands < min_hands:\n            continue\n        line = StatLine(chain.cid)\n        for hand, player in chain.entries:\n            single = {}\n            accumulate(hand, single, hero_name=player.name)\n            src = single.get(\"Hero\")\n            if not src:\n                continue\n            line.hands += 1\n            line.net += player.net\n            line.bb_won += player.net / hand.bb_size\n            for name, counter in src.c.items():\n                line.c[name].opp += counter.opp\n                line.c[name].act += counter.act\n            line.postflop_bets += src.postflop_bets\n            line.postflop_raises += src.postflop_raises\n            line.postflop_calls += src.postflop_calls\n            line.postflop_folds += src.postflop_folds\n        out.append((chain, line))\n    out.sort(key=lambda t: -t[0].hands)\n    return out\n\n\ndef format_chains(chains, min_hands=5) -> str:\n    rows = []\n    usable = [c for c in chains if c.hands >= min_hands]\n    rows.append(\"OPPONENT CONTINUITY (seat + stack chaining)\")\n    rows.append(\"  %d raw seat-occupancies collapsed into %d chains; %d have %d+ hands\"\n                % (sum(c.hands for c in chains), len(chains), len(usable), min_hands))\n    if not usable:\n        rows.append(\"  No chain reached the threshold - too few consecutive hands.\")\n        return \"\\n\".join(rows)\n    rows.append(\"\")\n    rows.append(\"  %-6s %-8s %5s %6s %8s %7s %7s %7s\"\n                % (\"id\", \"table\", \"seat\", \"hands\", \"conf\", \"VPIP\", \"PFR\", \"net bb\"))\n    for chain, line in chain_stats(chains, min_hands):\n        v = line.pct(\"vpip\")\n        p = line.pct(\"pfr\")\n        rows.append(\"  %-6s %-8s %5d %6d %8s %6s%% %6s%% %+7.1f\"\n                    % (chain.cid, chain.table, chain.seat, chain.hands, chain.confidence,\n                       \"%.0f\" % v if v is not None else \"-\",\n                       \"%.0f\" % p if p is not None else \"-\",\n                       line.bb_won))\n    return \"\\n\".join(rows)\n","pokerbrain/solver.py":"\"\"\"A heads-up river solver.\n\nFinds equilibrium (\"GTO\") strategies for a river spot: both players' ranges,\nthe board, the pot and the stacks are given, and the solver works out how\noften each hand should check, bet, call, fold or raise so that neither player\ncan gain by changing strategy.\n\nMethod: CFR+ (counterfactual regret minimisation, the \"plus\" variant with\nnon-negative regrets and linearly weighted averaging) - the same family of\nalgorithms used by commercial solvers. The river has no cards left to come,\nso the whole game tree is small and can be solved exactly. Earlier streets\nare not solved here: their trees include every future card and need compiled\nsoftware.\n\nShowdown values are computed range-against-range with card removal handled\nexactly (two hands that share a card never meet), using a strength-sorted\nsweep so each evaluation is linear in the range sizes.\n\nMoney convention: every value is chips at the end of the hand minus chips the\nplayer had when the river began. The pot already in the middle is shared out,\nso the two players' values always add up to the starting pot.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .cards import card_rank, card_str, parse_cards\nfrom .evaluator import evaluate\nfrom .model import ALLIN, BET, CALL, CHECK, FOLD, POST, PREFLOP, RAISE, RETURN, RIVER, STREETS, TURN\nfrom .ranges import RANK_CHARS, hand_class, make_combo, parse_range, remove_blockers\n\nOOP, IP = 0, 1\nNAMES = (\"OOP\", \"IP\")\n\nDEFAULT_BETS = (0.33, 0.75)\nDEFAULT_RAISES = (1.0,)\n\nPOSTFLOP_ORDER = [\"SB\", \"BB\", \"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"MP1\", \"HJ\", \"CO\", \"BTN\"]\n\n\nclass Node:\n    __slots__ = (\"kind\", \"player\", \"actions\", \"amounts\", \"children\", \"oop_in\", \"ip_in\",\n                 \"path\", \"regret\", \"strat_sum\", \"nid\")\n\n    def __init__(self, kind, player, oop_in, ip_in, path):\n        self.kind = kind          # \"act\", \"fold\" or \"show\"\n        self.player = player      # who acts (act) or who folded (fold)\n        self.oop_in = oop_in\n        self.ip_in = ip_in\n        self.path = path\n        self.actions = []\n        self.amounts = []         # chips put in by each action\n        self.children = []\n        self.regret = None\n        self.strat_sum = None\n        self.nid = -1\n\n\ndef _pct_label(prefix, frac):\n    return \"%s %d%%\" % (prefix, round(frac * 100))\n\n\ndef build_tree(pot, stack, oop_bets=DEFAULT_BETS, ip_bets=DEFAULT_BETS,\n               raises=DEFAULT_RAISES, max_raises=1):\n    \"\"\"The river betting tree. Stacks are effective (both players the same).\"\"\"\n    nodes = []\n\n    def add(node):\n        node.nid = len(nodes)\n        nodes.append(node)\n        return node\n\n    def rec(player, oop_in, ip_in, facing, raises_made, path, after_check):\n        node = add(Node(\"act\", player, oop_in, ip_in, path))\n        other = 1 - player\n        my_in = oop_in if player == OOP else ip_in\n        remaining = stack - my_in\n        pot_now = pot + oop_in + ip_in\n\n        def put(amount):\n            return (oop_in + amount, ip_in) if player == OOP else (oop_in, ip_in + amount)\n\n        seen = set()\n        if facing <= 1e-9:\n            node.actions.append(\"Check\")\n            node.amounts.append(0.0)\n            if player == OOP:\n                node.children.append(rec(IP, oop_in, ip_in, 0.0, raises_made,\n                                          path + [\"Check\"], True))\n            else:\n                node.children.append(add(Node(\"show\", None, oop_in, ip_in, path + [\"Check\"])))\n            for frac in (oop_bets if player == OOP else ip_bets):\n                amount = min(remaining, frac * pot_now)\n                key = round(amount, 6)\n                if amount <= 1e-9 or key in seen:\n                    continue\n                seen.add(key)\n                label = \"All-in\" if amount >= remaining - 1e-9 else _pct_label(\"Bet\", frac)\n                o, i = put(amount)\n                node.actions.append(label)\n                node.amounts.append(amount)\n                node.children.append(rec(other, o, i, amount, raises_made, path + [label], False))\n        else:\n            node.actions.append(\"Fold\")\n            node.amounts.append(0.0)\n            f = add(Node(\"fold\", player, oop_in, ip_in, path + [\"Fold\"]))\n            node.children.append(f)\n            call = min(facing, remaining)\n            o, i = put(call)\n            node.actions.append(\"Call\")\n            node.amounts.append(call)\n            node.children.append(add(Node(\"show\", None, o, i, path + [\"Call\"])))\n            if raises_made < max_raises and remaining > facing + 1e-9:\n                for frac in raises:\n                    amount = min(remaining, facing + frac * (pot_now + facing))\n                    key = round(amount, 6)\n                    if key in seen:\n                        continue\n                    seen.add(key)\n                    label = \"All-in\" if amount >= remaining - 1e-9 else _pct_label(\"Raise\", frac)\n                    o, i = put(amount)\n                    node.actions.append(label)\n                    node.amounts.append(amount)\n                    node.children.append(rec(other, o, i, amount - facing, raises_made + 1,\n                                             path + [label], False))\n        return node\n\n    root = rec(OOP, 0.0, 0.0, 0.0, 0, [], False)\n    return root, nodes\n\n\nclass RiverSolver:\n    def __init__(self, board, oop_range, ip_range, pot, stack,\n                 oop_bets=DEFAULT_BETS, ip_bets=DEFAULT_BETS, raises=DEFAULT_RAISES,\n                 max_raises=1):\n        if isinstance(board, str):\n            board = parse_cards(board)\n        if len(board) != 5:\n            raise ValueError(\"the river solver needs a full five-card board\")\n        if pot <= 0:\n            raise ValueError(\"the pot must be positive\")\n        if stack < 0:\n            raise ValueError(\"the stack cannot be negative\")\n        self.board = list(board)\n        self.pot = float(pot)\n        self.stack = float(stack)\n        ranges = []\n        for spec in (oop_range, ip_range):\n            weighted = parse_range(spec) if isinstance(spec, str) else dict(spec)\n            weighted = {c: w for c, w in remove_blockers(weighted, self.board).items() if w > 0}\n            if not weighted:\n                raise ValueError(\"a range is empty once the board cards are removed\")\n            ranges.append(weighted)\n        self.hands = [sorted(r) for r in ranges]\n        self.weights = [[ranges[p][c] for c in self.hands[p]] for p in (OOP, IP)]\n        self.strength = [[evaluate(list(c) + self.board) for c in self.hands[p]] for p in (OOP, IP)]\n        self.order = [sorted(range(len(self.hands[p])), key=lambda i, p=p: self.strength[p][i])\n                      for p in (OOP, IP)]\n        index = [{c: i for i, c in enumerate(self.hands[p])} for p in (OOP, IP)]\n        self.same = [[index[1 - p].get(c, -1) for c in self.hands[p]] for p in (OOP, IP)]\n        self.sizes = {\"oop_bets\": list(oop_bets), \"ip_bets\": list(ip_bets),\n                      \"raises\": list(raises), \"max_raises\": max_raises}\n        self.root, self.nodes = build_tree(self.pot, self.stack, oop_bets, ip_bets,\n                                           raises, max_raises)\n        for n in self.nodes:\n            if n.kind == \"act\":\n                h = len(self.hands[n.player])\n                n.regret = [[0.0] * h for _ in n.actions]\n                n.strat_sum = [[0.0] * h for _ in n.actions]\n        self.iterations = 0\n        self.pairs = self._pair_weight()\n\n    # ------------------------------------------------------------ maths --\n    def _pair_weight(self):\n        \"\"\"Total weight of all non-conflicting (OOP hand, IP hand) pairs.\"\"\"\n        valid = self._valid(OOP, self.weights[IP])\n        return sum(w * v for w, v in zip(self.weights[OOP], valid))\n\n    def _valid(self, p, reach_o):\n        \"\"\"Opponent reach that does not share a card with each of p's hands.\"\"\"\n        o = 1 - p\n        card = [0.0] * 52\n        total = 0.0\n        for (c1, c2), r in zip(self.hands[o], reach_o):\n            if r:\n                total += r\n                card[c1] += r\n                card[c2] += r\n        same = self.same[p]\n        out = []\n        for h, (c1, c2) in enumerate(self.hands[p]):\n            j = same[h]\n            out.append(total - card[c1] - card[c2] + (reach_o[j] if j >= 0 else 0.0))\n        return out\n\n    def _showdown(self, p, reach_o, win, lose, tie):\n        o = 1 - p\n        hp, ho = self.hands[p], self.hands[o]\n        sp, so = self.strength[p], self.strength[o]\n        op, oo = self.order[p], self.order[o]\n        n_p, n_o = len(op), len(oo)\n        weaker = [0.0] * n_p\n        stronger = [0.0] * n_p\n\n        acc, cards, j, i = 0.0, [0.0] * 52, 0, 0\n        while i < n_p:\n            s = sp[op[i]]\n            while j < n_o and so[oo[j]] < s:\n                r = reach_o[oo[j]]\n                if r:\n                    c1, c2 = ho[oo[j]]\n                    acc += r\n                    cards[c1] += r\n                    cards[c2] += r\n                j += 1\n            while i < n_p and sp[op[i]] == s:\n                h = op[i]\n                c1, c2 = hp[h]\n                weaker[h] = acc - cards[c1] - cards[c2]\n                i += 1\n\n        acc, cards, j, i = 0.0, [0.0] * 52, n_o - 1, n_p - 1\n        while i >= 0:\n            s = sp[op[i]]\n            while j >= 0 and so[oo[j]] > s:\n                r = reach_o[oo[j]]\n                if r:\n                    c1, c2 = ho[oo[j]]\n                    acc += r\n                    cards[c1] += r\n                    cards[c2] += r\n                j -= 1\n            while i >= 0 and sp[op[i]] == s:\n                h = op[i]\n                c1, c2 = hp[h]\n                stronger[h] = acc - cards[c1] - cards[c2]\n                i -= 1\n\n        valid = self._valid(p, reach_o)\n        return [w * win - l * lose + (v - w - l) * tie\n                for w, l, v in zip(weaker, stronger, valid)]\n\n    def _terminal(self, node, p, reach_o):\n        my_in = node.oop_in if p == OOP else node.ip_in\n        if node.kind == \"fold\":\n            folder_in = node.oop_in if node.player == OOP else node.ip_in\n            amount = -my_in if node.player == p else self.pot + folder_in\n            return [v * amount for v in self._valid(p, reach_o)]\n        return self._showdown(p, reach_o, self.pot + my_in, my_in, self.pot / 2.0)\n\n    @staticmethod\n    def _current(node):\n        n_a = len(node.actions)\n        h = len(node.regret[0])\n        out = [[0.0] * h for _ in range(n_a)]\n        for k in range(h):\n            total = 0.0\n            for a in range(n_a):\n                r = node.regret[a][k]\n                if r > 0:\n                    total += r\n            if total > 0:\n                for a in range(n_a):\n                    r = node.regret[a][k]\n                    out[a][k] = r / total if r > 0 else 0.0\n            else:\n                u = 1.0 / n_a\n                for a in range(n_a):\n                    out[a][k] = u\n        return out\n\n    @staticmethod\n    def _average(node):\n        n_a = len(node.actions)\n        h = len(node.strat_sum[0])\n        out = [[0.0] * h for _ in range(n_a)]\n        for k in range(h):\n            total = sum(node.strat_sum[a][k] for a in range(n_a))\n            for a in range(n_a):\n                out[a][k] = node.strat_sum[a][k] / total if total > 0 else 1.0 / n_a\n        return out\n\n    def _cfr(self, node, p, reach_p, reach_o, weight):\n        if node.kind != \"act\":\n            return self._terminal(node, p, reach_o)\n        strat = self._current(node)\n        n_a = len(node.actions)\n        if node.player == p:\n            values = [self._cfr(child, p, [r * s for r, s in zip(reach_p, strat[a])],\n                                reach_o, weight)\n                      for a, child in enumerate(node.children)]\n            h = len(reach_p)\n            node_val = [sum(strat[a][k] * values[a][k] for a in range(n_a)) for k in range(h)]\n            for a in range(n_a):\n                reg, ss, va, st = node.regret[a], node.strat_sum[a], values[a], strat[a]\n                for k in range(h):\n                    r = reg[k] + va[k] - node_val[k]\n                    reg[k] = r if r > 0 else 0.0\n                    ss[k] += weight * reach_p[k] * st[k]\n            return node_val\n        total = None\n        for a, child in enumerate(node.children):\n            vals = self._cfr(child, p, reach_p,\n                             [r * s for r, s in zip(reach_o, strat[a])], weight)\n            total = vals if total is None else [x + y for x, y in zip(total, vals)]\n        return total\n\n    def iterate(self, n=1):\n        for _ in range(n):\n            self.iterations += 1\n            t = self.iterations\n            for p in (OOP, IP):\n                self._cfr(self.root, p, list(self.weights[p]), list(self.weights[1 - p]), t)\n\n    # ------------------------------------------------------- evaluation --\n    def _values(self, node, p, reach_o, best_response):\n        \"\"\"Per-hand values for p: p plays best response or average strategy;\n        the opponent always plays its average strategy.\"\"\"\n        if node.kind != \"act\":\n            return self._terminal(node, p, reach_o)\n        avg = self._average(node)\n        if node.player == p:\n            children = [self._values(c, p, reach_o, best_response) for c in node.children]\n            h = len(self.hands[p])\n            if best_response:\n                return [max(children[a][k] for a in range(len(children))) for k in range(h)]\n            return [sum(avg[a][k] * children[a][k] for a in range(len(children)))\n                    for k in range(h)]\n        total = None\n        for a, child in enumerate(node.children):\n            vals = self._values(child, p, [r * s for r, s in zip(reach_o, avg[a])], best_response)\n            total = vals if total is None else [x + y for x, y in zip(total, vals)]\n        return total\n\n    def expected_values(self):\n        \"\"\"Average chips each player wins from the river, per hand dealt.\"\"\"\n        out = {}\n        for p in (OOP, IP):\n            vals = self._values(self.root, p, list(self.weights[1 - p]), False)\n            out[NAMES[p]] = sum(w * v for w, v in zip(self.weights[p], vals)) / self.pairs\n        return out\n\n    def exploitability(self):\n        \"\"\"How much a perfect counter-strategy would gain, as a fraction of the pot.\n\n        At a true equilibrium this is zero; commercial solvers typically stop\n        between 0.3% and 1% of the pot.\n        \"\"\"\n        br = 0.0\n        for p in (OOP, IP):\n            vals = self._values(self.root, p, list(self.weights[1 - p]), True)\n            br += sum(w * v for w, v in zip(self.weights[p], vals)) / self.pairs\n        return max(0.0, (br - self.pot) / 2.0) / self.pot\n\n    def solve(self, iterations=300, target=0.005, check_every=25, on_progress=None):\n        done = 0\n        expl = None\n        while done < iterations:\n            step = min(check_every, iterations - done)\n            self.iterate(step)\n            done += step\n            expl = self.exploitability()\n            if on_progress:\n                on_progress(done, iterations, expl)\n            if expl <= target:\n                break\n        return expl\n\n    # ------------------------------------------------------------ output --\n    def strategy(self, precision=3):\n        \"\"\"Average strategy at every decision, with range-level summaries.\"\"\"\n        out = []\n        reach = {self.root.nid: (list(self.weights[OOP]), list(self.weights[IP]))}\n        for node in self.nodes:\n            if node.kind != \"act\":\n                continue\n            r_oop, r_ip = reach[node.nid]\n            avg = self._average(node)\n            p = node.player\n            mine = r_oop if p == OOP else r_ip\n            base = sum(self.weights[p])\n            reached = sum(mine)\n            freqs = [sum(m * avg[a][k] for k, m in enumerate(mine)) / reached if reached else 0.0\n                     for a in range(len(node.actions))]\n            classes = {}\n            for k, combo in enumerate(self.hands[p]):\n                if mine[k] <= 0:\n                    continue\n                label = hand_class(combo)\n                row = classes.setdefault(label, [0.0] * (len(node.actions) + 1))\n                for a in range(len(node.actions)):\n                    row[a] += mine[k] * avg[a][k]\n                row[-1] += mine[k]\n            class_freqs = {label: [round(v / row[-1], precision) for v in row[:-1]]\n                           for label, row in classes.items() if row[-1] > 0}\n            hands = {}\n            for k, combo in enumerate(self.hands[p]):\n                hands[card_str(combo[1]) + card_str(combo[0])] = [\n                    round(avg[a][k], precision) for a in range(len(node.actions))]\n            out.append({\n                \"id\": node.nid,\n                \"player\": NAMES[p],\n                \"path\": list(node.path),\n                \"pot\": round(self.pot + node.oop_in + node.ip_in, 2),\n                \"actions\": list(node.actions),\n                \"amounts\": [round(x, 2) for x in node.amounts],\n                \"freqs\": [round(f, precision) for f in freqs],\n                \"reachPct\": round(100.0 * reached / base, 1) if base else 0.0,\n                \"classes\": class_freqs,\n                \"hands\": hands,\n            })\n            for a, child in enumerate(node.children):\n                if child.kind != \"act\":\n                    continue\n                if p == OOP:\n                    reach[child.nid] = ([m * avg[a][k] for k, m in enumerate(r_oop)], r_ip)\n                else:\n                    reach[child.nid] = (r_oop, [m * avg[a][k] for k, m in enumerate(r_ip)])\n        return out\n\n    def result(self):\n        ev = self.expected_values()\n        return {\n            \"board\": [card_str(c) for c in self.board],\n            \"pot\": self.pot,\n            \"stack\": self.stack,\n            \"sizes\": self.sizes,\n            \"combos\": {\"OOP\": len(self.hands[OOP]), \"IP\": len(self.hands[IP])},\n            \"iterations\": self.iterations,\n            \"exploitabilityPct\": round(100 * self.exploitability(), 2),\n            \"ev\": {k: round(v, 3) for k, v in ev.items()},\n            \"evPct\": {k: round(100 * v / self.pot, 1) for k, v in ev.items()},\n            \"nodes\": self.strategy(),\n        }\n\n    def walk_actions(self, moves):\n        \"\"\"Follow a list of (player, label or amount) moves from the root.\"\"\"\n        node = self.root\n        visited = []\n        for player, move in moves:\n            if node.kind != \"act\" or node.player != player:\n                break\n            if isinstance(move, str):\n                if move not in node.actions:\n                    break\n                a = node.actions.index(move)\n            else:\n                candidates = [i for i, lab in enumerate(node.actions)\n                              if lab not in (\"Check\", \"Fold\", \"Call\")]\n                if not candidates:\n                    break\n                a = min(candidates, key=lambda i: abs(node.amounts[i] - move))\n            visited.append((node, a))\n            node = node.children[a]\n        return visited\n\n\n# ------------------------------------------------ solving a real hand ---\n\ndef _invested_before(hand, name, street):\n    idx = STREETS.index(street)\n    total = 0.0\n    for a in hand.actions:\n        if a.player != name or STREETS.index(a.street) >= idx:\n            continue\n        if a.verb == RETURN:\n            total -= a.amount\n        elif a.verb in (POST, \"straddle\", CALL, BET, RAISE, ALLIN):\n            total += a.amount\n    return total\n\n\ndef river_spot(hand, hero_name=\"Hero\"):\n    \"\"\"Everything needed to solve the river of a real hand, or (None, reason).\"\"\"\n    from . import rangemodel\n\n    if len(hand.board) < 5:\n        return None, \"This hand didn't reach the river.\"\n    alive = [p for p in hand.players\n             if not p.folded_street or STREETS.index(p.folded_street) >= STREETS.index(RIVER)]\n    if len(alive) != 2 or not any(p.name == hero_name for p in alive):\n        return None, (\"Only heads-up rivers can be solved - %d players saw this river.\"\n                      % len(alive))\n    hero = hand.player(hero_name)\n    villain = [p for p in alive if p.name != hero_name][0]\n    if len(hero.hole_cards) != 2:\n        return None, \"Your hole cards aren't in the hand history.\"\n\n    def rank(p):\n        return POSTFLOP_ORDER.index(p.position) if p.position in POSTFLOP_ORDER else 99\n\n    oop, ip = sorted([hero, villain], key=rank)\n\n    v_ranges, _ = rangemodel.estimate_ranges(hand, villain.name, hero_name)\n    h_ranges, _ = rangemodel.estimate_ranges(hand, hero_name, villain.name)\n    v_range = dict(v_ranges.get(TURN) or v_ranges.get(PREFLOP) or {})\n    h_range = dict(h_ranges.get(TURN) or h_ranges.get(PREFLOP) or {})\n    hero_combo = make_combo(*hero.hole_cards)\n    h_range[hero_combo] = max(h_range.get(hero_combo, 0.0), 1.0)\n    v_range = remove_blockers(v_range, list(hero.hole_cards))\n\n    pot = hand.pot_before_street(RIVER)\n    stack = min(p.stack - _invested_before(hand, p.name, RIVER) for p in (hero, villain))\n    stack = max(0.0, stack)\n\n    # The river as it was played, in solver terms. An all-in that only\n    # matches the bet in front of it is a call.\n    moves = []\n    first_bet = None\n    street_in = {OOP: 0.0, IP: 0.0}\n    for a in hand.street_actions(RIVER):\n        who = OOP if a.player == oop.name else IP\n        if a.verb == CHECK:\n            moves.append((who, \"Check\"))\n        elif a.verb == FOLD:\n            moves.append((who, \"Fold\"))\n        elif a.verb == CALL:\n            moves.append((who, \"Call\"))\n            street_in[who] += a.amount\n        elif a.verb in (BET, RAISE, ALLIN):\n            level = street_in[who] + a.amount\n            if a.verb == ALLIN and level <= street_in[1 - who] + 1e-9:\n                moves.append((who, \"Call\"))\n            else:\n                if first_bet is None:\n                    first_bet = a.amount / (pot + street_in[OOP] + street_in[IP])\n                moves.append((who, a.amount))\n            street_in[who] = level\n\n    bets = sorted(set(DEFAULT_BETS) | ({round(first_bet, 2)} if first_bet and first_bet < 3 else set()))\n    return {\n        \"board\": list(hand.board),\n        \"oop\": oop.name, \"ip\": ip.name,\n        \"oopPos\": oop.position, \"ipPos\": ip.position,\n        \"heroSide\": OOP if hero is oop else IP,\n        \"heroCombo\": hero_combo,\n        \"villainCards\": list(villain.hole_cards),\n        \"oopRange\": h_range if hero is oop else v_range,\n        \"ipRange\": v_range if hero is oop else h_range,\n        \"pot\": round(pot, 4),\n        \"stack\": round(stack, 4),\n        \"bets\": bets,\n        \"moves\": moves,\n        \"bb\": hand.bb_size,\n    }, None\n\n\ndef prepare_hand(hand, hero_name=\"Hero\"):\n    \"\"\"(solver, spot) ready to iterate for a hand's river, or (None, error).\"\"\"\n    spot, reason = river_spot(hand, hero_name)\n    if spot is None:\n        return None, reason\n    if spot[\"stack\"] <= 0:\n        return None, \"Someone was already all-in before the river - there is nothing left to decide.\"\n    s = RiverSolver(spot[\"board\"], spot[\"oopRange\"], spot[\"ipRange\"],\n                    spot[\"pot\"], spot[\"stack\"], oop_bets=spot[\"bets\"], ip_bets=spot[\"bets\"])\n    return (s, spot), None\n\n\ndef describe_hand(s, spot):\n    \"\"\"The solved spot, plus what the solver does with the hero's own hand.\"\"\"\n    result = s.result()\n    hero_side = spot[\"heroSide\"]\n    combo = spot[\"heroCombo\"]\n    hero_key = card_str(combo[1]) + card_str(combo[0])\n    by_id = {n[\"id\"]: n for n in result[\"nodes\"]}\n    line = []\n    for node, a in s.walk_actions(spot[\"moves\"]):\n        info = by_id[node.nid]\n        entry = {\"nodeId\": node.nid, \"player\": NAMES[node.player],\n                 \"path\": list(node.path), \"actions\": info[\"actions\"],\n                 \"chosen\": node.actions[a], \"range\": info[\"freqs\"]}\n        if node.player == hero_side:\n            entry[\"hero\"] = info[\"hands\"].get(hero_key)\n        line.append(entry)\n    result.update({\n        \"spot\": {\n            \"oop\": \"You\" if hero_side == OOP else \"Them\",\n            \"ip\": \"You\" if hero_side == IP else \"Them\",\n            \"oopPos\": spot[\"oopPos\"], \"ipPos\": spot[\"ipPos\"],\n            \"heroSide\": NAMES[hero_side],\n            \"heroHand\": hero_key,\n            \"villainCards\": [card_str(c) for c in spot[\"villainCards\"]],\n            \"potBB\": round(spot[\"pot\"] / spot[\"bb\"], 1),\n            \"stackBB\": round(spot[\"stack\"] / spot[\"bb\"], 1),\n            \"bb\": spot[\"bb\"],\n        },\n        \"line\": line,\n    })\n    return result\n\n\ndef solve_hand(hand, hero_name=\"Hero\", iterations=300, target=0.005, on_progress=None):\n    \"\"\"Solve a hand's river and describe the solver's play with the hero's hand.\"\"\"\n    prepared, reason = prepare_hand(hand, hero_name)\n    if prepared is None:\n        return {\"error\": reason}\n    s, spot = prepared\n    s.solve(iterations, target, on_progress=on_progress)\n    return describe_hand(s, spot)\n\n\ndef grid_order():\n    \"\"\"The 13x13 hand-class grid, row by row (AA top-left).\"\"\"\n    ranks = RANK_CHARS[::-1]\n    rows = []\n    for i, r1 in enumerate(ranks):\n        row = []\n        for j, r2 in enumerate(ranks):\n            if i == j:\n                row.append(r1 + r2)\n            elif i < j:\n                row.append(r1 + r2 + \"s\")\n            else:\n                row.append(r2 + r1 + \"o\")\n        rows.append(row)\n    return rows\n\n\ndef format_text(result):\n    lines = []\n    lines.append(\"River %s   pot %.2f   stack %.2f   (%d vs %d combos)\" % (\n        \" \".join(result[\"board\"]), result[\"pot\"], result[\"stack\"],\n        result[\"combos\"][\"OOP\"], result[\"combos\"][\"IP\"]))\n    lines.append(\"%d iterations, exploitability %.2f%% of the pot\" % (\n        result[\"iterations\"], result[\"exploitabilityPct\"]))\n    lines.append(\"EV: OOP %.1f%% of pot, IP %.1f%% of pot\" % (\n        result[\"evPct\"][\"OOP\"], result[\"evPct\"][\"IP\"]))\n    for n in result[\"nodes\"]:\n        where = \" > \".join(n[\"path\"]) or \"start of river\"\n        freqs = \", \".join(\"%s %d%%\" % (a, round(100 * f)) for a, f in zip(n[\"actions\"], n[\"freqs\"]))\n        lines.append(\"  %-3s after [%s] (range reaches %.0f%%): %s\" % (\n            n[\"player\"], where, n[\"reachPct\"], freqs))\n    for step in result.get(\"line\", []):\n        if \"hero\" in step and step[\"hero\"]:\n            mix = \", \".join(\"%s %d%%\" % (a, round(100 * f))\n                            for a, f in zip(step[\"actions\"], step[\"hero\"]))\n            lines.append(\"  YOUR HAND %s at [%s]: solver plays %s; you chose %s\" % (\n                result[\"spot\"][\"heroHand\"], \" > \".join(step[\"path\"]) or \"start\",\n                mix, step[\"chosen\"]))\n    return \"\\n\".join(lines)\n","pokerbrain/stats.py":"\"\"\"HUD-style statistics computed from parsed hands.\n\nEvery statistic is stored as an (opportunities, actions) pair so that small\nsamples stay visible: a 100% c-bet on 2 opportunities should never be\npresented the same way as 100% on 200.\n\nOn sites that rotate anonymous player IDs every hand (CoinPoker does), the\nper-opponent view is meaningless, so the important aggregate is the *pool*:\nevery non-hero player merged into one profile, optionally split by position.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import defaultdict\n\nfrom .model import (\n    ALLIN, BET, CALL, CHECK, FLOP, FOLD, POST, PREFLOP, RAISE, RETURN, RIVER,\n    STRADDLE, TURN, POSITION_ORDER,\n)\n\nHERO = \"Hero\"\nPOOL = \"POOL\"\n\n\nclass Counter:\n    \"\"\"An (opportunities, actions) pair.\"\"\"\n\n    __slots__ = (\"opp\", \"act\")\n\n    def __init__(self):\n        self.opp = 0\n        self.act = 0\n\n    def add(self, opportunity: bool, action: bool = False):\n        if opportunity:\n            self.opp += 1\n            if action:\n                self.act += 1\n\n    @property\n    def pct(self):\n        return 100.0 * self.act / self.opp if self.opp else None\n\n    def __repr__(self):\n        return \"%d/%d\" % (self.act, self.opp)\n\n\nclass StatLine:\n    \"\"\"All counters for one player key (a name, or POOL).\"\"\"\n\n    def __init__(self, key: str):\n        self.key = key\n        self.hands = 0\n        self.net = 0.0\n        self.bb_won = 0.0\n        self.c = defaultdict(Counter)\n        self.postflop_bets = 0\n        self.postflop_raises = 0\n        self.postflop_calls = 0\n        self.postflop_folds = 0\n\n    def add(self, name, opportunity, action=False):\n        self.c[name].add(opportunity, action)\n\n    def pct(self, name):\n        return self.c[name].pct\n\n    def n(self, name):\n        return self.c[name].opp\n\n    @property\n    def af(self):\n        \"\"\"Aggression factor: (bets + raises) / calls, postflop.\"\"\"\n        if not self.postflop_calls:\n            return None\n        return (self.postflop_bets + self.postflop_raises) / self.postflop_calls\n\n    @property\n    def afq(self):\n        \"\"\"Aggression frequency: aggressive actions / all postflop actions.\"\"\"\n        total = (self.postflop_bets + self.postflop_raises +\n                 self.postflop_calls + self.postflop_folds)\n        if not total:\n            return None\n        return 100.0 * (self.postflop_bets + self.postflop_raises) / total\n\n    @property\n    def bb_per_100(self):\n        return 100.0 * self.bb_won / self.hands if self.hands else 0.0\n\n\ndef _preflop_sequence(hand):\n    \"\"\"Preflop decisions in order, with the raise depth each one faced.\"\"\"\n    seq = []\n    depth = 0  # number of raises made so far (the open counts as 1)\n    for a in hand.actions:\n        if a.street != PREFLOP:\n            continue\n        if a.verb in (POST, RETURN):\n            continue\n        if a.verb == STRADDLE:\n            continue  # a forced-style blind raise, not a decision\n        faced = depth\n        if a.verb in (RAISE, BET) or (a.verb == ALLIN and a.amount > 0):\n            seq.append((a, faced, True))\n            depth += 1\n        else:\n            seq.append((a, faced, False))\n    return seq\n\n\ndef _preflop_aggressor(hand):\n    last = None\n    for a in hand.actions:\n        if a.street != PREFLOP or a.verb in (POST, RETURN, STRADDLE):\n            continue\n        if a.verb in (RAISE, BET) or (a.verb == ALLIN and a.amount > 0):\n            last = a.player\n    return last\n\n\ndef _saw_street(hand, street):\n    \"\"\"Players who were still in when `street` was dealt.\"\"\"\n    if street not in hand.streets_reached:\n        return set()\n    order = [PREFLOP, FLOP, TURN, RIVER]\n    idx = order.index(street)\n    folded_before = set()\n    for p in hand.players:\n        if p.folded_street and order.index(p.folded_street) < idx:\n            folded_before.add(p.name)\n    return {p.name for p in hand.players} - folded_before\n\n\ndef _first_bettor(hand, street):\n    for a in hand.street_actions(street):\n        if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n            return a.player\n        if a.verb == CALL:\n            return None\n    return None\n\n\ndef accumulate(hand, lines, pool_positions=None, hero_name=HERO):\n    \"\"\"Fold one hand's situations into the {key: StatLine} dict.\"\"\"\n\n    def line(name):\n        key = HERO if name == hero_name else POOL\n        if key not in lines:\n            lines[key] = StatLine(key)\n        return lines[key]\n\n    seq = _preflop_sequence(hand)\n    pfa = _preflop_aggressor(hand)\n    acted_preflop = set()\n    openers = set()\n    three_bettors = set()\n\n    for p in hand.players:\n        st = line(p.name)\n        st.hands += 1\n        st.net += p.net\n        st.bb_won += p.net / hand.bb_size\n        if pool_positions is not None and p.name != hero_name:\n            pool_positions.setdefault(p.position, StatLine(p.position)).hands += 1\n\n    # ---------------------------------------------------------- preflop ---\n    folded_to_them = True   # true while no voluntary action has happened yet\n    for action, faced, is_raise in seq:\n        name = action.player\n        st = line(name)\n        player = hand.player(name)\n        first_decision = name not in acted_preflop\n        acted_preflop.add(name)\n\n        voluntary = action.verb in (CALL, BET, RAISE) or (\n            action.verb == ALLIN and action.amount > 0)\n\n        if first_decision:\n            st.add(\"vpip\", True, voluntary)\n            st.add(\"pfr\", True, is_raise)\n\n            if faced == 0:\n                # Nobody had raised yet.\n                st.add(\"rfi\", folded_to_them, is_raise)\n                st.add(\"limp\", folded_to_them, action.verb == CALL)\n                if player and player.position in (\"CO\", \"BTN\", \"SB\") and folded_to_them:\n                    st.add(\"steal\", True, is_raise)\n                if player and player.position == \"BB\":\n                    pass\n            elif faced == 1:\n                st.add(\"3bet\", True, is_raise)\n                if player and player.position == \"BB\" and _was_steal_attempt(hand):\n                    st.add(\"bb_fold_to_steal\", True, action.verb == FOLD)\n            elif faced == 2:\n                st.add(\"4bet\", True, is_raise)\n\n        else:\n            # Subsequent preflop decisions: facing a re-raise.\n            if faced == 1 and name in openers:\n                st.add(\"fold_to_3bet\", True, action.verb == FOLD)\n            elif faced == 2 and name in openers:\n                st.add(\"fold_to_3bet\", True, action.verb == FOLD)\n            elif faced == 2 and name in three_bettors:\n                st.add(\"fold_to_4bet\", True, action.verb == FOLD)\n\n        if is_raise:\n            if faced == 0:\n                openers.add(name)\n            elif faced == 1:\n                three_bettors.add(name)\n\n        if voluntary or is_raise:\n            folded_to_them = False\n\n    # --------------------------------------------------------- postflop ---\n    saw_flop = _saw_street(hand, FLOP)\n    for p in hand.players:\n        st = line(p.name)\n        st.add(\"saw_flop\", True, p.name in saw_flop)\n\n    for street in (FLOP, TURN, RIVER):\n        if street not in hand.streets_reached:\n            continue\n        live = _saw_street(hand, street)\n        bettor = _first_bettor(hand, street)\n        key = {FLOP: \"flop\", TURN: \"turn\", RIVER: \"river\"}[street]\n\n        # continuation betting by the preflop aggressor\n        if pfa in live:\n            acted_before = False\n            for a in hand.street_actions(street):\n                if a.player == pfa:\n                    made = a.verb in (BET,) or (a.verb == ALLIN and a.amount > 0)\n                    line(pfa).add(\"cbet_\" + key, not acted_before, made)\n                    break\n                if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n                    acted_before = True\n\n        # folding to that c-bet\n        if bettor == pfa and pfa is not None:\n            for a in hand.street_actions(street):\n                if a.player == pfa:\n                    continue\n                if a.verb in (FOLD, CALL, RAISE, ALLIN, CHECK):\n                    if a.verb == CHECK:\n                        continue\n                    line(a.player).add(\"fold_to_cbet_\" + key, True, a.verb == FOLD)\n\n        # raw aggression tallies\n        for a in hand.street_actions(street):\n            st = line(a.player)\n            if a.verb == BET:\n                st.postflop_bets += 1\n            elif a.verb == RAISE:\n                st.postflop_raises += 1\n            elif a.verb == ALLIN and a.amount > 0:\n                st.postflop_raises += 1\n            elif a.verb == CALL:\n                st.postflop_calls += 1\n            elif a.verb == FOLD:\n                st.postflop_folds += 1\n\n    # ------------------------------------------------------- showdown ----\n    showdown = {p.name for p in hand.players if p.showed}\n    for p in hand.players:\n        st = line(p.name)\n        if p.name in saw_flop:\n            st.add(\"wtsd\", True, p.name in showdown)\n            st.add(\"wwsf\", True, p.net > 0)\n        if p.name in showdown:\n            st.add(\"wsd\", True, p.net > 0)\n\n\ndef _was_steal_attempt(hand):\n    \"\"\"True when the only preflop raise so far came from CO/BTN/SB first-in.\"\"\"\n    for a in hand.actions:\n        if a.street != PREFLOP or a.verb in (POST, RETURN, STRADDLE):\n            continue\n        if a.verb in (RAISE, BET) or (a.verb == ALLIN and a.amount > 0):\n            p = hand.player(a.player)\n            return bool(p and p.position in (\"CO\", \"BTN\", \"SB\"))\n        if a.verb == CALL:\n            return False\n    return False\n\n\ndef compute(hands, hero_name=HERO):\n    \"\"\"Compute {HERO: StatLine, POOL: StatLine} across a list of hands.\"\"\"\n    lines = {}\n    for hand in hands:\n        accumulate(hand, lines, hero_name=hero_name)\n    return lines\n\n\ndef compute_by_position(hands, who=HERO, hero_name=HERO):\n    \"\"\"Per-position StatLines for the hero, or for the merged pool.\"\"\"\n    out = {}\n    for hand in hands:\n        for p in hand.players:\n            is_hero = p.name == hero_name\n            if (who == HERO) != is_hero:\n                continue\n            sub = out.setdefault(p.position, StatLine(p.position))\n            single = {}\n            accumulate(hand, single, hero_name=p.name)\n            src = single.get(HERO)\n            if not src:\n                continue\n            sub.hands += 1\n            sub.net += p.net\n            sub.bb_won += p.net / hand.bb_size\n            for name, counter in src.c.items():\n                sub.c[name].opp += counter.opp\n                sub.c[name].act += counter.act\n            sub.postflop_bets += src.postflop_bets\n            sub.postflop_raises += src.postflop_raises\n            sub.postflop_calls += src.postflop_calls\n            sub.postflop_folds += src.postflop_folds\n    return {k: out[k] for k in POSITION_ORDER if k in out}\n\n\n# Reference ranges for a solid small-stakes 6-max regular. Used to flag\n# deviations, not as gospel: the right value depends on the pool.\nBENCHMARKS = {\n    \"vpip\":              (22, 28, \"VPIP\"),\n    \"pfr\":               (17, 23, \"PFR\"),\n    \"rfi\":               (22, 32, \"Open-raise when folded to\"),\n    \"3bet\":              (6, 11, \"3-bet\"),\n    \"fold_to_3bet\":      (40, 55, \"Fold to 3-bet\"),\n    \"4bet\":              (3, 7, \"4-bet\"),\n    \"steal\":             (35, 50, \"Steal attempt (CO/BTN/SB)\"),\n    \"bb_fold_to_steal\":  (40, 60, \"BB fold vs steal\"),\n    \"limp\":              (0, 4, \"Open-limp\"),\n    \"cbet_flop\":         (55, 70, \"Flop c-bet\"),\n    \"cbet_turn\":         (40, 60, \"Turn c-bet\"),\n    \"cbet_river\":        (35, 55, \"River c-bet\"),\n    \"fold_to_cbet_flop\": (40, 55, \"Fold to flop c-bet\"),\n    \"fold_to_cbet_turn\": (40, 58, \"Fold to turn c-bet\"),\n    \"wtsd\":              (24, 30, \"Went to showdown\"),\n    \"wsd\":               (48, 56, \"Won at showdown\"),\n    \"wwsf\":              (43, 50, \"Won when saw flop\"),\n}\n\nSTAT_ORDER = list(BENCHMARKS.keys())\n\n\ndef format_table(line: StatLine, title=None) -> str:\n    \"\"\"Render one StatLine as an aligned text table with benchmark flags.\"\"\"\n    rows = []\n    head = title or line.key\n    rows.append(\"%s  (%d hands, %+.1f bb/100)\" % (head, line.hands, line.bb_per_100))\n    rows.append(\"%-28s %8s %10s   %s\" % (\"stat\", \"value\", \"sample\", \"vs benchmark\"))\n    rows.append(\"-\" * 72)\n    for name in STAT_ORDER:\n        counter = line.c.get(name)\n        if not counter or not counter.opp:\n            continue\n        lo, hi, label = BENCHMARKS[name]\n        val = counter.pct\n        if counter.opp < 15:\n            verdict = \"thin sample\"\n        elif val < lo:\n            verdict = \"LOW  (typical %d-%d%%)\" % (lo, hi)\n        elif val > hi:\n            verdict = \"HIGH (typical %d-%d%%)\" % (lo, hi)\n        else:\n            verdict = \"ok   (typical %d-%d%%)\" % (lo, hi)\n        rows.append(\"%-28s %7.1f%% %10s   %s\"\n                    % (label, val, \"%d/%d\" % (counter.act, counter.opp), verdict))\n    if line.af is not None:\n        rows.append(\"%-28s %8.2f %10s   %s\"\n                    % (\"Aggression factor\", line.af,\n                       \"%d/%d\" % (line.postflop_bets + line.postflop_raises,\n                                  line.postflop_calls), \"typical 2.0-3.5\"))\n    if line.afq is not None:\n        rows.append(\"%-28s %7.1f%% %10s   %s\"\n                    % (\"Aggression frequency\", line.afq, \"\", \"typical 38-48%\"))\n    return \"\\n\".join(rows)\n","pokerbrain/template.py":"\"\"\"The HTML body for the report.\n\nKept separate from report.py so the generator code stays readable.\n\nThe body carries its own <title>, font link, <style> and <script> and no\ndocument skeleton, so it can be emitted two ways:\n\n  standalone -- wrapped in a full HTML document, for opening from disk\n  fragment   -- as-is, for publishing as an Artifact (the host supplies the\n                skeleton, a charset/viewport meta and safe-area padding)\n\"\"\"\n\nBODY = r\"\"\"<title>Poker Brain<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n<style>\n/* Light is the base palette; dark redefines only the tokens, twice, so an\n   explicit toggle wins over the OS in both directions. */\n:root{\n  --bg:#f5f4f0; --panel:#ffffff; --panel2:#efefe9; --line:#e0e2dd; --ink:#161a18; --muted:#5e6863; --dim:#8b938d;\n  --accent:#8a6716; --accent-soft:#f0e7cf;\n  --good:#1a6b43; --bad:#a8243a; --warn:#8a5d0c;\n  --good-soft:#e2efe8; --bad-soft:#f7e3e6; --warn-soft:#f6ecd8;\n  --felt-a:#1d5740; --felt-b:#123326; --felt-rim:#0b2118; --felt-ink:#e4efe9;\n  --felt-dim:#8fb3a2;\n  --card-face:#fcfcfa; --card-red:#b0263a; --card-black:#1b201d;\n  --shadow:0 1px 2px rgba(20,30,25,.07), 0 6px 18px -10px rgba(20,30,25,.22);\n  --r:12px;\n  --display:\"Fraunces\",Georgia,\"Times New Roman\",serif;\n  --body:\"IBM Plex Sans\",ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"IBM Plex Mono\",ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;\n    --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;\n    --accent:#d4a537; --accent-soft:#2b2415;\n    --good:#41b97c; --bad:#e4586c; --warn:#d69f34;\n    --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;\n    --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;\n    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;\n  --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;\n  --accent:#d4a537; --accent-soft:#2b2415;\n  --good:#41b97c; --bad:#e4586c; --warn:#d69f34;\n  --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;\n  --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);\n}\n*{box-sizing:border-box}\nbody{\n  margin:0; background:var(--bg); color:var(--ink);\n  font-family:var(--body); font-size:15px; line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n}\n.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:0 72px}\n.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}\n\n/* ---------------------------------------------------------- masthead --- */\n.masthead{padding-block:26px 14px}\n.masthead h1{\n  font-family:var(--display); font-weight:600; font-size:clamp(26px,4.5vw,36px);\n  margin:0; letter-spacing:-.015em; text-wrap:balance;\n}\n.masthead .rule{height:2px; background:var(--accent); width:44px; margin:12px 0 10px; border-radius:2px}\n.masthead .meta{\n  color:var(--muted); font-size:12.5px; font-family:var(--mono);\n  letter-spacing:.01em; display:flex; flex-wrap:wrap; gap:6px 14px;\n}\n.tabbar{\n  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;\n  background:var(--bg); border-bottom:1px solid var(--line);\n  display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;\n  padding-block:8px; margin-bottom:22px;\n}\n.tabbar::-webkit-scrollbar{display:none}\n.tab{\n  flex:0 0 auto; padding:7px 14px; border:none; background:none; cursor:pointer;\n  color:var(--muted); font-family:var(--body); font-size:13px; font-weight:500;\n  border-radius:7px; letter-spacing:.01em;\n}\n.tab:hover{color:var(--ink); background:var(--panel2)}\n.tab[aria-selected=\"true\"]{color:var(--ink); background:var(--panel2); box-shadow:inset 0 -2px 0 var(--accent)}\n.tab:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent); outline-offset:2px}\n.view[hidden]{display:none!important}\n\n/* ------------------------------------------------------------- blocks --- */\n.row{display:grid; gap:14px}\n.r3{grid-template-columns:repeat(3,1fr)}\n.r2{grid-template-columns:repeat(2,1fr)}\n@media(max-width:820px){.r3,.r2{grid-template-columns:1fr}}\n.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}\n.panel.flush{padding:0; overflow:hidden}\nh2{font-family:var(--display); font-weight:600; font-size:19px; margin:30px 0 12px; letter-spacing:-.01em}\n.eyebrow{\n  font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;\n  color:var(--dim); font-weight:600; margin:0 0 10px;\n}\n\n/* Money tiles: the three figures the page exists to deliver. */\n.tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; position:relative; overflow:hidden}\n.tile::before{content:\"\"; position:absolute; inset:0 auto 0 0; width:3px; background:var(--dim)}\n.tile.up::before{background:var(--good)} .tile.down::before{background:var(--bad)}\n.tile .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--dim); font-weight:600}\n.tile .v{font-family:var(--mono); font-weight:600; font-size:clamp(24px,4vw,31px); margin-top:6px; letter-spacing:-.02em}\n.tile .n{font-size:12.5px; color:var(--muted); margin-top:2px}\n.up .v{color:var(--good)} .down .v{color:var(--bad)}\n\n/* --------------------------------------------------------- data table --- */\n.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}\ntable{width:100%; border-collapse:collapse; font-size:13.5px; min-width:440px}\ncaption{text-align:left; padding:14px 16px 0; font-size:10.5px; text-transform:uppercase;\n  letter-spacing:.11em; color:var(--dim); font-weight:600}\nth{\n  text-align:left; color:var(--dim); font-weight:600; font-size:10.5px;\n  text-transform:uppercase; letter-spacing:.09em; padding:10px 14px;\n  border-bottom:1px solid var(--line); white-space:nowrap;\n}\ntd{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle}\ntr:last-child td{border-bottom:none}\ntd.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}\ntbody tr.pick{cursor:pointer}\ntbody tr.pick:hover{background:var(--panel2)}\n.pos{color:var(--good)} .neg{color:var(--bad)}\n.meter{height:4px; border-radius:2px; background:var(--panel2); min-width:64px; overflow:hidden; position:relative}\n.meter i{position:absolute; inset:0 auto 0 0; border-radius:2px}\n.meter u{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--dim); opacity:.55}\n.pill{display:inline-block; font-family:var(--body); font-size:10.5px; font-weight:6
