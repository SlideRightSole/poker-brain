<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Poker Brain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Light is the base palette; dark redefines only the tokens, twice, so an
   explicit toggle wins over the OS in both directions. */
:root{
  --bg:#f5f4f0; --panel:#ffffff; --panel2:#efefe9; --line:#e0e2dd; --ink:#161a18; --muted:#5e6863; --dim:#8b938d;
  --accent:#8a6716; --accent-soft:#f0e7cf;
  --good:#1a6b43; --bad:#a8243a; --warn:#8a5d0c;
  --good-soft:#e2efe8; --bad-soft:#f7e3e6; --warn-soft:#f6ecd8;
  --felt-a:#1d5740; --felt-b:#123326; --felt-rim:#0b2118; --felt-ink:#e4efe9;
  --felt-dim:#8fb3a2;
  --card-face:#fcfcfa; --card-red:#b0263a; --card-black:#1b201d;
  --shadow:0 1px 2px rgba(20,30,25,.07), 0 6px 18px -10px rgba(20,30,25,.22);
  --r:12px;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;
    --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;
    --accent:#d4a537; --accent-soft:#2b2415;
    --good:#41b97c; --bad:#e4586c; --warn:#d69f34;
    --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;
    --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --panel:#161c19; --panel2:#1d2521; --line:#28322c;
  --ink:#e7ebe8; --muted:#8e9a93; --dim:#6a766f;
  --accent:#d4a537; --accent-soft:#2b2415;
  --good:#41b97c; --bad:#e4586c; --warn:#d69f34;
  --good-soft:#12291f; --bad-soft:#2c1519; --warn-soft:#2a2113;
  --card-face:#f2f4f1; --card-red:#c9303f; --card-black:#171c19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:0 72px}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------- masthead --- */
.masthead{padding-block:26px 14px}
.masthead h1{
  font-family:var(--display); font-weight:600; font-size:clamp(26px,4.5vw,36px);
  margin:0; letter-spacing:-.015em; text-wrap:balance;
}
.masthead .rule{height:2px; background:var(--accent); width:44px; margin:12px 0 10px; border-radius:2px}
.masthead .meta{
  color:var(--muted); font-size:12.5px; font-family:var(--mono);
  letter-spacing:.01em; display:flex; flex-wrap:wrap; gap:6px 14px;
}
.tabbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  padding-block:8px; margin-bottom:22px;
}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; padding:7px 14px; border:none; background:none; cursor:pointer;
  color:var(--muted); font-family:var(--body); font-size:13px; font-weight:500;
  border-radius:7px; letter-spacing:.01em;
}
.tab:hover{color:var(--ink); background:var(--panel2)}
.tab[aria-selected="true"]{color:var(--ink); background:var(--panel2); box-shadow:inset 0 -2px 0 var(--accent)}
.tab:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.view[hidden]{display:none!important}

/* ------------------------------------------------------------- blocks --- */
.row{display:grid; gap:14px}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.r3,.r2{grid-template-columns:1fr}}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.panel.flush{padding:0; overflow:hidden}
h2{font-family:var(--display); font-weight:600; font-size:19px; margin:30px 0 12px; letter-spacing:-.01em}
.eyebrow{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;
  color:var(--dim); font-weight:600; margin:0 0 10px;
}

/* Money tiles: the three figures the page exists to deliver. */
.tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; position:relative; overflow:hidden}
.tile::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--dim)}
.tile.up::before{background:var(--good)} .tile.down::before{background:var(--bad)}
.tile .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--dim); font-weight:600}
.tile .v{font-family:var(--mono); font-weight:600; font-size:clamp(24px,4vw,31px); margin-top:6px; letter-spacing:-.02em}
.tile .n{font-size:12.5px; color:var(--muted); margin-top:2px}
.up .v{color:var(--good)} .down .v{color:var(--bad)}

/* --------------------------------------------------------- data table --- */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:440px}
caption{text-align:left; padding:14px 16px 0; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.11em; color:var(--dim); font-weight:600}
th{
  text-align:left; color:var(--dim); font-weight:600; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.09em; padding:10px 14px;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover{background:var(--panel2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.meter{height:4px; border-radius:2px; background:var(--panel2); min-width:64px; overflow:hidden; position:relative}
.meter i{position:absolute; inset:0 auto 0 0; border-radius:2px}
.meter u{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--dim); opacity:.55}
.pill{display:inline-block; font-family:var(--body); font-size:10.5px; font-weight:600;
  padding:2px 8px; border-radius:999px; letter-spacing:.03em; white-space:nowrap}
.pill.ok{background:var(--good-soft); color:var(--good)}
.pill.off{background:var(--bad-soft); color:var(--bad)}
.pill.thin{background:var(--panel2); color:var(--muted)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}

/* -------------------------------------------------------------- cards --- */
.pc{
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  width:29px; height:40px; border-radius:4px; background:var(--card-face);
  color:var(--card-black); border:1px solid rgba(0,0,0,.24); font-family:var(--body);
  font-weight:600; font-size:14px; line-height:1;
  box-shadow:0 1px 2px rgba(0,0,0,.3); flex:0 0 auto;
}
.pc.red{color:var(--card-red)}
.pc s{font-size:11px; margin-top:1px; text-decoration:none}
.pc.sm{width:21px; height:29px; font-size:10.5px; border-radius:3px}
.pc.sm s{font-size:8.5px}
.pc.down{background:repeating-linear-gradient(45deg,#2c4a5e,#2c4a5e 3px,#25404f 3px,#25404f 6px); border-color:#35576b}
.hand{display:inline-flex; gap:2px; align-items:center}

/* --------------------------------------------------------- felt table --- */
.felt{
  position:relative; background:radial-gradient(ellipse at 50% 42%,var(--felt-a),var(--felt-b));
  border:10px solid var(--felt-rim); border-radius:46% / 38%;
  aspect-ratio:16/10; max-width:100%; min-height:270px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.45);
}
.centre{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:86%}
.centre .board{display:flex; gap:3px; justify-content:center; flex-wrap:wrap}
.centre .pot{color:var(--felt-dim); font-family:var(--mono); font-size:11.5px; margin-top:9px; letter-spacing:.04em}
.centre .pre{color:var(--felt-dim); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase}
.seat{position:absolute; transform:translate(-50%,-50%); width:118px}
.seat .box{
  background:rgba(7,18,13,.86); border:1px solid rgba(255,255,255,.13);
  border-radius:8px; padding:5px 6px; color:var(--felt-ink); text-align:center;
}
.seat.me .box{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.seat.gone{opacity:.36}
.seat .who{font-size:10.5px; font-weight:600; display:flex; gap:4px; justify-content:center; align-items:center}
.seat .who em{font-style:normal; color:var(--felt-dim); font-weight:500}
.seat .chips{font-family:var(--mono); font-size:9.5px; color:var(--felt-dim)}
.seat .hand{justify-content:center; margin-top:3px}
.seat .did{font-family:var(--mono); font-size:9.5px; color:var(--warn); margin-top:2px; min-height:12px}
.dealer{display:inline-flex; width:14px; height:14px; border-radius:50%; background:var(--card-face);
  color:#111; font-size:8.5px; line-height:14px; font-weight:700; justify-content:center}
@media(max-width:560px){
  .felt{aspect-ratio:auto; min-height:0; border-radius:var(--r); padding:14px; display:grid; gap:8px}
  .centre{position:static; transform:none; width:auto; order:-1; padding-bottom:6px}
  .seat{position:static!important; transform:none; width:auto}
}

/* ------------------------------------------------------ hand detail ----- */
.detail{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:16px}
.detail .top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline}
.detail .top h3{font-family:var(--display); font-weight:600; font-size:18px; margin:0}
.detail .top .res{font-family:var(--mono); font-size:22px; font-weight:600}
.street{margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line)}
.street:first-of-type{border-top:none}
.street h4{
  margin:0 0 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;
  color:var(--dim); font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.act{font-size:13px; color:var(--muted); padding:2px 0; display:flex; gap:7px; flex-wrap:wrap}
.act b{color:var(--ink); font-weight:600}
.act em{font-style:normal; color:var(--dim); font-size:11.5px; font-family:var(--mono)}
.act.me b{color:var(--accent)}
.maths{background:var(--panel2); border-radius:9px; padding:12px 14px; margin-top:10px; font-size:13px}
.maths dl{display:grid; grid-template-columns:1fr auto; gap:3px 14px; margin:0}
.maths dt{color:var(--muted)}
.maths dd{margin:0; font-family:var(--mono); font-weight:500; text-align:right}
.eq{margin-top:11px}
.eq .lab{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px}
.eq .lab b{font-family:var(--mono)}
.eqbar{height:9px; border-radius:5px; overflow:hidden; display:flex; border:1px solid var(--line)}
.note{margin-top:10px; padding:9px 11px; border-radius:8px; font-size:12.5px; line-height:1.5}
.note.bad{background:var(--bad-soft); color:var(--ink); border-left:3px solid var(--bad)}
.note.good{background:var(--good-soft); color:var(--ink); border-left:3px solid var(--good)}
.note.flat{background:var(--panel2); color:var(--muted)}
.rng{font-size:12.5px; color:var(--muted); padding:7px 0; border-bottom:1px solid var(--line)}
.rng:last-of-type{border-bottom:none}
.rng b{color:var(--ink); font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.07em}
.rng code{font-family:var(--mono); font-size:11.5px; color:var(--ink); display:block; margin-top:2px}

/* --------------------------------------------------------- players ----- */
.drop{
  border:2px dashed var(--line); border-radius:var(--r); padding:26px 18px;
  text-align:center; color:var(--muted); cursor:pointer; background:var(--panel);
  transition:border-color .15s, background .15s;
}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--panel2)}
.drop b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px; font-weight:600}
.drop kbd{
  font-family:var(--mono); font-size:11.5px; background:var(--panel2); color:var(--ink);
  border:1px solid var(--line); border-radius:4px; padding:1px 6px;
}
.shot{max-width:200px; border-radius:8px; border:1px solid var(--line); margin-top:12px}
.grid10{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
@media(max-width:820px){.grid10{grid-template-columns:repeat(2,1fr)}}
.fld label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--dim); font-weight:600; margin-bottom:3px}
.fld input{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:14px;
}
.fld input:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{
  background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 18px;
  font-family:var(--body); font-size:13.5px; font-weight:600; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5; cursor:default}
.swatch{width:34px; height:34px; border-radius:8px; flex:0 0 auto; border:1px solid rgba(0,0,0,.25)}
.sw-green{background:#2f9e5e}.sw-orange{background:#e08a1e}.sw-yellow{background:#e0c221}
.sw-blue{background:#2f7fd0}.sw-red{background:#d03a44}.sw-magenta{background:#c2439c}
.sw-none{background:var(--panel2)}
.verdict{display:flex; gap:13px; align-items:center}
.verdict h3{margin:0; font-family:var(--display); font-size:19px; font-weight:600}
.verdict .plan{color:var(--muted); font-size:13px}
.leakrow{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.leakrow:last-child{border-bottom:none}
.leakrow .bar{width:3px; border-radius:2px; background:var(--dim); flex:0 0 auto}
.leakrow.high .bar{background:var(--bad)} .leakrow.medium .bar{background:var(--warn)}
.leakrow.info .bar{background:var(--accent)}
.leakrow h5{margin:0 0 3px; font-size:14px; font-weight:600; display:flex; gap:8px;
  align-items:center; flex-wrap:wrap}
.leakrow p{margin:0; color:var(--muted); font-size:13px}
.leakrow .stat{font-family:var(--mono); font-size:11.5px; color:var(--dim)}
.noteout{
  width:100%; min-height:76px; padding:11px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--ink); font-family:var(--mono); font-size:13px;
  resize:vertical; line-height:1.5;
}
.roster{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:flex; gap:7px; align-items:center; background:var(--panel2); border:1px solid var(--line);
  border-radius:999px; padding:4px 11px 4px 5px; font-size:12.5px; cursor:pointer;
}
.chip:hover{border-color:var(--dim)}
.chip i{width:14px; height:14px; border-radius:50%; display:block; flex:0 0 auto}
.busy{color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%; animation:sp .7s linear infinite; flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

.status{
  border-radius:9px; padding:11px 13px; font-size:13px; margin-top:12px;
  border:1px solid var(--line); background:var(--panel2); line-height:1.5;
}
.status b{font-weight:600}
.status.ok{background:var(--good-soft); border-color:var(--good)}
.status.warn{background:var(--warn-soft); border-color:var(--warn)}
.status.err{background:var(--bad-soft); border-color:var(--bad)}
.status .how{display:block; margin-top:5px; color:var(--muted); font-size:12.5px}
.legend{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media(max-width:820px){.legend{grid-template-columns:1fr}}
.legend .item{display:flex; gap:12px; padding:12px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel)}
.legend .item b{display:block; font-size:14px; margin-bottom:2px}
.legend .item .when{color:var(--dim); font-size:12px; margin:2px 0 5px}
.legend .item .plan{color:var(--ink); font-size:13px}
.legend .swatch{width:26px; height:26px; border-radius:6px}
.legend-note{color:var(--muted); font-size:12.5px; margin:10px 0 0; max-width:70ch}
.colourbox{display:flex; gap:12px; margin-top:14px; padding:12px 14px;
  border:1px solid var(--line); border-radius:9px; background:var(--panel2)}
.colourbox b{display:block; font-size:14px}
.colourbox .when{color:var(--dim); font-size:12px; margin:2px 0 4px}
.colourbox .gplan{font-size:13px}
.profile{font-size:14.5px; margin:0 0 8px; font-weight:500}
.plansec{margin:8px 0 0}
.plansec h5{margin:0 0 3px; font-size:11px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--dim)}
.plansec ul{margin:0; padding-left:18px}
.plansec li{font-size:13.5px; margin:2px 0}
.loadbox{border:2px dashed var(--line); border-radius:var(--r); padding:30px 18px;
  text-align:center; background:var(--panel); cursor:pointer}
.loadbox:hover,.loadbox.over{border-color:var(--accent); background:var(--panel2)}
.loadbox b{display:block; font-size:16px; margin-bottom:4px}
.steps{margin:0; padding-left:20px; color:var(--muted); font-size:13.5px}
.steps li{margin:3px 0}
.bar2{height:8px; border-radius:4px; background:var(--panel2); overflow:hidden; margin-top:8px}
.bar2 i{display:block; height:100%; background:var(--accent); width:0; transition:width .2s}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
select{padding:6px 9px; border:1px solid var(--line); border-radius:7px; background:var(--panel);
  color:var(--ink); font-family:var(--body); font-size:13px; max-width:100%}
.hcards{display:grid; gap:8px}
.hcard{display:flex; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
  background:var(--panel); cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit}
.hcard:hover{border-color:var(--dim)}
.hcard .bar{width:3px; border-radius:2px; flex:0 0 auto; background:var(--dim)}
.hcard.bad .bar{background:var(--bad)}
.hcard.good .bar{background:var(--good)}
.hc-top{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px}
.hcard p{margin:4px 0 0; font-size:12.5px; color:var(--muted)}
.review{margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
.grade{display:flex; gap:8px; font-size:13.5px; padding:4px 0}
.grade i{font-style:normal; font-weight:700; flex:0 0 auto; width:16px}
.grade.good i{color:var(--good)}
.grade.bad i,.grade.review i{color:var(--bad)}
.dive,.ask{margin-top:18px; padding:14px; border:1px solid var(--line); border-radius:10px;
  background:var(--panel2)}
.dive .fields{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:8px 0}
@media(max-width:560px){.dive .fields{grid-template-columns:1fr}}
.dive input,.ask textarea{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:12.5px}
.ask textarea{font-family:var(--body); font-size:13.5px; min-height:70px; resize:vertical}
.answer{white-space:pre-wrap; font-size:13.5px; margin-top:10px; line-height:1.6}
.files{margin:8px 0 0; padding:0; list-style:none; font-size:13px}
.files li{padding:4px 0; border-bottom:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap}
.files li span{color:var(--dim); font-family:var(--mono); font-size:11.5px}
.lbl{font-weight:600; color:var(--ink)}
.legend .item .when,.colourbox .when{color:var(--muted); font-size:12.5px}
.grid13{display:grid; grid-template-columns:repeat(13,1fr); gap:2px; max-width:540px;
  margin-top:10px}
.grid13 div{aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  font-size:clamp(7px,1.5vw,11px); font-family:var(--mono); color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.65); border-radius:3px; overflow:hidden}
.grid13 .empty{background:var(--panel2); color:var(--dim); text-shadow:none}
.mix{display:flex; height:14px; border-radius:4px; overflow:hidden; border:1px solid var(--line);
  min-width:120px; flex:1}
.mix i{display:block; height:100%}
.legend2{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; margin:8px 0}
.legend2 span{display:inline-flex; align-items:center; gap:5px}
.legend2 b{width:11px; height:11px; border-radius:3px; display:inline-block}
.solvebox{margin-top:18px; padding:14px; border:1px solid var(--line); border-radius:10px;
  background:var(--panel2)}
.sfields{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0}
.sfields .wide{grid-column:span 2}
@media(max-width:820px){.sfields{grid-template-columns:repeat(2,1fr)} .sfields .wide{grid-column:span 2}}
.sfields input{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:12.5px}
.linerow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 0;
  border-bottom:1px solid var(--line); font-size:13px}
.linerow:last-child{border-bottom:none}
.linerow .where{min-width:170px; color:var(--muted)}
.lesson h2.big{font-family:var(--display); font-size:clamp(22px,3.4vw,30px); margin:4px 0 8px;
  text-wrap:balance}
.rulebox{border-left:4px solid var(--accent); background:var(--accent-soft); padding:12px 14px;
  border-radius:0 9px 9px 0; font-size:15px; font-weight:500; margin:6px 0}
.goalbox{border:1px solid var(--good); background:var(--good-soft); padding:12px 14px;
  border-radius:9px; font-size:14.5px}
.lesson ol{padding-left:20px; margin:4px 0} .lesson ol li{margin:4px 0; font-size:14px}
.lesson p.body{font-size:14.5px; max-width:70ch; margin:4px 0}
.qitem{padding:12px 0; border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:none}
.qitem p{margin:0 0 8px; font-size:14px; font-weight:500}
.qopts{display:flex; gap:8px; flex-wrap:wrap}
.qopt{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px;
  padding:6px 14px; cursor:pointer; font:inherit; font-size:13.5px}
.qopt:hover{border-color:var(--dim)}
.qopt.right{border-color:var(--good); background:var(--good-soft)}
.qopt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.qexplain{margin-top:8px; font-size:13px; color:var(--muted)}
.quick{
  background:var(--panel2); border:1px solid var(--line); border-radius:9px;
  padding:13px 14px; margin-bottom:16px;
}
.quick input{font-size:15px; letter-spacing:.04em}
.quick .hint{display:block; margin-top:6px; color:var(--dim); font-size:11.5px;
  font-family:var(--mono); line-height:1.5}
.quick .said{display:block; margin-top:6px; font-size:12.5px; color:var(--muted)}
.quick .said.good{color:var(--good)}
.quick .said.bad{color:var(--bad)}
.imgbar{display:flex;  gap:12px; align-items:flex-start; flex-wrap:wrap; margin-top:12px}

/* -------------------------------------------------------- findings ----- */
.find{padding:14px 0; border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:none}
.find h4{margin:0 0 5px; font-size:14.5px; font-weight:600; display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.find p{margin:4px 0; color:var(--muted); font-size:13px; white-space:pre-wrap}
.find .fix{color:var(--good); font-size:13px; margin-top:7px}
.sev{width:3px; align-self:stretch; border-radius:2px; background:var(--dim)}
.find.high .sev{background:var(--bad)} .find.medium .sev{background:var(--warn)}
.find .body{display:flex; gap:12px}

.callout{
  background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--r);
  padding:13px 15px; font-size:13px; margin-bottom:18px; color:var(--ink);
}
.callout b{font-weight:600}
.lead{color:var(--muted); font-size:13px; margin:0 0 12px; max-width:68ch}
.foot{color:var(--dim); font-size:12px; margin-top:26px; padding-top:14px; border-top:1px solid var(--line)}
.ghost{
  background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
  padding:5px 11px; cursor:pointer; font-size:12px; font-family:var(--body);
}
.ghost:hover{color:var(--ink); border-color:var(--dim)}
.themer{position:absolute; right:16px; top:26px}
.masthead{position:relative}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}

8,56],"gap":[3,8]},"tags":{"green":{"label":"Fish / station","plan":"Value bet them hard; don't bluff them."},"orange":{"label":"LAG / maniac","plan":"Let them bet into you; call them down lighter."},"yellow":{"label":"Nit / rock","plan":"Steal from them; fold when they fight back."},"blue":{"label":"Solid reg","plan":"Play good hands simply; take the easy spots."},"red":{"label":"Threat - avoid","plan":"Stay out of close pots with them."},"magenta":{"label":"Reg with a hole","plan":"Attack the leak written in the note."},"none":{"label":"Not enough to say","plan":"Play the pool default until you see more."}},"noteFallback":{"red":"no hole found - avoid marginal spots, no fancy bluffs","blue":"ordinary reg - play it straight","green":"loose-passive - value bet thin, never bluff","orange":"LAG - let them bluff into you, call lighter","yellow":"nit - steal their blinds, believe their raises"},"notePrefix":{"green":"GREEN fish","orange":"ORANGE LAG","yellow":"YELLOW nit","blue":"BLUE reg","red":"RED avoid","magenta":"MAGENTA reg w/ hole","none":"untagged"},"tagGuide":[{"colour":"green","label":"Fish / station","when":"They play lots of hands and mostly just call. Once they are in a pot they rarely fold.","plan":"Raise their limps and play big pots with them in position. Bet your good hands on every street and size up. Don't bluff them unless the note says they give up easily."},{"colour":"orange","label":"LAG / maniac","when":"They play lots of hands and raise and 3-bet a lot. Many of their bets are bluffs.","plan":"Open a little tighter in front of them. Call their bets lighter with medium hands, check your strong hands so they keep betting, and don't try to bluff them off a pot."},{"colour":"yellow","label":"Nit / rock","when":"They play very few hands and fold a lot. When they bet or raise big, they usually have it.","plan":"Raise their blinds whenever it folds to you and c-bet them on most flops. When they raise or bet big, fold unless your hand is strong."},{"colour":"blue","label":"Solid reg","when":"They play normal, sensible ranges and have no clear weakness.","plan":"Play good-quality hands with your normal strategy. Don't try fancy bluffs or thin hero-calls against them - take the easy spots and move on."},{"colour":"red","label":"Threat - avoid","when":"They play well: they 3-bet and check-raise at good rates and have no obvious leak.","plan":"Avoid close spots with them, especially out of position. Don't bluff-catch with weak hands or run big bluffs. If they sit on your left, think about changing seats."},{"colour":"magenta","label":"Reg with a hole","when":"They look like a normal regular but have at least one big leak.","plan":"Read the note before you play a pot with them - it says which leak to attack. Otherwise play them like a solid regular."}],"speedNote":{"fast":"settles quickly - trust it early","medium":"needs a few hundred hands","slow":"accumulates slowly - hold this one loosely"},"leaks":[{"id":"wide_gap","stat":"gap","op":">","threshold":12,"severity":"high","title":"Plays far more hands than they raise","exploit":"Isolate them in position and value bet relentlessly. A gap this size means most of the hands they show up with are ones they merely called with, so their range is weak and uncapped by any raise.","shorthand":"calls far too much preflop - isolate them and value bet"},{"id":"no_flatting","stat":"gap","op":"<","threshold":2,"severity":"info","title":"Raise-or-fold - almost never flat-calls","exploit":"Their calling range barely exists, so the hands they enter with are polarised to raises. Expect a strong range whenever they just call.","shorthand":"raise-or-fold player - when they just call, respect it"},{"id":"overfold_3bet","stat":"fold_to_three_bet","op":">","threshold":60,"severity":"high","title":"Folds too much to 3-bets","exploit":"3-bet them light, especially when they open from late position. They open wide and then surrender the pot without a fight.","shorthand":"folds to 3-bets - 3-bet ":null,"reqFE":null,"equity":31.3,"evCall":null,"madeHand":"High Card, K","texture":"dry / static","effStack":25.24},{"street":"turn","verb":"check","amount":0.0,"potBefore":2.6,"potBB":10.4,"toCall":0.0,"potOdds":null,"spr":9.7,"mdf":null,"betPct":null,"reqFE":null,"equity":22.1,"evCall":null,"madeHand":"High Card, K","texture":"wet / dynamic","effStack":25.24},{"street":"turn","verb":"call","amount":0.75,"potBefore":3.35,"potBB":13.4,"toCall":0.75,"potOdds":18.3,"spr":7.5,"mdf":82.0,"betPct":null,"reqFE":null,"equity":22.1,"evCall":0.15,"madeHand":"High Card, K","texture":"wet / dynamic","effStack":25.24},{"street":"river","verb":"check","amount":0.0,"potBefore":4.1,"potBB":16.4,"toCall":0.0,"potOdds":null,"spr":6.2,"mdf":null,"betPct":null,"reqFE":null,"equity":55.7,"evCall":null,"madeHand":"One Pair, Qs","texture":"wet / dynamic","effStack":25.24},{"street":"river","verb":"call","amount":2.46,"potBefore":6.56,"potBB":26.2,"toCall":2.46,"potOdds":27.3,"spr":3.8,"mdf":73.0,"betPct":null,"reqFE":null,"equity":55.7,"evCall":2.57,"madeHand":"One Pair, Qs","texture":"wet / dynamic","effStack":25.24}],"villain":"fa61849e","villainPos":"UTG","villainCards":["2h","2c"],"villainRangeSpec":"66+, A9s+, KTs+, QTs+, J9s+, T9s, 98s, AJo+, KQo","ranges":{"preflop":{"pct":10.0,"combos":133,"summary":"AJo, AQo, AKo, KQo, 66, 77, 88, 99, TT, JJ, AA, A9s +15 more"},"flop":{"pct":8.7,"combos":129,"summary":"AJo, AKo, AQo, KQo, TT, 99, 77, 66, AJs, ATs, A9s, JTs +15 more"},"turn":{"pct":4.5,"combos":121,"summary":"TT, 99, 66, AJo, 77, AKo, AQo, JJ, 98s, AJs, ATs, A9s +14 more"},"river":{"pct":1.2,"combos":54,"summary":"JJ, AQo, AA, AQs, QJs, QTs, TT, KQs, 88, KK, JTs, J9s +5 more"}},"grades":[{"kind":"good","street":"river","bb":10.3,"text":"Good call on the river with one pair, Qs: you needed 27% and had about 56% (worth about +10.3 bb).","cat":"good_call","facts":{"potBB":26.2,"toCallBB":9.8,"hand":"one pair, Qs","cards":"Kh Qc","board":"8s 5d 2s 4h Qh","potOdds":27,"equity":56,"evBB":10.3,"amountBB":9.8}}],"goodBB":10.3,"badBB":0,"raw":"CoinPoker Hand #134821200440: NLH (\u20ae0.10/\u20ae0.25) 2026/09/16 11:36:54 AEST\nTable '201371' 6-max Seat #2 is the button\nSeat 1: ea059e84 (\u20ae30.12 in chips)\nSeat 2: 9f756bd0 (\u20ae45.91 in chips)\nSeat 3: 9aa2ca50 (\u20ae26.72 in chips)\nSeat 4: Hero (\u20ae25.24 in chips)\nSeat 5: fa61849e (\u20ae31.89 in chips)\nSeat 6: ae7644a2 (\u20ae26.15 in chips)\n9aa2ca50: posts small blind \u20ae0.10\nHero: posts big blind \u20ae0.25\n*** HOLE CARDS ***\nDealt to ea059e84\nDealt to 9f756bd0\nDealt to 9aa2ca50\nDealt to Hero [Kh Qc]\nDealt to fa61849e\nDealt to ae7644a2\nfa61849e: raises \u20ae1 to \u20ae1.25\nae7644a2: folds\nea059e84: folds\n9f756bd0: folds\n9aa2ca50: folds\nHero: calls \u20ae1\n*** FLOP *** [8s 5d 2s]\nHero: checks\nfa61849e: checks\n*** TURN *** [8s 5d 2s] [4h]\nHero: checks\nfa61849e: bets \u20ae0.75\nHero: calls \u20ae0.75\n*** RIVER *** [8s 5d 2s 4h] [Qh]\nHero: checks\nfa61849e: bets \u20ae2.46\nHero: calls \u20ae2.46\n*** SHOWDOWN ***\nfa61849e: shows [2h 2c] (Three Of A Kind)\nfa61849e collected \u20ae8.55 from pot\nHero: mucks hand\n*** SUMMARY ***\nTotal pot \u20ae9.02 | Rake \u20ae0.45 | Splash Fee \u20ae0.02\nHand was run once\nBoard [ 8s 5d 2s 4h Qh ]\nGame ended: 2026/09/16 11:38:32 AEST\nSeat 1: ea059e84 folded before Flop (didn't bet)\nSeat 2: 9f756bd0 folded before Flop (didn't bet)\nSeat 3: 9aa2ca50 folded before Flop (didn't bet)\nSeat 4: Hero showed [Kh Qc] and lost with One Pair\nSeat 5: fa61849e showed [2h 2c] and won (\u20ae8.55) with Three Of A Kind\nSeat 6: ae7644a2 folded before Flop (didn't bet)","riverHeadsUp":true,"sessionId":"20260916-1002"}],"pysrc":{"pokerbrain/analysis.py":"\"\"\"Per-hand analysis: the maths behind every decision the hero faced.\n\nThis module produces the numbers. It deliberately does not produce verdicts:\njudgement belongs to the reader (or to the brain/ notes), because the right\nplay depends on reads and pool tendencies the raw numbers cannot see.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\n\nfrom .cards import cards_str, card_rank, card_suit\nfrom .equity import calculate\nfrom .evaluator import evaluate, describe\nfrom .model import (\n    ALLIN, BET, CALL, CHECK, FLOP, FOLD, POST, PREFLOP, RAISE, RETURN, RIVER,\n    STRADDLE, STREETS, TURN,\n)\nfrom .ranges import parse_range, remove_blockers, range_percent\n\n_CHART_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"charts\")\n_RANGES = None\n\n\ndef reference_ranges() -> dict:\n    global _RANGES\n    if _RANGES is None:\n        with open(os.path.join(_CHART_DIR, \"preflop_ranges.json\"), \"r\", encoding=\"utf-8\") as fh:\n            _RANGES = json.load(fh)\n    return _RANGES\n\n\n# ------------------------------------------------------------ pot maths ---\n\ndef pot_odds(call_amount: float, pot_before_call: float):\n    \"\"\"Break-even equity for a call, as a fraction.\"\"\"\n    total = pot_before_call + call_amount\n    return call_amount / total if total > 0 else 0.0\n\n\ndef bet_pct_pot(bet: float, pot: float):\n    return 100.0 * bet / pot if pot else 0.0\n\n\ndef mdf(bet: float, pot: float):\n    \"\"\"Minimum defence frequency against a bet of `bet` into `pot`.\"\"\"\n    if bet <= 0:\n        return 1.0\n    return pot / (pot + bet)\n\n\ndef required_fold_equity(bet: float, pot: float):\n    \"\"\"Fold frequency a pure bluff needs to break even.\"\"\"\n    if bet <= 0:\n        return 0.0\n    return bet / (pot + bet)\n\n\ndef spr(effective_stack: float, pot: float):\n    return effective_stack / pot if pot else float(\"inf\")\n\n\ndef ev_call(equity: float, pot_before_call: float, call_amount: float):\n    \"\"\"EV of calling, relative to folding (which is 0).\"\"\"\n    return equity * (pot_before_call + call_amount) - call_amount\n\n\n# -------------------------------------------------------- board texture ---\n\ndef board_texture(board) -> dict:\n    \"\"\"Describe a 3-5 card board: pairing, suits, connectedness, high cards.\"\"\"\n    if len(board) < 3:\n        return {}\n    ranks = sorted((card_rank(c) for c in board), reverse=True)\n    suits = [card_suit(c) for c in board]\n    counts = {}\n    for r in ranks:\n        counts[r] = counts.get(r, 0) + 1\n    suit_counts = {}\n    for s in suits:\n        suit_counts[s] = suit_counts.get(s, 0) + 1\n    max_suit = max(suit_counts.values())\n\n    unique = sorted(set(ranks), reverse=True)\n    gaps = [unique[i] - unique[i + 1] for i in range(len(unique) - 1)]\n    connected = sum(1 for g in gaps if g <= 2)\n\n    paired = any(v >= 2 for v in counts.values())\n    trips = any(v >= 3 for v in counts.values())\n    high_cards = sum(1 for r in ranks if r >= 8)   # T or better\n\n    if max_suit >= 3 and len(board) == 3:\n        suit_note = \"monotone\"\n    elif max_suit >= 4:\n        suit_note = \"four-flush\"\n    elif max_suit == 2:\n        suit_note = \"two-tone\"\n    else:\n        suit_note = \"rainbow\"\n\n    wetness = 0\n    wetness += 2 if max_suit >= 3 else (1 if max_suit == 2 else 0)\n    wetness += connected\n    wetness += 1 if high_cards >= 2 else 0\n    if paired:\n        wetness -= 1\n\n    return {\n        \"paired\": paired,\n        \"trips\": trips,\n        \"suit\": suit_note,\n        \"max_suit_count\": max_suit,\n        \"connected_steps\": connected,\n        \"high_card_count\": high_cards,\n        \"wetness\": max(0, wetness),\n        \"label\": \"wet / dynamic\" if wetness >= 3 else (\"semi-wet\" if wetness == 2 else \"dry / static\"),\n        \"text\": cards_str(board),\n    }\n\n\n# --------------------------------------------------- hero decision walk ---\n\nclass Decision:\n    \"\"\"One spot where the hero had to act.\"\"\"\n\n    def __init__(self, **kw):\n        self.__dict__.update(kw)\n\n    def __repr__(self):\n        return \"<%s %s pot=%.2f to_call=%.2f>\" % (\n            self.street, self.action.verb, self.pot_before, self.to_call)\n\n\ndef _effective_stack(hand, hero_name, live_names):\n    hero = hand.player(hero_name)\n    others = [hand.player(n) for n in live_names if n != hero_name]\n    others = [p for p in others if p]\n    if not hero or not others:\n        return hero.stack if hero else 0.0\n    return min(hero.stack, max(p.stack for p in others))\n\n\ndef walk(hand, hero_name=\"Hero\", villain_range=None, equity_iters=6000,\n         exact_limit=None):\n    \"\"\"Return a Decision for every hero action, with the maths attached.\"\"\"\n    hero = hand.player(hero_name)\n    if hero is None:\n        return []\n\n    pot = 0.0\n    street_invested = {}\n    street_level = {}\n    live = {p.name for p in hand.players}\n    decisions = []\n    hero_in = 0.0   # everything the hero has put in so far, antes included\n\n    for a in hand.actions:\n        street = a.street\n        street_invested.setdefault(street, {})\n        street_level.setdefault(street, 0.0)\n        inv = street_invested[street]\n\n        if a.player == hero_name and a.verb not in (POST, RETURN, STRADDLE, \"show\", \"muck\"):\n            to_call = max(0.0, street_level[street] - inv.get(hero_name, 0.0))\n            # A bet bigger than the hero's remaining stack can only be called\n            # for what is left; the rest goes back to the bettor.\n            pot_eff = pot\n            behind = max(0.0, hero.stack - hero_in)\n            if to_call > behind:\n                pot_eff = pot - (to_call - behind)\n                to_call = behind\n            eff = _effective_stack(hand, hero_name, live)\n            board = hand.board_at(street)\n            d = Decision(\n                street=street,\n                action=a,\n                pot_before=pot_eff,\n                to_call=to_call,\n                pot_odds=pot_odds(to_call, pot_eff) if to_call > 0 else None,\n                spr=spr(eff - inv.get(hero_name, 0.0), pot) if pot else None,\n                effective_stack=eff,\n                players_live=len(live),\n                board=list(board),\n                texture=board_texture(board) if len(board) >= 3 else {},\n                hole=list(hero.hole_cards),\n                bb=hand.bb_size,\n                equity=None,\n                ev_of_call=None,\n                required_fold_equity=None,\n                bet_pct=None,\n                mdf=None,\n                made_hand=\"\",\n                assumed_range=villain_range if isinstance(villain_range, str) else None,\n            )\n            if hero.hole_cards and len(board) >= 3:\n                d.made_hand = describe(evaluate(list(hero.hole_cards) + list(board)))\n            if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n                d.bet_pct = bet_pct_pot(a.amount, pot)\n                d.required_fold_equity = required_fold_equity(a.amount, pot)\n            if to_call > 0:\n                d.mdf = mdf(to_call, pot_eff)\n            street_range = villain_range\n            if isinstance(villain_range, dict) and villain_range:\n                # Per-street ranges: fall back to the most recent street given.\n                street_range = None\n                for s in STREETS[: STREETS.index(street) + 1]:\n                    if villain_range.get(s):\n                        street_range = villain_range[s]\n                d.assumed_range = street_range\n            if street_range and hero.hole_cards:\n                try:\n                    res = calculate(list(hero.hole_cards), [street_range], board,\n                                    iterations=equity_iters, seed=7,\n                                    exact_limit=exact_limit)\n                    d.equity = res.equity\n                    if to_call > 0:\n                        d.ev_of_call = ev_call(res.equity, pot_eff, to_call)\n                except Exception:\n                    pass\n            decisions.append(d)\n\n        # advance the pot / levels\n        if a.player == hero_name:\n            if a.verb == RETURN:\n                hero_in -= a.amount\n            elif a.verb in (POST, STRADDLE, CALL, BET, RAISE, ALLIN):\n                hero_in += a.amount\n        if a.verb == RETURN:\n            pot -= a.amount\n            inv[a.player] = inv.get(a.player, 0.0) - a.amount\n        elif a.verb in (POST, STRADDLE, CALL, BET, RAISE, ALLIN):\n            pot += a.amount\n            if not (a.verb == POST and \"ante\" in (a.note or \"\")):\n                inv[a.player] = inv.get(a.player, 0.0) + a.amount\n                street_level[street] = max(street_level[street], inv[a.player])\n        elif a.verb == FOLD:\n            live.discard(a.player)\n\n    return decisions\n\n\ndef summarise_decision(d) -> str:\n    \"\"\"One readable block of maths for a single decision.\"\"\"\n    out = []\n    head = \"%s: hero %s\" % (d.street.upper(), d.action.verb)\n    if d.action.amount:\n        head += \" %.2f\" % d.action.amount\n    out.append(head)\n    if d.board:\n        out.append(\"  board %s  (%s)\" % (cards_str(d.board), d.texture.get(\"label\", \"\")))\n    if d.made_hand:\n        out.append(\"  hero has %s  [%s]\" % (d.made_hand, cards_str(d.hole)))\n    out.append(\"  pot %.2f (%.1f bb)   effective stack %.2f (%.1f bb)\"\n               % (d.pot_before, d.pot_before / d.bb, d.effective_stack, d.effective_stack / d.bb))\n    if d.spr is not None:\n        out.append(\"  SPR %.1f\" % d.spr)\n    if d.to_call > 0:\n        out.append(\"  facing %.2f into %.2f  ->  pot odds %.1f%% needed, MDF %.0f%%\"\n                   % (d.to_call, d.pot_before, 100 * d.pot_odds, 100 * d.mdf))\n    if d.bet_pct is not None:\n        out.append(\"  sizing %.0f%% pot  ->  needs %.0f%% folds to break even as a bluff\"\n                   % (d.bet_pct, 100 * d.required_fold_equity))\n    if d.equity is not None:\n        assumed = getattr(d, \"assumed_range\", None)\n        if isinstance(assumed, str) and assumed:\n            pct = range_percent(remove_blockers(parse_range(assumed),\n                                                list(d.hole) + list(d.board)))\n            out.append(\"  assumed villain range (%.0f%% of hands): %s\" % (pct, assumed))\n        elif isinstance(assumed, dict) and assumed:\n            pct = range_percent(remove_blockers(assumed, list(d.hole) + list(d.board)))\n            out.append(\"  assumed villain range: %.0f%% of hands (%d combos)\"\n                       % (pct, len(assumed)))\n        out.append(\"  equity vs assumed range: %.1f%%\" % (100 * d.equity))\n        if d.ev_of_call is not None:\n            verdict = \"profitable\" if d.ev_of_call > 0 else \"losing\"\n            out.append(\"  EV(call) = %+.2f  (%s)\" % (d.ev_of_call, verdict))\n    return \"\\n\".join(out)\n\n\ndef hand_report(hand, hero_name=\"Hero\", villain_range=None) -> str:\n    \"\"\"Full text breakdown of one hand from the hero's seat.\"\"\"\n    hero = hand.player(hero_name)\n    lines = []\n    lines.append(\"Hand %s  %s  %g/%g%s  %d-handed\"\n                 % (hand.hand_id, hand.game, hand.small_blind, hand.big_blind,\n                    (\" ante %g\" % hand.ante) if hand.ante else \"\", len(hand.players)))\n    if hero:\n        lines.append(\"Hero in %s with [%s], stack %.2f (%.0f bb)\"\n                     % (hero.position, cards_str(hero.hole_cards), hero.stack,\n                        hero.stack / hand.bb_size))\n    lines.append(\"\")\n    for street in STREETS:\n        acts = hand.street_actions(street)\n        if not acts:\n            continue\n        board = hand.board_at(street)\n        header = street.upper()\n        if board:\n            header += \"  [%s]\" % cards_str(board)\n        lines.append(header)\n        for a in acts:\n            tag = \" *\" if a.player == hero_name else \"  \"\n            p = hand.player(a.player)\n            money = (\" %.2f\" % a.amount) if a.amount else \"\"\n            lines.append(\"   %s%-8s %-4s %s%s\"\n                         % (tag, a.player[:8], p.position if p else \"\", a.verb, money))\n        lines.append(\"\")\n    lines.append(\"Result: pot %.2f, rake %.2f, hero net %+.2f (%+.1f bb)\"\n                 % (hand.total_pot, hand.rake, hero.net if hero else 0.0,\n                    (hero.net / hand.bb_size) if hero else 0.0))\n    shown = [p for p in hand.players if p.hole_cards and p.name != hero_name]\n    if shown:\n        lines.append(\"Shown down: \" + \", \".join(\n            \"%s %s (%s)\" % (p.name[:8], cards_str(p.hole_cards), p.shown_rank or \"\")\n            for p in shown))\n    lines.append(\"\")\n    lines.append(\"DECISION MATHS\")\n    lines.append(\"-\" * 60)\n    for d in walk(hand, hero_name, villain_range):\n        lines.append(summarise_decision(d))\n        lines.append(\"\")\n    return \"\\n\".join(lines)\n","pokerbrain/cards.py":"\"\"\"Card representation.\n\nA card is an int 0..51 encoded as rank * 4 + suit.\nRanks are 0..12 mapping to 2..A; suits are 0..3 mapping to c,d,h,s.\nInteger encoding keeps the evaluator and Monte-Carlo loops fast.\n\"\"\"\n\nfrom __future__ import annotations\n\nRANK_CHARS = \"23456789TJQKA\"\nSUIT_CHARS = \"cdhs\"\n\nSUIT_SYMBOLS = {\"\\u2663\": \"c\", \"\\u2666\": \"d\", \"\\u2665\": \"h\", \"\\u2660\": \"s\"}\n\nRANK_TO_INT = {c: i for i, c in enumerate(RANK_CHARS)}\nSUIT_TO_INT = {c: i for i, c in enumerate(SUIT_CHARS)}\n\n# Human-facing rank value: 2..14\nRANK_VALUE = {i: i + 2 for i in range(13)}\n\n\nclass CardError(ValueError):\n    \"\"\"Raised when a card string cannot be parsed.\"\"\"\n\n\ndef make_card(rank: int, suit: int) -> int:\n    return rank * 4 + suit\n\n\ndef card_rank(card: int) -> int:\n    return card >> 2\n\n\ndef card_suit(card: int) -> int:\n    return card & 3\n\n\ndef parse_card(text: str) -> int:\n    \"\"\"Parse a single card such as 'As', 'th', '9D' or 'A\\u2660'.\"\"\"\n    s = text.strip()\n    if len(s) != 2:\n        raise CardError(f\"cannot parse card {text!r}\")\n    r, u = s[0], s[1]\n    u = SUIT_SYMBOLS.get(u, u)\n    r = r.upper()\n    u = u.lower()\n    if r not in RANK_TO_INT:\n        raise CardError(f\"bad rank in card {text!r}\")\n    if u not in SUIT_TO_INT:\n        raise CardError(f\"bad suit in card {text!r}\")\n    return make_card(RANK_TO_INT[r], SUIT_TO_INT[u])\n\n\ndef card_str(card: int) -> str:\n    return RANK_CHARS[card_rank(card)] + SUIT_CHARS[card_suit(card)]\n\n\ndef parse_cards(text: str) -> list[int]:\n    \"\"\"Parse a run of cards: 'AsKd', 'As Kd', '[As Kd]', 'As,Kd'.\"\"\"\n    cleaned = text.replace(\"[\", \" \").replace(\"]\", \" \").replace(\",\", \" \")\n    for sym, letter in SUIT_SYMBOLS.items():\n        cleaned = cleaned.replace(sym, letter)\n    tokens = cleaned.split()\n    cards: list[int] = []\n    for token in tokens:\n        if len(token) % 2 != 0:\n            raise CardError(f\"cannot split {token!r} into cards\")\n        for i in range(0, len(token), 2):\n            cards.append(parse_card(token[i : i + 2]))\n    if len(cards) != len(set(cards)):\n        raise CardError(f\"duplicate card in {text!r}\")\n    return cards\n\n\ndef cards_str(cards) -> str:\n    return \" \".join(card_str(c) for c in cards)\n\n\nFULL_DECK = tuple(range(52))\n","pokerbrain/equity.py":"\"\"\"Equity calculation: hand vs hand, hand vs range, range vs range.\n\nUses exact enumeration when the remaining sample space is small enough and\nMonte Carlo otherwise. Every entry point takes an optional seed so results\nare reproducible when you re-run an analysis.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport itertools\nimport random\n\nfrom .evaluator import evaluate\nfrom .ranges import parse_range, remove_blockers, make_combo\n\n# Enumerate rather than sample when the full space is at most this large.\nEXACT_LIMIT = 600_000\n\n\nclass EquityResult:\n    \"\"\"Equity for the hero plus each villain seat.\"\"\"\n\n    def __init__(self, win, tie, lose, equity, villain_equities, samples, exact):\n        self.win = win\n        self.tie = tie\n        self.lose = lose\n        self.equity = equity\n        self.villain_equities = villain_equities\n        self.samples = samples\n        self.exact = exact\n\n    @property\n    def win_pct(self):\n        return 100.0 * self.win / self.samples if self.samples else 0.0\n\n    @property\n    def tie_pct(self):\n        return 100.0 * self.tie / self.samples if self.samples else 0.0\n\n    @property\n    def equity_pct(self):\n        return 100.0 * self.equity\n\n    def __repr__(self):\n        kind = \"exact\" if self.exact else \"%d sims\" % self.samples\n        return \"<Equity %.2f%% (win %.2f%% tie %.2f%%, %s)>\" % (\n            self.equity_pct, self.win_pct, self.tie_pct, kind)\n\n\ndef _as_weighted(spec, dead):\n    \"\"\"Normalise a villain spec (string range, dict, or 2 cards) to {combo: w}.\"\"\"\n    if isinstance(spec, dict):\n        weighted = dict(spec)\n    elif isinstance(spec, str):\n        weighted = parse_range(spec)\n    elif isinstance(spec, (list, tuple)) and len(spec) == 2 and all(isinstance(c, int) for c in spec):\n        weighted = {make_combo(spec[0], spec[1]): 1.0}\n    else:\n        raise ValueError(\"cannot interpret villain spec %r\" % (spec,))\n    weighted = remove_blockers(weighted, dead)\n    if not weighted:\n        raise ValueError(\"villain range is empty after removing blocked cards\")\n    return weighted\n\n\ndef _score_showdown(hero_score, villain_scores):\n    \"\"\"Return (hero_share, villain_shares, outcome) splitting the pot by ties.\"\"\"\n    best = max([hero_score] + list(villain_scores))\n    winners = (1 if hero_score == best else 0) + sum(1 for s in villain_scores if s == best)\n    share = 1.0 / winners\n    hero_share = share if hero_score == best else 0.0\n    villain_shares = [share if s == best else 0.0 for s in villain_scores]\n    if hero_score == best:\n        outcome = \"win\" if winners == 1 else \"tie\"\n    else:\n        outcome = \"lose\"\n    return hero_share, villain_shares, outcome\n\n\ndef calculate(hero, villains, board=(), iterations=25_000, seed=None, exact_limit=None):\n    \"\"\"Equity for `hero` (2 cards) against one or more villain range specs.\n\n    board  -- 0, 3, 4 or 5 community cards already dealt\n    villains -- list of range strings / {combo: weight} dicts / explicit hands\n    \"\"\"\n    hero = list(hero)\n    board = list(board)\n    if len(hero) != 2:\n        raise ValueError(\"hero must hold exactly 2 cards\")\n    if len(board) not in (0, 3, 4, 5):\n        raise ValueError(\"board must have 0, 3, 4 or 5 cards\")\n\n    dead = set(hero) | set(board)\n    if len(dead) != len(hero) + len(board):\n        raise ValueError(\"duplicate card between hole cards and board\")\n\n    if not isinstance(villains, (list, tuple)):\n        villains = [villains]\n    ranges = [_as_weighted(v, dead) for v in villains]\n\n    deck = [c for c in range(52) if c not in dead]\n    to_come = 5 - len(board)\n\n    # Decide exact vs Monte Carlo.\n    combo_space = 1\n    for r in ranges:\n        combo_space *= len(r)\n    board_space = 1\n    for i in range(to_come):\n        board_space = board_space * (len(deck) - i) // (i + 1)\n    limit = EXACT_LIMIT if exact_limit is None else exact_limit\n    exact = combo_space * board_space <= limit\n\n    if exact:\n        return _exact(hero, ranges, board, deck, to_come)\n    return _monte_carlo(hero, ranges, board, deck, to_come, iterations, seed)\n\n\ndef _exact(hero, ranges, board, deck, to_come):\n    n = len(ranges)\n    win = tie = lose = 0.0\n    hero_eq = 0.0\n    villain_eq = [0.0] * n\n    total_weight = 0.0\n\n    for assignment in itertools.product(*[list(r.items()) for r in ranges]):\n        used = set(hero) | set(board)\n        weight = 1.0\n        clash = False\n        for combo, w in assignment:\n            if combo[0] in used or combo[1] in used:\n                clash = True\n                break\n            used.add(combo[0])\n            used.add(combo[1])\n            weight *= w\n        if clash or weight == 0.0:\n            continue\n\n        remaining = [c for c in deck if c not in used]\n        for extra in itertools.combinations(remaining, to_come):\n            full_board = board + list(extra)\n            hs = evaluate(hero + full_board)\n            vs = [evaluate(list(combo) + full_board) for combo, _ in assignment]\n            hero_share, villain_shares, outcome = _score_showdown(hs, vs)\n            hero_eq += hero_share * weight\n            for i, sh in enumerate(villain_shares):\n                villain_eq[i] += sh * weight\n            total_weight += weight\n            if outcome == \"win\":\n                win += weight\n            elif outcome == \"tie\":\n                tie += weight\n            else:\n                lose += weight\n\n    if total_weight == 0:\n        raise ValueError(\"no valid card assignments (ranges fully blocked)\")\n    equity = hero_eq / total_weight\n    villain_equities = [e / total_weight for e in villain_eq]\n    return EquityResult(win, tie, lose, equity, villain_equities, total_weight, True)\n\n\ndef _monte_carlo(hero, ranges, board, deck, to_come, iterations, seed):\n    rng = random.Random(seed)\n    pools = []\n    for r in ranges:\n        combos = list(r.keys())\n        weights = [r[c] for c in combos]\n        pools.append((combos, weights))\n\n    win = tie = lose = 0.0\n    hero_eq = 0.0\n    villain_eq = [0.0] * len(ranges)\n    samples = 0\n    attempts = 0\n    max_attempts = iterations * 40\n\n    while samples < iterations and attempts < max_attempts:\n        attempts += 1\n        used = set(hero) | set(board)\n        hands = []\n        ok = True\n        for combos, weights in pools:\n            combo = rng.choices(combos, weights=weights, k=1)[0]\n            if combo[0] in used or combo[1] in used:\n                ok = False\n                break\n            used.add(combo[0])\n            used.add(combo[1])\n            hands.append(combo)\n        if not ok:\n            continue\n\n        remaining = [c for c in deck if c not in used]\n        extra = rng.sample(remaining, to_come) if to_come else []\n        full_board = board + extra\n        hs = evaluate(hero + full_board)\n        vs = [evaluate(list(h) + full_board) for h in hands]\n        hero_share, villain_shares, outcome = _score_showdown(hs, vs)\n        hero_eq += hero_share\n        for i, sh in enumerate(villain_shares):\n            villain_eq[i] += sh\n        samples += 1\n        if outcome == \"win\":\n            win += 1\n        elif outcome == \"tie\":\n            tie += 1\n        else:\n            lose += 1\n\n    if samples == 0:\n        raise ValueError(\"could not sample any valid runout (ranges fully blocked)\")\n    equity = hero_eq / samples\n    villain_equities = [e / samples for e in villain_eq]\n    return EquityResult(win, tie, lose, equity, villain_equities, samples, False)\n\n\ndef range_vs_range(hero_spec, villain_spec, board=(), iterations=20_000, seed=None):\n    \"\"\"Average equity of one range against another.\"\"\"\n    board = list(board)\n    hero_range = remove_blockers(\n        parse_range(hero_spec) if isinstance(hero_spec, str) else dict(hero_spec), board)\n    rng = random.Random(seed)\n    combos = list(hero_range.keys())\n    weights = [hero_range[c] for c in combos]\n    total = 0.0\n    count = 0\n    per_combo = {}\n    picks = max(1, iterations // 200)\n    for _ in range(picks):\n        hero = rng.choices(combos, weights=weights, k=1)[0]\n        try:\n            res = calculate(list(hero), [villain_spec], board, iterations=200, seed=rng.random())\n        except ValueError:\n            continue\n        per_combo.setdefault(hero, []).append(res.equity)\n        total += res.equity\n        count += 1\n    avg = total / count if count else 0.0\n    detail = {c: sum(v) / len(v) for c, v in per_combo.items()}\n    return avg, detail\n\n\ndef equity_vs_random(hero, iterations=8000, seed=0):\n    \"\"\"Heads-up equity against a uniformly random hand (used for the 169 chart).\"\"\"\n    rng = random.Random(seed)\n    hero = list(hero)\n    deck = [c for c in range(52) if c not in hero]\n    total = 0.0\n    for _ in range(iterations):\n        sample = rng.sample(deck, 7)\n        villain = sample[:2]\n        board = sample[2:]\n        hs = evaluate(hero + board)\n        vs = evaluate(villain + board)\n        if hs > vs:\n            total += 1.0\n        elif hs == vs:\n            total += 0.5\n    return total / iterations\n","pokerbrain/evaluator.py":"\"\"\"Fast 5/6/7-card Texas Hold'em hand evaluator.\n\nevaluate(cards) returns a single int; higher is strictly better, and two\nhands compare equal if and only if they split the pot. The score packs the\ncategory in the high bits followed by up to five tiebreak ranks:\n\n    (category << 20) | (k1 << 16) | (k2 << 12) | (k3 << 8) | (k4 << 4) | k5\n\nRanks in the tiebreak slots use natural values 2..14 (14 = ace).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .cards import card_rank, card_suit\n\nHIGH_CARD = 0\nPAIR = 1\nTWO_PAIR = 2\nTRIPS = 3\nSTRAIGHT = 4\nFLUSH = 5\nFULL_HOUSE = 6\nQUADS = 7\nSTRAIGHT_FLUSH = 8\n\nCATEGORY_NAMES = {\n    HIGH_CARD: \"High Card\",\n    PAIR: \"One Pair\",\n    TWO_PAIR: \"Two Pair\",\n    TRIPS: \"Three of a Kind\",\n    STRAIGHT: \"Straight\",\n    FLUSH: \"Flush\",\n    FULL_HOUSE: \"Full House\",\n    QUADS: \"Four of a Kind\",\n    STRAIGHT_FLUSH: \"Straight Flush\",\n}\n\n\ndef _pack(category: int, kickers) -> int:\n    score = category << 20\n    shift = 16\n    for k in kickers[:5]:\n        score |= k << shift\n        shift -= 4\n    return score\n\n\ndef _straight_high(value_mask: int) -> int:\n    \"\"\"Highest straight top-card given a bitmask over values 2..14, else 0.\"\"\"\n    mask = value_mask\n    if mask & (1 << 14):\n        mask |= 1 << 1  # ace plays low for the wheel\n    for high in range(14, 4, -1):\n        window = (1 << high) | (1 << (high - 1)) | (1 << (high - 2)) | (1 << (high - 3)) | (1 << (high - 4))\n        if mask & window == window:\n            return high\n    return 0\n\n\ndef evaluate(cards) -> int:\n    \"\"\"Evaluate the best 5-card hand from 5, 6 or 7 cards.\"\"\"\n    value_mask = 0\n    suit_masks = [0, 0, 0, 0]\n    suit_counts = [0, 0, 0, 0]\n    rank_counts = [0] * 15\n\n    for card in cards:\n        value = card_rank(card) + 2\n        suit = card_suit(card)\n        value_mask |= 1 << value\n        suit_masks[suit] |= 1 << value\n        suit_counts[suit] += 1\n        rank_counts[value] += 1\n\n    # --- flush family -------------------------------------------------\n    for suit in range(4):\n        if suit_counts[suit] >= 5:\n            smask = suit_masks[suit]\n            sf_high = _straight_high(smask)\n            if sf_high:\n                return _pack(STRAIGHT_FLUSH, [sf_high])\n            top = []\n            for value in range(14, 1, -1):\n                if smask & (1 << value):\n                    top.append(value)\n                    if len(top) == 5:\n                        break\n            return _pack(FLUSH, top)\n\n    # --- paired families ----------------------------------------------\n    quads = []\n    trips = []\n    pairs = []\n    singles = []\n    for value in range(14, 1, -1):\n        count = rank_counts[value]\n        if count == 4:\n            quads.append(value)\n        elif count == 3:\n            trips.append(value)\n        elif count == 2:\n            pairs.append(value)\n        elif count == 1:\n            singles.append(value)\n\n    if quads:\n        quad = quads[0]\n        rest = [v for v in range(14, 1, -1) if v != quad and rank_counts[v]]\n        return _pack(QUADS, [quad, rest[0]])\n\n    if trips and (len(trips) > 1 or pairs):\n        trip = trips[0]\n        pair = trips[1] if len(trips) > 1 else pairs[0]\n        if pairs and len(trips) > 1:\n            pair = max(trips[1], pairs[0])\n        return _pack(FULL_HOUSE, [trip, pair])\n\n    straight = _straight_high(value_mask)\n    if straight:\n        return _pack(STRAIGHT, [straight])\n\n    if trips:\n        trip = trips[0]\n        kickers = [v for v in singles][:2]\n        return _pack(TRIPS, [trip] + kickers)\n\n    if len(pairs) >= 2:\n        hi, lo = pairs[0], pairs[1]\n        rest = [v for v in range(14, 1, -1) if v not in (hi, lo) and rank_counts[v]]\n        return _pack(TWO_PAIR, [hi, lo, rest[0]])\n\n    if pairs:\n        return _pack(PAIR, [pairs[0]] + singles[:3])\n\n    return _pack(HIGH_CARD, singles[:5])\n\n\ndef hand_category(score: int) -> int:\n    return score >> 20\n\n\ndef describe(score: int) -> str:\n    \"\"\"Human-readable description of an evaluated score.\"\"\"\n    from .cards import RANK_CHARS\n\n    cat = hand_category(score)\n    k = [(score >> s) & 0xF for s in (16, 12, 8, 4, 0)]\n    name = lambda v: RANK_CHARS[v - 2] if 2 <= v <= 14 else \"?\"\n    if cat == STRAIGHT_FLUSH:\n        return \"Royal Flush\" if k[0] == 14 else f\"Straight Flush, {name(k[0])} high\"\n    if cat == QUADS:\n        return f\"Four of a Kind, {name(k[0])}s\"\n    if cat == FULL_HOUSE:\n        return f\"Full House, {name(k[0])}s full of {name(k[1])}s\"\n    if cat == FLUSH:\n        return f\"Flush, {name(k[0])} high\"\n    if cat == STRAIGHT:\n        return f\"Straight, {name(k[0])} high\"\n    if cat == TRIPS:\n        return f\"Three of a Kind, {name(k[0])}s\"\n    if cat == TWO_PAIR:\n        return f\"Two Pair, {name(k[0])}s and {name(k[1])}s\"\n    if cat == PAIR:\n        return f\"One Pair, {name(k[0])}s\"\n    return f\"High Card, {name(k[0])}\"\n","pokerbrain/grading.py":"\"\"\"Grade the hero's decisions in a hand: what was played well, what to fix.\n\nGrades are built from the decision maths in `analysis.walk()`. The equity\nbehind them is measured against a *modelled* opponent range (`rangemodel`),\nso every grade is an estimate - strong enough to decide which hands deserve a\nsecond look, not strong enough to be a verdict on its own.\n\nEach grade carries a size in big blinds, so a session's hands can be ranked by\nhow much money the decisions made or cost:\n\n  calls  - EV of the call relative to folding\n  folds  - EV of the call that was passed up (positive = a fold that cost money)\n  raises and bets - a rough size from the amount and the equity behind it\n  preflop habits  - open-limps and straddles, which lose steadily\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .cards import cards_str\nfrom .model import ALLIN, BET, CALL, FOLD, POST, PREFLOP, RAISE, RETURN, RIVER, STRADDLE\n\nGOOD = \"good\"\nBAD = \"bad\"\nREVIEW = \"review\"\n\n# Smallest EV (in big blinds) worth reporting. Smaller swings are noise from\n# the range model rather than a decision worth studying.\nMIN_CALL_BB = 1.0\nMIN_FOLD_BB = 2.0\nMIN_FOLD_POT_BB = 6.0\n\n\ndef _pct(x):\n    return \"%.0f%%\" % (100 * x)\n\n\ndef _about(x):\n    \"\"\"An equity estimate in words: 'about 38%', or 'almost none'.\"\"\"\n    return \"almost none\" if x < 0.005 else \"about %.0f%%\" % (100 * x)\n\n\ndef _street(name):\n    \"\"\"Where a decision happened, ready to follow a verb: 'preflop', 'on the turn'.\"\"\"\n    return \"preflop\" if name == PREFLOP else \"on the \" + name\n\n\ndef _holding(d):\n    if not d.made_hand:\n        return cards_str(d.hole) if d.hole else \"your hand\"\n    kind, _, detail = d.made_hand.partition(\", \")\n    return kind.lower() + (\", \" + detail if detail else \"\")\n\n\ndef _item(kind, street, size_bb, text, cat=\"\", facts=None):\n    return {\"kind\": kind, \"street\": street, \"bb\": round(max(0.0, size_bb), 1), \"text\": text,\n            \"cat\": cat, \"facts\": facts or {}}\n\n\ndef _facts(d, bb, ev_bb=None):\n    \"\"\"The numbers behind a decision, for lessons and quizzes.\"\"\"\n    out = {\"potBB\": round(d.pot_before / bb, 1), \"toCallBB\": round(d.to_call / bb, 1),\n           \"hand\": _holding(d), \"cards\": cards_str(d.hole) if d.hole else \"\",\n           \"board\": cards_str(d.board) if d.board else \"\"}\n    if d.pot_odds is not None:\n        out[\"potOdds\"] = round(100 * d.pot_odds)\n    if d.equity is not None:\n        out[\"equity\"] = round(100 * d.equity)\n    if ev_bb is not None:\n        out[\"evBB\"] = round(ev_bb, 1)\n    if d.action.amount:\n        out[\"amountBB\"] = round(d.action.amount / bb, 1)\n    return out\n\n\ndef _is_call(d):\n    a = d.action\n    if a.verb == CALL:\n        return True\n    return a.verb == ALLIN and d.to_call > 0 and a.amount <= d.to_call + 1e-6\n\n\ndef _is_aggressive(d):\n    a = d.action\n    return a.verb in (BET, RAISE) or (a.verb == ALLIN and not _is_call(d) and a.amount > 0)\n\n\ndef preflop_habits(hand, hero_name=\"Hero\"):\n    \"\"\"Open-limps and straddles.\"\"\"\n    out = []\n    hero = hand.player(hero_name)\n    if not hero:\n        return out\n    bb = hand.bb_size\n    raised = False\n    for a in hand.actions:\n        if a.street != PREFLOP:\n            continue\n        if a.verb == STRADDLE and a.player == hero_name:\n            out.append(_item(\n                BAD, PREFLOP, a.amount / bb,\n                \"You straddled: a %.0f bb blind raise with a random hand, out of position. \"\n                \"It loses money over time - stop straddling.\" % (a.amount / bb),\n                cat=\"straddle\"))\n            continue\n        if a.verb in (POST, RETURN, STRADDLE):\n            continue\n        if a.player == hero_name:\n            if a.verb == CALL and not raised:\n                out.append(_item(\n                    BAD, PREFLOP, 1.0,\n                    \"You open-limped from the %s. When nobody has raised, raise or fold - \"\n                    \"limping gives up the initiative and invites the blinds in cheaply.\"\n                    % (hero.position or \"table\"), cat=\"limp\",\n                    facts={\"position\": hero.position}))\n            break\n        if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n            raised = True\n    return out\n\n\ndef grade_decisions(hand, decisions, hero_name=\"Hero\"):\n    hero = hand.player(hero_name)\n    if not hero:\n        return []\n    bb = hand.bb_size\n    lost_at_showdown = hero.showed and hero.net < 0\n    out = []\n\n    for d in decisions:\n        a = d.action\n        street = d.street\n        eq = d.equity\n\n        if eq is None:\n            continue\n\n        if _is_call(d) and d.ev_of_call is not None:\n            ev_bb = d.ev_of_call / bb\n            if ev_bb <= -MIN_CALL_BB:\n                out.append(_item(\n                    BAD, street, -ev_bb,\n                    \"Called %.1f bb %s with %s. You needed %s equity but had only about \"\n                    \"%s against their likely range - folding was better (cost about %.1f bb).\"\n                    % (d.to_call / bb, _street(street), _holding(d), _pct(d.pot_odds),\n                       _about(eq).replace(\"about \", \"\"), -ev_bb),\n                    cat=\"call_\" + street, facts=_facts(d, bb, ev_bb)))\n            elif ev_bb >= MIN_CALL_BB:\n                out.append(_item(\n                    GOOD, street, ev_bb,\n                    \"Good call %s with %s: you needed %s and had %s \"\n                    \"(worth about +%.1f bb).\"\n                    % (_street(street), _holding(d), _pct(d.pot_odds), _about(eq), ev_bb),\n                    cat=\"good_call\", facts=_facts(d, bb, ev_bb)))\n            continue\n\n        if a.verb == FOLD and d.ev_of_call is not None and d.to_call > 0:\n            ev_bb = d.ev_of_call / bb\n            if ev_bb >= MIN_FOLD_BB:\n                out.append(_item(\n                    BAD, street, ev_bb,\n                    \"Folded %s with %s, getting a good price: you needed %s and had %s. \"\n                    \"Calling was worth about +%.1f bb.\"\n                    % (_street(street), _holding(d), _pct(d.pot_odds), _about(eq), ev_bb),\n                    cat=\"overfold\", facts=_facts(d, bb, ev_bb)))\n            elif ev_bb <= -MIN_CALL_BB and d.pot_before / bb >= MIN_FOLD_POT_BB:\n                out.append(_item(\n                    GOOD, street, -ev_bb,\n                    \"Good fold %s with %s: you needed %s and had only %s - \"\n                    \"saved about %.1f bb.\"\n                    % (_street(street), _holding(d), _pct(d.pot_odds), _about(eq), -ev_bb),\n                    cat=\"good_fold\", facts=_facts(d, bb, ev_bb)))\n            continue\n\n        if _is_aggressive(d):\n            amount_bb = a.amount / bb\n            facing = d.to_call > 0\n            if eq >= 0.60 and street != PREFLOP:\n                out.append(_item(\n                    GOOD, street, max(1.0, amount_bb * (eq - 0.5)),\n                    \"%s for value %s with %s - %s equity against their range.\"\n                    % (\"Raised\" if facing else \"Bet\", _street(street), _holding(d), _about(eq)),\n                    cat=\"value_bet\", facts=_facts(d, bb)))\n            elif street == RIVER and facing and eq < 0.20:\n                out.append(_item(\n                    BAD, street, max(1.0, amount_bb * (0.5 - eq)),\n                    \"Raised the river with %s, which has %s against their range. \"\n                    \"A river raise like this mostly gets called by better hands - \"\n                    \"call or fold instead.\" % (_holding(d),\n                                                \"almost no equity\" if eq < 0.005\n                                                else \"only about %.0f%% equity\" % (100 * eq)),\n                    cat=\"river_raise\", facts=_facts(d, bb)))\n            elif street == RIVER and not facing and eq < 0.25 and lost_at_showdown:\n                out.append(_item(\n                    REVIEW, street, amount_bb * 0.3,\n                    \"Your river bet with %s (%s equity) was called and lost. \"\n                    \"Check whether this opponent folds enough for a bluff to work.\"\n                    % (_holding(d), _about(eq)),\n                    cat=\"river_bluff\", facts=_facts(d, bb)))\n    return out\n\n\ndef grade(hand, decisions, hero_name=\"Hero\"):\n    \"\"\"All grades for a hand plus the totals used to rank it.\"\"\"\n    items = preflop_habits(hand, hero_name) + grade_decisions(hand, decisions, hero_name)\n    good = round(sum(i[\"bb\"] for i in items if i[\"kind\"] == GOOD), 1)\n    bad = round(sum(i[\"bb\"] for i in items if i[\"kind\"] in (BAD, REVIEW)), 1)\n    return {\"items\": items, \"goodBB\": good, \"badBB\": bad}\n","pokerbrain/leaks.py":"\"\"\"Leak detection across a sample of hands.\n\nTwo kinds of finding:\n\n  * statistical  - a HUD stat sits outside the band a winning regular\n                   occupies, with enough sample to mean something.\n  * situational  - a concrete recurring spot that cost money, with the\n                   hands attached so they can be reviewed individually.\n\nEvery finding carries a confidence based on sample size. Poker variance is\nbrutal: 75 hands says almost nothing, 10,000 says a lot. The detector is\ndeliberately loud about which is which.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .cards import cards_str\nfrom .model import ALLIN, BET, CALL, CHECK, FLOP, FOLD, PREFLOP, RAISE, RIVER, TURN\nfrom .stats import BENCHMARKS, STAT_ORDER, compute\n\n# Sample sizes below which a stat is reported but not trusted.\nMIN_MEANINGFUL = {\n    \"vpip\": 100, \"pfr\": 100, \"rfi\": 80, \"3bet\": 60, \"fold_to_3bet\": 30,\n    \"4bet\": 30, \"steal\": 50, \"bb_fold_to_steal\": 40, \"limp\": 80,\n    \"cbet_flop\": 40, \"cbet_turn\": 30, \"cbet_river\": 25,\n    \"fold_to_cbet_flop\": 40, \"fold_to_cbet_turn\": 30,\n    \"wtsd\": 60, \"wsd\": 40, \"wwsf\": 60,\n}\n\n\nclass Finding:\n    def __init__(self, kind, title, detail, severity=\"medium\",\n                 confidence=\"low\", sample=0, hands=None, fix=\"\"):\n        self.kind = kind\n        self.title = title\n        self.detail = detail\n        self.severity = severity\n        self.confidence = confidence\n        self.sample = sample\n        self.hands = hands or []\n        self.fix = fix\n\n    def __repr__(self):\n        return \"<%s %s (%s)>\" % (self.severity, self.title, self.confidence)\n\n\ndef _confidence(sample, needed):\n    if sample >= needed:\n        return \"solid\"\n    if sample >= needed * 0.4:\n        return \"tentative\"\n    return \"too thin to trust\"\n\n\ndef showdown_split(hands, hero_name=\"Hero\"):\n    \"\"\"Split winnings into showdown (blue line) and non-showdown (red line).\n\n    Red line negative with blue line positive is the classic passive/\n    station profile: winning only by making hands, losing every pot that\n    does not reach showdown.\n    \"\"\"\n    # Each hand is converted at its own stakes, so mixed-stakes samples add up.\n    blue = red = 0.0\n    blue_money = red_money = 0.0\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero:\n            continue\n        if hero.showed or (hero.collected > 0 and hero.folded_street == \"\"\n                           and len(h.went_to_showdown) > 1):\n            blue += hero.net / h.bb_size\n            blue_money += hero.net\n        else:\n            red += hero.net / h.bb_size\n            red_money += hero.net\n    return {\"showdown_bb\": blue, \"non_showdown_bb\": red, \"total_bb\": blue + red,\n            \"showdown_money\": blue_money, \"non_showdown_money\": red_money,\n            \"total_money\": blue_money + red_money}\n\n\ndef statistical_leaks(hands, hero_name=\"Hero\"):\n    lines = compute(hands, hero_name=hero_name)\n    hero = lines.get(\"Hero\")\n    pool = lines.get(\"POOL\")\n    out = []\n    if not hero:\n        return out\n\n    for name in STAT_ORDER:\n        counter = hero.c.get(name)\n        if not counter or not counter.opp:\n            continue\n        lo, hi, label = BENCHMARKS[name]\n        val = counter.pct\n        needed = MIN_MEANINGFUL.get(name, 50)\n        conf = _confidence(counter.opp, needed)\n        pool_val = pool.c[name].pct if pool and pool.c.get(name) and pool.c[name].opp else None\n\n        if lo <= val <= hi:\n            continue\n        direction = \"too low\" if val < lo else \"too high\"\n        severity = \"high\" if (val < lo * 0.6 or val > hi * 1.6) else \"medium\"\n        detail = \"%s is %.1f%% over %d opportunities; a winning 6-max reg sits %d-%d%%.\" % (\n            label, val, counter.opp, lo, hi)\n        if pool_val is not None:\n            detail += \" Your pool runs %.1f%%.\" % pool_val\n        out.append(Finding(\"stat\", \"%s %s\" % (label, direction), detail,\n                           severity=severity, confidence=conf, sample=counter.opp,\n                           fix=_FIXES.get(name, \"\")))\n    return out\n\n\n_FIXES = {\n    \"vpip\": \"Tighten the bottom of your opening and cold-calling ranges, especially out of position.\",\n    \"pfr\": \"Convert limps and flat calls into raises. A healthy VPIP/PFR gap is about 4-6 points, not 20.\",\n    \"rfi\": \"When it folds to you, raise more. Folding a playable hand first-in gives up the blinds and the initiative.\",\n    \"3bet\": \"Add suited-ace and suited-broadway 3-bet bluffs against late-position opens.\",\n    \"fold_to_3bet\": \"Defend your opens more often in position; folding over half is exploitable.\",\n    \"steal\": \"Attack the blinds harder from CO/BTN/SB, particularly against players who fold too much.\",\n    \"bb_fold_to_steal\": \"Defend the big blind wider with suited and connected hands; you are getting a price.\",\n    \"limp\": \"Stop open-limping. Raise or fold; limping caps your range and invites multiway pots.\",\n    \"cbet_flop\": \"Bet more on boards that favour your range; check more on boards that favour theirs.\",\n    \"fold_to_cbet_flop\": \"Float and raise more on dry boards where the c-bettor's range is weak.\",\n    \"wtsd\": \"Reaching showdown too often usually means calling too many rivers with bluff-catchers.\",\n    \"wwsf\": \"Winning few pots that see a flop points to passivity after the flop; take more initiative.\",\n}\n\n\ndef situational_leaks(hands, hero_name=\"Hero\"):\n    out = []\n    # --- biggest losses --------------------------------------------------\n    losses = sorted((h for h in hands if h.player(hero_name)),\n                    key=lambda h: h.player(hero_name).net)[:5]\n    big = [h for h in losses if h.player(hero_name).net / h.bb_size < -20]\n    if big:\n        rows = []\n        for h in big:\n            hero = h.player(hero_name)\n            rows.append(\"  %s  %+.0f bb  %s [%s] on %s\"\n                        % (h.hand_id, hero.net / h.bb_size, hero.position,\n                           cards_str(hero.hole_cards), cards_str(h.board) or \"preflop\"))\n        out.append(Finding(\n            \"situational\", \"Largest pots lost\",\n            \"These hands dominate the sample's loss. Review each one street by \"\n            \"street before drawing conclusions from the aggregate stats:\\n\" + \"\\n\".join(rows),\n            severity=\"high\", confidence=\"n/a\", sample=len(big),\n            hands=[h.hand_id for h in big]))\n\n    # --- calling the river with a weak holding ---------------------------\n    river_calls = []\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero or RIVER not in h.streets_reached:\n            continue\n        acts = h.street_actions(RIVER)\n        for a in acts:\n            if a.player == hero_name and a.verb == CALL and a.amount / h.bb_size >= 8:\n                if hero.net < 0:\n                    river_calls.append((h, a))\n    if len(river_calls) >= 2:\n        rows = [\"  %s  called %.0f bb on the river with [%s], lost %.0f bb\"\n                % (h.hand_id, a.amount / h.bb_size,\n                   cards_str(h.player(hero_name).hole_cards),\n                   -h.player(hero_name).net / h.bb_size)\n
