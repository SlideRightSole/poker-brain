/* ------------------------------------------------------------ solver --- */
const ACT_CHECK = "#3f9a6b", ACT_FOLD = "#5f7c9c", ACT_ALLIN = "#8f2433";
const ACT_AGG = ["#e2b33c", "#e3843a", "#d45a3a", "#b53b3b"];
const GRID_RANKS = "AKQJT98765432";

function actColors(actions){
  let k = 0;
  return actions.map(a => a === "Check" || a === "Call" ? ACT_CHECK :
    a === "Fold" ? ACT_FOLD : a === "All-in" ? ACT_ALLIN : ACT_AGG[Math.min(k++, ACT_AGG.length - 1)]);
}

function mixBar(actions, freqs){
  const cols = actColors(actions);
  return '<span class="mix" role="img" aria-label="' + esc(actions.map((a, i) =>
    a + " " + Math.round(100 * freqs[i]) + "%").join(", ")) + '">' +
    actions.map((a, i) => freqs[i] > 0.001 ? '<i style="width:' + (100 * freqs[i]).toFixed(1) +
      "%;background:" + cols[i] + '" title="' + esc(a + " " + Math.round(100 * freqs[i]) + "%") +
      '"></i>' : "").join("") + "</span>";
}

function mixText(actions, freqs){
  return actions.map((a, i) => [a, freqs[i]]).filter(x => x[1] >= 0.005)
    .sort((x, y) => y[1] - x[1]).map(x => x[0] + " " + Math.round(100 * x[1]) + "%").join(", ");
}

function legendHTML(actions){
  const cols = actColors(actions);
  return '<div class="legend2">' + actions.map((a, i) => '<span><b style="background:' + cols[i] +
    '"></b>' + esc(a) + "</span>").join("") + "</div>";
}

function gridHTML(node){
  const cols = actColors(node.actions);
  let h = '<div class="grid13" role="img" aria-label="Strategy by hand class">';
  for (let i = 0; i < 13; i++){
    for (let j = 0; j < 13; j++){
      const r1 = GRID_RANKS[i], r2 = GRID_RANKS[j];
      const label = i === j ? r1 + r2 : (i < j ? r1 + r2 + "s" : r2 + r1 + "o");
      const f = node.classes[label];
      if (!f){ h += '<div class="empty">' + label + "</div>"; continue; }
      let acc = 0;
      const stops = f.map((v, a) => {
        const s = cols[a] + " " + acc.toFixed(1) + "% " + (acc + 100 * v).toFixed(1) + "%";
        acc += 100 * v;
        return s;
      }).join(",");
      h += '<div style="background:linear-gradient(to right,' + stops + ')" title="' +
        esc(label + ": " + mixText(node.actions, f)) + '">' + label + "</div>";
    }
  }
  return h + "</div>";
}

// Actions alternate from OOP, so the i-th step of a path belongs to OOP on
// even steps and IP on odd ones.
function pathText(path, names){
  if (!path.length) return "Start of river";
  return path.map((a, i) => (names ? names[i % 2 ? "IP" : "OOP"] : (i % 2 ? "IP" : "OOP")) +
    " " + a.toLowerCase()).join(" → ");
}

function nodeName(n, names){
  const who = names ? names[n.player] : n.player;
  return who + " to act · after " + pathText(n.path, names).replace("Start of river", "nothing yet");
}

function handKey(text, node){
  const t = text.replace(/\s+/g, "");
  if (t.length !== 4) return null;
  const a = t[0].toUpperCase() + t[1].toLowerCase(), b = t[2].toUpperCase() + t[3].toLowerCase();
  if (node.hands[a + b]) return a + b;
  if (node.hands[b + a]) return b + a;
  return null;
}

function renderSolveResult(box, res){
  const names = res.spot ? {
    OOP: res.spot.oop + " (" + res.spot.oopPos + ")",
    IP: res.spot.ip + " (" + res.spot.ipPos + ")"} : null;
  const quality = res.exploitabilityPct <= 1 ? "solver-grade" :
    (res.exploitabilityPct <= 3 ? "close" : "rough - run more iterations");
  let h = '<p class="lead" style="margin:10px 0 4px">Board ' + cards(res.board, true) +
    " · " + (res.spot ? "pot " + res.spot.potBB + " bb, " + res.spot.stackBB + " bb behind"
      : "pot " + res.pot + ", " + res.stack + " behind") +
    " · " + res.combos.OOP + " vs " + res.combos.IP + " combos</p>" +
    '<p class="small muted" style="margin:0">' + res.iterations + " iterations · " +
    "exploitability " + res.exploitabilityPct + "% of the pot (" + quality + ") · " +
    "EV: " + (names ? names.OOP : "OOP") + " " + res.evPct.OOP + "% of pot, " +
    (names ? names.IP : "IP") + " " + res.evPct.IP + "%</p>";
  if (res.spot){
    h += '<p class="small muted" style="margin:4px 0 0">' + esc(names.OOP) + " acts first. " +
      "Both ranges are estimates from the betting before the river." +
      (res.spot.villainCards.length ? " They actually had " + cards(res.spot.villainCards, true) + "." : "") +
      "</p>";
  }
  if (res.line && res.line.some(s => s.hero)){
    h += '<p class="eyebrow" style="margin-top:14px">Your hand (' + esc(res.spot.heroHand) +
      ") against the solution</p>";
    for (const st of res.line){
      if (!st.hero) continue;
      const idx = st.actions.indexOf(st.chosen);
      const f = idx >= 0 ? st.hero[idx] : 0;
      const verdict = f >= 0.5 ? '<span class="pill ok">matches the solver</span>' :
        f >= 0.15 ? '<span class="pill warn">a mix the solver sometimes plays</span>' :
        '<span class="pill off">the solver rarely does this</span>';
      h += '<div class="linerow"><span class="where">' + esc(pathText(st.path, names)) +
        "</span>" + mixBar(st.actions, st.hero) + "<span>Solver: " + esc(mixText(st.actions, st.hero)) +
        ". You: <b>" + esc(st.chosen) + "</b> " + verdict + "</span></div>";
    }
  }
  h += '<div class="toolbar" style="margin-top:14px"><label class="eyebrow" style="margin:0">Decision</label>' +
    '<select class="sv-node">' + res.nodes.map((n, i) => '<option value="' + i + '">' +
      esc(nodeName(n, names)) + " (range reaches " + n.reachPct + "%)</option>").join("") +
    "</select></div><div class=\"sv-panel\"></div>";
  box.innerHTML = h;

  const sel = box.querySelector(".sv-node");
  const panel = box.querySelector(".sv-panel");
  const heroSide = res.spot ? res.spot.heroSide : null;
  const draw = () => {
    const n = res.nodes[+sel.value];
    let p = '<p style="margin:6px 0 2px;font-size:14px"><b>' + esc(names ? names[n.player] : n.player) +
      "</b>, whole range: " + esc(mixText(n.actions, n.freqs)) + "</p>" +
      mixBar(n.actions, n.freqs) + legendHTML(n.actions) + gridHTML(n) +
      '<div class="toolbar" style="margin-top:10px"><label class="eyebrow" style="margin:0">Look up a hand</label>' +
      '<input class="sv-look" type="text" autocomplete="off" placeholder="e.g. AhKd" ' +
      'style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;' +
      'background:var(--bg);color:var(--ink);font-family:var(--mono)">' +
      '<span class="sv-lookout small"></span></div>';
    panel.innerHTML = p;
    const look = panel.querySelector(".sv-look"), out = panel.querySelector(".sv-lookout");
    const show = () => {
      const key = handKey(look.value, n);
      out.textContent = !look.value.trim() ? "" :
        (key ? key + ": " + mixText(n.actions, n.hands[key]) :
         "Not in this player's range here.");
    };
    look.oninput = show;
    if (res.spot && n.player === heroSide){ look.value = res.spot.heroHand; show(); }
  };
  sel.onchange = draw;
  const firstHero = res.line ? res.line.find(s => s.hero) : null;
  if (firstHero){
    const idx = res.nodes.findIndex(n => n.id === firstHero.nodeId);
    if (idx >= 0) sel.value = String(idx);
  }
  draw();
}

function solveHTML(hd){
  if (!hd.riverHeadsUp) return "";
  let h = '<div class="solvebox"><p class="eyebrow" style="margin:0">River solver</p>';
  if (!DATA.pysrc || !hd.raw){
    return h + '<p class="lead" style="margin:6px 0 0">Solving this river works on ' +
      '<a href="https://sliderightsole.github.io/poker-brain/" target="_blank" rel="noopener">' +
      "your own site</a>.</p></div>";
  }
  return h + '<p class="lead" style="margin:6px 0 8px">Work out the game-theory-optimal way ' +
    "to play this river for both players, and see how your decision compares.</p>" +
    '<button class="btn" id="solvebtn" type="button">Solve this river</button> ' +
    '<span class="small muted" id="solvemsg"></span><div id="solveout"></div></div>';
}

function solveProgress(el){
  return (done, total, expl) => {
    el.innerHTML = '<span class="busy"><span class="spin"></span>Solving… ' + done + "/" +
      total + " iterations" + (expl >= 0 ? " · exploitability " + expl.toFixed(2) + "%" : "") +
      "</span>";
  };
}

function wireSolve(hd){
  const btn = $("#solvebtn");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    const msg = $("#solvemsg");
    msg.innerHTML = '<span class="busy"><span class="spin"></span>' +
      (pyReady ? "Starting…" : "Loading the analyser…") + "</span>";
    try {
      const py = await ensurePython();
      const fn = py.globals.get("pb_solve_hand");
      let raw;
      try { raw = await fn(hd.raw, solveProgress(msg)); } finally { fn.destroy(); }
      const res = JSON.parse(raw);
      if (res.error){ msg.textContent = res.error; return; }
      hd._solve = res;
      msg.textContent = "";
      renderSolveResult($("#solveout"), res);
    } catch(err){
      msg.textContent = "Could not solve: " + String((err && err.message) || err).slice(0, 200);
    } finally {
      btn.disabled = false;
    }
  };
}

const SOLVER_PRESETS = [
  {name: "Textbook: nuts or air vs a bluff-catcher", board: "2c 7d 9h Js Kc",
   oop: "QQ", ip: "KK, 54o", pot: 10, stack: 100, bets: "100", raises: ""},
  {name: "Paired board, 3-bet pot", board: "Qh 9d 8s 8c 5c",
   oop: "TT+, AQs+, AKo, A5s-A4s", ip: "JJ-66, AJs+, KQs, QJs, JTs, T9s, AQo",
   pot: 20, stack: 80, bets: "33, 75", raises: "100"},
  {name: "Single-raised pot, dry king-high", board: "Kc 8d 4h 2s 7c",
   oop: "88-44, K9s-K5s, A8s-A2s, 97s, 86s, 65s, KTo-K9o",

];

function solverView(){
  const box = $("#v-solver");
  let h = '<p class="lead">A solver works out the unexploitable (“GTO”) way to play a ' +
    "spot: how often every hand should check, bet, call, fold or raise so the opponent can’t " +
    "profit by adjusting. This one solves <b>heads-up river</b> spots exactly, using the same " +
    "algorithm as commercial solvers (CFR+). Earlier streets need specialised software.</p>";
  if (!DATA.pysrc){
    box.innerHTML = h + '<div class="callout"><b>The solver runs on your own site.</b> Open ' +
      '<a href="https://sliderightsole.github.io/poker-brain/" target="_blank" rel="noopener">' +
      "sliderightsole.github.io/poker-brain</a> to use it.</div>";
    return;
  }
  h += '<div class="panel"><div class="toolbar"><label for="sv-preset" class="eyebrow" style="margin:0">' +
    'Start from</label><select id="sv-preset"><option value="">Choose an example…</option>' +
    SOLVER_PRESETS.map((p, i) => '<option value="' + i + '">' + esc(p.name) + "</option>").join("") +
    "</select></div>" +
    '<div class="sfields">' +
    '<div class="fld wide"><label for="sv-board">River board (5 cards)</label><input id="sv-board" placeholder="Qh 9d 8s 8c 5c"></div>' +
    '<div class="fld"><label for="sv-pot">Pot</label><input id="sv-pot" type="number" min="0" step="any" placeholder="20"></div>' +
    '<div class="fld"><label for="sv-stack">Stack behind</label><input id="sv-stack" type="number" min="0" step="any" placeholder="80"></div>' +
    '<div class="fld wide"><label for="sv-oop">Out-of-position range (acts first)</label><input id="sv-oop" placeholder="TT+, AQs+, AKo"></div>' +
    '<div class="fld wide"><label for="sv-ip">In-position range</label><input id="sv-ip" placeholder="JJ-66, AJs+, KQs"></div>' +
    '<div class="fld"><label for="sv-bets">Bet sizes (% pot)</label><input id="sv-bets" value="33, 75"></div>' +
    '<div class="fld"><label for="sv-raises">Raise sizes (% pot)</label><input id="sv-raises" value="100"></div>' +
    '<div class="fld"><label for="sv-iters">Max iterations</label><input id="sv-iters" type="number" min="10" max="3000" value="300"></div>' +
    "</div>" +
    '<button class="btn" id="sv-go" type="button">Solve</button> <span class="small muted" id="sv-status"></span>' +
    '<p class="small muted" style="margin:8px 0 0">Ranges use normal notation (<code>77+</code>, ' +
    "<code>ATs+</code>, <code>KQo</code>). Wider ranges and more sizes take longer. Leave raise " +
    "sizes blank for no raises.</p></div>" +
    '<div class="panel" style="margin-top:14px" id="sv-out"><p class="muted" style="margin:0">' +
    "Pick an example or enter a spot, then press Solve.</p></div>";
  box.innerHTML = h;

  $("#sv-preset").onchange = e => {
    const p = SOLVER_PRESETS[+e.target.value];
    if (!p) return;
    $("#sv-board").value = p.board; $("#sv-oop").value = p.oop; $("#sv-ip").value = p.ip;
    $("#sv-pot").value = p.pot; $("#sv-stack").value = p.stack;
    $("#sv-bets").value = p.bets; $("#sv-raises").value = p.raises;
  };
  const nums = s => s.split(/[,\s]+/).filter(Boolean).map(Number);
  $("#sv-go").onclick = async () => {
    const status = $("#sv-status"), btn = $("#sv-go");
    const bets = nums($("#sv-bets").value), raises = nums($("#sv-raises").value);
    if (bets.some(x => !(x > 0)) || raises.some(x => !(x > 0))){
      status.textContent = "Sizes must be positive percentages, e.g. 33, 75."; return;
    }
    const spec = {board: $("#sv-board").value, oop: $("#sv-oop").value, ip: $("#sv-ip").value,
      pot: Number($("#sv-pot").value), stack: Number($("#sv-stack").value),
      bets: bets.map(x => x / 100), raises: raises.map(x => x / 100),
      iterations: Math.max(10, Math.min(3000, Number($("#sv-iters").value) || 300))};
    if (!spec.board.trim() || !spec.oop.trim() || !spec.ip.trim() || !(spec.pot > 0) || !(spec.stack >= 0)){
      status.textContent = "Fill in the board, both ranges, the pot and the stack."; return;
    }
    btn.disabled = true;
    status.innerHTML = '<span class="busy"><span class="spin"></span>' +
      (pyReady ? "Starting…" : "Loading the analyser…") + "</span>";
    try {
      const py = await ensurePython();
      const fn = py.globals.get("pb_solve");
      let raw;
      try { raw = await fn(JSON.stringify(spec), solveProgress(status)); } finally { fn.destroy(); }
      const res = JSON.parse(raw);
      if (res.error){ status.textContent = res.error; return; }
      status.textContent = "";
      renderSolveResult($("#sv-out"), res);
    } catch(err){
      status.textContent = "Could not solve: " + String((err && err.message) || err).slice(0, 200);
    } finally {
      btn.disabled = false;
    }
  };
}

function lessonsView(){

  const box = $("#v-lessons");
  if (!list.length){

        "</b></span><p>" + esc(e.text) + "</p></span></button>").join("") + "</div>";

      a.bb + " bb this session</li>").join("") + "</ul>";

  if (s.solvable && s.solvable.length && DATA.pysrc){
    h += "<h2>Study with the solver</h2><p class=\"body\">These hands reached a heads-up river. " +
      "Solve one and compare your decision with the game-theory answer.</p><div class=\"qopts\">" +
      s.solvable.slice(0, 6).map(id => {

          "</button>";
      }).join("") + "</div>";

  h += '<h2>Goal for next session</h2><div class="goalbox">' + esc(L.goal) + "</div>" +
    '<p class="lead" style="margin-top:14px">' + esc(L.caveat) + "</p></div>";

const R = DATA.rules;
const SPEED = {}, SLABEL = {};
R.stats.forEach(x => { SPEED[x.key] = x.speed; SLABEL[x.key] = x.label; });
(R.derived || []).forEach(x => { SPEED[x.key] = x.speed; SLABEL[x.key] = x.label; });

// Values the rules read but nobody types in.
function withDerived(s){
  const full = Object.assign({}, s);
  full.gap = s.vpip - s.pfr;
  return full;
}
const SEV = {high:0, medium:1, low:2, info:3};
const SPD = {fast:0, medium:1, slow:2};

function classify(s){
  const g = s.vpip - s.pfr;
  if ((s.vpip >= 33 && g >= 10) || g >= 15 ||
      (s.fold_to_cbet <= 28 && s.wtsd >= 33 && s.pfr < 18))
    return ["green", "Fish / station",
      "VPIP " + s.vpip + " with a " + g + "-point gap to PFR - they call into far too " +
      "many pots and raise almost none of them before the flop, so most of their range " +
      "is hands they were not willing to raise."];
  if (s.vpip >= 30 && s.pfr >= 24)
    return ["orange", "LAG / maniac",
      "VPIP " + s.vpip + " / PFR " + s.pfr + " - genuinely loose and genuinely aggressive. " +
      "Their range is far wider than their aggression implies."];
  if (s.vpip <= 17)
    return ["yellow", "Nit / rock",
      "VPIP " + s.vpip + " - they are folding their way through the session. Their blinds " +
      "are free and their aggression is real."];
  let inBand = 0;
  for (const k in R.benchmarks){
    const b = R.benchmarks[k];
    if (s[k] >= b[0] && s[k] <= b[1]) inBand++;
  }
  if (inBand >= 7 && s.three_bet >= 7 && s.check_raise >= 6)
    return ["red", "Threat - avoid",
      inBand + " of 10 stats sit inside the winning-regular band, with a real 3-bet and " +
      "check-raise frequency. No obvious way in."];
  return ["blue", "Solid reg",
    "VPIP " + s.vpip + " / PFR " + s.pfr + " with a " + g +
    "-point gap - a reasonable, ordinary regular."];
}

function findLeaks(s){
  const full = withDerived(s);
  const out = [];
  for (const r of R.leaks){
    const v = full[r.stat];
    if (v == null) continue;
    const hit = r.op === ">" ? v > r.threshold : v < r.threshold;
    if (!hit) continue;
    out.push({
      id:r.id, stat:r.stat, severity:r.severity, title:r.title, exploit:r.exploit,
      value:v, label:SLABEL[r.stat], reliability:SPEED[r.stat],
      benchmark:R.benchmarks[r.stat],
      shorthand:r.shorthand.split("{v}").join(String(v))
    });
  }
  out.sort((a,b) => (SEV[a.severity]-SEV[b.severity]) || (SPD[a.reliability]-SPD[b.reliability]));
  return out;
}

function buildProfile(s, name){
  let cl = classify(s);
  let colour = cl[0], label = cl[1], why = cl[2];
  const leaks = findLeaks(s);
  const serious = leaks.filter(l => l.severity === "high");
  if ((colour === "blue" || colour === "red") && serious.length){
    colour = "magenta";
    label = "Reg with a hole";
    const f = serious[0].title;
    why = "Looks like an ordinary regular, but " + f[0].toLowerCase() + f.slice(1) +
          ". The exploit is in the note, not the headline stats.";
  }
  const plan = gamePlan(s);
  const note = planNote(plan, colour);
  const slow = leaks.filter(l => l.reliability === "slow").map(l => l.label);
  const unreliable = Array.from(new Set(slow)).sort();
  return {name:name, stats:s, colour:colour, archetype:label, reasoning:why, leaks:leaks,
          note:note, gamePlan:plan, unreliable:unreliable, plan:R.tags[colour].plan};
}

function holds(full, conds){
  for (const c of conds){
    const v = full[c[0]], th = c[2];
    if (v == null) return false;
    if (c[1] === ">" && !(v > th)) return false;
    if (c[1] === "<" && !(v < th)) return false;
    if (c[1] === ">=" && !(v >= th)) return false;
    if (c[1] === "<=" && !(v <= th)) return false;
  }
  return true;
}

function gamePlan(s){
  const full = withDerived(s);
  const pre = R.profileRules.pre.find(r => holds(full, r.when));
  const post = R.profileRules.post.find(r => holds(full, r.when));
  const sections = R.planSections.map(sec => {
    const picked = [], used = new Set();
    for (const e of R.plan[sec.key]){
      if (picked.length >= sec.limit) break;
      if (!e.when.length || e.groups.some(g => used.has(g))) continue;
      if (holds(full, e.when)){
        picked.push({long: e.long, short: e.short});
        e.groups.forEach(g => used.add(g));
      }
    }
    if (!picked.length){
      const d = R.plan[sec.key].find(e => !e.when.length);
      picked.push({long: d.long, short: d.short});
    }
    return {key: sec.key, title: sec.title, label: sec.label, items: picked};
  });
  return {profile: pre.long + "; " + post.long + ".",
          profileShort: "THEM: " + pre.short + ", " + post.short + ".", sections: sections};
}

function tagLine(colour){
  const g = (R.tagGuide || []).find(x => x.colour === colour);
  return g ? colour.toUpperCase() + " - " + g.label + "." : "";
}

function planNote(plan, colour){
  const secs = plan.sections;
  const render = counts => {
    const parts = [tagLine(colour), plan.profileShort].filter(p => p);
    secs.forEach((sec, idx) => {
      const n = counts[idx];
      if (!n) return;
      const lead = counts.slice(0, idx).some(c => c) ? "" : "ME - ";
      const shorts = sec.items.slice(0, n).map(i => i.short);
      parts.push(lead + sec.label + ": " + shorts.join("; ") + ".");
    });
    return parts.join(" ");
  };
  let counts = secs.map(() => 1);
  while (render(counts).length > R.noteLimit && counts.some(c => c)){
    let last = -1;
    counts.forEach((c, i) => { if (c) last = i; });
    counts[last] = 0;
  }
  secs.forEach((sec, i) => {
    if (counts[i] && sec.items.length > counts[i]){
      const trial = counts.slice();
      trial[i] += 1;
      if (render(trial).length <= R.noteLimit) counts = trial;
    }
  });
  return render(counts);
}

(function selfCheck(){
  const bad = R.selfTest.filter(t => buildProfile(t.stats, "").colour !== t.expect);
  if (bad.length) console.warn("Poker Brain: rule engine disagrees with Python on " +

})();

function renderRoster(){

function quickFill(){
  const said = $("#quicksaid");
  const raw = $("#f-quick").value;
  const nums = (raw.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  if (!nums.length){ said.className = "said"; said.textContent = ""; return; }
  if (nums.length !== R.stats.length){
    said.className = "said bad";
    said.textContent = "Found " + nums.length + " numbers, need " + R.stats.length + ".";
    return;
  }
  const bad = nums.filter(n => n < 0 || n > 100);
  if (bad.length){
    said.className = "said bad";
    said.textContent = "Every value should be a percentage between 0 and 100.";
    return;
  }
  R.stats.forEach((x, i) => { $("#f-" + x.key).value = nums[i]; });
  said.className = "said good";
  said.textContent = "Filled all ten.";
  analyse();
}

function readForm(){
  const s = {};
  for (const x of R.stats){
    const raw = $("#f-" + x.key).value.trim();
    if (raw === "") return {missing:x.label};
    const v = Number(raw);
    if (!isFinite(v) || v < 0 || v > 100) return {bad:x.label};
    s[x.key] = v;
  }
  return {stats:s};
}

function analyse(){
  const got = readForm();
  const msg = $("#msg");
  if (got.missing){ msg.textContent = "Still need " + got.missing + "."; return; }
  if (got.bad){ msg.textContent = got.bad + " must be a percentage between 0 and 100."; return; }
  msg.textContent = "";
  const name = $("#f-name").value.trim();
  const p = buildProfile(got.stats, name);
  renderVerdict(p);
  if (name){
    const r = loadRoster();
    r[name] = {name:name, colour:p.colour, stats:p.stats, note:p.note, at:Date.now()};
    saveRoster(r);
    renderRoster();
  }
}

function renderVerdict(p){
  const tag = R.tags[p.colour];
  let h = '<div class="panel" style="margin-top:14px">' +
    '<div class="verdict"><span class="swatch sw-' + esc(p.colour) + '"></span><div>' +
    '<h3>Tag ' + esc(p.colour.toUpperCase()) +
    (p.name ? " — " + esc(p.name) : "") + '</h3>' +
    '<div class="plan">' + esc(p.archetype) + " · " + esc(tag.plan) + '</div></div></div>' +
    '<p class="lead" style="margin-top:12px">' + esc(p.reasoning) + '</p>';

      esc(p.unreliable.join(", ")) + " accumulate slowly — a player only faces a 3-bet " +

      "more hands before trusting the rest.</div>";

  h += '<p class="eyebrow" style="margin-top:18px">Note to paste into CoinPoker</p>' +
    '<textarea class="noteout" id="note">' + esc(p.note) + "</textarea>" +
    '<div style="display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap">' +

    setTimeout(() => { $("#cp").textContent = "Copy note"; }, 1800);
  };
  $("#verdict").scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ---- in-browser OCR, for hosts where Claude is not available ----------- */
const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let tessLoading = null;

function loadScript(src){
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.async = true;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error("could not load " + src));
    document.head.appendChild(el);
  });
}

async function ensureTesseract(){
  if (window.Tesseract) return window.Tesseract;
  if (!tessLoading) tessLoading = loadScript(TESS_URL);
  await tessLoading;
  if (!window.Tesseract) throw new Error("Tesseract failed to initialise");
  return window.Tesseract;
}

function blobToImage(blob){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

// The panel is light text on a dark ground; Tesseract wants the opposite.
// Upscale first - the digits are small - then grey, invert, and push the
// midtones apart so the glyph edges are clean.
function preprocess(img){
  const scale = Math.min(3, Math.max(1.6, 1500 / Math.max(1, img.naturalWidth)));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  const ctx = c.getContext("2d", {willReadFrequently: true});
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, c.width, c.height);
  const frame = ctx.getImageData(0, 0, c.width, c.height);
  const px = frame.data;
  for (let i = 0; i < px.length; i += 4){
    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    v = 255 - v;
    v = v < 115 ? 0 : (v > 185 ? 255 : v);
    px[i] = px[i + 1] = px[i + 2] = v;
    px[i + 3] = 255;
  }
  ctx.putImageData(frame, 0, 0);
  return c;
}

// Tesseract versions differ in where they hang word boxes; gather them
// from whichever shape came back.
function wordsFrom(data){
  if (!data) return [];
  if (Array.isArray(data.words) && data.words.length) return data.words;
  const out = [];
  const walk = node => {
    if (!node || typeof node !== "object") return;
    if (Array.isArray(node.words)) out.push.apply(out, node.words);
    ["blocks", "paragraphs", "lines"].forEach(k => {
      if (Array.isArray(node[k])) node[k].forEach(walk);
    });
  };
  walk(data);
  return out;
}

// Every stat in the panel carries a percent sign and nothing else does, so
// the percentage tokens are exactly the ten values. Group them into rows,
// read each row left to right, and panel order falls out.
function panelNumbers(words){
  const found = [];
  for (const w of words){
    const text = String((w && w.text) || "").replace(/\s+/g, "");
    const m = text.match(/^(\d{1,3})%$/);
    if (!m) continue;
    const value = Number(m[1]);
    if (!isFinite(value) || value < 0 || value > 100) continue;
    const b = (w && w.bbox) || {};
    if (typeof b.x0 !== "number") continue;
    found.push({value: value, x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2,
                h: Math.max(1, b.y1 - b.y0)});
  }
  if (!found.length) return [];
  const meanH = found.reduce((t, n) => t + n.h, 0) / found.length;
  const tol = Math.max(10, meanH * 0.8);
  found.sort((a, b) => a.y - b.y);
  const rows = [];
  for (const n of found){
    const row = rows[rows.length - 1];
    if (row && Math.abs(n.y - row.y) <= tol){
      row.items.push(n);
      row.y = row.items.reduce((t, i) => t + i.y, 0) / row.items.length;
    } else {
      rows.push({y: n.y, items: [n]});
    }
  }
  const out = [];
  for (const row of rows){
    row.items.sort((a, b) => a.x - b.x);
    for (const item of row.items) out.push(item.value);
  }
  return out;
}

async function readWithOCR(blob){
  const btn = $("#readbtn");
  btn.disabled = true;
  setStatus("", '<span class="busy"><span class="spin"></span>Loading the reader… ' +
    'the first time downloads it, which takes a few seconds.</span>');
  try {
    const T = await ensureTesseract();
    setStatus("", '<span class="busy"><span class="spin"></span>Reading the panel…</span>');
    const img = await blobToImage(blob);
    const canvas = preprocess(img);
    const worker = await T.createWorker("eng");
    let data;
    try {
      await worker.setParameters({
        tessedit_char_whitelist: "0123456789%",
        tessedit_pageseg_mode: "11"
      });
      const result = await worker.recognize(canvas, {}, {blocks: true, text: true});
      data = result && result.data;
    } finally {
      try { await worker.terminate(); } catch(e){}
    }
    const nums = panelNumbers(wordsFrom(data));
    if (nums.length === R.stats.length){
      R.stats.forEach((x, i) => { $("#f-" + x.key).value = nums[i]; });
      setStatus("ok", "<b>Read all ten.</b> Check them against the screenshot before you " +
        "trust them — OCR does misread the odd digit — then press Analyse.");
      analyse();
    } else if (nums.length){
      setStatus("warn", "<b>Found " + nums.length + " numbers, expected " + R.stats.length +
        ".</b> Reading was unreliable on this image: " + esc(nums.join(", ")) +
        '<span class="how">Paste a tighter crop of just the stats, or use quick entry ' +
        "below.</span>");
    } else {
      setStatus("err", "<b>Could not read any values off that image.</b>" + TYPE_THEM_IN);
    }
  } catch(err){
    setStatus("err", "<b>The reader could not run.</b> " +
      esc((err && err.message) || "Unknown error") +
      '<span class="how">This needs an internet connection the first time, to fetch the ' +
      "OCR engine.</span>" + TYPE_THEM_IN);
  } finally {
    btn.disabled = false;
  }
}

/* Saved hands live in this browser (IndexedDB) so each day's files add to
   the last. Nothing is sent anywhere. */
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("poker-brain", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function kvGet(key){
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const r = db.transaction("kv").objectStore("kv").get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch(e){ return undefined; }
}
async function kvSet(key, value){
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(value, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    return true;
  } catch(e){ return false; }
}
async function kvClear(){
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){}
}

async function ensurePython(){
  if (pyReady) return pyReady;
  pyReady = (async () => {
    await loadScript(PYODIDE_URL + "pyodide.js");
    const py = await window.loadPyodide({indexURL: PYODIDE_URL});
    for (const rel in DATA.pysrc){

      py.FS.writeFile(path, DATA.pysrc[rel]);
    }
    await py.runPythonAsync(PY_GLUE);
    return py;
  })();
  try { return await pyReady; }
  catch(e){ pyReady = null; throw e; }
}

const PY_GLUE = [
  "import sys, json, asyncio",
  "sys.path.insert(0, '/pb')",
  "from pokerbrain.parsers import coinpoker",
  "from pokerbrain import report",
  "async def pb_run(texts, cache_json, progress):",
  "    cache = json.loads(cache_json) if cache_json else {}",
  "    hands, skipped = [], 0",
  "    for text in texts:",
  "        for block in coinpoker.split_hands(text):",
  "            try:",
  "                hands.append(coinpoker.parse_hand(block))",
  "            except Exception:",
  "                skipped += 1",
  "    unique = {}",
  "    for h in hands:",
  "        unique.setdefault(h.hand_id, h)",
  "    dupes = len(hands) - len(unique)",
  "    no_hero = sum(1 for h in unique.values() if h.hero is None)",
  "    hands = [h for h in unique.values() if h.hero is not None]",
  "    corrected = sum(1 for h in hands if any('summary says won' in w for w in h.parse_warnings))",
  "    hands.sort(key=lambda h: (h.timestamp, h.hand_id))",
  "    if not hands:",
  "        return json.dumps({'error': 'No CoinPoker hands with you in them were found.'})",
  "    todo = [h for h in hands if h.hand_id not in cache]",
  "    done = 0",
  "    for h in todo:",
  "        cache[h.hand_id] = report._hand_payload(h, 'Hero', 600, 600)",
  "        done += 1",
  "        if done % 4 == 0 or done == len(todo):",
  "            progress(done, len(todo))",
  "            await asyncio.sleep(0)",
  "    payloads = [cache[h.hand_id] for h in hands]",
  "    data = report.build_payload(hands, 'Hero', payloads)",
  "    data.pop('rules', None)",
  "    data['skipped'] = skipped",
  "    data['dupes'] = dupes",
  "    data['newHands'] = len(todo)",
  "    data['noHero'] = no_hero",
  "    data['corrected'] = corrected",
  "    return json.dumps(data)",
  "def pb_dive(raw, overrides_json):",
  "    try:",
  "        return json.dumps(report.deep_dive(raw, json.loads(overrides_json or '{}')))",
  "    except Exception as exc:",
  "        return json.dumps({'error': 'Could not analyse this hand: %s' % exc})",
  "from pokerbrain import solver as pbs",
  "async def _pb_iterate(s, iters, progress, spot):",
  "    done = 0",
  "    while done < iters:",
  "        step = min(10, iters - done)",
  "        s.iterate(step)",
  "        done += step",
  "        if done % 30 == 0 or done >= iters:",
  "            e = s.exploitability()",
  "            progress(done, iters, e * 100)",
  "            if e <= 0.005:",
  "                break",
  "        else:",
  "            progress(done, iters, -1)",
  "        await asyncio.sleep(0)",
  "    return json.dumps(pbs.describe_hand(s, spot) if spot else s.result())",
  "async def pb_solve(spec_json, progress):",
  "    spec = json.loads(spec_json)",
  "    try:",
  "        s = pbs.RiverSolver(spec['board'], spec['oop'], spec['ip'], float(spec['pot']),",
  "                            float(spec['stack']), oop_bets=tuple(spec['bets']),",
  "                            ip_bets=tuple(spec['bets']), raises=tuple(spec['raises']),",
  "                            max_raises=1 if spec['raises'] else 0)",
  "    except Exception as exc:",
  "        return json.dumps({'error': 'Check the spot: %s' % exc})",
  "    return await _pb_iterate(s, int(spec.get('iterations', 300)), progress, None)",
  "async def pb_solve_hand(raw, progress):",
  "    try:",
  "        prepared, reason = pbs.prepare_hand(coinpoker.parse_hand(raw))",
  "    except Exception as exc:",
  "        return json.dumps({'error': 'Could not read this hand: %s' % exc})",
  "    if prepared is None:",
  "        return json.dumps({'error': reason})",
  "    s, spot = prepared",
  "    return await _pb_iterate(s, 300, progress, spot)",
].join("\n");

async function addFiles(files){
  loadStatus("", '<span class="busy"><span class="spin"></span>Reading ' + files.length +
    " file" + (files.length > 1 ? "s" : "") + "…</span>");
  try {
    const saved = (await kvGet("texts")) || [];
    let added = 0;
    for (const f of files){
      const text = await f.text();
      if (saved.some(s => s.text === text)) continue;
      saved.push({name: f.name, added: new Date().toISOString(), text: text});
      added++;
    }
    const stored = await kvSet("texts", saved);
    await analyseTexts(saved.map(s => s.text), added, stored);
    await renderFileList();
  } catch(err){
    loadStatus("err", "<b>Could not load those files.</b> " +
      esc(String((err && err.message) || err)).slice(0, 300));
  }
}

async function analyseSaved(quiet){
  const saved = (await kvGet("texts")) || [];
  if (!saved.length){
    if (!quiet) loadStatus("warn", "<b>Nothing saved yet.</b> Add some hand history files first.");
    return;
  }
  await analyseTexts(saved.map(s => s.text), null, true);
}

async function analyseTexts(texts, addedFiles, stored){
  try {
    loadStatus("", '<span class="busy"><span class="spin"></span>' +
      (pyReady ? "Preparing…" : "Loading the analyser… the first time downloads it, " +
      "which takes a little while.") + "</span>");
    const py = await ensurePython();
    const cacheRec = await kvGet("cache");
    const cache = (cacheRec && cacheRec.buildId === DATA.buildId) ? cacheRec.payloads : {};
    const run = py.globals.get("pb_run");
    const progress = (done, total) => loadStatus("",
      '<span class="busy"><span class="spin"></span>Analysing new hand ' + done + " of " +
      total + "…</span>", 100 * done / total);
    const pyTexts = py.toPy(texts);
    let raw;
    try { raw = await run(pyTexts, JSON.stringify(cache), progress); }
    finally { pyTexts.destroy(); run.destroy(); }
    const result = JSON.parse(raw);
    if (result.error){
      loadStatus("err", "<b>" + esc(result.error) + "</b>" +
        '<span class="how">Check these are CoinPoker hand history exports (.txt).</span>');
      return;
    }
    const skipped = result.skipped || 0, dupes = result.dupes || 0, fresh = result.newHands || 0;
    const noHero = result.noHero || 0, corrected = result.corrected || 0;
    delete result.skipped; delete result.dupes; delete result.newHands;
    delete result.noHero; delete result.corrected;
    Object.assign(DATA, result);
    const payloads = {};
    for (const p of result.hands) payloads[p.id] = p;
    await kvSet("cache", {buildId: DATA.buildId, payloads: payloads});
    await kvSet("last", {buildId: DATA.buildId, data: result});
    sessionPick = null;
    lessonPick = null;
    handFilter = "all";
    renderAll();
    loadStatus("ok", "<b>" + DATA.meta.hands + " hands in " + (DATA.sessions || []).length +
      " sessions.</b> " +
      (addedFiles === 0 ? "Those files were already saved. " : "") +
      (addedFiles === null ? "Re-analysed with the latest version of the analyser. " :
        (fresh ? fresh + " new hand" + (fresh > 1 ? "s" : "") + " analysed. " : "No new hands. ")) +
      "Open the Sessions tab to review the latest one." +
      (dupes ? '<span class="how">' + dupes + " repeated hand" + (dupes > 1 ? "s" : "") +
        " across files counted once.</span>" : "") +
      (skipped ? '<span class="how">' + skipped + " hand" + (skipped > 1 ? "s" : "") +
        " could not be read and were skipped.</span>" : "") +
      (noHero ? '<span class="how">' + noHero + " hand" + (noHero > 1 ? "s" : "") +
        " didn’t include you and were left out.</span>" : "") +
      (corrected ? '<span class="how">' + corrected + " hand" + (corrected > 1 ? "s" : "") +
        " had a win recovered from the hand’s summary.</span>" : "") +
      '<span class="how">Total: ' + sgn(DATA.meta.netBB) + " bb over " + DATA.meta.hands +
        " hands, each converted at its own stakes (" + esc(DATA.meta.stakes) + ").</span>" +
      (stored ? "" : '<span class="how">This browser would not save the files, so they ' +
        "will be gone after a reload.</span>") +
      '<span class="how">Equity here uses a faster, rougher simulation than the report built ' +
      "on your PC.</span>");
  } catch(err){
    loadStatus("err", "<b>Could not analyse the hands.</b> " +
      esc(String((err && err.message) || err)).slice(0, 300) +
      '<span class="how">The first run needs an internet connection to download the ' +
      "analyser.</span>");
  }
}

/* On a return visit, show the saved analysis straight away. If the analyser
   has changed since it was saved, rebuild it in the background. */
async function restoreSaved(){
  if (!DATA.pysrc || !window.indexedDB) return;
  const last = await kvGet("last");
  if (last && last.data){
    Object.assign(DATA, last.data);
    sessionPick = null;
    lessonPick = null;
    handFilter = "all";
    renderAll();
    if (last.buildId === DATA.buildId) return;
  }
  const saved = (await kvGet("texts")) || [];
  if (saved.length) analyseSaved(true);
}

document.addEventListener("paste", e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items){
    if (it.type && it.type.indexOf("image/") === 0){
      const blob = it.getAsFile();
      if (!blob) continue;
      e.preventDefault();
      showTab("players");
      takeImage(blob);
      return;
    }
  }
});

$("#foot").textContent =

overview(); sessionsView(); lessonsView(); hands(); solverView(); leaksView(); oppView(); playersView(); loadView();
restoreSaved();

function showTab(name){
  for(const x of document.querySelectorAll(".tab"))
    x.setAttribute("aria-selected", x.dataset.v === name ? "true" : "false");
  for(const v of document.querySelectorAll(".view")) v.hidden = true;
  const view = $("#v-" + name);
  if(view) view.hidden = false;
}
for(const t of document.querySelectorAll(".tab")) t.onclick = () => showTab(t.dataset.v);
$("#themer").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem("pb-theme", next); }catch(e){}
};
try{
  const saved = localStorage.getItem("pb-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}catch(e){}
