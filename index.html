                for h, a in river_calls[:6]]\n        out.append(Finding(\n            \"situational\", \"Large losing river calls\",\n            \"Big river calls that did not get there:\\n\" + \"\\n\".join(rows) +\n            \"\\nOn the river there are no more cards: you are calling purely on whether \"\n            \"their value range is wider than the price you are getting.\",\n            severity=\"high\", confidence=_confidence(len(river_calls), 8),\n            sample=len(river_calls), hands=[h.hand_id for h, _ in river_calls],\n            fix=\"Before calling, name the worse hands they would bet this size with. \"\n                \"If you cannot name three, fold.\"))\n\n    # --- passivity: checking back / calling with the betting lead --------\n    passive = 0\n    total_flop = 0\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero or FLOP not in h.streets_reached or hero.folded_street == PREFLOP:\n            continue\n        total_flop += 1\n        aggressive = any(a.player == hero_name and\n                         (a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0))\n                         for a in h.actions if a.street in (FLOP, TURN, RIVER))\n        if not aggressive:\n            passive += 1\n    if total_flop >= 10 and passive / total_flop > 0.6:\n        out.append(Finding(\n            \"situational\", \"Postflop passivity\",\n            \"In %d of %d flops seen (%.0f%%) you never bet or raised on any street. \"\n            \"Pots are won by the player who bets; checking back gives every hand in \"\n            \"their range a free chance to improve or to bluff you.\"\n            % (passive, total_flop, 100 * passive / total_flop),\n            severity=\"high\", confidence=_confidence(total_flop, 60), sample=total_flop,\n            fix=\"Pick up the betting lead more: c-bet as the preflop aggressor, and \"\n                \"bet when checked to on boards that miss the caller's range.\"))\n\n    # --- open-limping ----------------------------------------------------\n    limps = []\n    for h in hands:\n        hero = h.player(hero_name)\n        if not hero:\n            continue\n        first_voluntary = None\n        raised = False\n        for a in h.actions:\n            if a.street != PREFLOP or a.verb in (\"post\", \"return\", \"straddle\"):\n                continue\n            if a.player == hero_name and first_voluntary is None:\n                first_voluntary = a\n                break\n            if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n                raised = True\n        if first_voluntary and first_voluntary.verb == CALL and not raised:\n            limps.append(h)\n    if limps:\n        out.append(Finding(\n            \"situational\", \"Open-limping\",\n            \"You open-limped %d times. Limping caps your range at hands you were not \"\n            \"willing to raise, surrenders the initiative, and lets the blinds see a \"\n            \"cheap flop. Hands: %s\"\n            % (len(limps), \", \".join(h.hand_id for h in limps[:6])),\n            severity=\"medium\", confidence=_confidence(len(limps), 15), sample=len(limps),\n            hands=[h.hand_id for h in limps],\n            fix=\"Raise or fold when the pot is unopened.\"))\n\n    return out\n\n\ndef analyse(hands, hero_name=\"Hero\"):\n    \"\"\"All findings, most severe first.\"\"\"\n    findings = statistical_leaks(hands, hero_name) + situational_leaks(hands, hero_name)\n    rank = {\"high\": 0, \"medium\": 1, \"low\": 2}\n    conf_rank = {\"solid\": 0, \"n/a\": 1, \"tentative\": 2, \"too thin to trust\": 3}\n    findings.sort(key=lambda f: (conf_rank.get(f.confidence, 3), rank.get(f.severity, 1)))\n    return findings\n\n\ndef format_findings(findings, hands=None, hero_name=\"Hero\") -> str:\n    out = []\n    if hands:\n        split = showdown_split(hands, hero_name)\n        out.append(\"WINNINGS SPLIT\")\n        out.append(\"  at showdown (blue line):     %+8.1f bb\" % split[\"showdown_bb\"])\n        out.append(\"  without showdown (red line): %+8.1f bb\" % split[\"non_showdown_bb\"])\n        out.append(\"  total:                       %+8.1f bb over %d hands\"\n                   % (split[\"total_bb\"], len(hands)))\n        out.append(\"\")\n    if not findings:\n        out.append(\"No leaks stood out. With a larger sample there will be more to see.\")\n        return \"\\n\".join(out)\n    out.append(\"FINDINGS (%d)\" % len(findings))\n    out.append(\"=\" * 72)\n    for i, f in enumerate(findings, 1):\n        out.append(\"%d. [%s | %s] %s\" % (i, f.severity.upper(), f.confidence, f.title))\n        for line in f.detail.split(\"\\n\"):\n            out.append(\"   \" + line)\n        if f.fix:\n            out.append(\"   FIX: \" + f.fix)\n        out.append(\"\")\n    return \"\\n\".join(out)\n","pokerbrain/lessons.py":"\"\"\"A lesson for each playing session, built from that session's own hands.\n\nThe lesson picks the theme that cost the most in the session, explains it,\ngives a rule to follow, shows the hands where it happened, sets a practice\nquiz using the real numbers from those hands, notes what went well, and sets\none goal for next time. Everything is derived from the graded decisions in\n`grading.py`, so a lesson is only as good as those estimates - it says so.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport hashlib\n\n# Which grade categories belong to which lesson theme.\nTHEME_OF = {\n    \"call_river\": \"river_calls\",\n    \"call_turn\": \"chasing\",\n    \"call_flop\": \"chasing\",\n    \"call_preflop\": \"preflop_calls\",\n    \"river_raise\": \"river_raise\",\n    \"overfold\": \"overfolding\",\n    \"straddle\": \"preflop_discipline\",\n    \"limp\": \"preflop_discipline\",\n    \"river_bluff\": \"river_bluffs\",\n    \"good_call\": \"good_calls\",\n    \"good_fold\": \"good_folds\",\n    \"value_bet\": \"value_bets\",\n}\n\nLIBRARY = {\n    \"river_calls\": {\n        \"title\": \"Stop paying off on the river\",\n        \"why\": (\"On the river there are no cards to come, so a call only wins when they are \"\n                \"bluffing or betting a worse hand for value. At these stakes most players bluff \"\n                \"the river far less than they should, so a big river bet is usually a strong \"\n                \"hand. Calling it with a hand that only beats bluffs is the most expensive habit \"\n                \"in small-stakes poker.\"),\n        \"rule\": (\"Before you call a river bet, name three worse hands they would bet this size \"\n                 \"with. If you can't, fold.\"),\n        \"steps\": [\n            \"Work out the price: your call divided by (pot + your call). A pot-sized bet needs \"\n            \"33%; a big shove into a small pot can need 40% or more.\",\n            \"List what they could have: the value hands that got here, and the draws that missed.\",\n            \"Count the bluffs. If there aren't enough of them to beat the price, fold - even a \"\n            \"hand that looks strong.\",\n            \"Watch paired boards: 'two pair' using the board's pair is really one pair plus a \"\n            \"kicker.\",\n        ],\n        \"question\": (\"They bet the size of the pot on the river. How often do they need to be \"\n                     \"bluffing for your call to break even?\"),\n        \"options\": [\"25%\", \"33%\", \"50%\"],\n        \"answer\": \"33%\",\n        \"explain\": \"You risk 1 pot to win 2 pots (the pot plus their bet), so you need to be \"\n                   \"right 1 time in 3.\",\n    },\n    \"chasing\": {\n        \"title\": \"Don't chase with hands that are already behind\",\n        \"why\": (\"A call on the flop or turn with a weak made hand or a thin draw costs twice: \"\n                \"you pay now, and you face a bigger bet on the next street with the same \"\n                \"problem. Their bet has already told you a lot about their hand.\"),\n        \"rule\": (\"Call a flop or turn bet only when your equity beats the price, or you have a \"\n                 \"clear plan for the next street.\"),\n        \"steps\": [\n            \"Count your real outs - cards that make you the best hand, not just a better one.\",\n            \"Rule of 2 and 4: outs x 2 is roughly your equity with one card to come, outs x 4 \"\n            \"with two.\",\n            \"Compare that to the price. If it's short, fold now rather than paying twice.\",\n            \"Ask what you'll do on the next card. If the answer is 'call again and hope', fold.\",\n        ],\n        \"question\": (\"You have a flush draw (9 outs) on the turn. Roughly what is your chance \"\n                     \"of hitting it on the river?\"),\n        \"options\": [\"9%\", \"19%\", \"36%\"],\n        \"answer\": \"19%\",\n        \"explain\": \"Rule of 2: 9 outs x 2 = 18%, and the exact figure is 19.6%.\",\n    },\n    \"preflop_calls\": {\n        \"title\": \"Tighten up the preflop calls\",\n        \"why\": (\"Calling a raise preflop with a hand that is dominated by their range puts you \"\n                \"in a big pot with the worst of it. The mistake is small each time and happens \"\n                \"often.\"),\n        \"rule\": \"Against a raise, call only with hands that play well and aren't dominated.\",\n        \"steps\": [\n            \"Hands like KJo, QTo and A9o are dominated by most raising ranges - fold them \"\n            \"against early-position raises.\",\n            \"Suited hands and pairs play better because they can make strong hands.\",\n            \"Out of position, tighten up further or 3-bet instead of calling.\",\n        ],\n        \"question\": (\"An early-position player raises and you're in the cutoff with KJo. \"\n                     \"Best option?\"),\n        \"options\": [\"Call\", \"Fold\", \"Limp\"],\n        \"answer\": \"Fold\",\n        \"explain\": \"KJo is dominated by the KQ, AK and AJ in an early raiser's range.\",\n    },\n    \"river_raise\": {\n        \"title\": \"Don't raise the river with a bluff-catcher\",\n        \"why\": (\"A hand that only beats bluffs gains nothing by raising: better hands call, \"\n                \"worse hands fold. The raise turns a small, close decision into a big loss.\"),\n        \"rule\": (\"Raise the river only with hands that are ahead when called - or as a planned \"\n                 \"bluff with a hand that can never win at showdown.\"),\n        \"steps\": [\n            \"Ask: which worse hands call my raise? If none, don't raise for value.\",\n            \"Ask: which better hands fold to my raise? If none, don't raise as a bluff.\",\n            \"If your hand beats some bluffs but loses to value, just call or fold.\",\n        ],\n        \"question\": (\"You have a hand that only beats bluffs, and they bet the river. What's \"\n                     \"the best play?\"),\n        \"options\": [\"Raise\", \"Call or fold\", \"Always fold\"],\n        \"answer\": \"Call or fold\",\n        \"explain\": \"Raising a bluff-catcher only gets called by better hands.\",\n    },\n    \"overfolding\": {\n        \"title\": \"Call when the price is right\",\n        \"why\": (\"Folding when you have enough equity gives money away just like a bad call - \"\n                \"it's just less obvious because you never see the pot you could have won.\"),\n        \"rule\": \"If your equity against their range beats the pot odds, call.\",\n        \"steps\": [\n            \"Small bets give you a big price: a third-pot bet needs only 20% to call.\",\n            \"Draws and pairs often have enough equity against a small bet.\",\n            \"Don't fold just because you don't have the best hand right now.\",\n        ],\n        \"question\": \"They bet half the pot. What equity do you need to call?\",\n        \"options\": [\"25%\", \"33%\", \"50%\"],\n        \"answer\": \"25%\",\n        \"explain\": \"You call 0.5 to win 2 (pot + bet + your call): 0.5 / 2 = 25%.\",\n    },\n    \"preflop_discipline\": {\n        \"title\": \"Clean up your preflop: no limps, no straddles\",\n        \"why\": (\"These look small but happen every session. A straddle is a blind raise with a \"\n                \"random hand, out of position. An open-limp gives up the initiative and invites \"\n                \"everyone in cheaply, so you play multiway pots with a weak hand.\"),\n        \"rule\": \"When nobody has entered the pot, raise or fold. Never straddle.\",\n        \"steps\": [\n            \"Use an opening range by position: tight from early seats, wide from the button.\",\n            \"If a hand isn't good enough to raise, it isn't good enough to limp.\",\n            \"Skip the straddle every time - it's a guaranteed small loss.\",\n        ],\n        \"question\": \"It folds to you in the cutoff with K9 suited. What's the best option?\",\n        \"options\": [\"Raise\", \"Limp\", \"Fold\"],\n        \"answer\": \"Raise\",\n        \"explain\": \"K9s is a standard cutoff open. Raising wins the blinds often and keeps the \"\n                   \"initiative.\",\n    },\n    \"river_bluffs\": {\n        \"title\": \"Pick your river bluffs\",\n        \"why\": (\"A river bluff only works if they fold often enough. Bluffing a player who \"\n                \"calls a lot, or with a size that needs too many folds, burns money.\"),\n        \"rule\": (\"A bet of X into a pot of P needs them to fold X / (P + X) of the time. \"\n                 \"Only bluff players who fold that often.\"),\n        \"steps\": [\n            \"Check the player's tag and note: stations and sticky regs don't fold enough.\",\n            \"Bluff with hands that block their calling hands.\",\n            \"Smaller bluffs need fewer folds - but also scare fewer hands away.\",\n        ],\n        \"question\": (\"You bet the size of the pot as a bluff. How often do they need to fold \"\n                     \"for it to break even?\"),\n        \"options\": [\"33%\", \"50%\", \"67%\"],\n        \"answer\": \"50%\",\n        \"explain\": \"You risk 1 pot to win 1 pot, so they need to fold half the time.\",\n    },\n    \"good_calls\": {\n        \"title\": \"Good calls at the right price\",\n        \"text\": \"You called when your equity beat the price. Keep doing the maths before you call.\",\n    },\n    \"good_folds\": {\n        \"title\": \"Disciplined folds\",\n        \"text\": \"You let go of hands that weren't getting the right price. That saves real money.\",\n    },\n    \"value_bets\": {\n        \"title\": \"Getting value from strong hands\",\n        \"text\": \"You bet your strong hands and got paid. Keep betting when you're ahead.\",\n    },\n}\n\nGENERAL = {\n    \"title\": \"Clean session - sharpen the fundamentals\",\n    \"why\": (\"No big mistakes stood out this session. That's the goal. Use the time to make the \"\n            \"basics automatic so they hold up when a big pot arrives.\"),\n    \"rule\": \"Know the price before every call: call / (pot + call).\",\n    \"steps\": [\n        \"Third-pot bet: you need 20%. Half-pot: 25%. Pot-size: 33%.\",\n        \"Play more hands from the button and cutoff, fewer from early seats.\",\n        \"Review one big pot from the session with the solver or the deep dive.\",\n    ],\n    \"question\": \"They bet a third of the pot. What equity do you need to call?\",\n    \"options\": [\"20%\", \"25%\", \"33%\"],\n    \"answer\": \"20%\",\n    \"explain\": \"You call 1 to win 5 (pot 3 + bet 1 + your call 1): 1 / 5 = 20%.\",\n}\n\nGOALS = {\n    \"river_calls\": \"Fold at least one river bluff-catcher when you can't name three worse \"\n                   \"hands that bet.\",\n    \"chasing\": \"Before every turn call, say your outs and the price out loud.\",\n    \"preflop_calls\": \"Fold every dominated offsuit hand facing an early-position raise.\",\n    \"river_raise\": \"Don't raise a single river with a hand that only beats bluffs.\",\n    \"overfolding\": \"Call every small bet where your equity clearly beats the price.\",\n    \"preflop_discipline\": \"Zero straddles and zero open-limps next session.\",\n    \"river_bluffs\": \"Only bluff the river against players whose note says they fold.\",\n}\n\n\nPRICE_DRILLS = [\n    (\"two-thirds of the pot\", 29),\n    (\"twice the pot\", 40),\n    (\"a third of the pot\", 20),\n]\n\n\ndef _shuffled(options, seed):\n    order = sorted(options, key=lambda o: hashlib.md5((seed + o).encode(\"utf-8\")).hexdigest())\n    return order\n\n\ndef _price_question(facts, seed):\n    pot, call = facts.get(\"potBB\"), facts.get(\"toCallBB\")\n    if not pot or not call:\n        return None\n    right = round(100 * call / (pot + call))\n    wrong_a = round(100 * call / pot) if pot else right + 10\n    wrong_b = max(1, right - 12) if right > 15 else right + 15\n    opts = []\n    for v in (right, wrong_a, wrong_b, right + 9):\n        label = \"%d%%\" % v\n        if label not in opts:\n            opts.append(label)\n    opts = opts[:3]\n    return {\n        \"q\": \"From your session: the pot was %.1f bb and you had to call %.1f bb. What equity \"\n             \"did you need?\" % (pot, call),\n        \"options\": _shuffled(opts, seed),\n        \"answer\": \"%d%%\" % right,\n        \"explain\": \"%.1f / (%.1f + %.1f) = %d%%. Call only when your equity beats that.\"\n                   % (call, pot, call, right),\n    }\n\n\ndef _decision_question(facts, seed, hand_id):\n    need, have = facts.get(\"potOdds\"), facts.get(\"equity\")\n    if need is None or have is None:\n        return None\n    right = \"Call\" if have > need else \"Fold\"\n    return {\n        \"q\": \"Hand %s: with %s on %s you had about %d%% equity against their likely range and \"\n             \"needed %d%%. Call or fold?\"\n             % (hand_id, facts.get(\"hand\") or facts.get(\"cards\"), facts.get(\"board\") or \"the board\",\n                have, need),\n        \"options\": [\"Call\", \"Fold\"],\n        \"answer\": right,\n        \"explain\": (\"%d%% is %s the %d%% you needed, so %s. (Equity is against an estimated \"\n                    \"range.)\" % (have, \"above\" if have > need else \"below\", need, right.lower())),\n    }\n\n\ndef build(session, payloads):\n    \"\"\"A lesson for one session. `payloads` are that session's hand payloads.\"\"\"\n    bad_by_theme, good_by_theme = {}, {}\n    examples, good_examples = {}, {}\n    for p in payloads:\n        for g in p.get(\"grades\", []):\n            theme = THEME_OF.get(g.get(\"cat\"))\n            if not theme:\n                continue\n            row = {\"handId\": p[\"id\"], \"text\": g[\"text\"], \"bb\": g[\"bb\"],\n                   \"cards\": p.get(\"heroCards\", []), \"board\": p.get(\"board\", []),\n                   \"pos\": p.get(\"heroPos\", \"\"), \"facts\": g.get(\"facts\", {}),\n                   \"street\": g.get(\"street\", \"\")}\n            if g[\"kind\"] == \"good\":\n                good_by_theme[theme] = good_by_theme.get(theme, 0.0) + g[\"bb\"]\n                good_examples.setdefault(theme, []).append(row)\n            else:\n                bad_by_theme[theme] = bad_by_theme.get(theme, 0.0) + g[\"bb\"]\n                examples.setdefault(theme, []).append(row)\n\n    total_bad = round(sum(bad_by_theme.values()), 1)\n    if bad_by_theme:\n        theme = max(bad_by_theme, key=lambda t: bad_by_theme[t])\n        lib = LIBRARY[theme]\n        ex = sorted(examples[theme], key=lambda r: -r[\"bb\"])[:3]\n        summary = (\"%d hands, %+.1f bb. Your graded mistakes cost about %.1f bb, and %.1f bb \"\n                   \"of that came from one theme - so that's today's lesson.\"\n                   % (session[\"hands\"], session[\"netBB\"], total_bad, bad_by_theme[theme]))\n    else:\n        theme, lib, ex = \"general\", GENERAL, []\n        summary = (\"%d hands, %+.1f bb, and no graded mistakes worth more than a big blind. \"\n                   \"Today is about keeping the basics sharp.\" % (session[\"hands\"], session[\"netBB\"]))\n\n    quiz = []\n    seed = session[\"id\"]\n    for r in ex:\n        for maker in (_price_question, ):\n            q = maker(r[\"facts\"], seed + r[\"handId\"])\n            if q and len(quiz) < 2:\n                quiz.append(q)\n        q = _decision_question(r[\"facts\"], seed, r[\"handId\"])\n        if q and len(quiz) < 3:\n            quiz.append(q)\n    quiz.append({\"q\": lib[\"question\"], \"options\": _shuffled(lib[\"options\"], seed + theme),\n                 \"answer\": lib[\"answer\"], \"explain\": lib[\"explain\"]})\n    # Always leave the player with at least three questions to work through.\n    for size, need in PRICE_DRILLS:\n        if len(quiz) >= 3:\n            break\n        opts = sorted({\"%d%%\" % need, \"%d%%\" % (need + 10), \"%d%%\" % max(5, need - 8)})\n        quiz.append({\n            \"q\": \"Drill: they bet %s. What equity do you need to call?\" % size,\n            \"options\": _shuffled(opts, seed + size),\n            \"answer\": \"%d%%\" % need,\n            \"explain\": \"Call / (pot + bet + call). Learn these by heart: 1/3 pot 20%, \"\n                       \"1/2 pot 25%, 2/3 pot 29%, pot 33%, 2x pot 40%.\",\n        })\n\n    keep = None\n    if good_by_theme:\n        gt = max(good_by_theme, key=lambda t: good_by_theme[t])\n        best = sorted(good_examples[gt], key=lambda r: -r[\"bb\"])[:2]\n        keep = {\"title\": LIBRARY[gt][\"title\"], \"text\": LIBRARY[gt][\"text\"],\n                \"bb\": round(good_by_theme[gt], 1),\n                \"examples\": [{k: r[k] for k in (\"handId\", \"text\", \"cards\", \"pos\")} for r in best]}\n\n    also = [{\"theme\": t, \"title\": LIBRARY[t][\"title\"], \"bb\": round(v, 1)}\n            for t, v in sorted(bad_by_theme.items(), key=lambda kv: -kv[1]) if t != theme]\n\n    return {\n        \"sessionId\": session[\"id\"],\n        \"theme\": theme,\n        \"title\": lib[\"title\"],\n        \"summary\": summary,\n        \"why\": lib[\"why\"],\n        \"rule\": lib[\"rule\"],\n        \"steps\": list(lib[\"steps\"]),\n        \"examples\": [{k: r[k] for k in (\"handId\", \"text\", \"cards\", \"board\", \"pos\", \"bb\")}\n                     for r in ex],\n        \"quiz\": quiz,\n        \"keepDoing\": keep,\n        \"alsoWatch\": also,\n        \"goal\": GOALS.get(theme, \"Review one big pot from this session with the deep dive \"\n                                 \"or the solver before you play again.\"),\n        \"caveat\": (\"Built from decisions graded against estimated opponent ranges, over one \"\n                   \"session of %d hands. Treat it as a guide to what to practise, not a verdict.\"\n                   % session[\"hands\"]),\n    }\n\n\ndef format_text(lesson):\n    out = [\"LESSON: \" + lesson[\"title\"], lesson[\"summary\"], \"\", \"Why it matters\", \"  \" + lesson[\"why\"],\n           \"\", \"The rule\", \"  \" + lesson[\"rule\"], \"\", \"How to apply it\"]\n    out += [\"  - \" + s for s in lesson[\"steps\"]]\n    if lesson[\"examples\"]:\n        out += [\"\", \"From your session\"]\n        out += [\"  %s (%s %s): %s\" % (e[\"handId\"], e[\"pos\"], \" \".join(e[\"cards\"]), e[\"text\"])\n                for e in lesson[\"examples\"]]\n    out += [\"\", \"Practice\"]\n    for i, q in enumerate(lesson[\"quiz\"], 1):\n        out.append(\"  %d. %s  [%s]\" % (i, q[\"q\"], \" / \".join(q[\"options\"])))\n        out.append(\"     Answer: %s - %s\" % (q[\"answer\"], q[\"explain\"]))\n    if lesson[\"keepDoing\"]:\n        k = lesson[\"keepDoing\"]\n        out += [\"\", \"Keep doing: %s (+%.1f bb)\" % (k[\"title\"], k[\"bb\"]), \"  \" + k[\"text\"]]\n    if lesson[\"alsoWatch\"]:\n        out += [\"\", \"Also watch: \" + \"; \".join(\"%s (%.1f bb)\" % (a[\"title\"], a[\"bb\"])\n                                              for a in lesson[\"alsoWatch\"])]\n    out += [\"\", \"Goal for next session: \" + lesson[\"goal\"], \"\", lesson[\"caveat\"]]\n    return \"\\n\".join(out)\n","pokerbrain/model.py":"\"\"\"Normalised hand-history data model.\n\nSite-specific parsers all produce these objects, so every downstream\ncomponent (stats, leak detection, analysis, reports) is site-agnostic.\n\nMoney is stored as float in the table's currency unit. Amounts follow one\nconvention throughout: `amount` is the chips a player *added* on that\naction, and `to_amount` is the resulting total wager level for the street.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nPREFLOP = \"preflop\"\nFLOP = \"flop\"\nTURN = \"turn\"\nRIVER = \"river\"\nSTREETS = (PREFLOP, FLOP, TURN, RIVER)\n\n# Action verbs\nPOST = \"post\"\nCHECK = \"check\"\nFOLD = \"fold\"\nCALL = \"call\"\nBET = \"bet\"\nRAISE = \"raise\"\nALLIN = \"allin\"\nSTRADDLE = \"straddle\"\nSHOW = \"show\"\nMUCK = \"muck\"\nRETURN = \"return\"\n\nAGGRESSIVE = (BET, RAISE)\nVOLUNTARY = (CALL, BET, RAISE, ALLIN)\n\n# Position labels ordered by distance from the button, for 2..10 handed.\nPOSITION_TABLES = {\n    2: [\"BTN\", \"BB\"],\n    3: [\"BTN\", \"SB\", \"BB\"],\n    4: [\"BTN\", \"SB\", \"BB\", \"CO\"],\n    5: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"CO\"],\n    6: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"HJ\", \"CO\"],\n    7: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"HJ\", \"CO\"],\n    8: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"MP\", \"HJ\", \"CO\"],\n    9: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"HJ\", \"CO\"],\n    10: [\"BTN\", \"SB\", \"BB\", \"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"MP1\", \"HJ\", \"CO\"],\n}\n\n# Ordering used when reporting stats by position.\nPOSITION_ORDER = [\"UTG\", \"UTG1\", \"UTG2\", \"MP\", \"MP1\", \"HJ\", \"CO\", \"BTN\", \"SB\", \"BB\"]\n\nIP_POSITIONS = (\"BTN\", \"CO\", \"HJ\")\nBLINDS = (\"SB\", \"BB\")\n\n\n@dataclass\nclass Action:\n    player: str\n    verb: str\n    street: str = PREFLOP\n    amount: float = 0.0          # chips added by this action\n    to_amount: float = 0.0       # resulting street wager level\n    all_in: bool = False\n    cards: tuple = ()            # for SHOW\n    note: str = \"\"               # e.g. \"ante\", \"small blind\", \"big blind\"\n    order: int = 0               # index within the hand\n\n    @property\n    def is_voluntary(self) -> bool:\n        return self.verb in VOLUNTARY\n\n    @property\n    def is_aggressive(self) -> bool:\n        return self.verb in AGGRESSIVE or (self.verb == ALLIN and self.amount > 0)\n\n    def __repr__(self):\n        money = f\" {self.amount:g}\" if self.amount else \"\"\n        to = f\"->{self.to_amount:g}\" if self.to_amount else \"\"\n        return f\"<{self.street}: {self.player} {self.verb}{money}{to}>\"\n\n\n@dataclass\nclass Player:\n    name: str\n    seat: int\n    stack: float                 # stack at the start of the hand\n    position: str = \"\"\n    hole_cards: tuple = ()       # ints; empty when unknown\n    is_hero: bool = False\n    posted: float = 0.0          # blinds + antes + straddle\n    invested: float = 0.0        # total chips put in across the hand\n    collected: float = 0.0       # total chips won back\n    showed: bool = False\n    shown_rank: str = \"\"         # site-reported hand name at showdown\n    folded_street: str = \"\"      # street on which they folded, if any\n\n    @property\n    def net(self) -> float:\n        return self.collected - self.invested\n\n    @property\n    def effective_position_group(self) -> str:\n        if self.position in BLINDS:\n            return \"blind\"\n        if self.position in IP_POSITIONS:\n            return \"late\"\n        return \"early\"\n\n    def __repr__(self):\n        tag = \"*\" if self.is_hero else \"\"\n        return f\"<{tag}{self.name} seat{self.seat} {self.position} {self.stack:g}>\"\n\n\n@dataclass\nclass Hand:\n    hand_id: str\n    site: str = \"CoinPoker\"\n    game: str = \"NLH\"\n    currency: str = \"USDT\"\n    small_blind: float = 0.0\n    big_blind: float = 0.0\n    ante: float = 0.0\n    timestamp: str = \"\"\n    timezone: str = \"\"\n    table: str = \"\"\n    max_seats: int = 6\n    button_seat: int = 0\n    players: list = field(default_factory=list)\n    actions: list = field(default_factory=list)\n    board: list = field(default_factory=list)     # card ints\n    total_pot: float = 0.0\n    rake: float = 0.0\n    extra_fee: float = 0.0\n    run_count: int = 1\n    is_tournament: bool = False\n    tournament_id: str = \"\"\n    level: str = \"\"\n    raw: str = \"\"\n    parse_warnings: list = field(default_factory=list)\n\n    # ---------------------------------------------------------- lookups ---\n    @property\n    def hero(self):\n        for p in self.players:\n            if p.is_hero:\n                return p\n        return None\n\n    def player(self, name: str):\n        for p in self.players:\n            if p.name == name:\n                return p\n        return None\n\n    def by_position(self, position: str):\n        for p in self.players:\n            if p.position == position:\n                return p\n        return None\n\n    def street_actions(self, street: str) -> list:\n        \"\"\"Real decisions on a street (blinds, antes and returns excluded).\"\"\"\n        return [a for a in self.actions\n                if a.street == street and a.verb not in (POST, RETURN, SHOW, MUCK)]\n\n    def all_street_entries(self, street: str) -> list:\n        return [a for a in self.actions if a.street == street]\n\n    @property\n    def streets_reached(self) -> list:\n        seen = [PREFLOP]\n        if len(self.board) >= 3:\n            seen.append(FLOP)\n        if len(self.board) >= 4:\n            seen.append(TURN)\n        if len(self.board) >= 5:\n            seen.append(RIVER)\n        return seen\n\n    @property\n    def final_street(self) -> str:\n        return self.streets_reached[-1]\n\n    def board_at(self, street: str) -> list:\n        counts = {PREFLOP: 0, FLOP: 3, TURN: 4, RIVER: 5}\n        return self.board[: counts[street]]\n\n    @property\n    def went_to_showdown(self) -> list:\n        \"\"\"Players who showed or mucked at showdown.\"\"\"\n        return [p for p in self.players if p.showed]\n\n    def pot_before_street(self, street: str) -> float:\n        \"\"\"Total chips in the middle when a street began.\"\"\"\n        idx = STREETS.index(street)\n        earlier = STREETS[:idx]\n        total = 0.0\n        for a in self.actions:\n            if a.street in earlier and a.verb != SHOW and a.verb != MUCK:\n                total += a.amount if a.verb != RETURN else -a.amount\n        return total\n\n    @property\n    def bb_size(self) -> float:\n        return self.big_blind or 1.0\n\n    def in_bb(self, amount: float) -> float:\n        return amount / self.bb_size\n\n    def __repr__(self):\n        return (f\"<Hand {self.hand_id} {self.game} {self.small_blind:g}/{self.big_blind:g} \"\n                f\"{len(self.players)}p board={len(self.board)}>\")\n\n\ndef assign_positions(hand: Hand) -> None:\n    \"\"\"Fill in each player's position from the button seat.\"\"\"\n    if not hand.players:\n        return\n    seats = sorted(p.seat for p in hand.players)\n    n = len(seats)\n    if hand.button_seat not in seats:\n        # Button sat out; fall back to the highest seat at or below it.\n        candidates = [s for s in seats if s <= hand.button_seat] or seats\n        button = candidates[-1]\n        hand.parse_warnings.append(\n            f\"button seat {hand.button_seat} not occupied; using seat {button}\")\n    else:\n        button = hand.button_seat\n\n    start = seats.index(button)\n    ordered = [seats[(start + i) % n] for i in range(n)]\n    labels = POSITION_TABLES.get(n)\n    if labels is None:\n        labels = [\"BTN\", \"SB\", \"BB\"] + [f\"P{i}\" for i in range(3, n)]\n\n    seat_to_player = {p.seat: p for p in hand.players}\n    for seat, label in zip(ordered, labels):\n        seat_to_player[seat].position = label\n","pokerbrain/profiles.py":"\"\"\"Opponent profiling from HUD statistics.\n\nCoinPoker's client shows a per-player stat panel (PokerIntel) with real,\npersistent usernames. This module turns those numbers into three things:\n\n    1. a colour tag, so the table read is instant\n    2. a ranked list of exploitable leaks, each with the adjustment\n    3. a note under 250 characters, for the client's own note field\n\nThe rules live in RULES as plain data so the same rule set drives the CLI,\nthe web report and the tests, and so they can be argued with and tuned in\none place rather than being buried in code.\n\nDesign note: the *classification* is deterministic. Screenshot reading may\nbe done by a vision model, but only to extract the numbers. Everything\ndownstream of the numbers is these rules, so the same input always gives\nthe same verdict.\n\"\"\"\n\nfrom __future__ import annotations\n\nNOTE_LIMIT = 250\n\n# Stats we read off the panel. `key` is used everywhere downstream.\nSTATS = [\n    (\"vpip\", \"VPIP\", \"fast\"),\n    (\"pfr\", \"PFR\", \"fast\"),\n    (\"three_bet\", \"3-Bet\", \"slow\"),\n    (\"fold_to_three_bet\", \"Fold to 3-Bet\", \"slow\"),\n    (\"cbet\", \"C-Bet\", \"fast\"),\n    (\"fold_to_cbet\", \"Fold to C-Bet\", \"medium\"),\n    (\"steal\", \"Steal\", \"fast\"),\n    (\"check_raise\", \"Check/Raise\", \"slow\"),\n    (\"wtsd\", \"WTSD\", \"medium\"),\n    (\"wsd\", \"WSD\", \"medium\"),\n]\n\n# Derived from the entered stats rather than read off the panel, but the\n# rules treat it like any other value.\nDERIVED = [\n    (\"gap\", \"VPIP\\u2013PFR gap\", \"fast\"),\n]\n\nSTAT_LABELS = {k: label for k, label, _ in STATS}\nSTAT_SPEED = {k: speed for k, _, speed in STATS}\nfor _k, _label, _speed in DERIVED:\n    STAT_LABELS[_k] = _label\n    STAT_SPEED[_k] = _speed\n\n# How quickly each statistic becomes trustworthy. Opportunities accumulate\n# at wildly different rates: you post a VPIP decision every hand, but you\n# only face a 3-bet after you have opened and someone has re-raised.\nSPEED_NOTE = {\n    \"fast\": \"settles quickly - trust it early\",\n    \"medium\": \"needs a few hundred hands\",\n    \"slow\": \"accumulates slowly - hold this one loosely\",\n}\n\nBENCHMARKS = {\n    \"vpip\": (22, 28),\n    \"pfr\": (17, 23),\n    \"three_bet\": (6, 11),\n    \"fold_to_three_bet\": (40, 55),\n    \"cbet\": (55, 70),\n    \"fold_to_cbet\": (40, 55),\n    \"steal\": (35, 50),\n    \"check_raise\": (6, 12),\n    \"wtsd\": (24, 30),\n    \"wsd\": (48, 56),\n    \"gap\": (3, 8),\n}\n\nTAGS = {\n    \"green\":   (\"Fish / station\", \"Value bet them hard; don't bluff them.\"),\n    \"orange\":  (\"LAG / maniac\", \"Let them bet into you; call them down lighter.\"),\n    \"yellow\":  (\"Nit / rock\", \"Steal from them; fold when they fight back.\"),\n    \"blue\":    (\"Solid reg\", \"Play good hands simply; take the easy spots.\"),\n    \"red\":     (\"Threat - avoid\", \"Stay out of close pots with them.\"),\n    \"magenta\": (\"Reg with a hole\", \"Attack the leak written in the note.\"),\n    \"none\":    (\"Not enough to say\", \"Play the pool default until you see more.\"),\n}\n\n# The colour legend, in the order a reader scans it: money first, danger\n# last, and the \"read the note\" tag at the end. `them` says what the player\n# does; `me` says what Luke should do about it.\nTAG_GUIDE = [\n    (\"green\", \"Fish / station\",\n     \"They play lots of hands and mostly just call. Once they are in a pot they \"\n     \"rarely fold.\",\n     \"Raise their limps and play big pots with them in position. Bet your good \"\n     \"hands on every street and size up. Don't bluff them unless the note says \"\n     \"they give up easily.\"),\n    (\"orange\", \"LAG / maniac\",\n     \"They play lots of hands and raise and 3-bet a lot. Many of their bets are \"\n     \"bluffs.\",\n     \"Open a little tighter in front of them. Call their bets lighter with medium \"\n     \"hands, check your strong hands so they keep betting, and don't try to bluff \"\n     \"them off a pot.\"),\n    (\"yellow\", \"Nit / rock\",\n     \"They play very few hands and fold a lot. When they bet or raise big, they \"\n     \"usually have it.\",\n     \"Raise their blinds whenever it folds to you and c-bet them on most flops. \"\n     \"When they raise or bet big, fold unless your hand is strong.\"),\n    (\"blue\", \"Solid reg\",\n     \"They play normal, sensible ranges and have no clear weakness.\",\n     \"Play good-quality hands with your normal strategy. Don't try fancy bluffs or \"\n     \"thin hero-calls against them - take the easy spots and move on.\"),\n    (\"red\", \"Threat - avoid\",\n     \"They play well: they 3-bet and check-raise at good rates and have no obvious \"\n     \"leak.\",\n     \"Avoid close spots with them, especially out of position. Don't bluff-catch \"\n     \"with weak hands or run big bluffs. If they sit on your left, think about \"\n     \"changing seats.\"),\n    (\"magenta\", \"Reg with a hole\",\n     \"They look like a normal regular but have at least one big leak.\",\n     \"Read the note before you play a pot with them - it says which leak to attack. \"\n     \"Otherwise play them like a solid regular.\"),\n]\n\nTAG_GUIDE_BY_COLOUR = {c: {\"label\": l, \"when\": w, \"plan\": p}\n                       for c, l, w, p in TAG_GUIDE}\n\n# ---------------------------------------------------------------- leaks ---\n# Each rule: (id, stat, op, threshold, severity, title, exploit, shorthand)\n# `shorthand` is what goes in the 250-character note.\n\nLEAK_RULES = [\n    (\"wide_gap\", \"gap\", \">\", 12, \"high\",\n     \"Plays far more hands than they raise\",\n     \"Isolate them in position and value bet relentlessly. A gap this size \"\n     \"means most of the hands they show up with are ones they merely called \"\n     \"with, so their range is weak and uncapped by any raise.\",\n     \"gap{v} isolate+value\"),\n\n    (\"no_flatting\", \"gap\", \"<\", 2, \"info\",\n     \"Raise-or-fold - almost never flat-calls\",\n     \"Their calling range barely exists, so the hands they enter with are \"\n     \"polarised to raises. Expect a strong range whenever they just call.\",\n     \"gap{v} raise-or-fold\"),\n\n    (\"overfold_3bet\", \"fold_to_three_bet\", \">\", 60, \"high\",\n     \"Folds too much to 3-bets\",\n     \"3-bet them light, especially when they open from late position. \"\n     \"They open wide and then surrender the pot without a fight.\",\n     \"F3B{v} 3bet light\"),\n\n    (\"underfold_3bet\", \"fold_to_three_bet\", \"<\", 33, \"medium\",\n     \"Almost never folds to a 3-bet\",\n     \"3-bet for value only. Your bluff 3-bets have no fold equity, and you \"\n     \"will be playing a big pot out of position with a weak range.\",\n     \"F3B{v} no 3bet bluffs\"),\n\n    (\"sticky_postflop\", \"fold_to_cbet\", \"<\", 32, \"high\",\n     \"Will not fold to a c-bet\",\n     \"Do not barrel them. Your bluffs get called. C-bet for value, check \"\n     \"back marginal hands, and value bet thinner than usual.\",\n     \"FvCB{v} NO barrels\"),\n\n    (\"overfold_cbet\", \"fold_to_cbet\", \">\", 58, \"high\",\n     \"Folds too much to c-bets\",\n     \"C-bet every flop against them, and keep barrelling turns. They give \"\n     \"up far too often for your bluffs to need much equity.\",\n     \"FvCB{v} cbet always\"),\n\n    (\"passive\", \"pfr\", \"<\", 12, \"high\",\n     \"Passive - calls far more than they raise\",\n     \"Raise them off pots relentlessly. When they do bet or raise, it is \"\n     \"strength: believe them and fold your marginal hands.\",\n     \"PFR{v} passive, raise em\"),\n\n    (\"calling_station\", \"wtsd\", \">\", 33, \"high\",\n     \"Goes to showdown far too often\",\n     \"Never bluff the river against them. Value bet two and three streets \"\n     \"with hands you would normally check.\",\n     \"WTSD{v} never bluff\"),\n\n    (\"overfolds_showdown\", \"wtsd\", \"<\", 21, \"medium\",\n     \"Gives up before showdown\",\n     \"Bluff them more, particularly on turns and rivers. They arrive at the \"\n     \"river with too few hands to call you.\",\n     \"WTSD{v} bluff more\"),\n\n    (\"low_3bet\", \"three_bet\", \"<\", 5, \"medium\",\n     \"Rarely 3-bets\",\n     \"Open wider against them. When they do 3-bet it is value - fold your \"\n     \"marginal opens rather than calling to 'see a flop'.\",\n     \"3B{v} their 3bets = value\"),\n\n    (\"high_3bet\", \"three_bet\", \">\", 11, \"medium\",\n     \"3-bets a lot\",\n     \"Defend wider against their 3-bets and add 4-bet bluffs. A 3-betting \"\n     \"range this wide contains plenty of air.\",\n     \"3B{v} defend wider\"),\n\n    (\"steal_happy\", \"steal\", \">\", 48, \"medium\",\n     \"Attacks the blinds constantly\",\n     \"Defend your big blind wider against them, and 3-bet their late opens. \"\n     \"Their stealing range is far too wide to hold up.\",\n     \"Steal{v} 3bet their opens\"),\n\n    (\"no_steal\", \"steal\", \"<\", 25, \"low\",\n     \"Rarely steals\",\n     \"Their late-position opens are strong. Give their button and cutoff \"\n     \"raises more respect than the position suggests.\",\n     \"Steal{v} late opens strong\"),\n\n    (\"cbet_happy\", \"cbet\", \">\", 74, \"medium\",\n     \"C-bets almost every flop\",\n     \"Float them in position and check-raise more. A c-bet that frequent \"\n     \"cannot be filtering for strength.\",\n     \"CB{v} float/raise more\"),\n\n    (\"cbet_shy\", \"cbet\", \"<\", 48, \"medium\",\n     \"Rarely c-bets\",\n     \"Their c-bets are strong. But their checks are weak - attack every \"\n     \"flop they check to you.\",\n     \"CB{v} attack their checks\"),\n\n    (\"checkraise_real\", \"check_raise\", \">\", 9, \"info\",\n     \"Check-raises at a real frequency\",\n     \"Their checks are not automatic weakness. Size down when betting into \"\n     \"them and be ready to fold to the raise.\",\n     \"CR{v} checks not weak\"),\n\n    (\"no_checkraise\", \"check_raise\", \"<\", 3, \"medium\",\n     \"Almost never check-raises\",\n     \"When they check, bet. Their check is a give-up, and you can bet any \"\n     \"two cards with near-impunity.\",\n     \"CR{v} bet when they check\"),\n\n    (\"weak_showdown\", \"wsd\", \"<\", 45, \"medium\",\n     \"Loses too often at showdown\",\n     \"They arrive at the river with weak holdings. Value bet thinner and \"\n     \"bluff less - they are paying you off already.\",\n     \"WSD{v} thin value\"),\n]\n\n\n# What goes in the table note for each leak: what they do wrong, then what\n# you do about it. Plain words, no stat codes - the note is read mid-hand.\nNOTE_TIPS = {\n    \"wide_gap\": \"calls far too much preflop - isolate them and value bet\",\n    \"no_flatting\": \"raise-or-fold player - when they just call, respect it\",\n    \"overfold_3bet\": \"folds to 3-bets - 3-bet them light\",\n    \"underfold_3bet\": \"never folds to 3-bets - 3-bet for value only\",\n    \"sticky_postflop\": \"won't fold to c-bets - don't barrel, just value bet\",\n    \"overfold_cbet\": \"folds to c-bets - c-bet and keep barrelling\",\n    \"passive\": \"passive - raise them off pots, their bets mean strength\",\n    \"calling_station\": \"calls down too much - never bluff the river\",\n    \"overfolds_showdown\": \"gives up before showdown - bluff turns and rivers\",\n    \"low_3bet\": \"rarely 3-bets - their 3-bet is strong, fold marginal hands\",\n    \"high_3bet\": \"3-bets wide - defend more, add 4-bet bluffs\",\n    \"steal_happy\": \"steals a lot - defend blinds wider, 3-bet their opens\",\n    \"no_steal\": \"rarely steals - their late-position opens are strong\",\n    \"cbet_happy\": \"c-bets almost every flop - float and raise them\",\n    \"cbet_shy\": \"rarely c-bets - their bets are real, attack their checks\",\n    \"checkraise_real\": \"check-raises often - their checks aren't weak, bet smaller\",\n    \"no_checkraise\": \"never check-raises - bet whenever they check\",\n    \"weak_showdown\": \"shows down weak hands - value bet thinner\",\n}\n\ndef _cmp(value, op, threshold):\n    return value > threshold if op == \">\" else value < threshold\n\n\ndef gap(stats):\n    \"\"\"VPIP minus PFR. A winning regular sits at 4-6; a station at 15+.\"\"\"\n    return stats[\"vpip\"] - stats[\"pfr\"]\n\n\n# ----------------------------------------------------------- archetypes ---\n\ndef classify(stats):\n    \"\"\"Return (colour, archetype label, reasoning) from a full stat line.\"\"\"\n    v, p = stats[\"vpip\"], stats[\"pfr\"]\n    g = gap(stats)\n    fcb = stats[\"fold_to_cbet\"]\n    wtsd = stats[\"wtsd\"]\n    tb = stats[\"three_bet\"]\n    cr = stats[\"check_raise\"]\n\n    # Loose-passive: the profile that prints money.\n    if (v >= 33 and g >= 10) or (g >= 15) or (fcb <= 28 and wtsd >= 33 and p < 18):\n        return \"green\", \"Fish / station\", (\n            \"VPIP %g with a %g-point gap to PFR - they call into far too many \"\n            \"pots and raise almost none of them before the flop, so most of \"\n            \"their range is hands they were not willing to raise.\" % (v, g))\n\n    # Loose-aggressive.\n    if v >= 30 and p >= 24:\n        return \"orange\", \"LAG / maniac\", (\n            \"VPIP %g / PFR %g - genuinely loose and genuinely aggressive. Their \"\n            \"range is far wider than their aggression implies.\" % (v, p))\n\n    # Nit.\n    if v <= 17:\n        return \"yellow\", \"Nit / rock\", (\n            \"VPIP %g - they are folding their way through the session. Their \"\n            \"blinds are free and their aggression is real.\" % v)\n\n    # Strong, balanced, aggressive and no glaring hole -> the one to avoid.\n    in_band = sum(1 for k, (lo, hi) in BENCHMARKS.items()\n                  if lo <= stats.get(k, -1) <= hi)\n    if in_band >= 7 and tb >= 7 and cr >= 6:\n        return \"red\", \"Threat - avoid\", (\n            \"%d of 10 stats sit inside the winning-regular band, with a real \"\n            \"3-bet and check-raise frequency. No obvious way in.\" % in_band)\n\n    return \"blue\", \"Solid reg\", (\n        \"VPIP %g / PFR %g with a %g-point gap - a reasonable, ordinary \"\n        \"regular.\" % (v, p, g))\n\n\ndef with_derived(stats):\n    \"\"\"The entered stats plus anything computed from them.\"\"\"\n    full = dict(stats)\n    full[\"gap\"] = gap(stats)\n    return full\n\n\ndef find_leaks(stats):\n    \"\"\"All triggered leak rules, most severe first.\"\"\"\n    rank = {\"high\": 0, \"medium\": 1, \"low\": 2, \"info\": 3}\n    full = with_derived(stats)\n    out = []\n    for lid, stat, op, threshold, severity, title, exploit, short in LEAK_RULES:\n        value = full.get(stat)\n        if value is None:\n            continue\n        if _cmp(value, op, threshold):\n            out.append({\n                \"id\": lid,\n                \"stat\": stat,\n                \"label\": STAT_LABELS[stat],\n                \"value\": value,\n                \"severity\": severity,\n                \"title\": title,\n                \"exploit\": exploit,\n                \"shorthand\": NOTE_TIPS.get(lid, short.replace(\"{v}\", \"%g\" % value)),\n                \"reliability\": STAT_SPEED[stat],\n                \"benchmark\": BENCHMARKS[stat],\n            })\n    out.sort(key=lambda f: (rank[f[\"severity\"]],\n                            0 if f[\"reliability\"] == \"fast\" else\n                            1 if f[\"reliability\"] == \"medium\" else 2))\n    return out\n\n\n# When no rule fires there is nothing to shorthand, and a note of just\n# \"25/20\" tells you nothing at the table. Fall back to the archetype's\n# standing instruction so every note carries an action.\nNOTE_FALLBACK = {\n    \"red\": \"no hole found - avoid marginal spots, no fancy bluffs\",\n    \"blue\": \"ordinary reg - play it straight\",\n    \"green\": \"loose-passive - value bet thin, never bluff\",\n    \"orange\": \"LAG - let them bluff into you, call lighter\",\n    \"yellow\": \"nit - steal their blinds, believe their raises\",\n}\n\n\n# Short enough to leave room for the leaks, long enough to read at a glance.\nNOTE_PREFIX = {\n    \"green\": \"GREEN fish\",\n    \"orange\": \"ORANGE LAG\",\n    \"yellow\": \"YELLOW nit\",\n    \"blue\": \"BLUE reg\",\n    \"red\": \"RED avoid\",\n    \"magenta\": \"MAGENTA reg w/ hole\",\n    \"none\": \"untagged\",\n}\n\n\ndef build_note(name, stats, colour, leaks, limit=NOTE_LIMIT):\n    \"\"\"A note that fits the client's field, ordered by what matters most.\"\"\"\n    head = NOTE_PREFIX.get(colour, colour.upper())\n    parts = [head]\n    for leak in leaks:\n        if leak[\"severity\"] == \"info\":\n            continue\n        candidate = parts + [leak[\"shorthand\"]]\n        if len(\" | \".join(candidate)) > limit:\n            break\n        parts = candidate\n    if len(parts) == 1:\n        # Nothing actionable fired. An informational finding still beats\n        # boilerplate: \"his checks are not weakness\" earns its space.\n        for leak in leaks:\n            if leak[\"severity\"] != \"info\":\n                continue\n            candidate = parts + [leak[\"shorthand\"]]\n            if len(\" | \".join(candidate)) <= limit:\n                parts = candidate\n    if len(parts) == 1:\n        fallback = NOTE_FALLBACK.get(colour)\n        if fallback and len(head) + 3 + len(fallback) <= limit:\n            parts.append(fallback)\n    note = \" | \".join(parts)\n    if len(note) > limit:\n        note = note[: limit - 1].rstrip() + \"\u2026\"\n    return note\n\n\n# ------------------------------------------------------------ game plan ---\n# Conditions are [stat, op, threshold] lists that must all hold; an empty\n# list is the default. Entries sharing a group never both appear, so a\n# combined rule suppresses the single-stat rules it already covers.\n\nPROFILE_RULES = {\n    \"pre\": [\n        ([[\"vpip\", \"<=\", 17]], \"They play very tight preflop\", \"play very tight pre\"),\n        ([[\"vpip\", \">=\", 33], [\"gap\", \">=\", 10]],\n         \"They play a huge number of hands and mostly just call\", \"call far too much pre\"),\n        ([[\"gap\", \">=\", 15]], \"They call far more than they raise preflop\", \"call more than they raise\"),\n        ([[\"vpip\", \">=\", 30], [\"pfr\", \">=\", 24]], \"They play loose and aggressive preflop\", \"play loose & aggressive\"),\n        ([[\"gap\", \"<=\", 2]], \"They raise or fold preflop and almost never just call\",\n         \"raise or fold pre\"),\n        ([[\"vpip\", \">=\", 29]], \"They play a little loose preflop\", \"play a bit loose pre\"),\n        ([[\"three_bet\", \">=\", 10]], \"They are aggressive preflop and 3-bet a lot\",\n         \"3-bet a lot\"),\n        ([[\"three_bet\", \"<=\", 6], [\"vpip\", \">=\", 24]],\n         \"They play plenty of hands but call instead of 3-betting\", \"flat instead of 3-betting\"),\n        ([[\"pfr\", \">=\", 20], [\"gap\", \"<=\", 6]],\n         \"They play solid, raise-first preflop\", \"raise first pre\"),\n        ([], \"They play normal, reg-like preflop ranges\", \"play normal ranges pre\"),\n    ],\n    \"post\": [\n        ([[\"fold_to_cbet\", \"<\", 32], [\"wtsd\", \">\", 33]],\n         \"after the flop they call down and rarely fold\",\n         \"call down after the flop\"),\n        ([[\"fold_to_cbet\", \"<\", 32]], \"after the flop they are very hard to push off a hand\",\n         \"won't fold to c-bets\"),\n        ([[\"wtsd\", \">\", 33]], \"they call down to showdown too often\", \"call down too much\"),\n        ([[\"fold_to_cbet\", \">\", 58]], \"they fold easily to flop bets\", \"fold to c-bets\"),\n        ([[\"wtsd\", \"<\", 21]], \"they give up before showdown\", \"give up before showdown\"),\n        ([[\"cbet\", \">\", 74]], \"they bet most flops, then give up\", \"c-bet then give up\"),\n        ([[\"check_raise\", \">\", 9]], \"they check-raise a lot after the flop\",\n         \"check-raise a lot\"),\n        ([[\"fold_to_cbet\", \"<\", 36]], \"they lean sticky against c-bets\", \"lean sticky vs c-bets\"),\n        ([[\"check_raise\", \">=\", 8], [\"cbet\", \">=\", 60]],\n         \"they play balanced and aggressive after the flop\", \"play balanced after the flop\"),\n        ([[\"check_raise\", \"<=\", 5]], \"they rarely fight back with a check-raise\",\n         \"rarely check-raise\"),\n        ([], \"they fold a normal amount after the flop\", \"fold normally after the flop\"),\n    ],\n}\n\nPLAN_SECTIONS = [\n    (\"preflop\", \"Preflop\", \"PRE\", 2),\n    (\"flop\", \"Flop\", \"FLOP\", 2),\n    (\"river\", \"Turn & river\", \"RIVER\", 2),\n]\n\n# (conditions, groups, long advice, short advice for the note)\nPLAN = {\n    \"preflop\": [\n        ([[\"fold_to_three_bet\", \">\", 60], [\"steal\", \">\", 48]], [\"f3b\", \"steal\"],\n         \"Re-steal a lot: they open wide from the button and cutoff and then fold \"\n         \"to most 3-bets.\",\n         \"re-steal vs their late opens\"),\n        ([[\"fold_to_three_bet\", \">\", 60]], [\"f3b\"],\n         \"3-bet them light, especially over late-position opens - they fold to \"\n         \"3-bets far too often, so suited aces and broadways make good bluffs.\",\n         \"3-bet them light\"),\n        ([[\"gap\", \">\", 12]], [\"gap\"],\n         \"Raise to isolate them when they limp or call, and play big pots with \"\n         \"them in position - most of their hands are weak ones they just called with.\",\n         \"isolate them, play big pots in position\"),\n        ([[\"fold_to_three_bet\", \"<\", 33]], [\"f3b\"],\n         \"Only 3-bet them with strong hands. They won't fold, so a bluff 3-bet just \"\n         \"builds a big pot with a weak hand.\",\n         \"3-bet them only with strong hands\"),\n        ([[\"three_bet\", \">\", 11]], [\"3b\"],\n         \"Their 3-bets are wide: don't fold hands like AJ, KQ or pairs to them, and \"\n         \"add a few 4-bet bluffs with an ace blocker.\",\n         \"don't fold good hands to their 3-bets\"),\n        ([[\"three_bet\", \"<\", 5]], [\"3b\"],\n         \"When they 3-bet it is a big hand - fold everything marginal, even AQ.\",\n         \"fold marginal hands to their 3-bets\"),\n        ([[\"steal\", \">\", 48]], [\"steal\"],\n         \"They raise the button and cutoff very light: defend your blinds wider \"\n         \"and 3-bet their opens with good hands.\",\n         \"defend your blinds wider vs them\"),\n        ([[\"vpip\", \"<=\", 17]], [\"tight\"],\n         \"Steal their blinds every time it folds to you, and when they do raise, \"\n         \"believe them and fold marginal hands.\",\n         \"steal their blinds, fold to their raises\"),\n        ([[\"steal\", \"<\", 25]], [\"steal\"],\n         \"Respect their button and cutoff raises - they are not stealing light.\",\n         \"respect their late-position raises\"),\n        ([[\"three_bet\", \">=\", 10]], [\"3b\"],\n         \"Their 3-bet is on the high side, so don't give up too easily when they \"\n         \"3-bet you.\",\n         \"don't over-fold to their 3-bets\"),\n        ([[\"fold_to_three_bet\", \">=\", 55]], [\"f3b\"],\n         \"They lean towards folding to 3-bets - a light 3-bet now and then prints.\",\n         \"3-bet them light sometimes\"),\n        ([[\"fold_to_three_bet\", \"<=\", 48]], [\"f3b\"],\n         \"They defend against 3-bets, so 3-bet them for value rather than as a bluff.\",\n         \"3-bet them for value, not as a bluff\"),\n        ([[\"steal\", \"<=\", 35]], [\"steal\"],\n         \"Their button and cutoff opens are a bit tighter than normal - give them \"\n         \"some respect from the blinds.\",\n         \"give their late opens respect\"),\n        ([[\"three_bet\", \"<=\", 6]], [\"3b\"],\n         \"They rarely 3-bet light, so open a little wider in front of them and give \"\n         \"their 3-bets credit.\",\n         \"open wider in front of them\"),\n        ([], [],\n         \"Nothing to exploit preflop - play your normal ranges.\",\n         \"play your normal ranges\"),\n    ],\n    \"flop\": [\n        ([[\"fold_to_cbet\", \"<\", 32]], [\"fcb\"],\n         \"Don't c-bet as a bluff - they call. Bet your made hands for value and \"\n         \"check back your misses.\",\n         \"don't c-bet bluff them, value bet only\"),\n        ([[\"fold_to_cbet\", \">\", 58]], [\"fcb\"],\n         \"C-bet almost every flop and keep firing the turn - they fold too often.\",\n         \"c-bet them often and keep firing\"),\n        ([[\"cbet\", \">\", 74]], [\"cbet\"],\n         \"Their c-bets are mostly air: call wider in position and raise some flops.\",\n         \"call and raise their c-bets more\"),\n        ([[\"cbet\", \"<\", 48]], [\"cbet\"],\n         \"When they bet a flop they have it; when they check, take a stab.\",\n         \"believe their bets, bet when they check\"),\n        ([[\"check_raise\", \">\", 9]], [\"cr\"],\n         \"Their checks are not weak - bet smaller and be ready to fold to a \"\n         \"check-raise.\",\n         \"bet smaller - their checks can be traps\"),\n        ([[\"check_raise\", \"<\", 3]], [\"cr\"],\n         \"They almost never check-raise, so bet whenever they check to you.\",\n         \"bet whenever they check\"),\n        ([[\"fold_to_cbet\", \"<\", 36]], [\"fcb\"],\n         \"They lean sticky after the flop - keep c-bet bluffs for boards that give \"\n         \"you real equity.\",\n         \"c-bet bluff them less\"),\n        ([[\"cbet\", \">=\", 70]], [\"cbet\"],\n         \"They c-bet often, so don't fold every miss to a flop bet in position.\",\n         \"don't fold every miss to their c-bet\"),\n        ([[\"check_raise\", \">=\", 8]], [\"cr\"],\n         \"They check-raise at a real rate - don't bet automatically when they check.\",\n         \"don't auto-bet when they check\"),\n        ([[\"check_raise\", \"<=\", 5]], [\"cr\"],\n         \"They seldom check-raise, so betting when they check is usually profitable.\",\n         \"bet when they check\"),\n        ([[\"fold_to_cbet\", \">=\", 46]], [\"fcb\"],\n         \"They give up on a fair number of flops - c-bet dry, high-card boards.\",\n         \"c-bet them on dry boards\"),\n        ([], [],\n         \"Nothing to exploit on the flop - use your normal c-bet strategy.\",\n         \"play your normal c-bet strategy\"),\n    ],\n    \"river\": [\n        ([[\"wtsd\", \">\", 33]], [\"wtsd\"],\n         \"Never bluff the river. Value bet thinner - top pair can bet all three \"\n         \"streets.\",\n         \"never bluff them, value bet thin\"),\n        ([[\"wtsd\", \"<\", 21]], [\"wtsd\"],\n         \"Fire turn and river barrels - they give up before showdown.\",\n         \"barrel them on turn and river\"),\n        ([[\"wsd\", \"<\", 45]], [\"wsd\"],\n         \"They reach showdown with weak hands - value bet thin and call down a \"\n         \"little lighter.\",\n         \"value bet thin, call them down lighter\"),\n        ([[\"wsd\", \">\", 56]], [\"wsd\"],\n         \"When they get to showdown they usually have it - respect big river bets.\",\n         \"fold to their big river bets\"),\n        ([[\"wtsd\", \">\", 30]], [\"wtsd\"],\n         \"They go to showdown slightly often - bluff the river sparingly.\",\n         \"bluff them on the river rarely\"),\n        ([[\"wsd\", \">=\", 54]], [\"wsd\"],\n         \"They win a lot when they get to showdown - their river calls and bets \"\n         \"are usually good hands.\",\n         \"respect their river bets and calls\"),\n        ([[\"wsd\", \"<=\", 50]], [\"wsd\"],\n         \"Their showdown hands are on the weak side - thin value bets get paid.\",\n         \"value bet thinner vs them\"),\n        ([[\"wtsd\", \"<=\", 26]], [\"wtsd\"],\n         \"They don't call down much, so a well-chosen river bluff works.\",\n         \"bluff them on the river sometimes\"),\n        ([], [],\n         \"Play turns and rivers straightforwardly.\",\n         \"play turn and river normally\"),\n    ],\n}\n\n\ndef _holds(full, conditions):\n    for stat, op, threshold in conditions:\n        v = full.get(stat)\n        if v is None:\n            return False\n        if op == \">\" and not v > threshold:\n            return False\n        if op == \"<\" and not v < threshold:\n            return False\n        if op == \">=\" and not v >= threshold:\n            return False\n        if op == \"<=\" and not v <= threshold:\n            return False\n    return True\n\n\ndef game_plan(stats):\n    \"\"\"Profile sentence plus street-by-street advice.\"\"\"\n    full = with_derived(stats)\n    pre = next(r for r in PROFILE_RULES[\"pre\"] if _holds(full, r[0]))\n    post = next(r for r in PROFILE_RULES[\"post\"] if _holds(full, r[0]))\n    sections = []\n    for key, title, label, limit in PLAN_SECTIONS:\n        picked, used = [], set()\n        for conds, groups, long_text, short_text in PLAN[key]:\n            if len(picked) >= limit:\n                break\n            if not conds or used & set(groups):\n                continue\n            if _holds(full, conds):\n                picked.append({\"long\": long_text, \"short\": short_text})\n                used |= set(groups)\n        if not picked:\n            default = [e for e in PLAN[key] if not e[0]][0]\n            picked = [{\"long\": default[2], \"short\": default[3]}]\n        sections.append({\"key\": key, \"title\": title, \"label\": label, \"items\": picked})\n    return {\n        \"profile\": \"%s; %s.\" % (pre[1], post[1]),\n        \"profileShort\": \"THEM: %s, %s.\" % (pre[2], post[2]),\n        \"sections\": sections,\n    }\n\n\ndef tag_line(colour):\n    \"\"\"'GREEN - Fish / station.' - the colour's meaning, first thing in the note.\"\"\"\n    guide = TAG_GUIDE_BY_COLOUR.get(colour)\n    return \"%s - %s.\" % (colour.upper(), guide[\"label\"]) if guide else \"\"\n\n\ndef plan_note(plan, limit=NOTE_LIMIT, colour=\"\"):\n    \"\"\"The plan squeezed into the client's note field, after the tag line.\n\n    Every street keeps its top instruction; second instructions are added\n    only while there is room, so a long preflop plan can't push the river\n    advice out of the note.\n    \"\"\"\n    secs = plan[\"sections\"]\n\n    def render(counts):\n        parts = [p for p in (tag_line(colour), plan[\"profileShort\"]) if p]\n        for idx, (sec, n) in enumerate(zip(secs, counts)):\n            if n == 0:\n                continue\n            lead = \"ME - \" if not any(counts[:idx]) else \"\"\n            shorts = [i[\"short\"] for i in sec[\"items\"][:n]]\n            parts.append(\"%s%s: %s.\" % (lead, sec[\"label\"], \"; \".join(shorts)))\n        return \" \".join(parts)\n\n    counts = [1] * len(secs)\n    while len(render(counts)) > limit and any(counts):\n        last = max(i for i, n in enumerate(counts) if n)\n        counts[last] = 0\n    for i, sec in enumerate(secs):\n        if counts[i] and len(sec[\"items\"]) > counts[i]:\n            trial = list(counts)\n            trial[i] += 1\n            if len(render(trial)) <= limit:\n                counts = trial\n    return render(counts)\n\n\ndef profile(stats, name=\"\"):\n    \"\"\"Full profile: tag, archetype, leaks, note, reliability warnings.\"\"\"\n    missing = [k for k, _, _ in STATS if stats.get(k) is None]\n    if missing:\n        raise ValueError(\"missing stats: %s\" % \", \".join(missing))\n\n    colour, label, why = classify(stats)\n    leaks = find_leaks(stats)\n\n    # A competent-looking regular with a serious hole gets flagged for the\n    # note rather than the archetype, because the archetype alone misleads.\n    serious = [l for l in leaks if l[\"severity\"] == \"high\"]\n    if colour in (\"blue\", \"red\") and serious:\n        colour = \"magenta\"\n        label = \"Reg with a hole\"\n        first = serious[0][\"title\"]\n        why = (\"Looks like an ordinary regular, but %s. The exploit is in the \"\n               \"note, not the headline stats.\" % (first[0].lower() + first[1:]))\n\n    shaky = sorted({l[\"label\"] for l in leaks if l[\"reliability\"] == \"slow\"})\n    plan = game_plan(stats)\n\n    return {\n        \"name\": name,\n        \"stats\": dict(stats),\n        \"gap\": gap(stats),\n        \"colour\": colour,\n        \"archetype\": label,\n        \"headline\": TAGS[colour][1],\n        \"reasoning\": why,\n        \"leaks\": leaks,\n        \"plan\": plan,\n        \"note\": plan_note(plan, colour=colour),\n        \"colourGuide\": TAG_GUIDE_BY_COLOUR.get(colour),\n        \"unreliable\": shaky,\n    }\n\n\n# Reference stat lines with the colour the Python rules give them. The web\n# report re-applies the rules client-side, so it checks itself against these\n# on load and complains in the console if the JavaScript port has drifted.\nSELF_TEST = [\n    ({\"vpip\": 24, \"pfr\": 22, \"three_bet\": 12, \"fold_to_three_bet\": 64, \"cbet\": 70,\n      \"fold_to_cbet\": 21, \"steal\": 45, \"check_raise\": 11, \"wtsd\": 31, \"wsd\": 52}, \"magenta\"),\n    ({\"vpip\": 48, \"pfr\": 9, \"three_bet\": 2, \"fold_to_three_bet\": 30, \"cbet\": 35,\n      \"fold_to_cbet\": 22, \"steal\": 14, \"check_raise\": 2, \"wtsd\": 41, \"wsd\": 44}, \"green\"),\n    ({\"vpip\": 13, \"pfr\": 11, \"three_bet\": 3, \"fold_to_three_bet\": 78, \"cbet\": 62,\n      \"fold_to_cbet\": 66, \"steal\": 20, \"check_raise\": 3, \"wtsd\": 20, \"wsd\": 58}, \"yellow\"),\n    ({\"vpip\": 42, \"pfr\": 34, \"three_bet\": 16, \"fold_to_three_bet\": 32, \"cbet\": 82,\n      \"fold_to_cbet\": 30, \"steal\": 62, \"check_raise\": 14, \"wtsd\": 28, \"wsd\": 47}, \"orange\"),\n    # Every stat in band, with a real 3-bet and check-raise: no way in.\n    ({\"vpip\": 25, \"pfr\": 20, \"three_bet\": 8, \"fold_to_three_bet\": 48, \"cbet\": 62,\n      \"fold_to_cbet\": 47, \"steal\": 42, \"check_raise\": 8, \"wtsd\": 27, \"wsd\": 52}, \"red\"),\n    # Competent but unremarkable - nothing to attack, nothing to fear.\n    ({\"vpip\": 26, \"pfr\": 19, \"three_bet\": 6, \"fold_to_three_bet\": 52, \"cbet\": 58,\n      \"fold_to_cbet\": 44, \"steal\": 33, \"check_raise\": 5, \"wtsd\": 26, \"wsd\": 50}, \"blue\"),\n]\n\n\ndef export_rules():\n    \"\"\"The rule set as plain data, for the web report to apply client-side.\"\"\"\n    return {\n        \"selfTest\": [{\"stats\": s, \"expect\": c} for s, c in SELF_TEST],\n        \"stats\": [{\"key\": k, \"label\": label, \"speed\": speed} for k, label, speed in STATS],\n        \"derived\": [{\"key\": k, \"label\": label, \"speed\": speed} for k, label, speed in DERIVED],\n        \"benchmarks\": BENCHMARKS,\n        \"tags\": {k: {\"label\": v[0], \"plan\": v[1]} for k, v in TAGS.items()},\n        \"noteFallback\": NOTE_FALLBACK,\n        \"notePrefix\": NOTE_PREFIX,\n        \"tagGuide\": [{\"colour\": c, \"label\": l, \"when\": w, \"plan\": p}\n                     for c, l, w, p in TAG_GUIDE],\n        \"speedNote\": SPEED_NOTE,\n        \"leaks\": [{\n            \"id\": lid, \"stat\": stat, \"op\": op, \"threshold\": th,\n            \"severity\": sev, \"title\": title, \"exploit\": exploit,\n            \"shorthand\": NOTE_TIPS.get(lid, short),\n        } for lid, stat, op, th, sev, title, exploit, short in LEAK_RULES],\n        \"noteLimit\": NOTE_LIMIT,\n        \"profileRules\": {k: [{\"when\": c, \"long\": l, \"short\": sh} for c, l, sh in v]\n                         for k, v in PROFILE_RULES.items()},\n        \"planSections\": [{\"key\": k, \"title\": t, \"label\": lb, \"limit\": n}\n                         for k, t, lb, n in PLAN_SECTIONS],\n        \"plan\": {k: [{\"when\": c, \"groups\": g, \"long\": l, \"short\": sh}\n                     for c, g, l, sh in v] for k, v in PLAN.items()},\n    }\n\n\ndef format_text(result):\n    \"\"\"Render a profile as plain text for the CLI.\"\"\"\n    out = []\n    name = result[\"name\"] or \"player\"\n    out.append(\"%s  ->  TAG %s  (%s)\" % (name, result[\"colour\"].upper(), result[\"archetype\"]))\n    out.append(\"  \" + result[\"headline\"])\n    out.append(\"  \" + result[\"reasoning\"])\n    out.append(\"\")\n    if result[\"leaks\"]:\n        out.append(\"  LEAKS AND HOW TO ATTACK THEM\")\n        for leak in result[\"leaks\"]:\n            lo, hi = leak[\"benchmark\"]\n            out.append(\"   [%-6s] %s  (%s %g%%, typical %d-%d%%)\"\n                       % (leak[\"severity\"], leak[\"title\"], leak[\"label\"],\n                          leak[\"value\"], lo, hi))\n            out.append(\"            %s\" % leak[\"exploit\"])\n        out.append(\"\")\n    guide = result.get(\"colourGuide\")\n    if guide:\n        out.append(\"  COLOUR %s - %s\" % (result[\"colour\"].upper(), guide[\"label\"]))\n        out.append(\"    When: \" + guide[\"when\"])\n        out.append(\"    Plan: \" + guide[\"plan\"])\n        out.append(\"\")\n    plan = result[\"plan\"]\n    out.append(\"  GAME PLAN\")\n    out.append(\"    \" + plan[\"profile\"])\n    for sec in plan[\"sections\"]:\n        out.append(\"    %s:\" % sec[\"title\"])\n        for item in sec[\"items\"]:\n            out.append(\"      - \" + item[\"long\"])\n    out.append(\"\")\n    if result[\"unreliable\"]:\n        out.append(\"  Hold loosely (slow-accumulating stats): %s\"\n                   % \", \".join(result[\"unreliable\"]))\n        out.append(\"\")\n    out.append(\"  NOTE (%d/%d chars)\" % (len(result[\"note\"]), NOTE_LIMIT))\n    out.append(\"  \" + result[\"note\"])\n    return \"\\n\".join(out)\n","pokerbrain/rangemodel.py":"\"\"\"Heuristic range estimation.\n\nAssigns a plausible range to an opponent from their position and the actions\nthey took, then narrows it street by street. This is a *model*, not solver\noutput: it exists so that every hand in a report gets real equity numbers\ninstead of none. Anything it produces should be presented as an estimate and\noverridden by hand when you have a genuine read.\n\nThe narrowing logic is deliberately simple and inspectable:\n\n  bet / raise -> polarised: the strongest part of the range, plus strong\n                 draws as semi-bluffs, plus a slice of the weakest hands\n                 as pure bluffs.\n  call        -> the middle: too good to fold, not good enough to raise.\n  check       -> everything that is not betting, weighted to the weak end.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\n\nfrom .evaluator import evaluate, hand_category, STRAIGHT, TRIPS, TWO_PAIR, PAIR\nfrom .model import ALLIN, BET, CALL, CHECK, FLOP, FOLD, PREFLOP, RAISE, RIVER, TURN\nfrom .ranges import parse_range, remove_blockers, hand_class\n\n_CHART_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"charts\")\n_RANGES = None\n\n# Fractions of the range used by each action. Tuned to be plausible rather\n# than exact; they are exposed here so they are easy to argue with.\nVALUE_FRAC = 0.30       # strongest share that bets for value\nBLUFF_FRAC = 0.18       # weakest share that bets as a bluff\nCALL_TOP = 0.62         # calling range spans this band of the ranking\nCALL_BOTTOM = 0.18\n\n\ndef reference_ranges() -> dict:\n    global _RANGES\n    if _RANGES is None:\n        with open(os.path.join(_CHART_DIR, \"preflop_ranges.json\"), \"r\", encoding=\"utf-8\") as fh:\n            _RANGES = json.load(fh)\n    return _RANGES\n\n\n# ----------------------------------------------------------- preflop -------\n\ndef _bucket_for(position):\n    if position in (\"UTG\", \"UTG1\", \"UTG2\"):\n        return \"vs_early\"\n    if position in (\"MP\", \"MP1\", \"HJ\"):\n        return \"vs_middle\"\n    if position in (\"CO\", \"BTN\"):\n        return \"vs_late\"\n    return \"vs_blinds\"\n\n\ndef preflop_range(hand, player_name):\n    \"\"\"Estimate a villain's preflop range from position and preflop action.\"\"\"\n    charts = reference_ranges()\n    player = hand.player(player_name)\n    if not player:\n        return \"\"\n\n    raises = 0\n    my_actions = []\n    for a in hand.actions:\n        if a.street != PREFLOP or a.verb in (\"post\", \"return\", \"straddle\"):\n            continue\n        aggressive = a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0)\n        if a.player == player_name:\n            my_actions.append((a, raises, aggressive))\n        if aggressive:\n            raises += 1\n\n    if not my_actions:\n        return charts[\"rfi\"].get(player.position, charts[\"rfi\"][\"CO\"])\n\n    first, faced, was_raise = my_actions[0]\n    last_raise_depth = max((f for _, f, agg in my_actions if agg), default=None)\n\n    if last_raise_depth is not None and last_raise_depth >= 2:\n        return charts[\"vs_3bet_4bet\"][\"default\"]\n    if last_raise_depth == 1:\n        return charts[\"vs_rfi_3bet\"][_bucket_for(player.position)]\n    if was_raise:\n        return charts[\"rfi\"].get(player.position, charts[\"rfi\"][\"CO\"])\n\n    # Called somewhere.\n    if faced >= 2:\n        return charts[\"vs_3bet_call\"][\"default\"]\n    if player.position == \"BB\":\n        return charts[\"vs_rfi_call\"][\"bb_vs_btn\"]\n    if player.position in (\"BTN\", \"CO\", \"HJ\"):\n        return charts[\"vs_rfi_call\"][\"ip_vs_late\"]\n    return charts[\"vs_rfi_call\"][\"ip_vs_early\"]\n\n\n# ---------------------------------------------------------- postflop -------\n\ndef _draw_outs(combo, board):\n    \"\"\"Cards that would make a straight or flush for this combo.\"\"\"\n    known = set(combo) | set(board)\n    if len(board) >= 5:\n        return 0\n    base = hand_category(evaluate(list(combo) + list(board)))\n    outs = 0\n    for card in range(52):\n        if card in known:\n            continue\n        cat = hand_category(evaluate(list(combo) + list(board) + [card]))\n        if cat >= STRAIGHT and cat > base:\n            outs += 1\n    return outs\n\n\ndef _rank_combos(weighted, board):\n    \"\"\"Order a range from strongest made hand to weakest, with draw info.\"\"\"\n    rows = []\n    for combo in weighted:\n        score = evaluate(list(combo) + list(board))\n        rows.append([combo, score, 0])\n    rows.sort(key=lambda r: -r[1])\n    # Only compute draw outs for the weaker part of the range; strong made\n    # hands do not need them and the evaluation is the expensive bit.\n    if len(board) < 5 and len(rows) <= 260:\n        cutoff = int(len(rows) * VALUE_FRAC)\n        for row in rows[cutoff:]:\n            row[2] = _draw_outs(row[0], board)\n    return rows\n\n\ndef narrow(weighted, board, action_verb):\n    \"\"\"Narrow a range on a board given the action taken.\"\"\"\n    if not weighted or len(board) < 3:\n        return dict(weighted)\n    rows = _rank_combos(weighted, board)\n    n = len(rows)\n    if n == 0:\n        return {}\n\n    aggressive = action_verb in (BET, RAISE, ALLIN)\n    out = {}\n\n    if aggressive:\n        value_cut = max(1, int(n * VALUE_FRAC))\n        for combo, _, _ in rows[:value_cut]:\n            out[combo] = weighted[combo]\n        # semi-bluffs: strong draws from the rest of the range\n        for combo, _, outs in rows[value_cut:]:\n            if outs >= 8:\n                out[combo] = weighted[combo] * 0.8\n            elif outs >= 4:\n                out[combo] = weighted[combo] * 0.35\n        # pure bluffs: a slice of the very bottom\n        bluff_start = int(n * (1 - BLUFF_FRAC))\n        for combo, _, outs in rows[bluff_start:]:\n            if outs < 4:\n                out.setdefault(combo, weighted[combo] * 0.25)\n\n    elif action_verb == CALL:\n        lo = int(n * CALL_BOTTOM)\n        hi = int(n * CALL_TOP)\n        for combo, _, _ in rows[lo:hi] or rows:\n            out[combo] = weighted[combo]\n        for combo, _, outs in rows[hi:]:\n            if outs >= 8:\n                out[combo] = weighted[combo] * 0.7\n\n    elif action_verb == CHECK:\n        start = max(1, int(n * VALUE_FRAC * 0.5))\n        for combo, _, _ in rows[start:]:\n            out[combo] = weighted[combo]\n        # slow-played monsters\n        for combo, _, _ in rows[:start]:\n            out[combo] = weighted[combo] * 0.25\n\n    else:\n        return dict(weighted)\n\n    return out or dict(weighted)\n\n\ndef estimate_ranges(hand, villain_name, hero_name=\"Hero\"):\n    \"\"\"{street: {combo: weight}} for one villain, narrowed by their actions.\"\"\"\n    spec = preflop_range(hand, villain_name)\n    hero = hand.player(hero_name)\n    dead = list(hero.hole_cards) if hero else []\n    current = remove_blockers(parse_range(spec), dead)\n    out = {PREFLOP: dict(current)}\n\n    for street in (FLOP, TURN, RIVER):\n        if street not in hand.streets_reached:\n            break\n        board = hand.board_at(street)\n        current = remove_blockers(current, dead + list(board))\n        for a in hand.street_actions(street):\n            if a.player != villain_name:\n                continue\n            verb = ALLIN if (a.verb == ALLIN and a.amount > 0) else a.verb\n            if verb == FOLD:\n                continue\n            current = narrow(current, board, verb)\n        out[street] = dict(current)\n    return out, spec\n\n\ndef describe_range(weighted, limit=14):\n    \"\"\"Short readable summary of a weighted range.\"\"\"\n    if not weighted:\n        return \"(empty)\"\n    by_class = {}\n    for combo, w in weighted.items():\n        label = hand_class(combo)\n        by_class[label] = by_class.get(label, 0.0) + w\n    ordered = sorted(by_class, key=lambda k: -by_class[k])\n    shown = ordered[:limit]\n    more = len(ordered) - len(shown)\n    text = \", \".join(shown)\n    if more > 0:\n        text += \" +%d more\" % more\n    return text\n\n\ndef main_villain(hand, hero_name=\"Hero\"):\n    \"\"\"The opponent who contested the pot most with the hero.\"\"\"\n    best = None\n    best_invested = 0.0\n    for p in hand.players:\n        if p.name == hero_name:\n            continue\n        if p.invested > best_invested:\n            best_invested = p.invested\n            best = p.name\n    return best\n","pokerbrain/ranges.py":"\"\"\"Preflop range notation parsing and combo maths.\n\nA *combo* is a specific two-card holding as a sorted tuple of card ints,\ne.g. AsKd. A *hand class* is the 169-element abstraction, e.g. AKs.\n\nSupported notation (comma or space separated):\n    AA, 77+, 99-55            pairs, pair-and-better, pair spans\n    AKs, AKo, AK              suited / offsuit / both\n    ATs+, AJo+, KQ+           kicker climbs toward the top card\n    A5s-A2s                   kicker spans\n    AsKd                      one exact combo\n    top 15%  /  15%           strongest N% of all 1326 combos\n    AA:0.5                    weighted entry (weight applied to each combo)\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport re\n\nfrom .cards import RANK_CHARS, RANK_TO_INT, parse_cards, card_rank, card_suit, card_str\n\nCombo = tuple  # (int, int) sorted ascending\n\n_CHART_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"charts\")\n_STRENGTH_PATH = os.path.join(_CHART_DIR, \"hand_strength.json\")\n\n\nclass RangeError(ValueError):\n    \"\"\"Raised when range notation cannot be parsed.\"\"\"\n\n\n# ---------------------------------------------------------------- combos ---\n\ndef make_combo(a: int, b: int) -> Combo:\n    return (a, b) if a < b else (b, a)\n\n\ndef all_combos() -> list:\n    out = []\n    for a in range(52):\n        for b in range(a + 1, 52):\n            out.append((a, b))\n    return out\n\n\ndef combo_str(combo: Combo) -> str:\n    return card_str(combo[1]) + card_str(combo[0])\n\n\ndef hand_class(combo: Combo) -> str:\n    \"\"\"Return the 169-class label for a combo: AKs, T9o, 77.\"\"\"\n    r1, r2 = card_rank(combo[0]), card_rank(combo[1])\n    hi, lo = max(r1, r2), min(r1, r2)\n    if hi == lo:\n        return RANK_CHARS[hi] * 2\n    suited = card_suit(combo[0]) == card_suit(com
