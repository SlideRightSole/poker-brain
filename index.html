    (\"overfold_cbet\", \"fold_to_cbet\", \">\", 58, \"high\",\n     \"Folds too much to c-bets\",\n     \"C-bet every flop against them, and keep barrelling turns. They give \"\n     \"up far too often for your bluffs to need much equity.\",\n     \"FvCB{v} cbet always\"),\n\n    (\"passive\", \"pfr\", \"<\", 12, \"high\",\n     \"Passive - calls far more than they raise\",\n     \"Raise them off pots relentlessly. When they do bet or raise, it is \"\n     \"strength: believe them and fold your marginal hands.\",\n     \"PFR{v} passive, raise em\"),\n\n    (\"calling_station\", \"wtsd\", \">\", 33, \"high\",\n     \"Goes to showdown far too often\",\n     \"Never bluff the river against them. Value bet two and three streets \"\n     \"with hands you would normally check.\",\n     \"WTSD{v} never bluff\"),\n\n    (\"overfolds_showdown\", \"wtsd\", \"<\", 21, \"medium\",\n     \"Gives up before showdown\",\n     \"Bluff them more, particularly on turns and rivers. They arrive at the \"\n     \"river with too few hands to call you.\",\n     \"WTSD{v} bluff more\"),\n\n    (\"low_3bet\", \"three_bet\", \"<\", 5, \"medium\",\n     \"Rarely 3-bets\",\n     \"Open wider against them. When they do 3-bet it is value - fold your \"\n     \"marginal opens rather than calling to 'see a flop'.\",\n     \"3B{v} their 3bets = value\"),\n\n    (\"high_3bet\", \"three_bet\", \">\", 11, \"medium\",\n     \"3-bets a lot\",\n     \"Defend wider against their 3-bets and add 4-bet bluffs. A 3-betting \"\n     \"range this wide contains plenty of air.\",\n     \"3B{v} defend wider\"),\n\n    (\"steal_happy\", \"steal\", \">\", 48, \"medium\",\n     \"Attacks the blinds constantly\",\n     \"Defend your big blind wider against them, and 3-bet their late opens. \"\n     \"Their stealing range is far too wide to hold up.\",\n     \"Steal{v} 3bet their opens\"),\n\n    (\"no_steal\", \"steal\", \"<\", 25, \"low\",\n     \"Rarely steals\",\n     \"Their late-position opens are strong. Give their button and cutoff \"\n     \"raises more respect than the position suggests.\",\n     \"Steal{v} late opens strong\"),\n\n    (\"cbet_happy\", \"cbet\", \">\", 74, \"medium\",\n     \"C-bets almost every flop\",\n     \"Float them in position and check-raise more. A c-bet that frequent \"\n     \"cannot be filtering for strength.\",\n     \"CB{v} float/raise more\"),\n\n    (\"cbet_shy\", \"cbet\", \"<\", 48, \"medium\",\n     \"Rarely c-bets\",\n     \"Their c-bets are strong. But their checks are weak - attack every \"\n     \"flop they check to you.\",\n     \"CB{v} attack their checks\"),\n\n    (\"checkraise_real\", \"check_raise\", \">\", 9, \"info\",\n     \"Check-raises at a real frequency\",\n     \"Their checks are not automatic weakness. Size down when betting into \"\n     \"them and be ready to fold to the raise.\",\n     \"CR{v} checks not weak\"),\n\n    (\"no_checkraise\", \"check_raise\", \"<\", 3, \"medium\",\n     \"Almost never check-raises\",\n     \"When they check, bet. Their check is a give-up, and you can bet any \"\n     \"two cards with near-impunity.\",\n     \"CR{v} bet when they check\"),\n\n    (\"weak_showdown\", \"wsd\", \"<\", 45, \"medium\",\n     \"Loses too often at showdown\",\n     \"They arrive at the river with weak holdings. Value bet thinner and \"\n     \"bluff less - they are paying you off already.\",\n     \"WSD{v} thin value\"),\n]\n\n\n# What goes in the table note for each leak: what they do wrong, then what\n# you do about it. Plain words, no stat codes - the note is read mid-hand.\nNOTE_TIPS = {\n    \"wide_gap\": \"calls far too much preflop - isolate them and value bet\",\n    \"no_flatting\": \"raise-or-fold player - when they just call, respect it\",\n    \"overfold_3bet\": \"folds to 3-bets - 3-bet them light\",\n    \"underfold_3bet\": \"never folds to 3-bets - 3-bet for value only\",\n    \"sticky_postflop\": \"won't fold to c-bets - don't barrel, just value bet\",\n    \"overfold_cbet\": \"folds to c-bets - c-bet and keep barrelling\",\n    \"passive\": \"passive - raise them off pots, their bets mean strength\",\n    \"calling_station\": \"calls down too much - never bluff the river\",\n    \"overfolds_showdown\": \"gives up before showdown - bluff turns and rivers\",\n    \"low_3bet\": \"rarely 3-bets - their 3-bet is strong, fold marginal hands\",\n    \"high_3bet\": \"3-bets wide - defend more, add 4-bet bluffs\",\n    \"steal_happy\": \"steals a lot - defend blinds wider, 3-bet their opens\",\n    \"no_steal\": \"rarely steals - their late-position opens are strong\",\n    \"cbet_happy\": \"c-bets almost every flop - float and raise them\",\n    \"cbet_shy\": \"rarely c-bets - their bets are real, attack their checks\",\n    \"checkraise_real\": \"check-raises often - their checks aren't weak, bet smaller\",\n    \"no_checkraise\": \"never check-raises - bet whenever they check\",\n    \"weak_showdown\": \"shows down weak hands - value bet thinner\",\n}\n\ndef _cmp(value, op, threshold):\n    return value > threshold if op == \">\" else value < threshold\n\n\ndef gap(stats):\n    \"\"\"VPIP minus PFR. A winning regular sits at 4-6; a station at 15+.\"\"\"\n    return stats[\"vpip\"] - stats[\"pfr\"]\n\n\n# ----------------------------------------------------------- archetypes ---\n\ndef classify(stats):\n    \"\"\"Return (colour, archetype label, reasoning) from a full stat line.\"\"\"\n    v, p = stats[\"vpip\"], stats[\"pfr\"]\n    g = gap(stats)\n    fcb = stats[\"fold_to_cbet\"]\n    wtsd = stats[\"wtsd\"]\n    tb = stats[\"three_bet\"]\n    cr = stats[\"check_raise\"]\n\n    # Loose-passive: the profile that prints money.\n    if (v >= 33 and g >= 10) or (g >= 15) or (fcb <= 28 and wtsd >= 33 and p < 18):\n        return \"green\", \"Fish / station\", (\n            \"VPIP %g with a %g-point gap to PFR - they call into far too many \"\n            \"pots and raise almost none of them before the flop, so most of \"\n            \"their range is hands they were not willing to raise.\" % (v, g))\n\n    # Loose-aggressive.\n    if v >= 30 and p >= 24:\n        return \"orange\", \"LAG / maniac\", (\n            \"VPIP %g / PFR %g - genuinely loose and genuinely aggressive. Their \"\n            \"range is far wider than their aggression implies.\" % (v, p))\n\n    # Nit.\n    if v <= 17:\n        return \"yellow\", \"Nit / rock\", (\n            \"VPIP %g - they are folding their way through the session. Their \"\n            \"blinds are free and their aggression is real.\" % v)\n\n    # Strong, balanced, aggressive and no glaring hole -> the one to avoid.\n    in_band = sum(1 for k, (lo, hi) in BENCHMARKS.items()\n                  if lo <= stats.get(k, -1) <= hi)\n    if in_band >= 7 and tb >= 7 and cr >= 6:\n        return \"red\", \"Threat - avoid\", (\n            \"%d of 10 stats sit inside the winning-regular band, with a real \"\n            \"3-bet and check-raise frequency. No obvious way in.\" % in_band)\n\n    return \"blue\", \"Solid reg\", (\n        \"VPIP %g / PFR %g with a %g-point gap - a reasonable, ordinary \"\n        \"regular.\" % (v, p, g))\n\n\ndef with_derived(stats):\n    \"\"\"The entered stats plus anything computed from them.\"\"\"\n    full = dict(stats)\n    full[\"gap\"] = gap(stats)\n    return full\n\n\ndef find_leaks(stats):\n    \"\"\"All triggered leak rules, most severe first.\"\"\"\n    rank = {\"high\": 0, \"medium\": 1, \"low\": 2, \"info\": 3}\n    full = with_derived(stats)\n    out = []\n    for lid, stat, op, threshold, severity, title, exploit, short in LEAK_RULES:\n        value = full.get(stat)\n        if value is None:\n            continue\n        if _cmp(value, op, threshold):\n            out.append({\n                \"id\": lid,\n                \"stat\": stat,\n                \"label\": STAT_LABELS[stat],\n                \"value\": value,\n                \"severity\": severity,\n                \"title\": title,\n                \"exploit\": exploit,\n                \"shorthand\": NOTE_TIPS.get(lid, short.replace(\"{v}\", \"%g\" % value)),\n                \"reliability\": STAT_SPEED[stat],\n                \"benchmark\": BENCHMARKS[stat],\n            })\n    out.sort(key=lambda f: (rank[f[\"severity\"]],\n                            0 if f[\"reliability\"] == \"fast\" else\n                            1 if f[\"reliability\"] == \"medium\" else 2))\n    return out\n\n\n# When no rule fires there is nothing to shorthand, and a note of just\n# \"25/20\" tells you nothing at the table. Fall back to the archetype's\n# standing instruction so every note carries an action.\nNOTE_FALLBACK = {\n    \"red\": \"no hole found - avoid marginal spots, no fancy bluffs\",\n    \"blue\": \"ordinary reg - play it straight\",\n    \"green\": \"loose-passive - value bet thin, never bluff\",\n    \"orange\": \"LAG - let them bluff into you, call lighter\",\n    \"yellow\": \"nit - steal their blinds, believe their raises\",\n}\n\n\n# Short enough to leave room for the leaks, long enough to read at a glance.\nNOTE_PREFIX = {\n    \"green\": \"GREEN fish\",\n    \"orange\": \"ORANGE LAG\",\n    \"yellow\": \"YELLOW nit\",\n    \"blue\": \"BLUE reg\",\n    \"red\": \"RED avoid\",\n    \"magenta\": \"MAGENTA reg w/ hole\",\n    \"none\": \"untagged\",\n}\n\n\ndef build_note(name, stats, colour, leaks, limit=NOTE_LIMIT):\n    \"\"\"A note that fits the client's field, ordered by what matters most.\"\"\"\n    head = NOTE_PREFIX.get(colour, colour.upper())\n    parts = [head]\n    for leak in leaks:\n        if leak[\"severity\"] == \"info\":\n            continue\n        candidate = parts + [leak[\"shorthand\"]]\n        if len(\" | \".join(candidate)) > limit:\n            break\n        parts = candidate\n    if len(parts) == 1:\n        # Nothing actionable fired. An informational finding still beats\n        # boilerplate: \"his checks are not weakness\" earns its space.\n        for leak in leaks:\n            if leak[\"severity\"] != \"info\":\n                continue\n            candidate = parts + [leak[\"shorthand\"]]\n            if len(\" | \".join(candidate)) <= limit:\n                parts = candidate\n    if len(parts) == 1:\n        fallback = NOTE_FALLBACK.get(colour)\n        if fallback and len(head) + 3 + len(fallback) <= limit:\n            parts.append(fallback)\n    note = \" | \".join(parts)\n    if len(note) > limit:\n        note = note[: limit - 1].rstrip() + \"\u2026\"\n    return note\n\n\n# ------------------------------------------------------------ game plan ---\n# Conditions are [stat, op, threshold] lists that must all hold; an empty\n# list is the default. Entries sharing a group never both appear, so a\n# combined rule suppresses the single-stat rules it already covers.\n\nPROFILE_RULES = {\n    \"pre\": [\n        ([[\"vpip\", \"<=\", 17]], \"They play very tight preflop\", \"play very tight pre\"),\n        ([[\"vpip\", \">=\", 33], [\"gap\", \">=\", 10]],\n         \"They play a huge number of hands and mostly just call\", \"call far too much pre\"),\n        ([[\"gap\", \">=\", 15]], \"They call far more than they raise preflop\", \"call more than they raise\"),\n        ([[\"vpip\", \">=\", 30], [\"pfr\", \">=\", 24]], \"They play loose and aggressive preflop\", \"play loose & aggressive\"),\n        ([[\"gap\", \"<=\", 2]], \"They raise or fold preflop and almost never just call\",\n         \"raise or fold pre\"),\n        ([[\"vpip\", \">=\", 29]], \"They play a little loose preflop\", \"play a bit loose pre\"),\n        ([[\"three_bet\", \">=\", 10]], \"They are aggressive preflop and 3-bet a lot\",\n         \"3-bet a lot\"),\n        ([[\"three_bet\", \"<=\", 6], [\"vpip\", \">=\", 24]],\n         \"They play plenty of hands but call instead of 3-betting\", \"flat instead of 3-betting\"),\n        ([[\"pfr\", \">=\", 20], [\"gap\", \"<=\", 6]],\n         \"They play solid, raise-first preflop\", \"raise first pre\"),\n        ([], \"They play normal, reg-like preflop ranges\", \"play normal ranges pre\"),\n    ],\n    \"post\": [\n        ([[\"fold_to_cbet\", \"<\", 32], [\"wtsd\", \">\", 33]],\n         \"after the flop they call down and rarely fold\",\n         \"call down after the flop\"),\n        ([[\"fold_to_cbet\", \"<\", 32]], \"after the flop they are very hard to push off a hand\",\n         \"won't fold to c-bets\"),\n        ([[\"wtsd\", \">\", 33]], \"they call down to showdown too often\", \"call down too much\"),\n        ([[\"fold_to_cbet\", \">\", 58]], \"they fold easily to flop bets\", \"fold to c-bets\"),\n        ([[\"wtsd\", \"<\", 21]], \"they give up before showdown\", \"give up before showdown\"),\n        ([[\"cbet\", \">\", 74]], \"they bet most flops, then give up\", \"c-bet then give up\"),\n        ([[\"check_raise\", \">\", 9]], \"they check-raise a lot after the flop\",\n         \"check-raise a lot\"),\n        ([[\"fold_to_cbet\", \"<\", 36]], \"they lean sticky against c-bets\", \"lean sticky vs c-bets\"),\n        ([[\"check_raise\", \">=\", 8], [\"cbet\", \">=\", 60]],\n         \"they play balanced and aggressive after the flop\", \"play balanced after the flop\"),\n        ([[\"check_raise\", \"<=\", 5]], \"they rarely fight back with a check-raise\",\n         \"rarely check-raise\"),\n        ([], \"they fold a normal amount after the flop\", \"fold normally after the flop\"),\n    ],\n}\n\nPLAN_SECTIONS = [\n    (\"preflop\", \"Preflop\", \"PRE\", 2),\n    (\"flop\", \"Flop\", \"FLOP\", 2),\n    (\"river\", \"Turn & river\", \"RIVER\", 2),\n]\n\n# (conditions, groups, long advice, short advice for the note)\nPLAN = {\n    \"preflop\": [\n        ([[\"fold_to_three_bet\", \">\", 60], [\"steal\", \">\", 48]], [\"f3b\", \"steal\"],\n         \"Re-steal a lot: they open wide from the button and cutoff and then fold \"\n         \"to most 3-bets.\",\n         \"re-steal vs their late opens\"),\n        ([[\"fold_to_three_bet\", \">\", 60]], [\"f3b\"],\n         \"3-bet them light, especially over late-position opens - they fold to \"\n         \"3-bets far too often, so suited aces and broadways make good bluffs.\",\n         \"3-bet them light\"),\n        ([[\"gap\", \">\", 12]], [\"gap\"],\n         \"Raise to isolate them when they limp or call, and play big pots with \"\n         \"them in position - most of their hands are weak ones they just called with.\",\n         \"isolate them, play big pots in position\"),\n        ([[\"fold_to_three_bet\", \"<\", 33]], [\"f3b\"],\n         \"Only 3-bet them with strong hands. They won't fold, so a bluff 3-bet just \"\n         \"builds a big pot with a weak hand.\",\n         \"3-bet them only with strong hands\"),\n        ([[\"three_bet\", \">\", 11]], [\"3b\"],\n         \"Their 3-bets are wide: don't fold hands like AJ, KQ or pairs to them, and \"\n         \"add a few 4-bet bluffs with an ace blocker.\",\n         \"don't fold good hands to their 3-bets\"),\n        ([[\"three_bet\", \"<\", 5]], [\"3b\"],\n         \"When they 3-bet it is a big hand - fold everything marginal, even AQ.\",\n         \"fold marginal hands to their 3-bets\"),\n        ([[\"steal\", \">\", 48]], [\"steal\"],\n         \"They raise the button and cutoff very light: defend your blinds wider \"\n         \"and 3-bet their opens with good hands.\",\n         \"defend your blinds wider vs them\"),\n        ([[\"vpip\", \"<=\", 17]], [\"tight\"],\n         \"Steal their blinds every time it folds to you, and when they do raise, \"\n         \"believe them and fold marginal hands.\",\n         \"steal their blinds, fold to their raises\"),\n        ([[\"steal\", \"<\", 25]], [\"steal\"],\n         \"Respect their button and cutoff raises - they are not stealing light.\",\n         \"respect their late-position raises\"),\n        ([[\"three_bet\", \">=\", 10]], [\"3b\"],\n         \"Their 3-bet is on the high side, so don't give up too easily when they \"\n         \"3-bet you.\",\n         \"don't over-fold to their 3-bets\"),\n        ([[\"fold_to_three_bet\", \">=\", 55]], [\"f3b\"],\n         \"They lean towards folding to 3-bets - a light 3-bet now and then prints.\",\n         \"3-bet them light sometimes\"),\n        ([[\"fold_to_three_bet\", \"<=\", 48]], [\"f3b\"],\n         \"They defend against 3-bets, so 3-bet them for value rather than as a bluff.\",\n         \"3-bet them for value, not as a bluff\"),\n        ([[\"steal\", \"<=\", 35]], [\"steal\"],\n         \"Their button and cutoff opens are a bit tighter than normal - give them \"\n         \"some respect from the blinds.\",\n         \"give their late opens respect\"),\n        ([[\"three_bet\", \"<=\", 6]], [\"3b\"],\n         \"They rarely 3-bet light, so open a little wider in front of them and give \"\n         \"their 3-bets credit.\",\n         \"open wider in front of them\"),\n        ([], [],\n         \"Nothing to exploit preflop - play your normal ranges.\",\n         \"play your normal ranges\"),\n    ],\n    \"flop\": [\n        ([[\"fold_to_cbet\", \"<\", 32]], [\"fcb\"],\n         \"Don't c-bet as a bluff - they call. Bet your made hands for value and \"\n         \"check back your misses.\",\n         \"don't c-bet bluff them, value bet only\"),\n        ([[\"fold_to_cbet\", \">\", 58]], [\"fcb\"],\n         \"C-bet almost every flop and keep firing the turn - they fold too often.\",\n         \"c-bet them often and keep firing\"),\n        ([[\"cbet\", \">\", 74]], [\"cbet\"],\n         \"Their c-bets are mostly air: call wider in position and raise some flops.\",\n         \"call and raise their c-bets more\"),\n        ([[\"cbet\", \"<\", 48]], [\"cbet\"],\n         \"When they bet a flop they have it; when they check, take a stab.\",\n         \"believe their bets, bet when they check\"),\n        ([[\"check_raise\", \">\", 9]], [\"cr\"],\n         \"Their checks are not weak - bet smaller and be ready to fold to a \"\n         \"check-raise.\",\n         \"bet smaller - their checks can be traps\"),\n        ([[\"check_raise\", \"<\", 3]], [\"cr\"],\n         \"They almost never check-raise, so bet whenever they check to you.\",\n         \"bet whenever they check\"),\n        ([[\"fold_to_cbet\", \"<\", 36]], [\"fcb\"],\n         \"They lean sticky after the flop - keep c-bet bluffs for boards that give \"\n         \"you real equity.\",\n         \"c-bet bluff them less\"),\n        ([[\"cbet\", \">=\", 70]], [\"cbet\"],\n         \"They c-bet often, so don't fold every miss to a flop bet in position.\",\n         \"don't fold every miss to their c-bet\"),\n        ([[\"check_raise\", \">=\", 8]], [\"cr\"],\n         \"They check-raise at a real rate - don't bet automatically when they check.\",\n         \"don't auto-bet when they check\"),\n        ([[\"check_raise\", \"<=\", 5]], [\"cr\"],\n         \"They seldom check-raise, so betting when they check is usually profitable.\",\n         \"bet when they check\"),\n        ([[\"fold_to_cbet\", \">=\", 46]], [\"fcb\"],\n         \"They give up on a fair number of flops - c-bet dry, high-card boards.\",\n         \"c-bet them on dry boards\"),\n        ([], [],\n         \"Nothing to exploit on the flop - use your normal c-bet strategy.\",\n         \"play your normal c-bet strategy\"),\n    ],\n    \"river\": [\n        ([[\"wtsd\", \">\", 33]], [\"wtsd\"],\n         \"Never bluff the river. Value bet thinner - top pair can bet all three \"\n         \"streets.\",\n         \"never bluff them, value bet thin\"),\n        ([[\"wtsd\", \"<\", 21]], [\"wtsd\"],\n         \"Fire turn and river barrels - they give up before showdown.\",\n         \"barrel them on turn and river\"),\n        ([[\"wsd\", \"<\", 45]], [\"wsd\"],\n         \"They reach showdown with weak hands - value bet thin and call down a \"\n         \"little lighter.\",\n         \"value bet thin, call them down lighter\"),\n        ([[\"wsd\", \">\", 56]], [\"wsd\"],\n         \"When they get to showdown they usually have it - respect big river bets.\",\n         \"fold to their big river bets\"),\n        ([[\"wtsd\", \">\", 30]], [\"wtsd\"],\n         \"They go to showdown slightly often - bluff the river sparingly.\",\n         \"bluff them on the river rarely\"),\n        ([[\"wsd\", \">=\", 54]], [\"wsd\"],\n         \"They win a lot when they get to showdown - their river calls and bets \"\n         \"are usually good hands.\",\n         \"respect their river bets and calls\"),\n        ([[\"wsd\", \"<=\", 50]], [\"wsd\"],\n         \"Their showdown hands are on the weak side - thin value bets get paid.\",\n         \"value bet thinner vs them\"),\n        ([[\"wtsd\", \"<=\", 26]], [\"wtsd\"],\n         \"They don't call down much, so a well-chosen river bluff works.\",\n         \"bluff them on the river sometimes\"),\n        ([], [],\n         \"Play turns and rivers straightforwardly.\",\n         \"play turn and river normally\"),\n    ],\n}\n\n\ndef _holds(full, conditions):\n    for stat, op, threshold in conditions:\n        v = full.get(stat)\n        if v is None:\n            return False\n        if op == \">\" and not v > threshold:\n            return False\n        if op == \"<\" and not v < threshold:\n            return False\n        if op == \">=\" and not v >= threshold:\n            return False\n        if op == \"<=\" and not v <= threshold:\n            return False\n    return True\n\n\ndef game_plan(stats):\n    \"\"\"Profile sentence plus street-by-street advice.\"\"\"\n    full = with_derived(stats)\n    pre = next(r for r in PROFILE_RULES[\"pre\"] if _holds(full, r[0]))\n    post = next(r for r in PROFILE_RULES[\"post\"] if _holds(full, r[0]))\n    sections = []\n    for key, title, label, limit in PLAN_SECTIONS:\n        picked, used = [], set()\n        for conds, groups, long_text, short_text in PLAN[key]:\n            if len(picked) >= limit:\n                break\n            if not conds or used & set(groups):\n                continue\n            if _holds(full, conds):\n                picked.append({\"long\": long_text, \"short\": short_text})\n                used |= set(groups)\n        if not picked:\n            default = [e for e in PLAN[key] if not e[0]][0]\n            picked = [{\"long\": default[2], \"short\": default[3]}]\n        sections.append({\"key\": key, \"title\": title, \"label\": label, \"items\": picked})\n    return {\n        \"profile\": \"%s; %s.\" % (pre[1], post[1]),\n        \"profileShort\": \"THEM: %s, %s.\" % (pre[2], post[2]),\n        \"sections\": sections,\n    }\n\n\ndef plan_note(plan, limit=NOTE_LIMIT):\n    \"\"\"The plan squeezed into the client's note field.\n\n    Every street keeps its top instruction; second instructions are added\n    only while there is room, so a long preflop plan can't push the river\n    advice out of the note.\n    \"\"\"\n    secs = plan[\"sections\"]\n\n    def render(counts):\n        parts = [plan[\"profileShort\"]]\n        for idx, (sec, n) in enumerate(zip(secs, counts)):\n            if n == 0:\n                continue\n            lead = \"ME - \" if not any(counts[:idx]) else \"\"\n            shorts = [i[\"short\"] for i in sec[\"items\"][:n]]\n            parts.append(\"%s%s: %s.\" % (lead, sec[\"label\"], \"; \".join(shorts)))\n        return \" \".join(parts)\n\n    counts = [1] * len(secs)\n    while len(render(counts)) > limit and any(counts):\n        last = max(i for i, n in enumerate(counts) if n)\n        counts[last] = 0\n    for i, sec in enumerate(secs):\n        if counts[i] and len(sec[\"items\"]) > counts[i]:\n            trial = list(counts)\n            trial[i] += 1\n            if len(render(trial)) <= limit:\n                counts = trial\n    return render(counts)\n\n\ndef profile(stats, name=\"\"):\n    \"\"\"Full profile: tag, archetype, leaks, note, reliability warnings.\"\"\"\n    missing = [k for k, _, _ in STATS if stats.get(k) is None]\n    if missing:\n        raise ValueError(\"missing stats: %s\" % \", \".join(missing))\n\n    colour, label, why = classify(stats)\n    leaks = find_leaks(stats)\n\n    # A competent-looking regular with a serious hole gets flagged for the\n    # note rather than the archetype, because the archetype alone misleads.\n    serious = [l for l in leaks if l[\"severity\"] == \"high\"]\n    if colour in (\"blue\", \"red\") and serious:\n        colour = \"magenta\"\n        label = \"Reg with a hole\"\n        first = serious[0][\"title\"]\n        why = (\"Looks like an ordinary regular, but %s. The exploit is in the \"\n               \"note, not the headline stats.\" % (first[0].lower() + first[1:]))\n\n    shaky = sorted({l[\"label\"] for l in leaks if l[\"reliability\"] == \"slow\"})\n    plan = game_plan(stats)\n\n    return {\n        \"name\": name,\n        \"stats\": dict(stats),\n        \"gap\": gap(stats),\n        \"colour\": colour,\n        \"archetype\": label,\n        \"headline\": TAGS[colour][1],\n        \"reasoning\": why,\n        \"leaks\": leaks,\n        \"plan\": plan,\n        \"note\": plan_note(plan),\n        \"colourGuide\": TAG_GUIDE_BY_COLOUR.get(colour),\n        \"unreliable\": shaky,\n    }\n\n\n# Reference stat lines with the colour the Python rules give them. The web\n# report re-applies the rules client-side, so it checks itself against these\n# on load and complains in the console if the JavaScript port has drifted.\nSELF_TEST = [\n    ({\"vpip\": 24, \"pfr\": 22, \"three_bet\": 12, \"fold_to_three_bet\": 64, \"cbet\": 70,\n      \"fold_to_cbet\": 21, \"steal\": 45, \"check_raise\": 11, \"wtsd\": 31, \"wsd\": 52}, \"magenta\"),\n    ({\"vpip\": 48, \"pfr\": 9, \"three_bet\": 2, \"fold_to_three_bet\": 30, \"cbet\": 35,\n      \"fold_to_cbet\": 22, \"steal\": 14, \"check_raise\": 2, \"wtsd\": 41, \"wsd\": 44}, \"green\"),\n    ({\"vpip\": 13, \"pfr\": 11, \"three_bet\": 3, \"fold_to_three_bet\": 78, \"cbet\": 62,\n      \"fold_to_cbet\": 66, \"steal\": 20, \"check_raise\": 3, \"wtsd\": 20, \"wsd\": 58}, \"yellow\"),\n    ({\"vpip\": 42, \"pfr\": 34, \"three_bet\": 16, \"fold_to_three_bet\": 32, \"cbet\": 82,\n      \"fold_to_cbet\": 30, \"steal\": 62, \"check_raise\": 14, \"wtsd\": 28, \"wsd\": 47}, \"orange\"),\n    # Every stat in band, with a real 3-bet and check-raise: no way in.\n    ({\"vpip\": 25, \"pfr\": 20, \"three_bet\": 8, \"fold_to_three_bet\": 48, \"cbet\": 62,\n      \"fold_to_cbet\": 47, \"steal\": 42, \"check_raise\": 8, \"wtsd\": 27, \"wsd\": 52}, \"red\"),\n    # Competent but unremarkable - nothing to attack, nothing to fear.\n    ({\"vpip\": 26, \"pfr\": 19, \"three_bet\": 6, \"fold_to_three_bet\": 52, \"cbet\": 58,\n      \"fold_to_cbet\": 44, \"steal\": 33, \"check_raise\": 5, \"wtsd\": 26, \"wsd\": 50}, \"blue\"),\n]\n\n\ndef export_rules():\n    \"\"\"The rule set as plain data, for the web report to apply client-side.\"\"\"\n    return {\n        \"selfTest\": [{\"stats\": s, \"expect\": c} for s, c in SELF_TEST],\n        \"stats\": [{\"key\": k, \"label\": label, \"speed\": speed} for k, label, speed in STATS],\n        \"derived\": [{\"key\": k, \"label\": label, \"speed\": speed} for k, label, speed in DERIVED],\n        \"benchmarks\": BENCHMARKS,\n        \"tags\": {k: {\"label\": v[0], \"plan\": v[1]} for k, v in TAGS.items()},\n        \"noteFallback\": NOTE_FALLBACK,\n        \"notePrefix\": NOTE_PREFIX,\n        \"tagGuide\": [{\"colour\": c, \"label\": l, \"when\": w, \"plan\": p}\n                     for c, l, w, p in TAG_GUIDE],\n        \"speedNote\": SPEED_NOTE,\n        \"leaks\": [{\n            \"id\": lid, \"stat\": stat, \"op\": op, \"threshold\": th,\n            \"severity\": sev, \"title\": title, \"exploit\": exploit,\n            \"shorthand\": NOTE_TIPS.get(lid, short),\n        } for lid, stat, op, th, sev, title, exploit, short in LEAK_RULES],\n        \"noteLimit\": NOTE_LIMIT,\n        \"profileRules\": {k: [{\"when\": c, \"long\": l, \"short\": sh} for c, l, sh in v]\n                         for k, v in PROFILE_RULES.items()},\n        \"planSections\": [{\"key\": k, \"title\": t, \"label\": lb, \"limit\": n}\n                         for k, t, lb, n in PLAN_SECTIONS],\n        \"plan\": {k: [{\"when\": c, \"groups\": g, \"long\": l, \"short\": sh}\n                     for c, g, l, sh in v] for k, v in PLAN.items()},\n    }\n\n\ndef format_text(result):\n    \"\"\"Render a profile as plain text for the CLI.\"\"\"\n    out = []\n    name = result[\"name\"] or \"player\"\n    out.append(\"%s  ->  TAG %s  (%s)\" % (name, result[\"colour\"].upper(), result[\"archetype\"]))\n    out.append(\"  \" + result[\"headline\"])\n    out.append(\"  \" + result[\"reasoning\"])\n    out.append(\"\")\n    if result[\"leaks\"]:\n        out.append(\"  LEAKS AND HOW TO ATTACK THEM\")\n        for leak in result[\"leaks\"]:\n            lo, hi = leak[\"benchmark\"]\n            out.append(\"   [%-6s] %s  (%s %g%%, typical %d-%d%%)\"\n                       % (leak[\"severity\"], leak[\"title\"], leak[\"label\"],\n                          leak[\"value\"], lo, hi))\n            out.append(\"            %s\" % leak[\"exploit\"])\n        out.append(\"\")\n    guide = result.get(\"colourGuide\")\n    if guide:\n        out.append(\"  COLOUR %s - %s\" % (result[\"colour\"].upper(), guide[\"label\"]))\n        out.append(\"    When: \" + guide[\"when\"])\n        out.append(\"    Plan: \" + guide[\"plan\"])\n        out.append(\"\")\n    plan = result[\"plan\"]\n    out.append(\"  GAME PLAN\")\n    out.append(\"    \" + plan[\"profile\"])\n    for sec in plan[\"sections\"]:\n        out.append(\"    %s:\" % sec[\"title\"])\n        for item in sec[\"items\"]:\n            out.append(\"      - \" + item[\"long\"])\n    out.append(\"\")\n    if result[\"unreliable\"]:\n        out.append(\"  Hold loosely (slow-accumulating stats): %s\"\n                   % \", \".join(result[\"unreliable\"]))\n        out.append(\"\")\n    out.append(\"  NOTE (%d/%d chars)\" % (len(result[\"note\"]), NOTE_LIMIT))\n    out.append(\"  \" + result[\"note\"])\n    return \"\\n\".join(out)\n","pokerbrain/rangemodel.py":"\"\"\"Heuristic range estimation.\n\nAssigns a plausible range to an opponent from their position and the actions\nthey took, then narrows it street by street. This is a *model*, not solver\noutput: it exists so that every hand in a report gets real equity numbers\ninstead of none. Anything it produces should be presented as an estimate and\noverridden by hand when you have a genuine read.\n\nThe narrowing logic is deliberately simple and inspectable:\n\n  bet / raise -> polarised: the strongest part of the range, plus strong\n                 draws as semi-bluffs, plus a slice of the weakest hands\n                 as pure bluffs.\n  call        -> the middle: too good to fold, not good enough to raise.\n  check       -> everything that is not betting, weighted to the weak end.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\n\nfrom .evaluator import evaluate, hand_category, STRAIGHT, TRIPS, TWO_PAIR, PAIR\nfrom .model import ALLIN, BET, CALL, CHECK, FLOP, FOLD, PREFLOP, RAISE, RIVER, TURN\nfrom .ranges import parse_range, remove_blockers, hand_class\n\n_CHART_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"charts\")\n_RANGES = None\n\n# Fractions of the range used by each action. Tuned to be plausible rather\n# than exact; they are exposed here so they are easy to argue with.\nVALUE_FRAC = 0.30       # strongest share that bets for value\nBLUFF_FRAC = 0.18       # weakest share that bets as a bluff\nCALL_TOP = 0.62         # calling range spans this band of the ranking\nCALL_BOTTOM = 0.18\n\n\ndef reference_ranges() -> dict:\n    global _RANGES\n    if _RANGES is None:\n        with open(os.path.join(_CHART_DIR, \"preflop_ranges.json\"), \"r\", encoding=\"utf-8\") as fh:\n            _RANGES = json.load(fh)\n    return _RANGES\n\n\n# ----------------------------------------------------------- preflop -------\n\ndef _bucket_for(position):\n    if position in (\"UTG\", \"UTG1\", \"UTG2\"):\n        return \"vs_early\"\n    if position in (\"MP\", \"MP1\", \"HJ\"):\n        return \"vs_middle\"\n    if position in (\"CO\", \"BTN\"):\n        return \"vs_late\"\n    return \"vs_blinds\"\n\n\ndef preflop_range(hand, player_name):\n    \"\"\"Estimate a villain's preflop range from position and preflop action.\"\"\"\n    charts = reference_ranges()\n    player = hand.player(player_name)\n    if not player:\n        return \"\"\n\n    raises = 0\n    my_actions = []\n    for a in hand.actions:\n        if a.street != PREFLOP or a.verb in (\"post\", \"return\", \"straddle\"):\n            continue\n        aggressive = a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0)\n        if a.player == player_name:\n            my_actions.append((a, raises, aggressive))\n        if aggressive:\n            raises += 1\n\n    if not my_actions:\n        return charts[\"rfi\"].get(player.position, charts[\"rfi\"][\"CO\"])\n\n    first, faced, was_raise = my_actions[0]\n    last_raise_depth = max((f for _, f, agg in my_actions if agg), default=None)\n\n    if last_raise_depth is not None and last_raise_depth >= 2:\n        return charts[\"vs_3bet_4bet\"][\"default\"]\n    if last_raise_depth == 1:\n        return charts[\"vs_rfi_3bet\"][_bucket_for(player.position)]\n    if was_raise:\n        return charts[\"rfi\"].get(player.position, charts[\"rfi\"][\"CO\"])\n\n    # Called somewhere.\n    if faced >= 2:\n        return charts[\"vs_3bet_call\"][\"default\"]\n    if player.position == \"BB\":\n        return charts[\"vs_rfi_call\"][\"bb_vs_btn\"]\n    if player.position in (\"BTN\", \"CO\", \"HJ\"):\n        return charts[\"vs_rfi_call\"][\"ip_vs_late\"]\n    return charts[\"vs_rfi_call\"][\"ip_vs_early\"]\n\n\n# ---------------------------------------------------------- postflop -------\n\ndef _draw_outs(combo, board):\n    \"\"\"Cards that would make a straight or flush for this combo.\"\"\"\n    known = set(combo) | set(board)\n    if len(board) >= 5:\n        return 0\n    base = hand_category(evaluate(list(combo) + list(board)))\n    outs = 0\n    for card in range(52):\n        if card in known:\n            continue\n        cat = hand_category(evaluate(list(combo) + list(board) + [card]))\n        if cat >= STRAIGHT and cat > base:\n            outs += 1\n    return outs\n\n\ndef _rank_combos(weighted, board):\n    \"\"\"Order a range from strongest made hand to weakest, with draw info.\"\"\"\n    rows = []\n    for combo in weighted:\n        score = evaluate(list(combo) + list(board))\n        rows.append([combo, score, 0])\n    rows.sort(key=lambda r: -r[1])\n    # Only compute draw outs for the weaker part of the range; strong made\n    # hands do not need them and the evaluation is the expensive bit.\n    if len(board) < 5 and len(rows) <= 260:\n        cutoff = int(len(rows) * VALUE_FRAC)\n        for row in rows[cutoff:]:\n            row[2] = _draw_outs(row[0], board)\n    return rows\n\n\ndef narrow(weighted, board, action_verb):\n    \"\"\"Narrow a range on a board given the action taken.\"\"\"\n    if not weighted or len(board) < 3:\n        return dict(weighted)\n    rows = _rank_combos(weighted, board)\n    n = len(rows)\n    if n == 0:\n        return {}\n\n    aggressive = action_verb in (BET, RAISE, ALLIN)\n    out = {}\n\n    if aggressive:\n        value_cut = max(1, int(n * VALUE_FRAC))\n        for combo, _, _ in rows[:value_cut]:\n            out[combo] = weighted[combo]\n        # semi-bluffs: strong draws from the rest of the range\n        for combo, _, outs in rows[value_cut:]:\n            if outs >= 8:\n                out[combo] = weighted[combo] * 0.8\n            elif outs >= 4:\n                out[combo] = weighted[combo] * 0.35\n        # pure bluffs: a slice of the very bottom\n        bluff_start = int(n * (1 - BLUFF_FRAC))\n        for combo, _, outs in rows[bluff_start:]:\n            if outs < 4:\n                out.setdefault(combo, weighted[combo] * 0.25)\n\n    elif action_verb == CALL:\n        lo = int(n * CALL_BOTTOM)\n        hi = int(n * CALL_TOP)\n        for combo, _, _ in rows[lo:hi] or rows:\n            out[combo] = weighted[combo]\n        for combo, _, outs in rows[hi:]:\n            if outs >= 8:\n                out[combo] = weighted[combo] * 0.7\n\n    elif action_verb == CHECK:\n        start = max(1, int(n * VALUE_FRAC * 0.5))\n        for combo, _, _ in rows[start:]:\n            out[combo] = weighted[combo]\n        # slow-played monsters\n        for combo, _, _ in rows[:start]:\n            out[combo] = weighted[combo] * 0.25\n\n    else:\n        return dict(weighted)\n\n    return out or dict(weighted)\n\n\ndef estimate_ranges(hand, villain_name, hero_name=\"Hero\"):\n    \"\"\"{street: {combo: weight}} for one villain, narrowed by their actions.\"\"\"\n    spec = preflop_range(hand, villain_name)\n    hero = hand.player(hero_name)\n    dead = list(hero.hole_cards) if hero else []\n    current = remove_blockers(parse_range(spec), dead)\n    out = {PREFLOP: dict(current)}\n\n    for street in (FLOP, TURN, RIVER):\n        if street not in hand.streets_reached:\n            break\n        board = hand.board_at(street)\n        current = remove_blockers(current, dead + list(board))\n        for a in hand.street_actions(street):\n            if a.player != villain_name:\n                continue\n            verb = ALLIN if (a.verb == ALLIN and a.amount > 0) else a.verb\n            if verb == FOLD:\n                continue\n            current = narrow(current, board, verb)\n        out[street] = dict(current)\n    return out, spec\n\n\ndef describe_range(weighted, limit=14):\n    \"\"\"Short readable summary of a weighted range.\"\"\"\n    if not weighted:\n        return \"(empty)\"\n    by_class = {}\n    for combo, w in weighted.items():\n        label = hand_class(combo)\n        by_class[label] = by_class.get(label, 0.0) + w\n    ordered = sorted(by_class, key=lambda k: -by_class[k])\n    shown = ordered[:limit]\n    more = len(ordered) - len(shown)\n    text = \", \".join(shown)\n    if more > 0:\n        text += \" +%d more\" % more\n    return text\n\n\ndef main_villain(hand, hero_name=\"Hero\"):\n    \"\"\"The opponent who contested the pot most with the hero.\"\"\"\n    best = None\n    best_invested = 0.0\n    for p in hand.players:\n        if p.name == hero_name:\n            continue\n        if p.invested > best_invested:\n            best_invested = p.invested\n            best = p.name\n    return best\n","pokerbrain/ranges.py":"\"\"\"Preflop range notation parsing and combo maths.\n\nA *combo* is a specific two-card holding as a sorted tuple of card ints,\ne.g. AsKd. A *hand class* is the 169-element abstraction, e.g. AKs.\n\nSupported notation (comma or space separated):\n    AA, 77+, 99-55            pairs, pair-and-better, pair spans\n    AKs, AKo, AK              suited / offsuit / both\n    ATs+, AJo+, KQ+           kicker climbs toward the top card\n    A5s-A2s                   kicker spans\n    AsKd                      one exact combo\n    top 15%  /  15%           strongest N% of all 1326 combos\n    AA:0.5                    weighted entry (weight applied to each combo)\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport re\n\nfrom .cards import RANK_CHARS, RANK_TO_INT, parse_cards, card_rank, card_suit, card_str\n\nCombo = tuple  # (int, int) sorted ascending\n\n_CHART_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"charts\")\n_STRENGTH_PATH = os.path.join(_CHART_DIR, \"hand_strength.json\")\n\n\nclass RangeError(ValueError):\n    \"\"\"Raised when range notation cannot be parsed.\"\"\"\n\n\n# ---------------------------------------------------------------- combos ---\n\ndef make_combo(a: int, b: int) -> Combo:\n    return (a, b) if a < b else (b, a)\n\n\ndef all_combos() -> list:\n    out = []\n    for a in range(52):\n        for b in range(a + 1, 52):\n            out.append((a, b))\n    return out\n\n\ndef combo_str(combo: Combo) -> str:\n    return card_str(combo[1]) + card_str(combo[0])\n\n\ndef hand_class(combo: Combo) -> str:\n    \"\"\"Return the 169-class label for a combo: AKs, T9o, 77.\"\"\"\n    r1, r2 = card_rank(combo[0]), card_rank(combo[1])\n    hi, lo = max(r1, r2), min(r1, r2)\n    if hi == lo:\n        return RANK_CHARS[hi] * 2\n    suited = card_suit(combo[0]) == card_suit(combo[1])\n    return RANK_CHARS[hi] + RANK_CHARS[lo] + (\"s\" if suited else \"o\")\n\n\ndef class_combos(label: str) -> list:\n    \"\"\"All concrete combos belonging to a 169-class label.\"\"\"\n    label = label.strip()\n    if len(label) == 2 and label[0].upper() == label[1].upper():\n        r = RANK_TO_INT[label[0].upper()]\n        cards = [r * 4 + s for s in range(4)]\n        return [make_combo(cards[i], cards[j]) for i in range(4) for j in range(i + 1, 4)]\n    if len(label) == 3:\n        hi, lo, kind = label[0].upper(), label[1].upper(), label[2].lower()\n        h, l = RANK_TO_INT[hi], RANK_TO_INT[lo]\n        if h == l:\n            raise RangeError(\"%r is not a valid hand class\" % label)\n        if h < l:\n            h, l = l, h\n        if kind == \"s\":\n            return [make_combo(h * 4 + s, l * 4 + s) for s in range(4)]\n        if kind == \"o\":\n            return [make_combo(h * 4 + s1, l * 4 + s2)\n                    for s1 in range(4) for s2 in range(4) if s1 != s2]\n    raise RangeError(\"%r is not a valid hand class\" % label)\n\n\ndef all_hand_classes() -> list:\n    \"\"\"The 169 classes in chart order (pairs on the diagonal, suited above).\"\"\"\n    out = []\n    for i in range(12, -1, -1):\n        for j in range(12, -1, -1):\n            if i == j:\n                out.append(RANK_CHARS[i] * 2)\n            elif i > j:\n                out.append(RANK_CHARS[i] + RANK_CHARS[j] + \"s\")\n            else:\n                out.append(RANK_CHARS[j] + RANK_CHARS[i] + \"o\")\n    seen = []\n    for label in out:\n        if label not in seen:\n            seen.append(label)\n    return seen\n\n\n# ------------------------------------------------------------- expansion ---\n\n_PAIR_RE = re.compile(r\"^([2-9TJQKA])\\1$\", re.I)\n_PAIR_PLUS_RE = re.compile(r\"^([2-9TJQKA])\\1\\+$\", re.I)\n_PAIR_SPAN_RE = re.compile(r\"^([2-9TJQKA])\\1-([2-9TJQKA])\\2$\", re.I)\n_HAND_RE = re.compile(r\"^([2-9TJQKA])([2-9TJQKA])([so]?)$\", re.I)\n_HAND_PLUS_RE = re.compile(r\"^([2-9TJQKA])([2-9TJQKA])([so]?)\\+$\", re.I)\n_HAND_SPAN_RE = re.compile(\n    r\"^([2-9TJQKA])([2-9TJQKA])([so]?)-([2-9TJQKA])([2-9TJQKA])([so]?)$\", re.I)\n_PCT_RE = re.compile(r\"^(?:top[\\s_]*)?([0-9]+(?:\\.[0-9]+)?)\\s*%$\", re.I)\n\n\ndef _r(ch: str) -> int:\n    return RANK_TO_INT[ch.upper()]\n\n\ndef _expand_token(token: str) -> list:\n    t = token.strip()\n    if not t:\n        return []\n\n    m = _PCT_RE.match(t)\n    if m:\n        return top_percent(float(m.group(1)))\n\n    if _PAIR_RE.match(t):\n        return class_combos(t)\n\n    m = _PAIR_PLUS_RE.match(t)\n    if m:\n        lo = _r(m.group(1))\n        out = []\n        for r in range(lo, 13):\n            out += class_combos(RANK_CHARS[r] * 2)\n        return out\n\n    m = _PAIR_SPAN_RE.match(t)\n    if m:\n        a, b = _r(m.group(1)), _r(m.group(2))\n        lo, hi = min(a, b), max(a, b)\n        out = []\n        for r in range(lo, hi + 1):\n            out += class_combos(RANK_CHARS[r] * 2)\n        return out\n\n    m = _HAND_PLUS_RE.match(t)\n    if m:\n        hi, lo, kind = _r(m.group(1)), _r(m.group(2)), m.group(3).lower()\n        if hi < lo:\n            hi, lo = lo, hi\n        out = []\n        for k in range(lo, hi):\n            label = RANK_CHARS[hi] + RANK_CHARS[k]\n            out += _expand_token(label + kind) if kind else _expand_token(label)\n        return out\n\n    m = _HAND_SPAN_RE.match(t)\n    if m:\n        hi1, lo1, k1 = _r(m.group(1)), _r(m.group(2)), m.group(3).lower()\n        hi2, lo2, k2 = _r(m.group(4)), _r(m.group(5)), m.group(6).lower()\n        if hi1 != hi2:\n            raise RangeError(\"span %r must share a top card\" % t)\n        kind = k1 or k2\n        lo, hi = min(lo1, lo2), max(lo1, lo2)\n        out = []\n        for k in range(lo, hi + 1):\n            label = RANK_CHARS[hi1] + RANK_CHARS[k]\n            out += _expand_token(label + kind) if kind else _expand_token(label)\n        return out\n\n    m = _HAND_RE.match(t)\n    if m:\n        hi, lo, kind = m.group(1).upper(), m.group(2).upper(), m.group(3).lower()\n        if hi == lo:\n            return class_combos(hi + lo)\n        if kind:\n            return class_combos(hi + lo + kind)\n        return class_combos(hi + lo + \"s\") + class_combos(hi + lo + \"o\")\n\n    # exact combo, e.g. AsKd\n    try:\n        cards = parse_cards(t)\n        if len(cards) == 2:\n            return [make_combo(cards[0], cards[1])]\n    except Exception:\n        pass\n\n    raise RangeError(\"cannot parse range token %r\" % token)\n\n\ndef parse_range(text: str) -> dict:\n    \"\"\"Parse range notation into a {combo: weight} dict.\"\"\"\n    if not text or not text.strip():\n        return {}\n    out = {}\n    for part in re.split(r\"[,\\n]+\", text):\n        for token in part.split():\n            weight = 1.0\n            if \":\" in token:\n                token, _, w = token.partition(\":\")\n                try:\n                    weight = float(w)\n                except ValueError:\n                    raise RangeError(\"bad weight in %r\" % part)\n            for combo in _expand_token(token):\n                out[combo] = max(out.get(combo, 0.0), weight)\n    return out\n\n\ndef remove_blockers(weighted: dict, dead_cards) -> dict:\n    \"\"\"Drop combos that use any known or dead card.\"\"\"\n    dead = set(dead_cards)\n    return {c: w for c, w in weighted.items()\n            if c[0] not in dead and c[1] not in dead}\n\n\ndef combo_count(weighted: dict) -> float:\n    return sum(weighted.values())\n\n\ndef range_percent(weighted: dict) -> float:\n    return 100.0 * combo_count(weighted) / 1326.0\n\n\ndef to_class_summary(weighted: dict) -> str:\n    \"\"\"Collapse combos back into readable class notation.\"\"\"\n    by_class = {}\n    for combo in weighted:\n        by_class.setdefault(hand_class(combo), 0)\n        by_class[hand_class(combo)] += 1\n    labels = []\n    for label in all_hand_classes():\n        if label in by_class:\n            total = len(class_combos(label))\n            got = by_class[label]\n            labels.append(label if got == total else \"%s(%d/%d)\" % (label, got, total))\n    return \", \".join(labels)\n\n\n# -------------------------------------------------------------- strength ---\n\n_strength_cache = None\n\n\ndef hand_strength_table() -> dict:\n    \"\"\"{hand_class: equity vs a random hand}, from the cached chart.\"\"\"\n    global _strength_cache\n    if _strength_cache is None:\n        with open(_STRENGTH_PATH, \"r\", encoding=\"utf-8\") as fh:\n            _strength_cache = json.load(fh)\n    return _strength_cache\n\n\ndef ranked_hand_classes() -> list:\n    table = hand_strength_table()\n    return sorted(table, key=lambda h: -table[h])\n\n\ndef top_percent(pct: float) -> list:\n    \"\"\"Strongest pct% of the 1326 combos, by equity vs a random hand.\"\"\"\n    target = 1326.0 * pct / 100.0\n    out = []\n    for label in ranked_hand_classes():\n        combos = class_combos(label)\n        if out and len(out) + len(combos) > target:\n            break\n        out += combos\n        if len(out) >= target:\n            break\n    return out\n","pokerbrain/report.py":"\"\"\"Generate a self-contained HTML report from parsed hands.\n\nEverything (data, styles, script) is inlined into one file so the report\nworks offline, can be opened straight from disk, and can be emailed or kept\nalongside the session it describes.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\n\nfrom . import analysis, leaks, profiles, rangemodel, sessions, stats, template\nfrom .cards import card_str, cards_str\nfrom .model import FLOP, PREFLOP, RIVER, STREETS, TURN\nfrom .ranges import range_percent\nfrom .stats import BENCHMARKS, STAT_ORDER\n\n\ndef _hand_payload(hand, hero_name=\"Hero\", equity_iters=4000, exact_limit=4000):\n    hero = hand.player(hero_name)\n    villain = rangemodel.main_villain(hand, hero_name)\n    ranges = {}\n    range_view = {}\n    spec = \"\"\n    if villain:\n        try:\n            ranges, spec = rangemodel.estimate_ranges(hand, villain, hero_name)\n            for street, weighted in ranges.items():\n                range_view[street] = {\n                    \"pct\": round(range_percent(weighted), 1),\n                    \"combos\": len(weighted),\n                    \"summary\": rangemodel.describe_range(weighted, 12),\n                }\n        except Exception:\n            ranges = {}\n\n    decisions = []\n    try:\n        walked = analysis.walk(hand, hero_name, villain_range=ranges or None,\n                               equity_iters=equity_iters, exact_limit=exact_limit)\n    except Exception:\n        walked = []\n    for d in walked:\n        decisions.append({\n            \"street\": d.street,\n            \"verb\": d.action.verb,\n            \"amount\": round(d.action.amount, 2),\n            \"potBefore\": round(d.pot_before, 2),\n            \"potBB\": round(d.pot_before / d.bb, 1),\n            \"toCall\": round(d.to_call, 2),\n            \"potOdds\": round(100 * d.pot_odds, 1) if d.pot_odds is not None else None,\n            \"spr\": round(d.spr, 1) if d.spr is not None else None,\n            \"mdf\": round(100 * d.mdf, 0) if d.mdf is not None else None,\n            \"betPct\": round(d.bet_pct, 0) if d.bet_pct is not None else None,\n            \"reqFE\": round(100 * d.required_fold_equity, 0) if d.required_fold_equity is not None else None,\n            \"equity\": round(100 * d.equity, 1) if d.equity is not None else None,\n            \"evCall\": round(d.ev_of_call, 2) if d.ev_of_call is not None else None,\n            \"madeHand\": d.made_hand,\n            \"texture\": d.texture.get(\"label\", \"\") if d.texture else \"\",\n            \"effStack\": round(d.effective_stack, 2),\n        })\n\n    street_actions = {}\n    for street in STREETS:\n        rows = []\n        for a in hand.street_actions(street):\n            p = hand.player(a.player)\n            rows.append({\n                \"player\": a.player,\n                \"pos\": p.position if p else \"\",\n                \"verb\": a.verb,\n                \"amount\": round(a.amount, 2),\n                \"isHero\": a.player == hero_name,\n            })\n        if rows:\n            street_actions[street] = rows\n\n    return {\n        \"id\": hand.hand_id,\n        \"time\": hand.timestamp,\n        \"sb\": hand.small_blind,\n        \"bb\": hand.big_blind,\n        \"ante\": hand.ante,\n        \"table\": hand.table,\n        \"buttonSeat\": hand.button_seat,\n        \"players\": [{\n            \"seat\": p.seat, \"name\": p.name, \"pos\": p.position,\n            \"stack\": round(p.stack, 2), \"stackBB\": round(p.stack / hand.bb_size, 1),\n            \"cards\": [card_str(c) for c in p.hole_cards],\n            \"net\": round(p.net, 2), \"netBB\": round(p.net / hand.bb_size, 1),\n            \"isHero\": p.is_hero, \"folded\": p.folded_street or \"\",\n            \"shownRank\": p.shown_rank,\n        } for p in sorted(hand.players, key=lambda x: x.seat)],\n        \"board\": [card_str(c) for c in hand.board],\n        \"streets\": street_actions,\n        \"pot\": round(hand.total_pot, 2),\n        \"rake\": round(hand.rake, 2),\n        \"heroNet\": round(hero.net, 2) if hero else 0,\n        \"heroNetBB\": round(hero.net / hand.bb_size, 1) if hero else 0,\n        \"heroPos\": hero.position if hero else \"\",\n        \"heroCards\": [card_str(c) for c in hero.hole_cards] if hero else [],\n        \"finalStreet\": hand.final_street,\n        \"decisions\": decisions,\n        \"villain\": villain or \"\",\n        \"villainPos\": hand.player(villain).position if villain and hand.player(villain) else \"\",\n        \"villainCards\": [card_str(c) for c in hand.player(villain).hole_cards]\n                        if villain and hand.player(villain) and hand.player(villain).hole_cards else [],\n        \"villainRangeSpec\": spec,\n        \"ranges\": range_view,\n    }\n\n\ndef build_payload(hands, hero_name=\"Hero\", hand_payloads=None):\n    lines = stats.compute(hands, hero_name=hero_name)\n    hero_line = lines.get(\"Hero\")\n    pool_line = lines.get(\"POOL\")\n\n    def stat_rows(line):\n        rows = []\n        if not line:\n            return rows\n        for name in STAT_ORDER:\n            counter = line.c.get(name)\n            if not counter or not counter.opp:\n                continue\n            lo, hi, label = BENCHMARKS[name]\n            rows.append({\n                \"key\": name, \"label\": label,\n                \"value\": round(counter.pct, 1),\n                \"act\": counter.act, \"opp\": counter.opp,\n                \"lo\": lo, \"hi\": hi,\n                \"thin\": counter.opp < 15,\n            })\n        return rows\n\n    if hand_payloads is None:\n        hand_payloads = [_hand_payload(h, hero_name) for h in hands]\n\n    cumulative = []\n    running = 0.0\n    for h in hands:\n        hero = h.player(hero_name)\n        if hero:\n            running += hero.net / h.bb_size\n        cumulative.append(round(running, 2))\n\n    findings = []\n    for f in leaks.analyse(hands, hero_name):\n        findings.append({\n            \"title\": f.title, \"detail\": f.detail, \"severity\": f.severity,\n            \"confidence\": f.confidence, \"sample\": f.sample, \"fix\": f.fix,\n            \"hands\": f.hands,\n        })\n\n    chains = sessions.build_chains(hands, hero_name)\n    opponents = []\n    for chain, line in sessions.chain_stats(chains, min_hands=4):\n        opponents.append({\n            \"id\": chain.cid, \"table\": chain.table, \"seat\": chain.seat,\n            \"hands\": chain.hands, \"confidence\": chain.confidence,\n            \"vpip\": round(line.pct(\"vpip\"), 0) if line.pct(\"vpip\") is not None else None,\n            \"pfr\": round(line.pct(\"pfr\"), 0) if line.pct(\"pfr\") is not None else None,\n            \"af\": round(line.af, 2) if line.af is not None else None,\n            \"netBB\": round(line.bb_won, 1),\n        })\n\n    split = leaks.showdown_split(hands, hero_name)\n    bb = hands[0].bb_size if hands else 1.0\n\n    return {\n        \"meta\": {\n            \"site\": hands[0].site if hands else \"\",\n            \"hands\": len(hands),\n            \"stakes\": \"%g/%g%s\" % (hands[0].small_blind, hands[0].big_blind,\n                                   (\" ante %g\" % hands[0].ante) if hands[0].ante else \"\"),\n            \"currency\": hands[0].currency if hands else \"\",\n            \"first\": hands[0].timestamp if hands else \"\",\n            \"last\": hands[-1].timestamp if hands else \"\",\n            \"netBB\": round(sum(h.player(hero_name).net for h in hands\n                               if h.player(hero_name)) / bb, 1),\n            \"bb100\": round(100 * sum(h.player(hero_name).net for h in hands\n                                     if h.player(hero_name)) / bb / len(hands), 1) if hands else 0,\n        },\n        \"rules\": profiles.export_rules(),\n        \"split\": {k: round(v, 1) for k, v in split.items()},\n        \"cumulative\": cumulative,\n        \"heroStats\": stat_rows(hero_line),\n        \"poolStats\": stat_rows(pool_line),\n        \"byPosition\": [{\n            \"pos\": pos, \"hands\": line.hands,\n            \"vpip\": round(line.pct(\"vpip\"), 0) if line.pct(\"vpip\") is not None else None,\n            \"pfr\": round(line.pct(\"pfr\"), 0) if line.pct(\"pfr\") is not None else None,\n            \"bb100\": round(line.bb_per_100, 0),\n        } for pos, line in stats.compute_by_position(hands, hero_name=hero_name).items()],\n        \"findings\": findings,\n        \"opponents\": opponents,\n        \"hands\": hand_payloads,\n    }\n\n\n_PKG_DIR = os.path.dirname(os.path.abspath(__file__))\n\n\ndef package_source():\n    \"\"\"{relative path: text} for every file the in-browser analyser needs.\"\"\"\n    out = {}\n    for root, dirs, files in os.walk(_PKG_DIR):\n        dirs[:] = [d for d in dirs if d != \"__pycache__\"]\n        for name in files:\n            if not (name.endswith(\".py\") or name.endswith(\".json\")):\n                continue\n            if name in (\"__main__.py\", \"cli.py\"):\n                continue\n            full = os.path.join(root, name)\n            rel = os.path.relpath(full, os.path.dirname(_PKG_DIR)).replace(os.sep, \"/\")\n            with open(full, \"r\", encoding=\"utf-8\") as fh:\n                out[rel] = fh.read()\n    return out\n\n\ndef render(payload, standalone=True) -> str:\n    \"\"\"Render the report. standalone=False returns an Artifact-ready fragment.\"\"\"\n    payload = dict(payload)\n    if standalone:\n        payload[\"pysrc\"] = package_source()\n    blob = json.dumps(payload, separators=(\",\", \":\"))\n    # Keep embedded source from closing the script tag it lives in.\n    blob = blob.replace(\"<\/\", \"<\\\\/\").replace(\"<\!--\", \"<\\\\!--\")\n    body = template.BODY.replace(\"/*__DATA__*/null\", blob)\n    if not standalone:\n        return body\n    return template.STANDALONE.replace(\"__BODY__\", body)\n\n\ndef write(hands, path, hero_name=\"Hero\", standalone=True):\n    payload = build_payload(hands, hero_name)\n    html = render(payload, standalone=standalone)\n    directory = os.path.dirname(os.path.abspath(path))\n    if directory and not os.path.isdir(directory):\n        os.makedirs(directory, exist_ok=True)\n    with open(path, \"w\", encoding=\"utf-8\") as fh:\n        fh.write(html)\n    return path, len(html)\n","pokerbrain/sessions.py":"\"\"\"Recover opponent continuity on sites that rotate anonymous IDs.\n\nCoinPoker issues every opponent a fresh ID each hand, so IDs are useless as\nhandles. But players do not teleport: the same seat, at the same table, in\nthe next hand, holding exactly the stack the previous hand left them with,\nis almost certainly the same person.\n\nChaining on (table, seat, expected stack) reconstructs opponents across a\nsession. The links are probabilistic \u2014 someone can leave and be replaced by\na player who happens to buy in for the same amount \u2014 so every chain carries\na confidence, and chains never span a gap in the hand sequence.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom .model import POSITION_ORDER\n\n# A stack is considered to carry over if it matches within this many chips.\nSTACK_TOLERANCE = 0.02\n\n\nclass Chain:\n    \"\"\"A run of hands believed to be the same physical opponent.\"\"\"\n\n    __slots__ = (\"cid\", \"table\", \"seat\", \"entries\", \"links\", \"topups\")\n\n    def __init__(self, cid, table, seat):\n        self.cid = cid\n        self.table = table\n        self.seat = seat\n        self.entries = []   # (hand, player)\n        self.links = 0      # confident links made\n        self.topups = 0     # links where the stack changed unexplained\n\n    @property\n    def hands(self):\n        return len(self.entries)\n\n    @property\n    def net(self):\n        return sum(p.net for _, p in self.entries)\n\n    @property\n    def confidence(self):\n        if self.hands < 3:\n            return \"weak\"\n        ratio = self.links / max(1, self.hands - 1)\n        if ratio > 0.9 and self.topups == 0:\n            return \"strong\"\n        return \"moderate\" if ratio > 0.6 else \"weak\"\n\n    def __repr__(self):\n        return \"<Chain %s t%s seat%d %dh %s>\" % (\n            self.cid, self.table, self.seat, self.hands, self.confidence)\n\n\ndef _sort_key(hand):\n    try:\n        return (hand.timestamp, int(hand.hand_id))\n    except (TypeError, ValueError):\n        return (hand.timestamp, hand.hand_id)\n\n\ndef build_chains(hands, hero_name=\"Hero\"):\n    \"\"\"Link opponents across consecutive hands. Returns a list of Chains.\"\"\"\n    by_table = {}\n    for h in hands:\n        by_table.setdefault(h.table, []).append(h)\n\n    chains = []\n    counter = 0\n\n    for table, table_hands in by_table.items():\n        table_hands = sorted(table_hands, key=_sort_key)\n        # active[seat] = (chain, expected_stack_for_next_hand)\n        active = {}\n        for hand in table_hands:\n            seen_seats = set()\n            for p in hand.players:\n                if p.name == hero_name:\n                    continue\n                seen_seats.add(p.seat)\n                prior = active.get(p.seat)\n                linked = False\n                topup = False\n                if prior:\n                    chain, expected = prior\n                    if abs(p.stack - expected) <= STACK_TOLERANCE:\n                        linked = True\n                    elif p.stack > expected and (p.stack - expected) > STACK_TOLERANCE:\n                        # Could be a top-up by the same player, or a new player.\n                        # Only accept it as the same player if the seat was\n                        # never vacated, and mark it as uncertain.\n                        linked = True\n                        topup = True\n                if linked:\n                    chain = prior[0]\n                    chain.links += 1\n                    if topup:\n                        chain.topups += 1\n                else:\n                    counter += 1\n                    chain = Chain(\"P%03d\" % counter, table, p.seat)\n                    chains.append(chain)\n                chain.entries.append((hand, p))\n                active[p.seat] = (chain, p.stack + p.net)\n\n            # Seats that did not appear this hand have been vacated.\n            for seat in list(active):\n                if seat not in seen_seats:\n                    del active[seat]\n\n    return chains\n\n\ndef chain_stats(chains, min_hands=5):\n    \"\"\"HUD stats for each reconstructed opponent with enough hands.\"\"\"\n    from .stats import StatLine, accumulate\n\n    out = []\n    for chain in chains:\n        if chain.hands < min_hands:\n            continue\n        line = StatLine(chain.cid)\n        for hand, player in chain.entries:\n            single = {}\n            accumulate(hand, single, hero_name=player.name)\n            src = single.get(\"Hero\")\n            if not src:\n                continue\n            line.hands += 1\n            line.net += player.net\n            line.bb_won += player.net / hand.bb_size\n            for name, counter in src.c.items():\n                line.c[name].opp += counter.opp\n                line.c[name].act += counter.act\n            line.postflop_bets += src.postflop_bets\n            line.postflop_raises += src.postflop_raises\n            line.postflop_calls += src.postflop_calls\n            line.postflop_folds += src.postflop_folds\n        out.append((chain, line))\n    out.sort(key=lambda t: -t[0].hands)\n    return out\n\n\ndef format_chains(chains, min_hands=5) -> str:\n    rows = []\n    usable = [c for c in chains if c.hands >= min_hands]\n    rows.append(\"OPPONENT CONTINUITY (seat + stack chaining)\")\n    rows.append(\"  %d raw seat-occupancies collapsed into %d chains; %d have %d+ hands\"\n                % (sum(c.hands for c in chains), len(chains), len(usable), min_hands))\n    if not usable:\n        rows.append(\"  No chain reached the threshold - too few consecutive hands.\")\n        return \"\\n\".join(rows)\n    rows.append(\"\")\n    rows.append(\"  %-6s %-8s %5s %6s %8s %7s %7s %7s\"\n                % (\"id\", \"table\", \"seat\", \"hands\", \"conf\", \"VPIP\", \"PFR\", \"net bb\"))\n    for chain, line in chain_stats(chains, min_hands):\n        v = line.pct(\"vpip\")\n        p = line.pct(\"pfr\")\n        rows.append(\"  %-6s %-8s %5d %6d %8s %6s%% %6s%% %+7.1f\"\n                    % (chain.cid, chain.table, chain.seat, chain.hands, chain.confidence,\n                       \"%.0f\" % v if v is not None else \"-\",\n                       \"%.0f\" % p if p is not None else \"-\",\n                       line.bb_won))\n    return \"\\n\".join(rows)\n","pokerbrain/stats.py":"\"\"\"HUD-style statistics computed from parsed hands.\n\nEvery statistic is stored as an (opportunities, actions) pair so that small\nsamples stay visible: a 100% c-bet on 2 opportunities should never be\npresented the same way as 100% on 200.\n\nOn sites that rotate anonymous player IDs every hand (CoinPoker does), the\nper-opponent view is meaningless, so the important aggregate is the *pool*:\nevery non-hero player merged into one profile, optionally split by position.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import defaultdict\n\nfrom .model import (\n    ALLIN, BET, CALL, CHECK, FLOP, FOLD, POST, PREFLOP, RAISE, RETURN, RIVER,\n    STRADDLE, TURN, POSITION_ORDER,\n)\n\nHERO = \"Hero\"\nPOOL = \"POOL\"\n\n\nclass Counter:\n    \"\"\"An (opportunities, actions) pair.\"\"\"\n\n    __slots__ = (\"opp\", \"act\")\n\n    def __init__(self):\n        self.opp = 0\n        self.act = 0\n\n    def add(self, opportunity: bool, action: bool = False):\n        if opportunity:\n            self.opp += 1\n            if action:\n                self.act += 1\n\n    @property\n    def pct(self):\n        return 100.0 * self.act / self.opp if self.opp else None\n\n    def __repr__(self):\n        return \"%d/%d\" % (self.act, self.opp)\n\n\nclass StatLine:\n    \"\"\"All counters for one player key (a name, or POOL).\"\"\"\n\n    def __init__(self, key: str):\n        self.key = key\n        self.hands = 0\n        self.net = 0.0\n        self.bb_won = 0.0\n        self.c = defaultdict(Counter)\n        self.postflop_bets = 0\n        self.postflop_raises = 0\n        self.postflop_calls = 0\n        self.postflop_folds = 0\n\n    def add(self, name, opportunity, action=False):\n        self.c[name].add(opportunity, action)\n\n    def pct(self, name):\n        return self.c[name].pct\n\n    def n(self, name):\n        return self.c[name].opp\n\n    @property\n    def af(self):\n        \"\"\"Aggression factor: (bets + raises) / calls, postflop.\"\"\"\n        if not self.postflop_calls:\n            return None\n        return (self.postflop_bets + self.postflop_raises) / self.postflop_calls\n\n    @property\n    def afq(self):\n        \"\"\"Aggression frequency: aggressive actions / all postflop actions.\"\"\"\n        total = (self.postflop_bets + self.postflop_raises +\n                 self.postflop_calls + self.postflop_folds)\n        if not total:\n            return None\n        return 100.0 * (self.postflop_bets + self.postflop_raises) / total\n\n    @property\n    def bb_per_100(self):\n        return 100.0 * self.bb_won / self.hands if self.hands else 0.0\n\n\ndef _preflop_sequence(hand):\n    \"\"\"Preflop decisions in order, with the raise depth each one faced.\"\"\"\n    seq = []\n    depth = 0  # number of raises made so far (the open counts as 1)\n    for a in hand.actions:\n        if a.street != PREFLOP:\n            continue\n        if a.verb in (POST, RETURN):\n            continue\n        if a.verb == STRADDLE:\n            continue  # a forced-style blind raise, not a decision\n        faced = depth\n        if a.verb in (RAISE, BET) or (a.verb == ALLIN and a.amount > 0):\n            seq.append((a, faced, True))\n            depth += 1\n        else:\n            seq.append((a, faced, False))\n    return seq\n\n\ndef _preflop_aggressor(hand):\n    last = None\n    for a in hand.actions:\n        if a.street != PREFLOP or a.verb in (POST, RETURN, STRADDLE):\n            continue\n        if a.verb in (RAISE, BET) or (a.verb == ALLIN and a.amount > 0):\n            last = a.player\n    return last\n\n\ndef _saw_street(hand, street):\n    \"\"\"Players who were still in when `street` was dealt.\"\"\"\n    if street not in hand.streets_reached:\n        return set()\n    order = [PREFLOP, FLOP, TURN, RIVER]\n    idx = order.index(street)\n    folded_before = set()\n    for p in hand.players:\n        if p.folded_street and order.index(p.folded_street) < idx:\n            folded_before.add(p.name)\n    return {p.name for p in hand.players} - folded_before\n\n\ndef _first_bettor(hand, street):\n    for a in hand.street_actions(street):\n        if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n            return a.player\n        if a.verb == CALL:\n            return None\n    return None\n\n\ndef accumulate(hand, lines, pool_positions=None, hero_name=HERO):\n    \"\"\"Fold one hand's situations into the {key: StatLine} dict.\"\"\"\n\n    def line(name):\n        key = HERO if name == hero_name else POOL\n        if key not in lines:\n            lines[key] = StatLine(key)\n        return lines[key]\n\n    seq = _preflop_sequence(hand)\n    pfa = _preflop_aggressor(hand)\n    acted_preflop = set()\n    openers = set()\n    three_bettors = set()\n\n    for p in hand.players:\n        st = line(p.name)\n        st.hands += 1\n        st.net += p.net\n        st.bb_won += p.net / hand.bb_size\n        if pool_positions is not None and p.name != hero_name:\n            pool_positions.setdefault(p.position, StatLine(p.position)).hands += 1\n\n    # ---------------------------------------------------------- preflop ---\n    folded_to_them = True   # true while no voluntary action has happened yet\n    for action, faced, is_raise in seq:\n        name = action.player\n        st = line(name)\n        player = hand.player(name)\n        first_decision = name not in acted_preflop\n        acted_preflop.add(name)\n\n        voluntary = action.verb in (CALL, BET, RAISE) or (\n            action.verb == ALLIN and action.amount > 0)\n\n        if first_decision:\n            st.add(\"vpip\", True, voluntary)\n            st.add(\"pfr\", True, is_raise)\n\n            if faced == 0:\n                # Nobody had raised yet.\n                st.add(\"rfi\", folded_to_them, is_raise)\n                st.add(\"limp\", folded_to_them, action.verb == CALL)\n                if player and player.position in (\"CO\", \"BTN\", \"SB\") and folded_to_them:\n                    st.add(\"steal\", True, is_raise)\n                if player and player.position == \"BB\":\n                    pass\n            elif faced == 1:\n                st.add(\"3bet\", True, is_raise)\n                if player and player.position == \"BB\" and _was_steal_attempt(hand):\n                    st.add(\"bb_fold_to_steal\", True, action.verb == FOLD)\n            elif faced == 2:\n                st.add(\"4bet\", True, is_raise)\n\n        else:\n            # Subsequent preflop decisions: facing a re-raise.\n            if faced == 1 and name in openers:\n                st.add(\"fold_to_3bet\", True, action.verb == FOLD)\n            elif faced == 2 and name in openers:\n                st.add(\"fold_to_3bet\", True, action.verb == FOLD)\n            elif faced == 2 and name in three_bettors:\n                st.add(\"fold_to_4bet\", True, action.verb == FOLD)\n\n        if is_raise:\n            if faced == 0:\n                openers.add(name)\n            elif faced == 1:\n                three_bettors.add(name)\n\n        if voluntary or is_raise:\n            folded_to_them = False\n\n    # --------------------------------------------------------- postflop ---\n    saw_flop = _saw_street(hand, FLOP)\n    for p in hand.players:\n        st = line(p.name)\n        st.add(\"saw_flop\", True, p.name in saw_flop)\n\n    for street in (FLOP, TURN, RIVER):\n        if street not in hand.streets_reached:\n            continue\n        live = _saw_street(hand, street)\n        bettor = _first_bettor(hand, street)\n        key = {FLOP: \"flop\", TURN: \"turn\", RIVER: \"river\"}[street]\n\n        # continuation betting by the preflop aggressor\n        if pfa in live:\n            acted_before = False\n            for a in hand.street_actions(street):\n                if a.player == pfa:\n                    made = a.verb in (BET,) or (a.verb == ALLIN and a.amount > 0)\n                    line(pfa).add(\"cbet_\" + key, not acted_before, made)\n                    break\n                if a.verb in (BET, RAISE) or (a.verb == ALLIN and a.amount > 0):\n                    acted_before = True\n\n        # folding to that c-bet\n        if bettor == pfa and pfa is not None:\n            for a in hand.street_actions(street):\n                if a.player == pfa:\n                    continue\n                if a.verb in (FOLD, CALL, RAISE, ALLIN, CHECK):\n                    if a.verb == CHECK:\n                        continue\n                    line(a.player).add(\"fold_to_cbet_\" + key, True, a.verb == FOLD)\n\n        # raw aggression tallies\n        for a in hand.street_actions(street):\n            st = line(a.player)\n            if a.verb == BET:\n                st.postflop_bets += 1\n            elif a.verb == RAISE:\n                st.postflop_raises += 1\n            elif a.verb == ALLIN and a.amount > 0:\n                st.postflop_raises += 1\n            elif a.verb == CALL:\n                st.postflop_calls += 1\n            elif a.verb == FOLD:\n                st.postflop_folds += 1\n\n    # ------------------------------------------------------- showdown ----\n    showdown = {p.name for p in hand.players if p.showed}\n    for p in hand.players:\n        st = line(p.name)\n        if p.name in saw_flop:\n            st.add(\"wtsd\", True, p.name in showdown)\n            st.add(\"wwsf\", True, p.net > 0)\n        if p.name in showdown:\n            st.add(\"wsd\", True, p.net > 0)\n\n\ndef _was_steal_attempt(hand):\n    \"\"\"True when the only preflop raise so far came from CO/BTN/SB first-in.\"\"\"\n    for a in hand.actions:\n        if a.street != PREFLOP or a.verb in (POST, RETURN, STRADDLE):\n            continue\n        if a.verb in (RAISE, BET) or (a.verb == ALLIN and a.amount > 0):\n            p = hand.player(a.player)\n            return bool(p and p.position in (\"CO\", \"BTN\", \"SB\"))\n        if a.verb == CALL:\n            return False\n    return False\n\n\ndef compute(hands, hero_name=HERO):\n    \"\"\"Compute {HERO: StatLine, POOL: StatLine} across a list of hands.\"\"\"\n    lines = {}\n    for hand in hands:\n        accumulate(hand, lines, hero_name=hero_name)\n    return lines\n\n\ndef compute_by_position(hands, who=HERO, hero_name=HERO):\n    \"\"\"Per-position StatLines for the hero, or for the merged pool.\"\"\"\n    out = {}\n    for hand in hands:\n        for p in hand.players:\n            is_hero = p.name == hero_name\n            if (who == HERO) != is_hero:\n                continue\n            sub = out.setdefault(p.position, StatLine(p.position))\n            single = {}\n            accumulate(hand, single, hero_name=p.name)\n            src = single.get(HERO)\n            if not src:\n                continue\n            sub.hands += 1\n            sub.net += p.net\n            sub.bb_won += p.net / hand.bb_size\n            for name, counter in src.c.items():\n                sub.c[name].opp += counter.opp\n                sub.c[name].act += counter.act\n            sub.postflop_bets += src.postflop_bets\n            sub.postflop_raises += src.postflop_raises\n            sub.postflop_calls += src.postflop_calls\n            sub.postflop_folds += src.postflop_folds\n    return {k: out[k] for k in POSITION_ORDER if k in out}\n\n\n# Reference ranges for a solid small-stakes 6-max regular. Used to flag\n# deviations, not as gospel: the right value depends on the pool.\nBENCHMARKS = {\n    \"vpip\":              (22, 28, \"VPIP\"),\n    \"pfr\":               (17, 23, \"PFR\"),\n    \"rfi\":               (22, 32, \"Open-raise when folded to\"),\n    \"3bet\":              (6, 11, \"3-bet\"),\n    \"fold_to_3bet\":      (40, 55, \"Fold to 3-bet\"),\n    \"4bet\":              (3, 7, \"4-bet\"),\n    \"steal\":             (35, 50, \"Steal attempt (CO/BTN/SB)\"),\n    \"bb_fold_to_steal\":  (40, 60, \"BB fold vs steal\"),\n    \"limp\":              (0, 4, \"Open-limp\"),\n    \"cbet_flop\":         (55, 70, \"Flop c-bet\"),\n    \"cbet_turn\":         (40, 60, \"Turn c-bet\"),\n    \"cbet_river\":        (35, 55, \"River c-bet\"),\n    \"fold_to_cbet_flop\": (40, 55, \"Fold to flop c-bet\"),\n    \"fold_to_cbet_turn\": (40, 58, \"Fold to turn c-bet\"),\n    \"wtsd\":              (24, 30, \"Went to showdown\"),\n    \"wsd\":               (48, 56, \"Won at showdown\"),\n    \"wwsf\":              (43, 50, \"Won when saw flop\"),\n}\n\nSTAT_ORDER = list(BENCHMARKS.keys())\n\n\ndef format_table(line: StatLine, title=None) -> str:\n    \"\"\"Render one StatLine as an aligned text table with benchmark flags.\"\"\"\n    rows = []\n    head = title or line.key\n    rows.append(\"%s  (%d hands, %+.1f bb/100)\" % (head, line.hands, line.bb_per_100))\n    rows.append(\"%-28s %8s %10s   %s\" % (\"stat\", \"value\", \"sample\", \"vs benchmark\"))\n    rows.append(\"-\" * 72)\n    for name in STAT_ORDER:\n        counter = line.c.get(name)\n        if not counter or not counter.opp:\n            continue\n        lo, hi, label = BENCHMARKS[name]\n        val = counter.pct\n        if counter.opp < 15:\n            verdict = \"thin sample\"\n        elif val < lo:\n            verdict = \"LOW  (typical %d-%d%%)\" % (lo, hi)\n        elif val > hi:\n            verdict = \"HIGH (typical %d-%d%%)\" % (lo, hi)\n        else:\n            verdict = \"ok   (typical %d-%d%%)\" % (lo, hi)\n        rows.append(\"%-28s %7.1f%% %10s   %s\"\n                    % (label, val, \"%d/%d\" % (counter.act, counter.opp), verdict))\n    if line.af is not None:\n        rows.append(\"%-28s %8.2f %10s   %s\"\n                    % (\"Aggression factor\", line.af,\n                       \"%d/%d\" % (line.postflop_bets + line.postflop_raises,\n                                  line.postflop_calls), \"typical 2.0-3.5\"))\n    if line.afq is not None:\n        rows.append(\"%-28s %7.1f%% %10s   %s\"\n                    % (\"Aggression frequency\", line.afq, \"\", \"typical 38-48%\"))\n    return \"\\n\".join(rows)\n","pokerbrain/template.py":"\"\"\"The HTML body for the report.\n\nKept separate from report.py so the generator code stays readable.\n\nThe body carries its own <title>, font link, <style> and <script> and no\ndocument skeleton, so it can be emitted two ways:\n\n  standalone -- wrapped in a full HTML document, for opening from disk\n  fragment   -- as-is, for publishing as an Artifact (the host supplies the\n                skeleton, a charset/viewport meta and safe-area padding)\n\"\"\"\n\nBODY = r\"\"\"<title>Poker Brain<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n<style>\n/* Light is the base palette; dark redefines only the tokens, twice, so an\n   explicit toggle wins over the OS in both directions. */\n:root{\n  --bg:#f5f4f0; --panel:#ffffff; --panel2:#efefe9; --line:#e0e2dd; --ink:#161a18; --muted:#5e6863; --dim:#8b938d;\n  --accent:#8a6716; --accent-soft:#f0e7cf;\n  --good:#1a6b43; --bad:#a8243a; --warn:#8a5d0c;\n  --good-soft:#e2efe8; --bad-soft:#f7e3e6; --warn-soft:#f6ecd8;\n  --felt-a:#1d5740; --felt-b:#123326; --felt-rim:#0b2118; --felt-ink:#e4efe9;\n  --felt-dim:#8fb3a2;\n  --card-face:#fcfcfa; --card-red:#b0263a; --card-black:#1b201d;\n  --shadow:0 1px 2px rgba(20,30,25,.07), 0 6px 18px -10px rgba(20,30,25,.22);\n  --r:12px;\n  --display:\"Fraunces\",Georgia,\"Times New Roman\"
