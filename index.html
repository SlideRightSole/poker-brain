 'Steal  Check/Raise  WTSD  WSD<\/span>' +\n        '<span class=\"said\" id=\"quicksaid\"><\/span><\/div>' +\n      '<div class=\"grid10\">' + flds + '<\/div>' +\n      '<div style=\"display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap\">' +\n        '<button class=\"btn\" id=\"go\" type=\"button\">Analyse<\/button>' +\n        '<button class=\"ghost\" id=\"clr\" type=\"button\">Clear<\/button>' +\n        '<span id=\"msg\" class=\"small muted\"><\/span><\/div><\/div>' +\n    '<div id=\"verdict\"><\/div>' +\n    '<h2>What the colours mean<\/h2>' +\n    '<div class=\"legend\" id=\"legend\"><\/div>' +\n    '<p class=\"legend-note\">These match the colour dots in the CoinPoker note panel. ' +\n    'Teal is deliberately unused - fewer colours you actually apply beats a complete set ' +\n    'you do not. Tag by what you should <b>do<\/b> against a player, not by a single stat.<\/p>' +\n    '<h2>Saved players<\/h2>' +\n    '<div class=\"panel\"><div class=\"roster\" id=\"roster\"><\/div>' +\n      '<p class=\"lead\" style=\"margin:10px 0 0\">Kept in this browser only, as a convenience. ' +\n      'The note itself belongs in the poker client note field, which is what you see at the ' +\n      'table.<\/p><\/div>';\n\n  $(\"#go\").onclick = analyse;\n  $(\"#f-quick\").oninput = quickFill;\n  $(\"#f-quick\").onkeydown = e => { if (e.key === \"Enter\"){ e.preventDefault(); analyse(); } };\n  $(\"#clr\").onclick = () => {\n    R.stats.forEach(x => { $(\"#f-\" + x.key).value = \"\"; });\n    $(\"#f-name\").value = \"\"; $(\"#verdict\").innerHTML = \"\";\n    $(\"#shotwrap\").innerHTML = \"\"; $(\"#msg\").textContent = \"\";\n    $(\"#imgbar\").hidden = true; $(\"#imgstatus\").hidden = true; shotBlob = null;\n    $(\"#f-quick\").value = \"\"; $(\"#quicksaid\").textContent = \"\";\n    $(\"#quicksaid\").className = \"said\";\n  };\n  const drop = $(\"#drop\"), pick = $(\"#pick\");\n  drop.onclick = () => pick.click();\n  drop.onkeydown = e => {\n    if (e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); pick.click(); }\n  };\n  pick.onchange = () => { if (pick.files && pick.files[0]) takeImage(pick.files[0]); };\n  drop.addEventListener(\"dragover\", e => { e.preventDefault(); drop.classList.add(\"over\"); });\n  drop.addEventListener(\"dragleave\", () => drop.classList.remove(\"over\"));\n  drop.addEventListener(\"drop\", e => {\n    e.preventDefault(); drop.classList.remove(\"over\");\n    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];\n    if (f && f.type.indexOf(\"image/\") === 0) takeImage(f);\n  });\n  $(\"#readbtn\").onclick = () => { if (shotBlob) readScreenshot(shotBlob); };\n  renderLegend();\n  renderRoster();\n  probeVision();\n}\n\nfunction renderLegend(){\n  const box = $(\"#legend\");\n  if (!box || !R.tagGuide) return;\n  box.innerHTML = R.tagGuide.map(g =>\n    '<div class=\"item\"><span class=\"swatch sw-' + esc(g.colour) + '\"><\/span><div>' +\n    \"<b>\" + esc(g.colour.charAt(0).toUpperCase() + g.colour.slice(1)) + \" \\u2014 \" +\n    esc(g.label) + \"<\/b>\" +\n    '<div class=\"when\"><span class=\"lbl\">Them:<\/span> ' + esc(g.when) + \"<\/div>\" +\n    '<div class=\"plan\"><span class=\"lbl\">Me:<\/span> ' + esc(g.plan) + \"<\/div><\/div><\/div>\"\n  ).join(\"\");\n}\n\nfunction renderRoster(){\n  const r = loadRoster();\n  const names = Object.keys(r).sort();\n  const box = $(\"#roster\");\n  if (!names.length){\n    box.innerHTML = '<span class=\"muted small\">Nothing saved yet.<\/span>';\n    return;\n  }\n  box.innerHTML = names.map(n =>\n    '<span class=\"chip\" data-n=\"' + esc(n) + '\"><i class=\"sw-' + esc(r[n].colour) + '\"><\/i>' +\n    esc(n) + '<\/span>').join(\"\");\n  for (const el of box.querySelectorAll(\".chip\")){\n    el.onclick = () => {\n      const p = loadRoster()[el.dataset.n];\n      if (!p) return;\n      $(\"#f-name\").value = p.name;\n      R.stats.forEach(x => { $(\"#f-\" + x.key).value = p.stats[x.key]; });\n      analyse();\n    };\n  }\n}\n\nfunction quickFill(){\n  const said = $(\"#quicksaid\");\n  const raw = $(\"#f-quick\").value;\n  const nums = (raw.match(/\\d+(?:\\.\\d+)?/g) || []).map(Number);\n  if (!nums.length){ said.className = \"said\"; said.textContent = \"\"; return; }\n  if (nums.length !== R.stats.length){\n    said.className = \"said bad\";\n    said.textContent = \"Found \" + nums.length + \" numbers, need \" + R.stats.length + \".\";\n    return;\n  }\n  const bad = nums.filter(n => n < 0 || n > 100);\n  if (bad.length){\n    said.className = \"said bad\";\n    said.textContent = \"Every value should be a percentage between 0 and 100.\";\n    return;\n  }\n  R.stats.forEach((x, i) => { $(\"#f-\" + x.key).value = nums[i]; });\n  said.className = \"said good\";\n  said.textContent = \"Filled all ten.\";\n  analyse();\n}\n\nfunction readForm(){\n  const s = {};\n  for (const x of R.stats){\n    const raw = $(\"#f-\" + x.key).value.trim();\n    if (raw === \"\") return {missing:x.label};\n    const v = Number(raw);\n    if (!isFinite(v) || v < 0 || v > 100) return {bad:x.label};\n    s[x.key] = v;\n  }\n  return {stats:s};\n}\n\nfunction analyse(){\n  const got = readForm();\n  const msg = $(\"#msg\");\n  if (got.missing){ msg.textContent = \"Still need \" + got.missing + \".\"; return; }\n  if (got.bad){ msg.textContent = got.bad + \" must be a percentage between 0 and 100.\"; return; }\n  msg.textContent = \"\";\n  const name = $(\"#f-name\").value.trim();\n  const p = buildProfile(got.stats, name);\n  renderVerdict(p);\n  if (name){\n    const r = loadRoster();\n    r[name] = {name:name, colour:p.colour, stats:p.stats, note:p.note, at:Date.now()};\n    saveRoster(r);\n    renderRoster();\n  }\n}\n\nfunction renderVerdict(p){\n  const tag = R.tags[p.colour];\n  let h = '<div class=\"panel\" style=\"margin-top:14px\">' +\n    '<div class=\"verdict\"><span class=\"swatch sw-' + esc(p.colour) + '\"><\/span><div>' +\n    '<h3>Tag ' + esc(p.colour.toUpperCase()) +\n    (p.name ? \" \u2014 \" + esc(p.name) : \"\") + '<\/h3>' +\n    '<div class=\"plan\">' + esc(p.archetype) + \" \u00b7 \" + esc(tag.plan) + '<\/div><\/div><\/div>' +\n    '<p class=\"lead\" style=\"margin-top:12px\">' + esc(p.reasoning) + '<\/p>';\n\n  const g = (R.tagGuide || []).find(x => x.colour === p.colour);\n  if (g){\n    h += '<div class=\"colourbox\"><span class=\"swatch sw-' + esc(p.colour) + '\"><\/span><div>' +\n      '<p class=\"eyebrow\" style=\"margin:0 0 4px\">Colour to set in CoinPoker<\/p>' +\n      \"<b>\" + esc(p.colour.charAt(0).toUpperCase() + p.colour.slice(1)) + \" \\u2014 \" +\n      esc(g.label) + \"<\/b>\" +\n      '<div class=\"when\"><span class=\"lbl\">Them:<\/span> ' + esc(g.when) + \"<\/div>\" +\n      '<div class=\"gplan\"><span class=\"lbl\">Me:<\/span> ' + esc(g.plan) + \"<\/div><\/div><\/div>\";\n  }\n\n  const gp = p.gamePlan;\n  h += '<p class=\"eyebrow\" style=\"margin-top:18px\">Them<\/p>' +\n    '<p class=\"profile\">' + esc(gp.profile) + \"<\/p>\" +\n    '<p class=\"eyebrow\" style=\"margin-top:14px\">Me<\/p>';\n  for (const sec of gp.sections){\n    h += '<div class=\"plansec\"><h5>Me \\u2014 ' + esc(sec.title) + \"<\/h5><ul>\" +\n      sec.items.map(i => \"<li>\" + esc(i.long) + \"<\/li>\").join(\"\") + \"<\/ul><\/div>\";\n  }\n\n  if (p.leaks.length){\n    h += '<p class=\"eyebrow\" style=\"margin-top:18px\">Leaks and how to attack them<\/p>';\n    for (const l of p.leaks){\n      const pill = l.severity === \"high\" ? \"off\" : (l.severity === \"medium\" ? \"warn\" : \"thin\");\n      h += '<div class=\"leakrow ' + esc(l.severity) + '\"><div class=\"bar\"><\/div><div>' +\n        \"<h5>\" + esc(l.title) +\n        '<span class=\"pill ' + pill + '\">' + esc(l.severity) + \"<\/span>\" +\n        (l.reliability === \"slow\" ? '<span class=\"pill thin\">slow stat<\/span>' : \"\") +\n        \"<\/h5><p>\" + esc(l.exploit) + \"<\/p>\" +\n        '<div class=\"stat\">' + esc(l.label) + \" \" + l.value + \"%, typical \" +\n        l.benchmark[0] + \"\u2013\" + l.benchmark[1] + \"%<\/div><\/div><\/div>\";\n    }\n  } else {\n    h += '<p class=\"lead\">No rule tripped. Play them straightforwardly until something ' +\n         'shows up.<\/p>';\n  }\n\n  if (p.unreliable.length){\n    h += '<div class=\"callout\" style=\"margin-top:16px\"><b>Hold these loosely.<\/b> ' +\n      esc(p.unreliable.join(\", \")) + \" accumulate slowly \u2014 a player only faces a 3-bet \" +\n      \"after opening and getting re-raised. Act hard on VPIP, PFR, C-Bet and Steal; wait for \" +\n      \"more hands before trusting the rest.<\/div>\";\n  }\n\n  h += '<p class=\"eyebrow\" style=\"margin-top:18px\">Note to paste into CoinPoker<\/p>' +\n    '<textarea class=\"noteout\" id=\"note\">' + esc(p.note) + \"<\/textarea>\" +\n    '<div style=\"display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap\">' +\n    '<button class=\"btn\" id=\"cp\" type=\"button\">Copy note<\/button>' +\n    '<span class=\"small muted\" id=\"cc\">' + p.note.length + \"/\" + R.noteLimit +\n    \" characters<\/span><\/div><\/div>\";\n  $(\"#verdict\").innerHTML = h;\n\n  const ta = $(\"#note\");\n  ta.oninput = () => {\n    $(\"#cc\").textContent = ta.value.length + \"/\" + R.noteLimit + \" characters\";\n  };\n  $(\"#cp\").onclick = async () => {\n    ta.select();\n    let ok = false;\n    try { await navigator.clipboard.writeText(ta.value); ok = true; }\n    catch(e){ try { ok = document.execCommand(\"copy\"); } catch(e2){ ok = false; } }\n    $(\"#cp\").textContent = ok ? \"Copied\" : \"Press Ctrl+C\";\n    setTimeout(() => { $(\"#cp\").textContent = \"Copy note\"; }, 1800);\n  };\n  $(\"#verdict\").scrollIntoView({behavior:\"smooth\", block:\"nearest\"});\n}\n\n\nlet shotBlob = null;\nlet sampleFn = null;\nlet imagesConfirmed = false;\n\nfunction setStatus(kind, html){\n  const el = $(\"#imgstatus\");\n  el.className = \"status \" + kind;\n  el.innerHTML = html;\n  el.hidden = false;\n}\n\nfunction setEnv(kind, html){\n  const el = $(\"#env\");\n  el.className = \"status \" + kind;\n  el.innerHTML = html;\n  el.hidden = false;\n}\n\nconst TYPE_THEM_IN =\n  '<span class=\"how\">Type the ten numbers into the boxes below instead - that always ' +\n  'works, and is never misread.<\/span>';\n\nasync function probeVision(){\n  if (!(window.claude && window.claude.use)){\n    setEnv(\"\", \"<b>Screenshots are read here by built-in OCR.<\/b> Paste a stat panel and \" +\n      \"press <b>Read screenshot<\/b>. The first read downloads the reader, so give it a few \" +\n      \"seconds; after that it is quick and works offline. Always check the numbers it fills \" +\n      \"in \u2014 OCR can misread a digit.\");\n    return;\n  }\n  let s = null;\n  try { s = await window.claude.use(\"sample\"); } catch(e){ s = null; }\n  if (!s){\n    setEnv(\"warn\", \"<b>Screenshot reading is not available in this view.<\/b>\" + TYPE_THEM_IN);\n    return;\n  }\n  sampleFn = s;\n  let caps = null;\n  try { caps = await s.limits(); } catch(e){ caps = null; }\n  imagesConfirmed = !!(caps && caps.images);\n  if (imagesConfirmed){\n    setEnv(\"ok\", \"<b>Screenshot reading is ready.<\/b> Paste a stat panel and I will read the \" +\n      \"numbers off it. The first read asks your permission and takes a few seconds.\");\n  } else {\n    setEnv(\"\", \"<b>Screenshot reading: not confirmed in this viewer.<\/b> It did not advertise \" +\n      \"image support, but that is not the same as refusing - paste a panel and press \" +\n      \"<b>Read screenshot<\/b> anyway. If it genuinely cannot, it will say so.\" + TYPE_THEM_IN);\n  }\n}\n\nfunction takeImage(blob){\n  shotBlob = blob;\n  const url = URL.createObjectURL(blob);\n  $(\"#shotwrap\").innerHTML =\n    '<img class=\"shot\" alt=\"Pasted stat panel\" src=\"' + url + '\">';\n  $(\"#imgbar\").hidden = false;\n  setStatus(\"\", \"Got the image. Reading it now...\");\n  readScreenshot(blob);\n}\n\nconst VISION = [\n  \"This image is a screenshot of an online poker HUD player-statistics panel.\",\n  \"Read the player screen name and the ten percentage statistics, then reply with only JSON.\",\n  \"Keys: name, vpip, pfr, three_bet, fold_to_three_bet, cbet, fold_to_cbet, steal,\",\n  \"check_raise, wtsd, wsd.\",\n  \"The panel labels them VPIP, PFR, 3-BET, Fold to 3-Bet, C-BET, Fold to C-Bet, Steal,\",\n  \"Check/Raise, WTSD and WSD. WTSD and WSD may sit at either end of a coloured bar.\",\n  \"Every statistic is a number without a percent sign. Use null for anything not visible.\",\n  \"name is the player screen name as a string, or an empty string if you cannot see it.\",\n  'Example: {\"name\":\"Player1\",\"vpip\":24,\"pfr\":22,\"three_bet\":12,\"fold_to_three_bet\":64,',\n  '\"cbet\":70,\"fold_to_cbet\":21,\"steal\":45,\"check_raise\":11,\"wtsd\":31,\"wsd\":52}'\n].join(\"\\n\");\n\nconst VISION_ERRORS = {\n  not_granted: \"You have not allowed this page to use Claude, so it cannot read the image. \" +\n    \"Reload the page to be asked again, or type the numbers in below.\",\n  sampling_disabled: \"Claude is not available on this account, so screenshots cannot be read.\",\n  images_unavailable: \"This viewer really cannot send images. Opening the same link in a web browser (Chrome, Edge, Safari) usually can.\",\n  image_rejected: \"That image was rejected. Try a PNG or JPEG under 20 MB.\",\n  rate_limited: \"Too many requests just now. Wait a moment and press Read screenshot again.\",\n  invalid_json: \"I could not read the panel cleanly. Press Read screenshot to try again, \" +\n    \"or type the numbers in below.\",\n  refused: \"I could not process that image.\",\n  session_expired: \"Your Claude session expired. Sign in again, then press Read screenshot.\",\n  cancelled: \"That read was cancelled.\",\n  upstream_error: \"Something went wrong reaching Claude. Press Read screenshot to try again.\"\n};\n\nasync function readScreenshot(blob){\n  if (!blob) return;\n  if (sampleFn) return readWithClaude(blob);\n  return readWithOCR(blob);\n}\n\nasync function readWithClaude(blob){\n  const btn = $(\"#readbtn\");\n  btn.disabled = true;\n  setStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Reading the panel. The first ' +\n    'time, Claude asks your permission first.<\/span>');\n  try {\n    const d = await sampleFn.json(VISION, {images: blob, modelTier: \"default\"});\n    const missing = [];\n    let filled = 0;\n    for (const x of R.stats){\n      const v = d ? d[x.key] : null;\n      if (typeof v === \"number\" && isFinite(v)){ $(\"#f-\" + x.key).value = v; filled++; }\n      else missing.push(x.label);\n    }\n    if (d && typeof d.name === \"string\" && d.name.trim()) $(\"#f-name\").value = d.name.trim();\n    if (filled === R.stats.length){\n      setStatus(\"ok\", \"<b>Read all ten.<\/b> Check them against the screenshot, then press \" +\n        \"Analyse.\");\n      analyse();\n    } else if (filled){\n      setStatus(\"warn\", \"<b>Read \" + filled + \" of \" + R.stats.length + \".<\/b> Still need: \" +\n        esc(missing.join(\", \")) + \". Fill those in and press Analyse.\");\n    } else {\n      setStatus(\"err\", \"<b>I could not read any numbers off that image.<\/b>\" + TYPE_THEM_IN);\n    }\n  } catch(e){\n    const code = e && e.code;\n    setStatus(\"err\", \"<b>\" + esc((code && VISION_ERRORS[code]) ||\n      \"Could not read that screenshot.\") + \"<\/b>\" + TYPE_THEM_IN +\n      (code ? '<span class=\"how\">Error code: ' + esc(code) + \"<\/span>\" : \"\"));\n  } finally {\n    btn.disabled = false;\n  }\n}\n\n/* ---- in-browser OCR, for hosts where Claude is not available ----------- */\nconst TESS_URL = \"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js\";\nlet tessLoading = null;\n\nfunction loadScript(src){\n  return new Promise((resolve, reject) => {\n    const el = document.createElement(\"script\");\n    el.src = src;\n    el.async = true;\n    el.onload = () => resolve();\n    el.onerror = () => reject(new Error(\"could not load \" + src));\n    document.head.appendChild(el);\n  });\n}\n\nasync function ensureTesseract(){\n  if (window.Tesseract) return window.Tesseract;\n  if (!tessLoading) tessLoading = loadScript(TESS_URL);\n  await tessLoading;\n  if (!window.Tesseract) throw new Error(\"Tesseract failed to initialise\");\n  return window.Tesseract;\n}\n\nfunction blobToImage(blob){\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    const url = URL.createObjectURL(blob);\n    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };\n    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(\"bad image\")); };\n    img.src = url;\n  });\n}\n\n// The panel is light text on a dark ground; Tesseract wants the opposite.\n// Upscale first - the digits are small - then grey, invert, and push the\n// midtones apart so the glyph edges are clean.\nfunction preprocess(img){\n  const scale = Math.min(3, Math.max(1.6, 1500 / Math.max(1, img.naturalWidth)));\n  const c = document.createElement(\"canvas\");\n  c.width = Math.round(img.naturalWidth * scale);\n  c.height = Math.round(img.naturalHeight * scale);\n  const ctx = c.getContext(\"2d\", {willReadFrequently: true});\n  ctx.imageSmoothingEnabled = true;\n  ctx.imageSmoothingQuality = \"high\";\n  ctx.drawImage(img, 0, 0, c.width, c.height);\n  const frame = ctx.getImageData(0, 0, c.width, c.height);\n  const px = frame.data;\n  for (let i = 0; i < px.length; i += 4){\n    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];\n    v = 255 - v;\n    v = v < 115 ? 0 : (v > 185 ? 255 : v);\n    px[i] = px[i + 1] = px[i + 2] = v;\n    px[i + 3] = 255;\n  }\n  ctx.putImageData(frame, 0, 0);\n  return c;\n}\n\n// Tesseract versions differ in where they hang word boxes; gather them\n// from whichever shape came back.\nfunction wordsFrom(data){\n  if (!data) return [];\n  if (Array.isArray(data.words) && data.words.length) return data.words;\n  const out = [];\n  const walk = node => {\n    if (!node || typeof node !== \"object\") return;\n    if (Array.isArray(node.words)) out.push.apply(out, node.words);\n    [\"blocks\", \"paragraphs\", \"lines\"].forEach(k => {\n      if (Array.isArray(node[k])) node[k].forEach(walk);\n    });\n  };\n  walk(data);\n  return out;\n}\n\n// Every stat in the panel carries a percent sign and nothing else does, so\n// the percentage tokens are exactly the ten values. Group them into rows,\n// read each row left to right, and panel order falls out.\nfunction panelNumbers(words){\n  const found = [];\n  for (const w of words){\n    const text = String((w && w.text) || \"\").replace(/\\s+/g, \"\");\n    const m = text.match(/^(\\d{1,3})%$/);\n    if (!m) continue;\n    const value = Number(m[1]);\n    if (!isFinite(value) || value < 0 || value > 100) continue;\n    const b = (w && w.bbox) || {};\n    if (typeof b.x0 !== \"number\") continue;\n    found.push({value: value, x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2,\n                h: Math.max(1, b.y1 - b.y0)});\n  }\n  if (!found.length) return [];\n  const meanH = found.reduce((t, n) => t + n.h, 0) / found.length;\n  const tol = Math.max(10, meanH * 0.8);\n  found.sort((a, b) => a.y - b.y);\n  const rows = [];\n  for (const n of found){\n    const row = rows[rows.length - 1];\n    if (row && Math.abs(n.y - row.y) <= tol){\n      row.items.push(n);\n      row.y = row.items.reduce((t, i) => t + i.y, 0) / row.items.length;\n    } else {\n      rows.push({y: n.y, items: [n]});\n    }\n  }\n  const out = [];\n  for (const row of rows){\n    row.items.sort((a, b) => a.x - b.x);\n    for (const item of row.items) out.push(item.value);\n  }\n  return out;\n}\n\nasync function readWithOCR(blob){\n  const btn = $(\"#readbtn\");\n  btn.disabled = true;\n  setStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Loading the reader\u2026 ' +\n    'the first time downloads it, which takes a few seconds.<\/span>');\n  try {\n    const T = await ensureTesseract();\n    setStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Reading the panel\u2026<\/span>');\n    const img = await blobToImage(blob);\n    const canvas = preprocess(img);\n    const worker = await T.createWorker(\"eng\");\n    let data;\n    try {\n      await worker.setParameters({\n        tessedit_char_whitelist: \"0123456789%\",\n        tessedit_pageseg_mode: \"11\"\n      });\n      const result = await worker.recognize(canvas, {}, {blocks: true, text: true});\n      data = result && result.data;\n    } finally {\n      try { await worker.terminate(); } catch(e){}\n    }\n    const nums = panelNumbers(wordsFrom(data));\n    if (nums.length === R.stats.length){\n      R.stats.forEach((x, i) => { $(\"#f-\" + x.key).value = nums[i]; });\n      setStatus(\"ok\", \"<b>Read all ten.<\/b> Check them against the screenshot before you \" +\n        \"trust them \u2014 OCR does misread the odd digit \u2014 then press Analyse.\");\n      analyse();\n    } else if (nums.length){\n      setStatus(\"warn\", \"<b>Found \" + nums.length + \" numbers, expected \" + R.stats.length +\n        \".<\/b> Reading was unreliable on this image: \" + esc(nums.join(\", \")) +\n        '<span class=\"how\">Paste a tighter crop of just the stats, or use quick entry ' +\n        \"below.<\/span>\");\n    } else {\n      setStatus(\"err\", \"<b>Could not read any values off that image.<\/b>\" + TYPE_THEM_IN);\n    }\n  } catch(err){\n    setStatus(\"err\", \"<b>The reader could not run.<\/b> \" +\n      esc((err && err.message) || \"Unknown error\") +\n      '<span class=\"how\">This needs an internet connection the first time, to fetch the ' +\n      \"OCR engine.<\/span>\" + TYPE_THEM_IN);\n  } finally {\n    btn.disabled = false;\n  }\n}\n\n/* ------------------------------------------------------------ load hands - */\nconst PYODIDE_URL = \"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/\";\nlet pyReady = null;\n\nfunction renderMeta(){\n  $(\"#meta\").innerHTML = [\n    DATA.meta.site, DATA.meta.stakes, DATA.meta.hands + \" hands\",\n    DATA.meta.first + \" \u2014 \" + DATA.meta.last\n  ].map(x => \"<span>\" + esc(x) + \"<\/span>\").join(\"\");\n}\n\nfunction renderAll(){\n  renderMeta(); overview(); sessionsView(); lessonsView(); hands(); leaksView(); oppView();\n}\n\n/* Saved hands live in this browser (IndexedDB) so each day's files add to\n   the last. Nothing is sent anywhere. */\nfunction idbOpen(){\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(\"poker-brain\", 1);\n    req.onupgradeneeded = () => req.result.createObjectStore(\"kv\");\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\nasync function kvGet(key){\n  try {\n    const db = await idbOpen();\n    return await new Promise((resolve, reject) => {\n      const r = db.transaction(\"kv\").objectStore(\"kv\").get(key);\n      r.onsuccess = () => resolve(r.result);\n      r.onerror = () => reject(r.error);\n    });\n  } catch(e){ return undefined; }\n}\nasync function kvSet(key, value){\n  try {\n    const db = await idbOpen();\n    await new Promise((resolve, reject) => {\n      const tx = db.transaction(\"kv\", \"readwrite\");\n      tx.objectStore(\"kv\").put(value, key);\n      tx.oncomplete = resolve;\n      tx.onerror = () => reject(tx.error);\n    });\n    return true;\n  } catch(e){ return false; }\n}\nasync function kvClear(){\n  try {\n    const db = await idbOpen();\n    await new Promise((resolve, reject) => {\n      const tx = db.transaction(\"kv\", \"readwrite\");\n      tx.objectStore(\"kv\").clear();\n      tx.oncomplete = resolve;\n      tx.onerror = () => reject(tx.error);\n    });\n  } catch(e){}\n}\n\nfunction loadView(){\n  const hosted = !!DATA.pysrc;\n  let h = '<p class=\"lead\">Load each day\u2019s CoinPoker hand history files here. They are ' +\n    \"saved in this browser and added to what you loaded before, then split into sessions so \" +\n    \"you can review each one. Files are analysed on this computer and never uploaded.<\/p>\";\n  if (!hosted){\n    h += '<div class=\"callout\"><b>Loading hands works on your own site.<\/b> Open ' +\n      '<a href=\"https://sliderightsole.github.io/poker-brain/\" target=\"_blank\" rel=\"noopener\">' +\n      \"sliderightsole.github.io/poker-brain<\/a> and use this tab there \u2014 this view can\u2019t \" +\n      \"run the analyser.<\/div>\";\n    $(\"#v-load\").innerHTML = h;\n    return;\n  }\n  h += '<div id=\"loaddrop\" class=\"loadbox\" tabindex=\"0\" role=\"button\">' +\n      \"<b>Add hand history files<\/b>Click to pick one or more <code>.txt<\/code> exports, \" +\n      \"or drop them here.\" +\n      '<input id=\"loadpick\" type=\"file\" accept=\".txt,text/plain\" multiple hidden><\/div>' +\n    '<div id=\"loadstatus\" class=\"status\" hidden><\/div>' +\n    '<h2>Saved in this browser<\/h2><div class=\"panel\"><ul class=\"files\" id=\"filelist\"><\/ul>' +\n    '<div style=\"display:flex;gap:10px;margin-top:12px;flex-wrap:wrap\">' +\n    '<button class=\"ghost\" id=\"reanalyse\" type=\"button\">Re-analyse everything<\/button>' +\n    '<button class=\"ghost\" id=\"clearall\" type=\"button\">Remove all saved hands<\/button><\/div><\/div>' +\n    '<h2>Tips<\/h2><ol class=\"steps\">' +\n      \"<li>Export each day\u2019s sessions from CoinPoker as a text file and add them here. \" +\n      \"Loading a file twice is fine \u2014 each hand is counted once.<\/li>\" +\n      \"<li>The first run downloads the analyser (about 10 MB). After that only new hands \" +\n      \"need analysing, so daily loads are quick.<\/li>\" +\n      \"<li>Saved hands stay in this browser on this computer. Clearing your browser data \" +\n      \"removes them, so keep your exported files too.<\/li><\/ol>\";\n  $(\"#v-load\").innerHTML = h;\n  const drop = $(\"#loaddrop\"), pick = $(\"#loadpick\");\n  drop.onclick = () => pick.click();\n  drop.onkeydown = e => { if (e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); pick.click(); } };\n  pick.onchange = () => {\n    if (pick.files && pick.files.length) addFiles(Array.from(pick.files));\n    pick.value = \"\";\n  };\n  drop.addEventListener(\"dragover\", e => { e.preventDefault(); drop.classList.add(\"over\"); });\n  drop.addEventListener(\"dragleave\", () => drop.classList.remove(\"over\"));\n  drop.addEventListener(\"drop\", e => {\n    e.preventDefault(); drop.classList.remove(\"over\");\n    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || [])\n      .filter(f => /\\.txt$/i.test(f.name) || f.type === \"text/plain\");\n    if (files.length) addFiles(files);\n  });\n  $(\"#reanalyse\").onclick = () => analyseSaved(false);\n  $(\"#clearall\").onclick = async () => {\n    if (!window.confirm(\"Remove all saved hands from this browser? Your exported files are not affected.\")) return;\n    await kvClear();\n    location.reload();\n  };\n  renderFileList();\n}\n\nasync function renderFileList(){\n  const el = $(\"#filelist\");\n  if (!el) return;\n  const texts = (await kvGet(\"texts\")) || [];\n  if (!texts.length){\n    el.innerHTML = '<li style=\"border:none;color:var(--muted)\">Nothing saved yet \u2014 the ' +\n      \"report is showing the hands built into this page.<\/li>\";\n    return;\n  }\n  el.innerHTML = texts.slice().reverse().map(f => \"<li><b>\" + esc(f.name) + \"<\/b><span>added \" +\n    esc(new Date(f.added).toLocaleString()) + \" \u00b7 \" + Math.round(f.text.length / 1024) +\n    \" KB<\/span><\/li>\").join(\"\");\n}\n\nfunction loadStatus(kind, html, pct){\n  const el = $(\"#loadstatus\");\n  if (!el) return;\n  el.className = \"status \" + kind;\n  el.hidden = false;\n  el.innerHTML = html + (pct == null ? \"\" :\n    '<div class=\"bar2\"><i style=\"width:' + Math.round(pct) + '%\"><\/i><\/div>');\n}\n\nasync function ensurePython(){\n  if (pyReady) return pyReady;\n  pyReady = (async () => {\n    await loadScript(PYODIDE_URL + \"pyodide.js\");\n    const py = await window.loadPyodide({indexURL: PYODIDE_URL});\n    for (const rel in DATA.pysrc){\n      const path = \"/pb/\" + rel;\n      py.FS.mkdirTree(path.slice(0, path.lastIndexOf(\"/\")));\n      py.FS.writeFile(path, DATA.pysrc[rel]);\n    }\n    await py.runPythonAsync(PY_GLUE);\n    return py;\n  })();\n  try { return await pyReady; }\n  catch(e){ pyReady = null; throw e; }\n}\n\nconst PY_GLUE = [\n  \"import sys, json, asyncio\",\n  \"sys.path.insert(0, '/pb')\",\n  \"from pokerbrain.parsers import coinpoker\",\n  \"from pokerbrain import report\",\n  \"async def pb_run(texts, cache_json, progress):\",\n  \"    cache = json.loads(cache_json) if cache_json else {}\",\n  \"    hands, skipped = [], 0\",\n  \"    for text in texts:\",\n  \"        for block in coinpoker.split_hands(text):\",\n  \"            try:\",\n  \"                hands.append(coinpoker.parse_hand(block))\",\n  \"            except Exception:\",\n  \"                skipped += 1\",\n  \"    unique = {}\",\n  \"    for h in hands:\",\n  \"        unique.setdefault(h.hand_id, h)\",\n  \"    dupes = len(hands) - len(unique)\",\n  \"    no_hero = sum(1 for h in unique.values() if h.hero is None)\",\n  \"    hands = [h for h in unique.values() if h.hero is not None]\",\n  \"    corrected = sum(1 for h in hands if any('summary says won' in w for w in h.parse_warnings))\",\n  \"    hands.sort(key=lambda h: (h.timestamp, h.hand_id))\",\n  \"    if not hands:\",\n  \"        return json.dumps({'error': 'No CoinPoker hands with you in them were found.'})\",\n  \"    todo = [h for h in hands if h.hand_id not in cache]\",\n  \"    done = 0\",\n  \"    for h in todo:\",\n  \"        cache[h.hand_id] = report._hand_payload(h, 'Hero', 600, 600)\",\n  \"        done += 1\",\n  \"        if done % 4 == 0 or done == len(todo):\",\n  \"            progress(done, len(todo))\",\n  \"            await asyncio.sleep(0)\",\n  \"    payloads = [cache[h.hand_id] for h in hands]\",\n  \"    data = report.build_payload(hands, 'Hero', payloads)\",\n  \"    data.pop('rules', None)\",\n  \"    data['skipped'] = skipped\",\n  \"    data['dupes'] = dupes\",\n  \"    data['newHands'] = len(todo)\",\n  \"    data['noHero'] = no_hero\",\n  \"    data['corrected'] = corrected\",\n  \"    return json.dumps(data)\",\n  \"def pb_dive(raw, overrides_json):\",\n  \"    try:\",\n  \"        return json.dumps(report.deep_dive(raw, json.loads(overrides_json or '{}')))\",\n  \"    except Exception as exc:\",\n  \"        return json.dumps({'error': 'Could not analyse this hand: %s' % exc})\",\n  \"from pokerbrain import solver as pbs\",\n  \"async def _pb_iterate(s, iters, progress, spot):\",\n  \"    done = 0\",\n  \"    while done < iters:\",\n  \"        step = min(10, iters - done)\",\n  \"        s.iterate(step)\",\n  \"        done += step\",\n  \"        if done % 30 == 0 or done >= iters:\",\n  \"            e = s.exploitability()\",\n  \"            progress(done, iters, e * 100)\",\n  \"            if e <= 0.005:\",\n  \"                break\",\n  \"        else:\",\n  \"            progress(done, iters, -1)\",\n  \"        await asyncio.sleep(0)\",\n  \"    return json.dumps(pbs.describe_hand(s, spot) if spot else s.result())\",\n  \"async def pb_solve(spec_json, progress):\",\n  \"    spec = json.loads(spec_json)\",\n  \"    try:\",\n  \"        s = pbs.RiverSolver(spec['board'], spec['oop'], spec['ip'], float(spec['pot']),\",\n  \"                            float(spec['stack']), oop_bets=tuple(spec['bets']),\",\n  \"                            ip_bets=tuple(spec['bets']), raises=tuple(spec['raises']),\",\n  \"                            max_raises=1 if spec['raises'] else 0)\",\n  \"    except Exception as exc:\",\n  \"        return json.dumps({'error': 'Check the spot: %s' % exc})\",\n  \"    return await _pb_iterate(s, int(spec.get('iterations', 300)), progress, None)\",\n  \"async def pb_solve_hand(raw, progress):\",\n  \"    try:\",\n  \"        prepared, reason = pbs.prepare_hand(coinpoker.parse_hand(raw))\",\n  \"    except Exception as exc:\",\n  \"        return json.dumps({'error': 'Could not read this hand: %s' % exc})\",\n  \"    if prepared is None:\",\n  \"        return json.dumps({'error': reason})\",\n  \"    s, spot = prepared\",\n  \"    return await _pb_iterate(s, 300, progress, spot)\",\n].join(\"\\n\");\n\nasync function addFiles(files){\n  loadStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>Reading ' + files.length +\n    \" file\" + (files.length > 1 ? \"s\" : \"\") + \"\u2026<\/span>\");\n  try {\n    const saved = (await kvGet(\"texts\")) || [];\n    let added = 0;\n    for (const f of files){\n      const text = await f.text();\n      if (saved.some(s => s.text === text)) continue;\n      saved.push({name: f.name, added: new Date().toISOString(), text: text});\n      added++;\n    }\n    const stored = await kvSet(\"texts\", saved);\n    await analyseTexts(saved.map(s => s.text), added, stored);\n    await renderFileList();\n  } catch(err){\n    loadStatus(\"err\", \"<b>Could not load those files.<\/b> \" +\n      esc(String((err && err.message) || err)).slice(0, 300));\n  }\n}\n\nasync function analyseSaved(quiet){\n  const saved = (await kvGet(\"texts\")) || [];\n  if (!saved.length){\n    if (!quiet) loadStatus(\"warn\", \"<b>Nothing saved yet.<\/b> Add some hand history files first.\");\n    return;\n  }\n  await analyseTexts(saved.map(s => s.text), null, true);\n}\n\nasync function analyseTexts(texts, addedFiles, stored){\n  try {\n    loadStatus(\"\", '<span class=\"busy\"><span class=\"spin\"><\/span>' +\n      (pyReady ? \"Preparing\u2026\" : \"Loading the analyser\u2026 the first time downloads it, \" +\n      \"which takes a little while.\") + \"<\/span>\");\n    const py = await ensurePython();\n    const cacheRec = await kvGet(\"cache\");\n    const cache = (cacheRec && cacheRec.buildId === DATA.buildId) ? cacheRec.payloads : {};\n    const run = py.globals.get(\"pb_run\");\n    const progress = (done, total) => loadStatus(\"\",\n      '<span class=\"busy\"><span class=\"spin\"><\/span>Analysing new hand ' + done + \" of \" +\n      total + \"\u2026<\/span>\", 100 * done / total);\n    const pyTexts = py.toPy(texts);\n    let raw;\n    try { raw = await run(pyTexts, JSON.stringify(cache), progress); }\n    finally { pyTexts.destroy(); run.destroy(); }\n    const result = JSON.parse(raw);\n    if (result.error){\n      loadStatus(\"err\", \"<b>\" + esc(result.error) + \"<\/b>\" +\n        '<span class=\"how\">Check these are CoinPoker hand history exports (.txt).<\/span>');\n      return;\n    }\n    const skipped = result.skipped || 0, dupes = result.dupes || 0, fresh = result.newHands || 0;\n    const noHero = result.noHero || 0, corrected = result.corrected || 0;\n    delete result.skipped; delete result.dupes; delete result.newHands;\n    delete result.noHero; delete result.corrected;\n    Object.assign(DATA, result);\n    const payloads = {};\n    for (const p of result.hands) payloads[p.id] = p;\n    await kvSet(\"cache\", {buildId: DATA.buildId, payloads: payloads});\n    await kvSet(\"last\", {buildId: DATA.buildId, data: result});\n    sessionPick = null;\n    lessonPick = null;\n    handFilter = \"all\";\n    renderAll();\n    loadStatus(\"ok\", \"<b>\" + DATA.meta.hands + \" hands in \" + (DATA.sessions || []).length +\n      \" sessions.<\/b> \" +\n      (addedFiles === 0 ? \"Those files were already saved. \" : \"\") +\n      (addedFiles === null ? \"Re-analysed with the latest version of the analyser. \" :\n        (fresh ? fresh + \" new hand\" + (fresh > 1 ? \"s\" : \"\") + \" analysed. \" : \"No new hands. \")) +\n      \"Open the Sessions tab to review the latest one.\" +\n      (dupes ? '<span class=\"how\">' + dupes + \" repeated hand\" + (dupes > 1 ? \"s\" : \"\") +\n        \" across files counted once.<\/span>\" : \"\") +\n      (skipped ? '<span class=\"how\">' + skipped + \" hand\" + (skipped > 1 ? \"s\" : \"\") +\n        \" could not be read and were skipped.<\/span>\" : \"\") +\n      (noHero ? '<span class=\"how\">' + noHero + \" hand\" + (noHero > 1 ? \"s\" : \"\") +\n        \" didn\u2019t include you and were left out.<\/span>\" : \"\") +\n      (corrected ? '<span class=\"how\">' + corrected + \" hand\" + (corrected > 1 ? \"s\" : \"\") +\n        \" had a win recovered from the hand\u2019s summary.<\/span>\" : \"\") +\n      '<span class=\"how\">Total: ' + sgn(DATA.meta.netBB) + \" bb over \" + DATA.meta.hands +\n        \" hands, each converted at its own stakes (\" + esc(DATA.meta.stakes) + \").<\/span>\" +\n      (stored ? \"\" : '<span class=\"how\">This browser would not save the files, so they ' +\n        \"will be gone after a reload.<\/span>\") +\n      '<span class=\"how\">Equity here uses a faster, rougher simulation than the report built ' +\n      \"on your PC.<\/span>\");\n  } catch(err){\n    loadStatus(\"err\", \"<b>Could not analyse the hands.<\/b> \" +\n      esc(String((err && err.message) || err)).slice(0, 300) +\n      '<span class=\"how\">The first run needs an internet connection to download the ' +\n      \"analyser.<\/span>\");\n  }\n}\n\n/* On a return visit, show the saved analysis straight away. If the analyser\n   has changed since it was saved, rebuild it in the background. */\nasync function restoreSaved(){\n  if (!DATA.pysrc || !window.indexedDB) return;\n  const last = await kvGet(\"last\");\n  if (last && last.data){\n    Object.assign(DATA, last.data);\n    sessionPick = null;\n    lessonPick = null;\n    handFilter = \"all\";\n    renderAll();\n    if (last.buildId === DATA.buildId) return;\n  }\n  const saved = (await kvGet(\"texts\")) || [];\n  if (saved.length) analyseSaved(true);\n}\n\ndocument.addEventListener(\"paste\", e => {\n  const items = (e.clipboardData && e.clipboardData.items) || [];\n  for (const it of items){\n    if (it.type && it.type.indexOf(\"image/\") === 0){\n      const blob = it.getAsFile();\n      if (!blob) continue;\n      e.preventDefault , A2s+, K6s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 76s, 65s, A8o+, K9o+, QTo+, JTo\"\n  },\n\n  \"vs_rfi_3bet\": {\n    \"_note\": \"Value-heavy 3-bet with a polar bluff component; widen vs late-position opens.\",\n    \"vs_early\": \"QQ+, AKs, AKo, A5s-A4s, KQs\",\n    \"vs_middle\": \"JJ+, AQs+, AKo, A5s-A3s, KJs+\",\n    \"vs_late\": \"99+, ATs+, AQo+, A5s-A2s, KTs+, QJs, JTs, T9s, 76s\",\n    \"vs_blinds\": \"TT+, AJs+, AQo+, A5s-A3s, KQs\"\n  },\n\n  \"vs_rfi_call\": {\n    \"_note\": \"Flat-calling range in position; from the blinds this is wider but weaker.\",\n    \"ip_vs_early\": \"88-22, AJs-ATs, KQs-KJs, QJs, JTs, T9s, 98s\",\n    \"ip_vs_late\": \"JJ-22, AJs-A2s, KQs-K9s, QJs-Q9s, JTs-J9s, T9s, 98s, 87s, 76s, AJo-ATo, KQo\",\n    \"bb_vs_btn\": \"99-22, A9s-A2s, K9s-K2s, Q9s-Q6s, J9s-J7s, T8s+, 97s+, 86s+, 75s+, 64s+, 54s, AJo-A2o, KJo-K8o, QJo-Q9o, JTo-J9o, T9o, 98o\"\n  },\n\n  \"vs_3bet_4bet\": {\n    \"_note\": \"Linear value 4-bet plus blockers as bluffs.\",\n    \"default\": \"QQ+, AKs, AKo, A5s-A4s\"\n  },\n\n  \"vs_3bet_call\": {\n    \"default\": \"JJ-88, AQs-AJs, KQs, AQo\"\n  },\n\n  \"population_adjustments\": {\n    \"_note\": \"How to shade the baseline against common small-stakes pool leaks.\",\n    \"pool_overfolds_to_3bet\": \"3-bet more bluffs with suited-ace and suited-broadway blockers.\",\n    \"pool_underfolds_to_cbet\": \"C-bet thinner for value, bluff less on static boards.\",\n    \"pool_limps\": \"Isolate limpers wider in position; limp-callers rarely have a strong range.\",\n    \"pool_underdefends_blinds\": \"Steal at a higher frequency from CO/BTN/SB.\",\n    \"pool_rarely_3bets\": \"Open wider from every seat and fold less to the 3-bets that do come.\"\n  },\n\n  \"push_fold_note\": \"For short-stack tournament play see icm.py and the Nash push/fold logic; the ranges above assume roughly 100bb cash.\"\n}\n","pokerbrain/parsers/coinpoker.py":"\"\"\"CoinPoker hand-history parser.\n\nWritten against real CoinPoker exports. Format notes that matter:\n\n  * `calls X` and `ALLIN X` give the chips *added* by that action.\n  * `raises A to B` gives the raise increment A and the new street level B;\n    the chips added are B minus what the player already had out this street.\n  * Antes go to the pot but do not set a street wager level.\n  * `STRADDLE X` is a voluntary blind raise made before the flop action.\n  * `NAME: RETURN X` is the uncalled portion of a bet coming back.\n  * `*** SHOWDOWN ***` is printed on every hand, including folded-out ones,\n    so it is a section marker and not evidence a showdown happened.\n  * Opponent IDs are regenerated every hand, so they are not stable handles.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\n\nfrom ..cards import parse_cards\nfrom ..model import (\n    ALLIN, BET, CALL, CHECK, FLOP, FOLD, MUCK, POST, PREFLOP, RAISE, RETURN,\n    RIVER, SHOW, STRADDLE, TURN, Action, Hand, Player, assign_positions,\n)\n\nSITE = \"CoinPoker\"\n\n_MONEY = r\"[^\\d\\s]?([0-9]+(?:\\.[0-9]+)?)\"\n\n_HEADER_RE = re.compile(\n    r\"^CoinPoker Hand #(?P<id>\\d+):\\s+(?P<game>[A-Za-z0-9\\- ]+?)\\s+\"\n    r\"\\((?P<stakes>[^)]*)\\)\\s+\"\n    r\"(?P<date>\\d{4}/\\d{2}/\\d{2}\\s+\\d{2}:\\d{2}:\\d{2})\\s*(?P<tz>\\w+)?\",\n    re.M)\n\n_TABLE_RE = re.compile(\n    r\"^Table '(?P<table>[^']+)'\\s+(?:(?P<max>\\d+)-max\\s+)?Seat #(?P<button>\\d+) is the button\",\n    re.M)\n\n_SEAT_RE = re.compile(\n    r\"^Seat (?P<seat>\\d+): (?P<name>.+?) \\(\" + _MONEY + r\" in chips\\)\", re.M)\n\n_POST_RE = re.compile(\n    r\"^(?P<name>.+?): posts (?P<kind>ante|small blind|big blind|auto big blind|\"\n    r\"small & big blinds|straddle)\\s+\" + _MONEY, re.M | re.I)\n\n_STRADDLE_RE = re.compile(r\"^(?P<name>.+?): STRADDLE\\s+\" + _MONEY, re.M)\n_ALLIN_RE = re.compile(r\"^(?P<name>.+?): ALLIN\\s+\" + _MONEY, re.M)\n_RETURN_RE = re.compile(r\"^(?P<name>.+?): RETURN\\s+\" + _MONEY, re.M)\n_CHECK_RE = re.compile(r\"^(?P<name>.+?): checks\\s*$\", re.M)\n_FOLD_RE = re.compile(r\"^(?P<name>.+?): folds\\s*$\", re.M)\n_CALL_RE = re.compile(r\"^(?P<name>.+?): calls\\s+\" + _MONEY, re.M)\n_BET_RE = re.compile(r\"^(?P<name>.+?): bets\\s+\" + _MONEY, re.M)\n_RAISE_RE = re.compile(r\"^(?P<name>.+?): raises\\s+\" + _MONEY + r\"\\s+to\\s+\" + _MONEY, re.M)\n_SHOW_RE = re.compile(r\"^(?P<name>.+?): shows \\[(?P<cards>[^\\]]+)\\](?:\\s*\\((?P<rank>[^)]+)\\))?\", re.M)\n_MUCK_RE = re.compile(r\"^(?P<name>.+?): mucks hand\\s*$\", re.M)\n_DEALT_RE = re.compile(r\"^Dealt to (?P<name>.+?)(?:\\s+\\[(?P<cards>[^\\]]+)\\])?\\s*$\", re.M)\n# \"collected X from pot\", and the main/side pot forms used when someone is all-in.\n_COLLECT_RE = re.compile(r\"^(?P<name>.+?):? collected\\s+\" + _MONEY +\n                         r\"\\s+from\\s+(?:the\\s+)?(?:main\\s+|side\\s+)?pot\", re.M | re.I)\n# The summary repeats each winner's total: \"Seat 3: Hero ... won (X)\".\n_SUMMARY_WON_RE = re.compile(\n    r\"^Seat \\d+: (?P<name>.+?) (?:\\([^)]*\\) )?(?:showed \\[[^\\]]*\\] and )?(?:won|collected) \\(\"\n    + _MONEY + r\"\\)\", re.M)\n_STREET_RE = re.compile(r\"^\\*\\*\\* (FLOP|TURN|RIVER) \\*\\*\\*(?P<cards>.*)$\", re.M)\n_BOARD_RE = re.compile(r\"^Board \\[\\s*(?P<cards>[^\\]]*?)\\s*\\]\", re.M)\n_POT_RE = re.compile(r\"^Total pot\\s+\" + _MONEY +\n                     r\"(?:\\s*\\|\\s*Rake\\s+\" + _MONEY + r\")?\"\n                     r\"(?:\\s*\\|\\s*Splash Fee\\s+\" + _MONEY + r\")?\", re.M)\n_RUN_RE = re.compile(r\"^Hand was run (once|twice|three times)\", re.M | re.I)\n_SUMMARY_SEAT_RE = re.compile(\n    r\"^Seat (?P<seat>\\d+): (?P<name>.+?) (?P<what>folded (?:before|on) the \\w+|folded before Flop\"\n    r\"|showed \\[(?P<cards>[^\\]]+)\\] and (?P<result>won|lost)(?:\\s*\\(\" + _MONEY + r\"\\))?\"\n    r\"(?: with (?P<rank>[A-Za-z][A-Za-z ]*?))?\\s*|collected|mucked)\\s*$\", re.M)\n\n_RUN_WORDS = {\"once\": 1, \"twice\": 2, \"three times\": 3}\n\n_STREET_TOKEN = {\"FLOP\": FLOP, \"TURN\": TURN, \"RIVER\": RIVER}\n\n\ndef detect(text: str) -> bool:\n    \"\"\"True when this looks like a CoinPoker export.\"\"\"\n    return \"CoinPoker Hand #\" in text\n\n\ndef split_hands(text: str) -> list:\n    \"\"\"Split a file into individual hand blocks.\"\"\"\n    text = text.replace(\"\\r\\n\", \"\\n\").replace(\"\ufeff\", \"\")\n    starts = [m.start() for m in re.finditer(r\"^CoinPoker Hand #\\d+:\", text, re.M)]\n    blocks = []\n    for i, start in enumerate(starts):\n        end = starts[i + 1] if i + 1 < len(starts) else len(text)\n        block = text[start:end].strip()\n        if block:\n            blocks.append(block)\n    return blocks\n\n\ndef _f(value) -> float:\n    return float(value) if value not in (None, \"\") else 0.0\n\n\ndef _parse_stakes(hand: Hand, stakes: str) -> None:\n    nums = re.findall(r\"([0-9]+(?:\\.[0-9]+)?)\", stakes)\n    vals = [float(n) for n in nums]\n    if len(vals) >= 3:\n        hand.small_blind, hand.big_blind, hand.ante = vals[0], vals[1], vals[2]\n    elif len(vals) == 2:\n        hand.small_blind, hand.big_blind = vals[0], vals[1]\n    elif len(vals) == 1:\n        hand.big_blind = vals[0]\n        hand.small_blind = vals[0] / 2\n    symbol = re.sub(r\"[0-9./\\s]\", \"\", stakes)\n    if symbol:\n        hand.currency = {\"\u20ae\": \"USDT\"}.get(symbol[0], symbol[0])\n\n\ndef _street_boundaries(block: str):\n    \"\"\"Yield (street, start_index, end_index) spans over the hand body.\"\"\"\n    markers = [(PREFLOP, 0)]\n    for m in _STREET_RE.finditer(block):\n        markers.append((_STREET_TOKEN[m.group(1)], m.start()))\n    summary = block.find(\"*** SUMMARY ***\")\n    end_all = summary if summary != -1 else len(block)\n    spans = []\n    for i, (street, start) in enumerate(markers):\n        end = markers[i + 1][1] if i + 1 < len(markers) else end_all\n        spans.append((street, start, end))\n    return spans\n\n\ndef parse_hand(block: str) -> Hand:\n    \"\"\"Parse one CoinPoker hand block into a Hand.\"\"\"\n    header = _HEADER_RE.search(block)\n    if not header:\n        raise Va )\n            try:\n                player.hole_cards = tuple(parse_cards(m.group(\"cards\")))\n            except Exception as exc:\n                hand.parse_warnings.append(f\"dealt {name}: {exc}\")\n\n    # --- actions, street by street --------------------------------------\n    order = 0\n    street_level = {}      # street -> current wager level\n    street_invested = {}   # (street, player) -> chips out this street\n\n    def invested(street, name):\n        return street_invested.get((street, name), 0.0)\n\n    def add(street, name, value):\n        street_invested[(street, name)] = invested(street, name) + value\n\n    events = []\n    for street, start, end in _street_boundaries(block):\n        section = block[start:end]\n        street_level.setdefault(street, 0.0)\n        found = []\n        for regex, verb in ((_POST_RE, POST), (_STRADDLE_RE, STRADDLE), (_CHECK_RE, CHECK),\n                            (_FOLD_RE, FOLD), (_CALL_RE, CALL), (_BET_RE, BET),\n                            (_RAISE_RE, RAISE), (_ALLIN_RE, ALLIN), (_RETURN_RE, RETURN),\n                            (_SHOW_RE, SHOW), (_MUCK_RE, MUCK)):\n            for m in regex.finditer(section):\n                name = m.group(\"name\").strip()\n                if name not in known:\n                    continue\n                found.append((m.start(), verb, m))\n        found.sort(key=lambda t: t[0])\n        events.append((street, found))\n\n    for street, found in events:\n        for _, verb, m in found:\n            name = m.group(\"name\").strip()\n            player = hand.player(name)\n            action = Action(player=name, verb=verb, street=street, order=order)\n            order += 1\n\n            if verb == POST:\n                kind = m.group(\"kind\").lower()\n                value = _f(m.group(3))\n                action.amount = value\n                action.note = kind\n                if \"ante\" in kind:\n                    action.to_amount = 0.0           # antes se          action.to_amount = invested(street, name)\n                action.all_in = True\n                street_level[street] = max(street_level[street], action.to_amount)\n\n            elif verb == RETURN:\n                value = _f(m.group(2))\n                action.amount = value\n                street_invested[(street, name)] = invested(street, name) - value\n\n            elif verb == SHOW:\n                action.note = (m.group(\"rank\") or \"\").strip()\n                try:\n                    action.cards = tuple(parse_cards(m.group(\"cards\")))\n                except Exception:\n                    action.cards = ()\n                if player:\n                    player.showed = True\n                    player.shown_rank = action.note\n                    if action.cards and not player.hole_cards:\n                        player.hole_cards = action.cards\n\n            elif verb == MUCK:\n                if player:\n                    player.showed = True\n\n            hand.actions.append(action)\n\n    # --- money totals ----------------------------------------------------\n    for m in _COLLECT_RE.finditer(block):\n        player = hand.player(m.group(\"name\").strip())\n        if player:\n            player.collected += _f(m.group(2))\n\n    # Cross-check against the summary's own totals. If the body's collect\n    # lines missed a win (an unfamiliar pot wording, say), trust the summary.\n    summary_at = block.find(\"*** SUMMARY ***\")\n    if summary_at != -1:\n        won = {}\n        for m in _SUMMARY_WON_RE.finditer(block[summary_at:]):\n            name = m.group(\"name\").strip()\n            won[name] = won.get(name, 0.0) + _f(m.group(2))\n        for name, amount in won.items():\n            player = hand.player(name)\n            if player and amount > player.collected + 0.005:\n                hand.parse_warnings.append(\n                    \"%s: summary says won %.2f but body collected %.2f; using summary\"\n                    % (name, amount, player.collected))\n                player.collected = amount\n\n    pot = _POT_RE.search(block)\n    if pot:\n        hand.total_pot = _f(pot.group(1))\n        hand.rake = _f(pot.group(2))\n        hand.extra_fee = _f(pot.group(3))\n\n    run = _RUN_RE.search(block)\n    if run:\n        hand.run_count = _RUN_WORDS.get(run.group(1).lower(), 1)\n\n    # Invested = everything added, minus anything returned.\n    for a in hand.actions:\n        player = hand.player(a.player)\n        if not player:\n            continue\n        if a.verb in (POST, STRADDLE, CALL, BET, RAISE, ALLIN):\n            player.invested += a.amount\n        elif a.verb == RETURN:\n            player.invested -= a.amount\n\n    # Summary rows fill in fold street and shown cards for players we missed.\n    summary_idx = block.find(\"*** SUMMARY ***\")\n    if summary_idx != -1:\n        for m in _SUMMARY_SEAT_RE.finditer(block[summary_idx:]):\n            player = hand.player(m.group(\"name\").strip())\n            if not player:\n                continue\n            what = m.group(\"what\") or \"\"\n            if what.startswith(\"folded\"):\n                # \"folded on the Turn\"  -> folded during the turn\n                # \"folded before Flop\"  -> folded on the street *before* the flop\n                named = {\"flop\": FLOP, \"turn\": TURN, \"river\": RIVER}.get(\n                    what.split()[-1].lower(), PREFLOP)\n                if \" before \" in what:\n                    order = [PREFLOP, FLOP, TURN, RIVER]\n                    named = order[max(0, order.index(named) - 1)]\n                player.folded_street = named\n            if m.group(\"cards\") and not player.hole_cards:\n                try:\n                    player.hole_cards = tuple(parse_cards(m.group(\"cards\")))\n                    player.showed = True\n                except Exception:\n                    pass\n            if m.group(\"rank\"):\n                player.shown_rank = m.group(\"rank\").strip()\n\n    # Some exports name the player instead of writing \"Hero\". The only\n    # player whose hole cards are dealt face up is the one who exported it.\n    if hand.hero is None and len(dealt_with_cards) == 1:\n        me = dealt_with_cards[0]\n        old = me.name\n        me.name = \"Hero\"\n        me.is_hero = True\n        for a in hand.actions:\n            if a.player == old:\n                a.player = \"Hero\"\n\n    _validate(hand)\n    return hand\n\n\ndef _validate(hand: Hand) -> None:\n    \"\"\"Record (never raise on) internal inconsistencies, for later inspection.\"\"\"\n    invested = sum(p.invested for p in hand.players)\n    collected = sum(p.collected for p in hand.players)\n    if hand.total_pot:\n        expected = collected + hand.rake + hand.extra_fee\n        if abs(invested - expected) > max(0.02, 0.01 * hand.total_pot):\n            hand.parse_warnings.append(\n                f\"chip mismatch: invested {invested:.2f} vs collected+rake {expected:.2f}\")\n    for p in hand.players:\n        if p.invested > p.stack + 1e-6:\n            hand.parse_warnings.append(\n                f\"{p.name} invested {p.invested:.2f} over stack {p.stack:.2f}\")\n    if len(hand.board) not in (0, 3, 4, 5):\n        hand.parse_warnings.append(f\"odd board length {len(hand.board)}\")\n\n\ndef parse_file(path: str) -> list:\n    with open(path, \"r\", encoding=\"utf-8\", errors=\"replace\") as fh:\n        text = fh.read()\n    return [parse_hand(b) for b in split_hands(text)]\n\n\ndef parse_text(text: str) -> list:\n    return [parse_hand(b) for b in split_hands(text)]\n","pokerbrain/parsers/__init__.py":""},"buildId":"cb34ca70f5c8"};
const SUIT = {s:"♠", h:"♥", d:"♦", c:"♣"};
const REDS = {h:1, d:1};
const ORDER = ["preflop","flop","turn","river"];
const BOARDN = {preflop:0, flop:3, turn:4, river:5};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn = (v, d) => (Number(v) >= 0 ? "+" : "") + Number(v).toFixed(d == null ? 1 : d);
const dir = v => Number(v) >= 0 ? "pos" : "neg";

function card(c, small){
  if(!c) return "";
  const r = c[0], s = c[1];
  return `<span class="pc${REDS[s] ? " red" : ""}${small ? " sm" : ""}">${
    esc(r === "T" ? "10" : r)}<s>${SUIT[s] || ""}</s></span>`;
}
const cards = (l, sm) => `<span class="hand">${(l||[]).map(c => card(c, sm)).join("")}</span>`;

/* ------------------------------------------------------------- chart --- */
function chart(vals){
  if(!vals || !vals.length) return "";
  const W = 960, H = 220, L = 46, R = 14, T = 16, B = 26;
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const span = (hi - lo) || 1;
  const x = i => L + i * (W - L - R) / Math.max(1, vals.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / span;
  const pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last = vals[vals.length - 1];
  const col = last >= 0 ? "var(--good)" : "var(--bad)";
  const area = `${L},${y(0).toFixed(1)} ${pts} ${x(vals.length-1).toFixed(1)},${y(0).toFixed(1)}`;
  const ticks = [hi, 0, lo].filter((v,i,a) => a.indexOf(v) === i);
  let marks = "";
  for(const t of ticks){
    marks += `<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="var(--line)" stroke-width="1"${t === 0 ? "" : ' stroke-dasharray="2 4"'}/>
      <text x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" fill="var(--dim)"
        font-size="11" font-family="var(--mono)">${t.toFixed(0)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="220" role="img"
    aria-label="Cumulative result: ${last.toFixed(1)} big blinds after ${vals.length} hands, low point ${lo.toFixed(0)}">
    ${marks}
    <polygon points="${area}" fill="${col}" opacity="0.10"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.25"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" fill="${col}"/>
    <text x="${L}" y="${H-7}" fill="var(--dim)" font-size="11" font-family="var(--mono)">hand 1</text>
    <text x="${W-R}" y="${H-7}" text-anchor="end" fill="var(--dim)" font-size="11"
      font-family="var(--mono)">hand ${vals.length}</text>
  </svg>`;
}

/* ------------------------------------------------------------- stats --- */
function statTable(rows, title, note){
  if(!rows.length) return "";
  let h = `<div class="panel flush"><table><caption>${esc(title)}</caption><thead><tr>
    <th>Stat</th><th class="n">Rate</th><th class="n">Sample</th>
    <th class="n">Typical</th><th>Read</th></tr></thead><tbody>`;
  for(const r of rows){
    const low = r.value < r.lo, high = r.value > r.hi;
    const pill = r.thin ? '<span class="pill thin">thin</span>'
      : low ? '<span class="pill off">low</span>'
      : high ? '<span class="pill off">high</span>'
      : '<span class="pill ok">in band</span>';
    const scale = Math.max(r.hi * 1.6, r.value * 1.15, 10);
    const w = Math.min(100, 100 * r.value / scale);
    const bandL = 100 * r.lo / scale, bandR = 100 * r.hi / scale;
    h += `<tr><td>${esc(r.label)}</td>
      <td class="n">${r.value.toFixed(1)}%</td>
      <td class="n" style="color:var(--dim)">${r.act}/${r.opp}</td>
      <td class="n" style="color:var(--muted)">${r.lo}–${r.hi}%</td>
      <td><div style="display:flex;align-items:center;gap:9px">
        <div class="meter" style="flex:1" title="${r.value.toFixed(1)}% vs typical ${r.lo}–${r.hi}%">
          <i style="width:${w}%;background:${low||high?"var(--bad)":"var(--good)"}"></i>
          <u style="left:${bandL}%"></u><u style="left:${bandR}%"></u>
        </div>${pill}</div></td></tr>`;
  }
  h += "</tbody></table>";
  if(note) h += `<p class="lead" style="padding:10px 16px 14px;margin:0">${esc(note)}</p>`;
  return h + "</div>";
}

function overview(){
  const m = DATA.meta, s = DATA.split;
  let h = "";
  if(m.hands < 500){
    h += `<div class="callout"><b>${m.hands} hands is a small sample.</b> Preflop rates settle
      around 1,000 hands, postflop rates need several thousand, and a win rate needs 20,000+.
      Read everything here as a hypothesis to test against more data — not a verdict.</div>`;
  }
  h += `<div class="row r3">
    <div class="tile ${m.netBB>=0?"up":"down"}"><div class="k">Result</div>
      <div class="v">${sgn(m.netBB)} bb</div>
      <div class="n">${sgn(m.bb100)} bb/100 across ${m.hands} hands</div></div>
    <div class="tile ${s.showdown_bb>=0?"up":"down"}"><div class="k">At showdown</div>
      <div class="v">${sgn(s.showdown_bb)} bb</div>
      <div class="n">pots that got called</div></div>
    <div class="tile ${s.non_showdown_bb>=0?"up":"down"}"><div class="k">Without showdown</div>
      <div class="v">${sgn(s.non_showdown_bb)} bb</div>
      <div class="n">pots won uncontested</div></div>
  </div>`;
  h += `<h2>Where the money went</h2>
    <div class="panel">${chart(DATA.cumulative)}
    <p class="lead" style="margin:10px 0 0">Cumulative result in big blinds, hand by hand.
    Steep single-hand drops matter more than the slope — they point at individual
    decisions rather than a losing style.</p></div>`;
  h += `<h2>Rates</h2><div class="row r2">
    ${statTable(DATA.heroStats, "You", "Markers on each bar show the band a winning 6-max regular occupies.")}
    ${statTable(DATA.poolStats, "The pool — every opponent merged",
      "This site rotates opponent IDs every hand, so the merged pool is the right prior for an unknown player.")}
  </div>`;
  if(DATA.byPosition.length){
    h += `<h2>By seat</h2><div class="panel flush"><div class="scroll"><table>
      <thead><tr><th>Position</th><th class="n">Hands</th><th class="n">VPIP</th>
      <th class="n">PFR</th><th class="n">bb/100</th></tr></thead><tbody>`;
    for(const r of DATA.byPosition){
      h += `<tr><td>${esc(r.pos)}</td><td class="n">${r.hands}</td>
        <td class="n">${r.vpip==null?"–":r.vpip+"%"}</td>
        <td class="n">${r.pfr==null?"–":r.pfr+"%"}</td>
        <td class="n ${dir(r.bb100)}">${sgn(r.bb100,0)}</td></tr>`;
    }
    h += "</tbody></table></div></div>";
  }
  $("#v-overview").innerHTML = h;
}

/* -------------------------------------------------------------- felt --- */
function felt(hd){
  const upto = ORDER.indexOf(hd.finalStreet);
  const shown = hd.board.slice(0, BOARDN[hd.finalStreet] || 0);
  const last = {};
  for(let i = 0; i <= upto; i++)
    for(const a of (hd.streets[ORDER[i]] || [])) last[a.player] = a;

  const n = hd.players.length;
  let seats = "";
  hd.players.forEach((p, i) => {
    const ang = (-90 + i * 360 / n) * Math.PI / 180;
    const cx = 50 + 40 * Math.cos(ang), cy = 50 + 35 * Math.sin(ang);
    const a = last[p.name];
    const out = p.folded && ORDER.indexOf(p.folded) <= upto;
    const face = p.cards.length ? cards(p.cards, true)
      : (out ? "" : `<span class="hand">${card("Xx",true).replace("pc","pc down")}${
          card("Xx",true).replace("pc","pc down")}</span>`);
    seats += `<div class="seat${p.isHero?" me":""}${out?" gone":""}" style="left:${cx}%;top:${cy}%">
      <div class="box">
        <div class="who">${esc(p.isHero?"You":p.name.slice(0,8))}<em>${esc(p.pos)}</em>${
          p.seat === hd.buttonSeat ? '<span class="dealer">D</span>' : ""}</div>
        <div class="chips">${p.stackBB} bb</div>
        ${face}
        <div class="did">${a ? esc(a.verb + (a.amount ? " " + a.amount : "")) : ""}</div>
      </div></div>`;
  });
  const centre = shown.length
    ? `<div class="board">${shown.map(c => card(c)).join("")}</div>`
    : '<div class="pre">pre-flop</div>';
  return `<div class="felt">${seats}<div class="centre">${centre}
    <div class="pot">pot ${potAt(hd, hd.finalStreet)} bb</div></div></div>`;
}
function potAt(hd, street){
  for(let i = ORDER.indexOf(street); i >= 0; i--){
    const e = hd.decisions.filter(d => d.street === ORDER[i]).pop();
    if(e) return e.potBB;
  }
  return 0;
}

function maths(d){
  const r = [];
  const add = (k,v) => r.push(`<dt>${k}</dt><dd>${v}</dd>`);
  add("Pot before you acted", `${d.potBefore} <span style="color:var(--dim)">(${d.potBB} bb)</span>`);
  if(d.spr != null) add("Stack-to-pot ratio", d.spr);
  if(d.toCall > 0){
    add("To call", d.toCall);
    add("Equity your call needs", `${d.potOdds}%`);
    add("Minimum defence frequency", `${d.mdf}%`);
  }
  if(d.betPct != null){
    add("Your sizing", `${d.betPct}% of pot`);
    add("Folds needed to break even", `${d.reqFE}%`);
  }
  if(d.madeHand) add("Your hand", d.madeHand);
  if(d.texture) add("Board", d.texture);

  let eq = "";
  if(d.equity != null){
    eq = `<div class="eq"><div class="lab"><span style="color:var(--muted)">Your equity vs their estimated range</span>
      <b>${d.equity}%</b></div><div class="eqbar">
      <i style="width:${d.equity}%;background:var(--good)"></i>
      <i style="width:${100-d.equity}%;background:var(--bad)"></i></div></div>`;
  }
  let note = "";
  if(d.evCall != null){
    if(d.evCall < -0.5) note = `<div class="note bad">Calling cost <b>${d.evCall.toFixed(2)}</b>
      in expectation. You needed <b>${d.potOdds}%</b> equity and held <b>${d.equity}%</b>.</div>`;
    else if(d.evCall > 0.5) note = `<div class="note good">Calling was worth
      <b>+${d.evCall.toFixed(2)}</b> against the estimated range.</div>`;
    else note = `<div class="note flat">Close to break-even (${sgn(d.evCall,2)}).</div>`;
  }
  return `<div class="maths"><dl>${r.join("")}</dl>${eq}</div>${note}`;
}

function reviewHTML(grades, title){

    const mark = g.kind === "good" ? "✓" : (g.kind === "review" ? "?" : "✗");

function wireDive(hd){
  const btn = $("#divebtn");
  if (!btn) return;
  btn.onclick = async () => {
    const overrides = {};
    for (const st of ORDER){
      const el = $("#dv-" + st);
      if (el && el.value.trim()) overrides[st] = el.value.trim();
    }
    btn.disabled = true;
    $("#divemsg").innerHTML = '<span class="busy"><span class="spin"></span>' +
      (pyReady ? "Recalculating…" : "Loading the analyser… the first time takes a moment.") +
      "</span>";
    try {
      const py = await ensurePython();
      const fn = py.globals.get("pb_dive");
      let raw;
      try { raw = await fn(hd.raw, JSON.stringify(overrides)); } finally { fn.destroy(); }
      const res = JSON.parse(raw);
      if (res.error){ $("#divemsg").textContent = res.error; return; }
      hd._dive = res;
      $("#divemsg").textContent = "";
      let h = '<div class="review"><p class="eyebrow">Recalculated with ' +
        (Object.keys(res.overrides).length ? "your ranges" : "the estimate") + "</p>";
      for (const st of ORDER){
        const r = res.ranges[st];
        const ds = res.decisions.filter(d => d.street === st);
        if (!ds.length) continue;
        h += '<div class="street"><h4>' + st + "</h4>";
        if (r) h += '<div class="rng">' + (res.overrides[st] ? "Your range" : "Estimated range") +
          " — " + r.pct + "% of hands<code>" + esc(r.summary) + "</code></div>";
        for (const d of ds) h += maths(d);
        h += "</div>";
      }
      h += "</div>" + reviewHTML(res.grades, "Review with these ranges");
      $("#diveout").innerHTML = h;
    } catch(err){
      $("#divemsg").textContent = "Could not recalculate: " +
        String((err && err.message) || err).slice(0, 200);
    } finally {
      btn.disabled = false;
    }
  };
}

function handContext(hd){
  const L = [];
  L.push("Hand " + hd.id + " (" + hd.time + "), CoinPoker NLH " + hd.sb + "/" + hd.bb +
    (hd.ante ? " ante " + hd.ante : "") + ", " + hd.players.length + "-handed.");
  L.push("I am in the " + hd.heroPos + " with " + hd.heroCards.join(" ") + ".");
  L.push("Players: " + hd.players.map(p => (p.isHero ? "Me" : p.name) + " " + p.pos + " " +
    p.stackBB + "bb").join(", ") + ".");
  for (const st of ORDER){
    const acts = hd.streets[st];
    if (!acts) continue;
    const b = hd.board.slice(0, BOARDN[st]);
    L.push(st.toUpperCase() + (b.length ? " [" + b.join(" ") + "]" : "") + ": " +
      acts.map(a => (a.isHero ? "Me" : a.player) + " (" + a.pos + ") " + a.verb +
        (a.amount ? " " + a.amount : "")).join(", "));
  }
  L.push("Result for me: " + sgn(hd.heroNetBB) + " bb. Pot " + hd.pot + ".");
  if (hd.villainCards && hd.villainCards.length)
    L.push("Main opponent showed " + hd.villainCards.join(" ") + ".");
  const dive = hd._dive;
  const decisions = dive ? dive.decisions : hd.decisions;
  const ranges = dive ? dive.ranges : hd.ranges;
  L.push("");
  L.push("Engine maths for each of my decisions (opponent ranges are estimates" +
    (dive && Object.keys(dive.overrides).length ? ", some set by me" : "") + "):");
  for (const d of decisions){
    const bits = [d.street + ": I " + d.verb + (d.amount ? " " + d.amount : ""),
      "pot " + d.potBB + "bb"];
    if (d.toCall > 0) bits.push("to call " + d.toCall + ", needed " + d.potOdds + "%");
    if (d.equity != null) bits.push("equity vs range " + d.equity + "%");
    if (d.evCall != null) bits.push("EV of calling " + d.evCall);
    if (d.spr != null) bits.push("SPR " + d.spr);
    if (d.madeHand) bits.push(d.madeHand);
    L.push("- " + bits.join("; "));
  }
  for (const st of ORDER){
    if (ranges && ranges[st]) L.push("Their " + st + " range: " + ranges[st].summary +
      " (" + ranges[st].pct + "% of hands)");
  }
  if (hd._solve && hd._solve.line){
    L.push("");
    L.push("River solver (GTO, estimated ranges) with my hand " + hd._solve.spot.heroHand + ":");
    for (const st of hd._solve.line){
      if (!st.hero) continue;
      L.push("- at [" + (st.path.join(" > ") || "start of river") + "]: solver plays " +
        st.actions.map((a, i) => a + " " + Math.round(100 * st.hero[i]) + "%").join(", ") +
        "; I chose " + st.chosen);
    }
  }
  const grades = dive ? dive.grades : hd.grades;
  if (grades && grades.length){
    L.push("");
    L.push("Automatic review:");
    for (const g of grades) L.push("- [" + g.kind + "] " + g.text);
  }
  return L.join("\n");
}

  "You are an experienced poker coach reviewing one hand of online 6-max cash with a",

async function claudeSample(){

  try {
    if (window.claude && window.claude.use) sampleFn = await window.claude.use("sample");
  } catch(e){ sampleFn = null; }

/* ---- built-in coach: answers common questions from this hand's numbers,
   used wherever Claude isn't available (the self-hosted page) ---- */
const ASK_TOPICS = [
  ["equity", /equity|chance|percent|%|how often.*win|odds of winning|outs/i],
  ["price", /pot odds|price|odds|need(ed)? to call|break ?even|worth (a )?call/i],
  ["range", /beat|ahead|behind|range|what (did|could|would) (they|he|she|villain)|put (them|him|her) on/i],
  ["action", /should i|raise|call|fold|bet|check|shove|all.?in|jam|differently|mistake|right play|best play/i]
];

function askTopics(q){
  const hits = ASK_TOPICS.filter(t => t[1].test(q)).map(t => t[0]);
  return hits.length ? hits : ["review"];
}

function askStreet(q){
  for (const st of ORDER) if (new RegExp("\\b" + st + "\\b", "i").test(q)) return st;
  return null;
}

function bbOf(hd, x){ return Math.round(10 * x / (hd.bb || 1)) / 10; }

function decisionLine(hd, d){
  const act = d.verb + (d.amount ? " " + bbOf(hd, d.amount) + " bb" : "");
  let s = cap(d.street) + " - you " + act + " (pot " + d.potBB + " bb" +
    (d.madeHand ? ", you had " + d.madeHand : "") + ").";
  if (d.equity != null) s += " Your equity against their estimated range: " + d.equity + "%.";
  if (d.toCall > 0 && d.potOdds != null){
    const called = d.verb === "call";
    s += (called ? " Calling cost " : " A call would have cost ") + bbOf(hd, d.toCall) +
      " bb, needing " + d.potOdds + "% equity.";
    if (d.equity != null){
      const gap = Math.round(10 * (d.equity - d.potOdds)) / 10;
      const verb = called ? "calling " : "a call ";
      s += gap >= 0 ? " You had " + gap + " points more than that, so " + verb +
                      (called ? "made" : "would have made") + " money"
                    : " You were " + (-gap) + " points short, so " + verb +
                      (called ? "lost" : "would have lost") + " money";
      if (d.evCall != null) s += " (about " + sgn(bbOf(hd, d.evCall)) + " bb each time)";
      s += ".";
    }
  }
  return s;
}

function cap(s){ return s ? s[0].toUpperCase() + s.slice(1) : s; }

function localAnswer(hd, q){
  const dive = hd._dive;
  const decisions = (dive ? dive.decisions : hd.decisions) || [];
  const ranges = (dive ? dive.ranges : hd.ranges) || {};
  const grades = (dive ? dive.grades : hd.grades) || [];
  const street = askStreet(q);
  const picked = street ? decisions.filter(d => d.street === street) : decisions;
  const ds = picked.length ? picked : decisions;
  const topics = askTopics(q);
  const out = [];

  if (topics.includes("equity")){
    out.push("HOW TO WORK OUT YOUR EQUITY",
      "Equity is how often your hand wins by the river against every hand they could have - " +
      "not against their one actual hand.",
      "1. Put them on a range: the hands they would play this way. Their action narrows it " +
      "(a big river raise is mostly strong hands).",
      "2. If you're behind and drawing, count your outs - the cards that make you the best " +
      "hand. Don't count outs that also improve them.",
      "3. Rule of 2 and 4: outs x 4 = your rough equity on the flop with two cards to come; " +
      "outs x 2 on the turn with one card to come. Example: a flush draw has 9 outs, so " +
      "about 36% on the flop and 18% on the turn.",
      "4. If you have a made hand, ask what share of their range you beat. Beating half of " +
      "it means roughly 50%.",
      "5. Compare with the price: call / (pot + their bet + your call). If your equity is " +
      "higher, calling makes money.",
      "At the table you estimate. Here the engine works it out exactly against the range " +
      "shown in the deep dive above. Change that range and press Recalculate to see how " +
      "much your read matters.", "");
  }
  if (topics.includes("price") && !topics.includes("equity")){
    out.push("THE PRICE",
      "Needed equity = your call / (pot + their bet + your call). A half-pot bet needs 25%, " +
      "a two-thirds bet 28.6%, a pot-sized bet 33%, and a shove twice the pot needs 40%.", "");
  }

  const lines = ds.map(d => decisionLine(hd, d));
  if (lines.length){
    out.push(street ? "YOUR " + street.toUpperCase() + " IN THIS HAND" : "IN THIS HAND");
    out.push(...lines, "");
  } else if (street){
    out.push("You didn't make a decision on the " + street + " in this hand.", "");
  }

  if (topics.includes("range") || topics.includes("equity")){
    const rs = ORDER.filter(st => ranges[st] && (!street || st === street));
    if (rs.length){
      out.push("WHAT THEY COULD HAVE (estimated)");
      for (const st of rs) out.push(cap(st) + ": " + ranges[st].summary + " (" +
        ranges[st].pct + "% of all hands).");
      if (hd.villainCards && hd.villainCards.length)
        out.push("They actually showed " + hd.villainCards.join(" ") + " - but judge the " +
          "decision against the whole range, not the one hand they had.");
      out.push("");
    }
  }

  if (topics.includes("action") || topics.includes("review")){
    const gs = street ? grades.filter(g => !g.street || g.street === street) : grades;
    out.push("VERDICT");
    if (gs.length){
      for (const g of gs) out.push((g.kind === "good" ? "Good: " : g.kind === "review" ?
        "Check: " : "Fix: ") + g.text);
    } else {
      out.push("Nothing here stood out as clearly right or wrong against their estimated " +
        "range. A close spot - either choice is fine unless you have a specific read.");
    }
    const facing = ds.filter(d => d.toCall > 0 && d.equity != null && d.verb === "fold");
    for (const d of facing){
      out.push(d.equity >= d.potOdds
        ? "On the " + d.street + " you folded with " + d.equity + "% when you needed " +
          d.potOdds + "% - calling was the better choice against this range."
        : "On the " + d.street + " your fold was right: " + d.equity + "% is less than the " +
          d.potOdds + "% you needed.");
    }
    out.push("");
  }

  out.push("These answers come from the engine and estimated ranges. For anything more " +
    "specific, use “Copy hand + question” and paste it into a chat with Claude.");
  return out.join("\n");
}

function wireAsk(hd){
  const q = $("#askq");
  const askText = () => (q.value.trim() || "Review this hand. What did I do well, and what " +
    "should I change?");
  const copyText = () => "Help me with this poker hand. " + askText() + "\n\n" + handContext(hd);

  $("#copybtn").onclick = async () => {
    const text = copyText();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
    if (!ok){
      $("#askout").textContent = text;
      $("#askmsg").textContent = "Select the text below and copy it.";
      return;
    }
    $("#askmsg").textContent = "Copied — paste it into a chat with Claude.";
  };

  $("#askbtn").onclick = async () => {
    const btn = $("#askbtn");
    const sample = await claudeSample();
    if (!sample){
      $("#askout").textContent = localAnswer(hd, askText());
      $("#askmsg").textContent = "Answered by the built-in coach.";
      return;
    }
    btn.disabled = true;
    $("#askmsg").textContent = "";
    $("#askout").textContent = "Thinking…";
    try {
      await sample(ASK_RULES + "\n\nQuestion: " + askText() + "\n\n" + handContext(hd), {
        cache: false,
        onText: ({text}) => { $("#askout").textContent = text; }
      });
    } catch(e){
      const why = {
        not_granted: "You haven't allowed this page to use Claude. Reload to be asked again, or copy the hand instead.",
        rate_limited: "Too many requests right now — try again in a moment.",
        session_expired: "Your Claude session expired — sign in again."
      }[e && e.code];
      $("#askout").textContent = (e && e.text) || "";
      $("#askmsg").textContent = why || "Couldn't get an answer — try again, or copy the hand instead.";
    } finally {
      btn.disabled = false;
    }
  };
}
